guntas diretas.","html":"Evitar responder a perguntas diretas."}],"correct":"C","explanation":"A assertividade na comunicação consiste em transmitir ideias de forma clara, direta e objetiva, mantendo sempre o respeito com o interlocutor.","original":"### Questão 4 (Módulo 2 / Aula 2: Assertividade)\n**Enunciado:** O que significa ser assertivo na comunicação escrita e falada do ambiente de trabalho? [36]\n\n* A) Falar de forma informal.\n* B) Utilizar linguagem rebuscada.\n* C) Comunicar-se com respeito e objetividade.\n* D) Impor sua opinião sem ouvir os colegas.\n* E) Evitar responder a perguntas diretas.\n\n* **Resposta Correta:** **C) Comunicar-se com respeito e objetividade.** [36]\n* **Justificativa Teórica Oficial:** A assertividade na comunicação consiste em transmitir ideias de forma clara, direta e objetiva, mantendo sempre o respeito com o interlocutor [36].","distractors":{"A":"Informalidade por si só não define assertividade no material.","B":"A fonte prioriza clareza e objetividade; linguagem rebuscada não é o critério.","D":"Imposição contraria o respeito ao interlocutor indicado no conceito.","E":"Evitar responder não caracteriza a comunicação clara e direta descrita na fonte."},"evidence":"MÓDULO 2: COMUNICAÇÃO PROFISSIONAL · Aula 2: E-mail Corporativo e Escrita Técnica","evidenceLesson":4,"examTip":"A assertividade na comunicação consiste em transmitir ideias de forma clara, direta e objetiva, mantendo sempre o respeito com o interlocutor.","promptHtml":"O que significa ser assertivo na comunicação escrita e falada do ambiente de trabalho?","explanationHtml":"\u003cp>A assertividade na comunicação consiste em transmitir ideias de forma clara, direta e objetiva, mantendo sempre o respeito com o interlocutor.\u003c/p>\n","examTipHtml":"\u003cp>A assertividade na comunicação consiste em transmitir ideias de forma clara, direta e objetiva, mantendo sempre o respeito com o interlocutor.\u003c/p>\n","review":{"topic":"Assertividade","key":"Respeito + objetividade","takeaway":"Ser direto não é impor: comunique a ideia com clareza e respeito."}},{"id":4,"title":"Questão 5 (Módulo 3 / Aula 1: Organogramas)","prompt":"No organograma de uma empresa, o que representam as linhas verticais e horizontais que conectam os cargos?","options":[{"letter":"A","text":"A faixa salarial dos funcionários.","html":"A faixa salarial dos funcionários."},{"letter":"B","text":"Relações de autoridade e comunicação.","html":"Relações de autoridade e comunicação."},{"letter":"C","text":"O tempo de empresa de cada gestor.","html":"O tempo de empresa de cada gestor."},{"letter":"D","text":"O nível de escolaridade exigido.","html":"O nível de escolaridade exigido."},{"letter":"E","text":"A produtividade diária.","html":"A produtividade diária."}],"correct":"B","explanation":"As linhas em um organograma representam as relações entre os cargos, indicando quem se reporta a quem, além de evidenciar o fluxo de comunicação dentro da empresa.","original":"### Questão 5 (Módulo 3 / Aula 1: Organogramas)\n**Enunciado:** No organograma de uma empresa, o que representam as linhas verticais e horizontais que conectam os cargos? [56, 61]\n\n* A) A faixa salarial dos funcionários.\n* B) Relações de autoridade e comunicação.\n* C) O tempo de empresa de cada gestor.\n* D) O nível de escolaridade exigido.\n* E) A produtividade diária.\n\n* **Resposta Correta:** **B) Relações de autoridade e comunicação.** [56, 61]\n* **Justificativa Teórica Oficial:** As linhas em um organograma representam as relações entre os cargos, indicando quem se reporta a quem, além de evidenciar o fluxo de comunicação dentro da empresa [61].","distractors":{"A":"A função descrita para as linhas é conectar cargos por autoridade e comunicação, não informar salários.","C":"Tempo de empresa não é a informação representada pelas linhas no material.","D":"Escolaridade não é o significado atribuído às linhas de conexão.","E":"O organograma apresentado representa estrutura e relações, não produtividade diária."},"evidence":"MÓDULO 3: TRABALHO EM EQUIPE E CONVIVÊNCIA · Aula 1: Hierarquia no Trabalho e Organogramas","evidenceLesson":6,"examTip":"As linhas em um organograma representam as relações entre os cargos, indicando quem se reporta a quem, além de evidenciar o fluxo de comunicação dentro da empresa.","promptHtml":"No organograma de uma empresa, o que representam as linhas verticais e horizontais que conectam os cargos?","explanationHtml":"\u003cp>As linhas em um organograma representam as relações entre os cargos, indicando quem se reporta a quem, além de evidenciar o fluxo de comunicação dentro da empresa.\u003c/p>\n","examTipHtml":"\u003cp>As linhas em um organograma representam as relações entre os cargos, indicando quem se reporta a quem, além de evidenciar o fluxo de comunicação dentro da empresa.\u003c/p>\n","review":{"topic":"Organogramas","key":"Autoridade + comunicação","takeaway":"As linhas ligam cargos e mostram as relações entre eles."}},{"id":5,"title":"Questão 6 (Módulo 3 / Aula 2: Diversidade no Trabalho)","prompt":"Qual é o principal benefício alcançado pelas empresas quando há integração e colaboração efetiva entre profissionais de diferentes gerações?","options":[{"letter":"A","text":"Redução imediata de impostos.","html":"Redução imediata de impostos."},{"letter":"B","text":"Aumento da inovação e qualidade das soluções.","html":"Aumento da inovação e qualidade das soluções."},{"letter":"C","text":"Eliminação completa de reuniões.","html":"Eliminação completa de reuniões."},{"letter":"D","text":"Padronização de todos os funcionários.","html":"Padronização de todos os funcionários."},{"letter":"E","text":"Fim da necessidade de liderança.","html":"Fim da necessidade de liderança."}],"correct":"B","explanation":"Quando diferentes gerações compartilham experiências, ideias e conhecimentos, há maior diversidade de perspectivas, o que favorece a inovação e melhora a qualidade das soluções.","original":"### Questão 6 (Módulo 3 / Aula 2: Diversidade no Trabalho)\n**Enunciado:** Qual é o principal benefício alcançado pelas empresas quando há integração e colaboração efetiva entre profissionais de diferentes gerações? [71]\n\n* A) Redução imediata de impostos.\n* B) Aumento da inovação e qualidade das soluções.\n* C) Eliminação completa de reuniões.\n* D) Padronização de todos os funcionários.\n* E) Fim da necessidade de liderança.\n\n* **Resposta Correta:** **B) Aumento da inovação e qualidade das soluções.** [71]\n* **Justificativa Teórica Oficial:** Quando diferentes gerações compartilham experiências, ideias e conhecimentos, há maior diversidade de perspectivas, o que favorece a inovação e melhora a qualidade das soluções [71].","distractors":{"A":"Redução de impostos não é benefício estabelecido pela fonte.","C":"O material não relaciona colaboração intergeracional à eliminação de reuniões.","D":"A fonte valoriza a diversidade de perspectivas, não a padronização das pessoas.","E":"O texto não afirma que essa colaboração elimina a necessidade de liderança."},"evidence":"MÓDULO 3: TRABALHO EM EQUIPE E CONVIVÊNCIA · Aula 2: Diversidade no Trabalho e Colaboração Intergeracional","evidenceLesson":7,"examTip":"Quando diferentes gerações compartilham experiências, ideias e conhecimentos, há maior diversidade de perspectivas, o que favorece a inovação e melhora a qualidade das soluções.","promptHtml":"Qual é o principal benefício alcançado pelas empresas quando há integração e colaboração efetiva entre profissionais de diferentes gerações?","explanationHtml":"\u003cp>Quando diferentes gerações compartilham experiências, ideias e conhecimentos, há maior diversidade de perspectivas, o que favorece a inovação e melhora a qualidade das soluções.\u003c/p>\n","examTipHtml":"\u003cp>Quando diferentes gerações compartilham experiências, ideias e conhecimentos, há maior diversidade de perspectivas, o que favorece a inovação e melhora a qualidade das soluções.\u003c/p>\n","review":{"topic":"Colaboração entre gerações","key":"Troca que melhora soluções","takeaway":"Perspectivas diferentes favorecem a inovação e a qualidade das soluções."}},{"id":6,"title":"Questão 7 (Módulo 4 / Aula 1: Modelo SCI de Feedback)","prompt":"Qual modelo de feedback organiza a comunicação a partir da descrição do contexto factual, da ação observada e das consequências geradas?","options":[{"letter":"A","text":"Modelo PDCA.","html":"Modelo PDCA."},{"letter":"B","text":"Modelo SCI.","html":"Modelo SCI."},{"letter":"C","text":"Modelo SWOT.","html":"Modelo SWOT."},{"letter":"D","text":"Modelo 5S.","html":"Modelo 5S."},{"letter":"E","text":"Modelo SMART.","html":"Modelo SMART."}],"correct":"B","explanation":"O modelo SCI organiza o feedback a partir da descrição da situação, do comportamento observado e do impacto gerado, tornando a comunicação clara, objetiva e construtiva.","original":"### Questão 7 (Módulo 4 / Aula 1: Modelo SCI de Feedback)\n**Enunciado:** Qual modelo de feedback organiza a comunicação a partir da descrição do contexto factual, da ação observada e das consequências geradas? [84]\n\n* A) Modelo PDCA.\n* B) Modelo SCI.\n* C) Modelo SWOT.\n* D) Modelo 5S.\n* E) Modelo SMART.\n\n* **Resposta Correta:** **B) Modelo SCI.** [84]\n* **Justificativa Teórica Oficial:** O modelo SCI organiza o feedback a partir da descrição da situação, do comportamento observado e do impacto gerado, tornando a comunicação clara, objetiva e construtiva [84].","distractors":{"A":"A fonte não define PDCA como Situação, Comportamento e Impacto.","C":"A fonte não define SWOT como essa estrutura de feedback.","D":"No material, 5S organiza o ambiente físico e digital; SCI organiza o feedback.","E":"A fonte não apresenta SMART como o modelo solicitado."},"evidence":"MÓDULO 4: POSTURA PROFISSIONAL · Aula 1: Feedback Profissional e Modelo SCI","evidenceLesson":9,"examTip":"O modelo SCI organiza o feedback a partir da descrição da situação, do comportamento observado e do impacto gerado, tornando a comunicação clara, objetiva e construtiva.","promptHtml":"Qual modelo de feedback organiza a comunicação a partir da descrição do contexto factual, da ação observada e das consequências geradas?","explanationHtml":"\u003cp>O modelo SCI organiza o feedback a partir da descrição da situação, do comportamento observado e do impacto gerado, tornando a comunicação clara, objetiva e construtiva.\u003c/p>\n","examTipHtml":"\u003cp>O modelo SCI organiza o feedback a partir da descrição da situação, do comportamento observado e do impacto gerado, tornando a comunicação clara, objetiva e construtiva.\u003c/p>\n","review":{"topic":"Feedback SCI","key":"Situação → Comportamento → Impacto","takeaway":"Descreva o contexto, a ação observada e a consequência gerada."}},{"id":7,"title":"Questão 8 (Módulo 5 / Aula 1: Matriz de Eisenhower - Definição)","prompt":"Qual é o objetivo principal da utilização da Matriz de Eisenhower no cotidiano profissional?","options":[{"letter":"A","text":"Calcular a margem de lucro de um projeto.","html":"Calcular a margem de lucro de um projeto."},{"letter":"B","text":"Classificar tarefas com base em urgência e importância.","html":"Classificar tarefas com base em urgência e importância."},{"letter":"C","text":"Organizar a folha de pagamento.","html":"Organizar a folha de pagamento."},{"letter":"D","text":"Desenhar a identidade visual da empresa.","html":"Desenhar a identidade visual da empresa."},{"letter":"E","text":"Enviar mensagens automáticas.","html":"Enviar mensagens automáticas."}],"correct":"B","explanation":"A Matriz de Eisenhower é uma ferramenta utilizada para organizar tarefas considerando dois critérios principais: urgência e importância, permitindo definir prioridades e tomar decisões eficientes.","original":"### Questão 8 (Módulo 5 / Aula 1: Matriz de Eisenhower - Definição)\n**Enunciado:** Qual é o objetivo principal da utilização da Matriz de Eisenhower no cotidiano profissional? [110]\n\n* A) Calcular a margem de lucro de um projeto.\n* B) Classificar tarefas com base em urgência e importância.\n* C) Organizar a folha de pagamento.\n* D) Desenhar a identidade visual da empresa.\n* E) Enviar mensagens automáticas.\n\n* **Resposta Correta:** **B) Classificar tarefas com base em urgência e importância.** [110]\n* **Justificativa Teórica Oficial:** A Matriz de Eisenhower é uma ferramenta utilizada para organizar tarefas considerando dois critérios principais: urgência e importância, permitindo definir prioridades e tomar decisões eficientes [110].","distractors":{"A":"Cálculo de margem de lucro não é o objetivo apresentado para essa matriz.","C":"Folha de pagamento não é a finalidade descrita para a ferramenta.","D":"Identidade visual não é o foco da classificação por urgência e importância.","E":"A fonte descreve priorização de tarefas, não envio automático de mensagens."},"evidence":"MÓDULO 5: ORGANIZAÇÃO E PRODUTIVIDADE · Aula 1: Gestão do Tempo e Matriz de Eisenhower","evidenceLesson":12,"examTip":"A Matriz de Eisenhower é uma ferramenta utilizada para organizar tarefas considerando dois critérios principais: urgência e importância, permitindo definir prioridades e tomar decisões eficientes.","promptHtml":"Qual é o objetivo principal da utilização da Matriz de Eisenhower no cotidiano profissional?","explanationHtml":"\u003cp>A Matriz de Eisenhower é uma ferramenta utilizada para organizar tarefas considerando dois critérios principais: urgência e importância, permitindo definir prioridades e tomar decisões eficientes.\u003c/p>\n","examTipHtml":"\u003cp>A Matriz de Eisenhower é uma ferramenta utilizada para organizar tarefas considerando dois critérios principais: urgência e importância, permitindo definir prioridades e tomar decisões eficientes.\u003c/p>\n","review":{"topic":"Matriz de Eisenhower","key":"Urgência × importância","takeaway":"A matriz ajuda a classificar tarefas e definir prioridades."}},{"id":8,"title":"Questão 9 (Módulo 5 / Aula 1: Matriz de Eisenhower - Aplicação)","prompt":"Você precisa votar na decoração da formatura (com prazo de quatro dias), mas hoje tem tarefas acadêmicas/profissionais com entrega imediata. Como a tarefa de votar deve ser classificada?","options":[{"letter":"A","text":"É importante e urgente.","html":"É importante e urgente."},{"letter":"B","text":"É importante, mas não é urgente.","html":"É importante, mas não é urgente."},{"letter":"C","text":"Não é importante nem urgente.","html":"Não é importante nem urgente."},{"letter":"D","text":"É urgente, mas não é importante.","html":"É urgente, mas não é importante."},{"letter":"E","text":"É uma crise crítica imediata.","html":"É uma crise crítica imediata."}],"correct":"B","explanation":"Embora a votação seja importante, ela não possui prazo imediato (quatro dias). Como existem outras tarefas com entrega urgente hoje, essa atividade deve ser planejada para outro momento.","original":"### Questão 9 (Módulo 5 / Aula 1: Matriz de Eisenhower - Aplicação)\n**Enunciado:** Você precisa votar na decoração da formatura (com prazo de quatro dias), mas hoje tem tarefas acadêmicas/profissionais com entrega imediata. Como a tarefa de votar deve ser classificada? [105, 112]\n\n* A) É importante e urgente.\n* B) É importante, mas não é urgente.\n* C) Não é importante nem urgente.\n* D) É urgente, mas não é importante.\n* E) É uma crise crítica imediata.\n\n* **Resposta Correta:** **B) É importante, mas não é urgente.** [105, 112]\n* **Justificativa Teórica Oficial:** Embora a votação seja importante, ela não possui prazo imediato (quatro dias). Como existem outras tarefas com entrega urgente hoje, essa atividade deve ser planejada para outro momento [112].","distractors":{"A":"O prazo de quatro dias não torna essa votação urgente no caso apresentado.","C":"O material considera a votação importante; portanto, não pertence ao grupo sem importância.","D":"A tarefa é importante e não imediata, o oposto dessa classificação.","E":"O caso tem prazo futuro e outras entregas para hoje; a fonte não o trata como crise imediata."},"evidence":"MÓDULO 5: ORGANIZAÇÃO E PRODUTIVIDADE · Aula 1: Gestão do Tempo e Matriz de Eisenhower","evidenceLesson":12,"examTip":"Embora a votação seja importante, ela não possui prazo imediato (quatro dias). Como existem outras tarefas com entrega urgente hoje, essa atividade deve ser planejada para outro momento.","promptHtml":"Você precisa votar na decoração da formatura (com prazo de quatro dias), mas hoje tem tarefas acadêmicas/profissionais com entrega imediata. Como a tarefa de votar deve ser classificada?","explanationHtml":"\u003cp>Embora a votação seja importante, ela não possui prazo imediato (quatro dias). Como existem outras tarefas com entrega urgente hoje, essa atividade deve ser planejada para outro momento.\u003c/p>\n","examTipHtml":"\u003cp>Embora a votação seja importante, ela não possui prazo imediato (quatro dias). Como existem outras tarefas com entrega urgente hoje, essa atividade deve ser planejada para outro momento.\u003c/p>\n","review":{"topic":"Prioridade da votação","key":"Importante ≠ urgente","takeaway":"O prazo de quatro dias permite planejar a votação; as entregas de hoje exigem atenção imediata."}},{"id":9,"title":"Questão 10 (Módulo 5 / Aula 2: Programa 5S Digital)","prompt":"Ao passar a nomear todos os seus arquivos digitais da mesma forma (ex: `atividade_matematica_data`), facilitando a identificação e o uso por qualquer pessoa, qual senso do 5S está sendo aplicado?","options":[{"letter":"A","text":"Senso de utilização (*Seiri*).","html":"Senso de utilização (\u003cem>Seiri\u003c/em>)."},{"letter":"B","text":"Senso de padronização (*Seiketsu*).","html":"Senso de padronização (\u003cem>Seiketsu\u003c/em>)."},{"letter":"C","text":"Senso de organização (*Seiton*).","html":"Senso de organização (\u003cem>Seiton\u003c/em>)."},{"letter":"D","text":"Senso de disciplina (*Shitsuke*).","html":"Senso de disciplina (\u003cem>Shitsuke\u003c/em>)."},{"letter":"E","text":"Senso de limpeza (*Seiso*).","html":"Senso de limpeza (\u003cem>Seiso\u003c/em>)."}],"correct":"B","explanation":"Padronizar a nomenclatura de arquivos virtuais garante consistência visual e organizacional no ambiente de trabalho digital, caracterizando a aplicação do Senso de Padronização (*Seiketsu*).","original":"### Questão 10 (Módulo 5 / Aula 2: Programa 5S Digital)\n**Enunciado:** Ao passar a nomear todos os seus arquivos digitais da mesma forma (ex: `atividade_matematica_data`), facilitando a identificação e o uso por qualquer pessoa, qual senso do 5S está sendo aplicado? [116, 117]\n\n* A) Senso de utilização (*Seiri*).\n* B) Senso de padronização (*Seiketsu*).\n* C) Senso de organização (*Seiton*).\n* D) Senso de disciplina (*Shitsuke*).\n* E) Senso de limpeza (*Seiso*).\n\n* **Resposta Correta:** **B) Senso de padronização (*Seiketsu*).** [116, 117]\n* **Justificativa Teórica Oficial:** Padronizar a nomenclatura de arquivos virtuais garante consistência visual e organizacional no ambiente de trabalho digital, caracterizando a aplicação do Senso de Padronização (*Seiketsu*) [116].","distractors":{"A":"Seiri separa o útil do inútil; o caso pergunta por consistência na nomenclatura.","C":"Seiton trata de um lugar para cada coisa; o caso destaca o padrão comum dos nomes.","D":"Shitsuke trata de manter a rotina; a ação específica descrita é definir uma nomenclatura padronizada.","E":"Seiso trata de limpeza; a situação é de padronização da identificação."},"evidence":"MÓDULO 5: ORGANIZAÇÃO E PRODUTIVIDADE · Aula 2: Organização do Trabalho e Método 5S","evidenceLesson":13,"examTip":"Padronizar a nomenclatura de arquivos virtuais garante consistência visual e organizacional no ambiente de trabalho digital, caracterizando a aplicação do Senso de Padronização (*Seiketsu*).","promptHtml":"Ao passar a nomear todos os seus arquivos digitais da mesma forma (ex: \u003ccode>atividade_matematica_data\u003c/code>), facilitando a identificação e o uso por qualquer pessoa, qual senso do 5S está sendo aplicado?","explanationHtml":"\u003cp>Padronizar a nomenclatura de arquivos virtuais garante consistência visual e organizacional no ambiente de trabalho digital, caracterizando a aplicação do Senso de Padronização (\u003cem>Seiketsu\u003c/em>).\u003c/p>\n","examTipHtml":"\u003cp>Padronizar a nomenclatura de arquivos virtuais garante consistência visual e organizacional no ambiente de trabalho digital, caracterizando a aplicação do Senso de Padronização (\u003cem>Seiketsu\u003c/em>).\u003c/p>\n","review":{"topic":"5S nos arquivos","key":"Seiketsu = padronização","takeaway":"Uma regra comum para nomear arquivos caracteriza padronização."}},{"id":10,"title":"Questão 11 (Módulo 6 / Aula 1: Empreendedorismo por Oportunidade)","prompt":"Uma estudante percebe que seus colegas enfrentam dificuldades na organização dos estudos e decide criar proativamente um aplicativo de cronogramas para ajudá-los, sem ter necessidade financeira imediata. Esse caso é classificado como:","options":[{"letter":"A","text":"Empreendedorismo por necessidade.","html":"Empreendedorismo por necessidade."},{"letter":"B","text":"Empreendedorismo por oportunidade.","html":"Empreendedorismo por oportunidade."},{"letter":"C","text":"Empreendedorismo corporativo.","html":"Empreendedorismo corporativo."},{"letter":"D","text":"Empreendedorismo informal.","html":"Empreendedorismo informal."},{"letter":"E","text":"Intraempreendedorismo estatal.","html":"Intraempreendedorismo estatal."}],"correct":"B","explanation":"A estudante identificou uma necessidade e criou uma solução de forma proativa, sem pressão financeira imediata, característica típica do empreendedorismo por oportunidade.","original":"### Questão 11 (Módulo 6 / Aula 1: Empreendedorismo por Oportunidade)\n**Enunciado:** Uma estudante percebe que seus colegas enfrentam dificuldades na organização dos estudos e decide criar proativamente um aplicativo de cronogramas para ajudá-los, sem ter necessidade financeira imediata. Esse caso é classificado como: [134]\n\n* A) Empreendedorismo por necessidade.\n* B) Empreendedorismo por oportunidade.\n* C) Empreendedorismo corporativo.\n* D) Empreendedorismo informal.\n* E) Intraempreendedorismo estatal.\n\n* **Resposta Correta:** **B) Empreendedorismo por oportunidade.** [134]\n* **Justificativa Teórica Oficial:** A estudante identificou uma necessidade e criou uma solução de forma proativa, sem pressão financeira imediata, característica típica do empreendedorismo por oportunidade [134].","distractors":{"A":"O caso declara ausência de pressão financeira imediata e identificação proativa de uma necessidade.","C":"O caso não descreve inovação de um funcionário dentro de uma empresa existente.","D":"Informalidade não é o critério usado na classificação apresentada pelo material.","E":"O caso não descreve inovação dentro de uma organização estatal; essa categoria não é fundamentada na fonte."},"evidence":"MÓDULO 6: INICIAÇÃO EMPREENDEDORA · Aula 1: Atitude Empreendedora e Modalidades","evidenceLesson":15,"examTip":"A estudante identificou uma necessidade e criou uma solução de forma proativa, sem pressão financeira imediata, característica típica do empreendedorismo por oportunidade.","promptHtml":"Uma estudante percebe que seus colegas enfrentam dificuldades na organização dos estudos e decide criar proativamente um aplicativo de cronogramas para ajudá-los, sem ter necessidade financeira imediata. Esse caso é classificado como:","explanationHtml":"\u003cp>A estudante identificou uma necessidade e criou uma solução de forma proativa, sem pressão financeira imediata, característica típica do empreendedorismo por oportunidade.\u003c/p>\n","examTipHtml":"\u003cp>A estudante identificou uma necessidade e criou uma solução de forma proativa, sem pressão financeira imediata, característica típica do empreendedorismo por oportunidade.\u003c/p>\n","review":{"topic":"Empreender por oportunidade","key":"Necessidade percebida → solução","takeaway":"No caso do aplicativo, a iniciativa surge de uma oportunidade, sem pressão financeira imediata."}},{"id":11,"title":"Questão 12 (Módulo 6 / Aula 1: Empreendedorismo Corporativo)","prompt":"Um colaborador desenvolve um novo método de organização no setor de expedição de sua empresa para reduzir o tempo de separação de pedidos. Esse processo de inovação interna é denominado:","options":[{"letter":"A","text":"Empreendedorismo por necessidade.","html":"Empreendedorismo por necessidade."},{"letter":"B","text":"Empreendedorismo corporativo.","html":"Empreendedorismo corporativo."},{"letter":"C","text":"Empreendedorismo individual.","html":"Empreendedorismo individual."},{"letter":"D","text":"Empreendedorismo social.","html":"Empreendedorismo social."},{"letter":"E","text":"Empreendedorismo verde.","html":"Empreendedorismo verde."}],"correct":"B","explanation":"A inovação ocorre dentro de uma empresa já existente, com o objetivo de melhorar processos e aumentar a competitividade, característica do empreendedorismo corporativo.","original":"### Questão 12 (Módulo 6 / Aula 1: Empreendedorismo Corporativo)\n**Enunciado:** Um colaborador desenvolve um novo método de organização no setor de expedição de sua empresa para reduzir o tempo de separação de pedidos. Esse processo de inovação interna é denominado: [136]\n\n* A) Empreendedorismo por necessidade.\n* B) Empreendedorismo corporativo.\n* C) Empreendedorismo individual.\n* D) Empreendedorismo social.\n* E) Empreendedorismo verde.\n\n* **Resposta Correta:** **B) Empreendedorismo corporativo.** [136]\n* **Justificativa Teórica Oficial:** A inovação ocorre dentro de uma empresa já existente, com o objetivo de melhorar processos e aumentar a competitividade, característica do empreendedorismo corporativo [136].","distractors":{"A":"O fator decisivo da fonte é a inovação dentro da empresa existente, não pressão por renda.","C":"A melhoria é criada por colaborador no processo da empresa; a fonte a classifica como corporativa.","D":"O caso e o gabarito não apresentam finalidade social como critério dessa classificação.","E":"A redução do tempo de separação não é descrita como projeto de preservação ambiental."},"evidence":"MÓDULO 6: INICIAÇÃO EMPREENDEDORA · Aula 1: Atitude Empreendedora e Modalidades","evidenceLesson":15,"examTip":"A inovação ocorre dentro de uma empresa já existente, com o objetivo de melhorar processos e aumentar a competitividade, característica do empreendedorismo corporativo.","promptHtml":"Um colaborador desenvolve um novo método de organização no setor de expedição de sua empresa para reduzir o tempo de separação de pedidos. Esse processo de inovação interna é denominado:","explanationHtml":"\u003cp>A inovação ocorre dentro de uma empresa já existente, com o objetivo de melhorar processos e aumentar a competitividade, característica do empreendedorismo corporativo.\u003c/p>\n","examTipHtml":"\u003cp>A inovação ocorre dentro de uma empresa já existente, com o objetivo de melhorar processos e aumentar a competitividade, característica do empreendedorismo corporativo.\u003c/p>\n","review":{"topic":"Empreendedorismo corporativo","key":"Inovar dentro da empresa","takeaway":"A melhoria no setor de expedição é criada dentro de uma organização existente."}},{"id":12,"title":"Questão 13 (Módulo 6 / Aula 1: Empreendedorismo Sustentável)","prompt":"Uma empresa cria uma linha de embalagens biodegradáveis que mantém a lucratividade do negócio e reduz drasticamente o impacto ambiental. Esse modelo é classificado como:","options":[{"letter":"A","text":"Empreendedorismo por necessidade.","html":"Empreendedorismo por necessidade."},{"letter":"B","text":"Empreendedorismo sustentável.","html":"Empreendedorismo sustentável."},{"letter":"C","text":"Empreendedorismo social.","html":"Empreendedorismo social."},{"letter":"D","text":"Empreendedorismo individual.","html":"Empreendedorismo individual."},{"letter":"E","text":"Empreendedorismo por oportunidade tradicional.","html":"Empreendedorismo por oportunidade tradicional."}],"correct":"B","explanation":"O caso apresenta uma solução que mantém a geração de valor econômico ao mesmo tempo em que reduz impactos ambientais, característica central do empreendedorismo sustentável.","original":"### Questão 13 (Módulo 6 / Aula 1: Empreendedorismo Sustentável)\n**Enunciado:** Uma empresa cria uma linha de embalagens biodegradáveis que mantém a lucratividade do negócio e reduz drasticamente o impacto ambiental. Esse modelo é classificado como: [137]\n\n* A) Empreendedorismo por necessidade.\n* B) Empreendedorismo sustentável.\n* C) Empreendedorismo social.\n* D) Empreendedorismo individual.\n* E) Empreendedorismo por oportunidade tradicional.\n\n* **Resposta Correta:** **B) Empreendedorismo sustentável.** [137]\n* **Justificativa Teórica Oficial:** O caso apresenta uma solução que mantém a geração de valor econômico ao mesmo tempo em que reduz impactos ambientais, característica central do empreendedorismo sustentável [137].","distractors":{"A":"A pressão por renda não é a característica destacada no caso.","C":"A fonte destaca a combinação de valor econômico e preservação ambiental; não classifica este caso como social.","D":"Atuação individual não é o critério destacado pela questão.","E":"A característica específica dada no caso é manter lucro e reduzir impacto ambiental."},"evidence":"MÓDULO 6: INICIAÇÃO EMPREENDEDORA · Aula 1: Atitude Empreendedora e Modalidades","evidenceLesson":15,"examTip":"O caso apresenta uma solução que mantém a geração de valor econômico ao mesmo tempo em que reduz impactos ambientais, característica central do empreendedorismo sustentável.","promptHtml":"Uma empresa cria uma linha de embalagens biodegradáveis que mantém a lucratividade do negócio e reduz drasticamente o impacto ambiental. Esse modelo é classificado como:","explanationHtml":"\u003cp>O caso apresenta uma solução que mantém a geração de valor econômico ao mesmo tempo em que reduz impactos ambientais, característica central do empreendedorismo sustentável.\u003c/p>\n","examTipHtml":"\u003cp>O caso apresenta uma solução que mantém a geração de valor econômico ao mesmo tempo em que reduz impactos ambientais, característica central do empreendedorismo sustentável.\u003c/p>\n","review":{"topic":"Empreendedorismo sustentável","key":"Lucro + menor impacto ambiental","takeaway":"O caso reúne geração de valor econômico e redução de impactos ambientais."}}],"activities":[{"id":0,"title":"1. Reescrita de Bilhete Informal (Módulo 1 / Aula 1)","prompt":"* **Instruções Completas:**\n  * Leiam o bilhete informal:\n    > *\"Oi, saí rapidinho aqui, mas ó… não consegui terminar o relatório. O sistema começou a travar muito, tipo, não salvava nada, aí perdi umas partes que já tinha feito. Fiquei tentando arrumar, reiniciei tudo, mas continuou ruim. Se puder, manda uma mensagem pro chefe explicando isso, porque ficou tudo meio parado aqui na nossa equipe.\"*\n  * Em duplas, identifiquem as informações principais, eliminem a informalidade e reescrevam a mensagem em linguagem adequada ao ambiente profissional.","expectation":"* *Exemplo Esperado de Referência:*\n    > *\"Olá, informo que o colaborador Lucas precisou se ausentar e não conseguiu concluir o relatório devido a falhas no sistema. A equipe está verificando a situação e permanece à disposição para atualizações.\"*","original":"### 1. Reescrita de Bilhete Informal (Módulo 1 / Aula 1)\n* **Instruções Completas:**\n  * Leiam o bilhete informal:\n    > *\"Oi, saí rapidinho aqui, mas ó… não consegui terminar o relatório. O sistema começou a travar muito, tipo, não salvava nada, aí perdi umas partes que já tinha feito. Fiquei tentando arrumar, reiniciei tudo, mas continuou ruim. Se puder, manda uma mensagem pro chefe explicando isso, porque ficou tudo meio parado aqui na nossa equipe.\"* [2]\n  * Em duplas, identifiquem as informações principais, eliminem a informalidade e reescrevam a mensagem em linguagem adequada ao ambiente profissional [3, 8].\n* **Gabarito / Expectativa de Resposta:**\n  * *Exemplo Esperad  Se puder, manda uma mensagem pro chefe explicando isso, porque ficou tudo meio parado aqui na nossa equipe.\"*\n  * Em duplas, identifiquem as informações principais, eliminem a informalidade e reescrevam a mensagem em linguagem adequada ao ambiente profissional.","adapt":"Registre sua produção individual neste caderno. Atenda a todos os itens e explique por que suas decisões se apoiam nos conceitos estudados.","promptMd":"* **Instruções Completas:**\n  * Em duplas, analisem a situação-problema de comunicação apresentada em aula e identifiquem **sete pontos** que tornam a mensagem pouco profissional.\n  * Reescrevam a mensagem no caderno garantindo clareza, formalidade e objetividade.","promptHtml":"\u003cul>\n\u003cli>\u003cstrong>Instruções Completas:\u003c/strong>\u003cul>\n\u003cli>Em duplas, analisem a situação-problema de comunicação apresentada em aula e identifiquem \u003cstrong>sete pontos\u003c/strong> que tornam a mensagem pouco profissional.\u003c/li>\n\u003cli>Reescrevam a mensagem no caderno garantindo clareza, formalidade e objetividade.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","expectationHtml":"\u003cul>\n\u003cli>Os estudantes devem apontar o uso de gírias, falta de contexto, ausência de saudação formal, parágrafos confusos, transferência indevida de responsabilidade, erros gramaticais e falta de prazos. A reescrita deve apresentar estrutura formal completa.\u003c/li>\n\u003c/ul>\n","supportHtml":"\u003cul>\n\u003cli>\u003cstrong>Instruções Completas:\u003c/strong>\u003cul>\n\u003cli>Leiam o bilhete informal:\u003cblockquote>\n\u003cp>\u003cem>&quot;Oi, saí rapidinho aqui, mas ó… não consegui terminar o relatório. O sistema começou a travar muito, tipo, não salvava nada, aí perdi umas partes que já tinha feito. Fiquei tentando arrumar, reiniciei tudo, mas continuou ruim. Se puder, manda uma mensagem pro chefe explicando isso, porque ficou tudo meio parado aqui na nossa equipe.&quot;\u003c/em>\u003c/p>\n\u003c/blockquote>\n\u003c/li>\n\u003cli>Em duplas, identifiquem as informações principais, eliminem a informalidade e reescrevam a mensagem em linguagem adequada ao ambiente profissional.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n"},{"id":2,"title":"3. Redação Prática de E-mail Corporativo em Trios (Módulo 2 / Aula 2)","prompt":"* **Instruções Completas:**\n  * Em trios, dividam-se nos papéis:\n    * **Integrante A:** Redige o e-mail inicial.\n    * **Integrante B:** Escreve a resposta ao e-mail de A.\n    * **Integrante C:** Avalia ambos os e-mails com base no checklist de revisão e sugere melhorias.\n  * Escolham uma das situações: 1. Confirmação de reunião; 2. Envio de documento; 3. Pedido de prazo.","expectation":"* E-mails redigidos com assunto claro, saudação formal, corpo em tópicos objetivos, solicitação de confirmação e assinatura profissional, validados pelo checklist do integrante C.","original":"### 3. Redação Prática de E-mail Corporativo em Trios (Módulo 2 / Aula 2)\n* **Instruções Completas:**\n  * Em trios, dividam-se nos papéis:\n    * **Integrante A:** Redige o e-mail inicial [37].\n    * **Integrante B:** Escreve a resposta ao e-mail de A [37].\n    * **Integrante C:** Avalia ambos os e-mails com base no checklist de revisão e sugere melhorias [37, 43].\n  * Escolham uma das situações: 1. Confirmação de reunião; 2. Envio de documento; 3. Pedido de prazo [37].\n* **Gabarito / Expectativa de Resposta:**\n  * E-mails redigidos com assunto claro, saudação formal, corpo em tópicos objetivos, solicitação de confirmação e assinatura profissional, validados pelo checklist do integrante C [37, 44].","adapt":"Se estiver sozinho, escreva as três partes: e-mail inicial, resposta e revisão do checklist. Justifique as escolhas de linguagem e estrutura.","gap":"","support":"","promptMd":"* **Instruções Completas:**\n  * Em trios, dividam-se nos papéis:\n    * **Integrante A:** Redige o e-mail inicial.\n    * **Integrante B:** Escreve a resposta ao e-mail de A.\n    * **Integrante C:** Avalia e redijam um e-mail corporativo ao gestor comunicando o plano de melhoria.","expectation":"* Propostas físicas (*Seiri* e *Seiton*) e digitais (*Seiketsu* - padronização de arquivos) acompanhadas de e-mail formal bem estruturado.","original":"### 6. Diagnóstico 5S em Ambiente Físico e Digital (Módulo 5 / Aula 2)\n* **Instruções Completas:**\n  * Em grupos, identifiquem dois problemas de organização no ambiente físico e dois problemas no ambiente digital de um escritório [121].\n  * Proponham soluções práticas baseadas no 5S e redijam um e-mail corporativo ao gestor comunicando o plano de melhoria [121].\n* **Gabarito / Expectativa de Resposta:**\n  * Propostas físicas (*Seiri* e *Seiton*) e digitais (*Seiketsu* - padronização de arquivos) acompanhadas de e-mail formal bem estruturado [116, 121, 122].","adapt":"Registre sua produção individual neste caderno. Atenda a todos os itens e explique por que suas decisões se apoiam nos conceitos estudados.","gap":"","support":"","promptMd":"* **Instruções Completas:**\n  * Em grupos, identifiquem dois problemas de organização no ambiente físico e dois problemas no ambiente digital de um escritório.\n  * Proponham soluções práticas baseadas no 5S e redijam um e-mail corporativo ao gestor comunicando o plano de melhoria.","promptHtml":"\u003cul>\n\u003cli>\u003cstrong>Instruções Completas:\u003c/strong>\u003cul>\n\u003cli>Em grupos, identifiquem dois problemas de organização no ambiente físico e dois problemas no ambiente digital de um escritório.\u003c/li>\n\u003cli>Proponham soluções práticas baseadas no 5S e redijam um e-mail corporativo ao gestor comunicando o plano de melhoria.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","expectationHtml":"\u003cul>\n\u003cli>Propostas físicas (\u003cem>Seiri\u003c/em> e \u003cem>Seiton\u003c/em>) e digitais (\u003cem>Seiketsu\u003c/em> - padronização de arquivos) acompanhadas de e-mail formal bem estruturado.\u003c/li>\n\u003c/ul>\n","supportHtml":""},{"id":6,"title":"7. Elaboração de Mapa Mental Empreendedor (Módulo 6 / Aula 2)","prompt":"* **Instruções Completas:**\n  * Em grupos, escolham um problema real da comunidade escolar.\n  * Construam um **Mapa Mental** no caderno detalhando: Onde ocorre, Quem é afetado, Quando ocorre, Causas, Impactos e Oportunidade de Solução.","expectation":"* Estruturação lógica e visual demonstrando o diagnóstico completo do problema e a proposta de valor empreendedora.","original":"### 7. Elaboração de Mapa Mental Empreendedor (Módulo 6 / Aula 2)\n* **Instruções Completas:**\n  * Em grupos, escolham um problema real da comunidade escolar [144, 145].\n  * Construam um **Mapa Mental** no caderno detalhando: Onde ocorre, Quem é afetado, Quando ocorre, Causas, Impactos e Oportunidade de Solução [140, 145].\n* **Gabarito / Expectativa de Resposta:**\n  * Estruturação lógica e visual demonstrando o diagnóstico completo do problema e a proposta de valor empreendedora [145].","adapt":"Registre seu mapa em texto com os ramos: onde, quem, quando, causas, impactos e oportunidade. Explique por que a solução corresponde ao problema que você identificou.","gap":"","support":"","promptMd":"* **Instruções Completas:**\n  * Em grupos, escolham um problema real da comunidade escolar.\n  * Construam um **Mapa Mental** no caderno detalhando: Onde ocorre, Quem é afetado, Quando ocorre, Causas, Impactos e Oportunidade de Solução.","promptHtml":"\u003cul>\n\u003cli>\u003cstrong>Instruções Completas:\u003c/strong>\u003cul>\n\u003cli>Em grupos, escolham um problema real da comunidade escolar.\u003c/li>\n\u003cli>Construam um \u003cstrong>Mapa Mental\u003c/strong> no caderno detalhando: Onde ocorre, Quem é afetado, Quando ocorre, Causas, Impactos e Oportunidade de Solução.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","expectationHtml":"\u003cul>\n\u003cli>Estruturação lógica e visual demonstrando o diagnóstico completo do problema e a proposta de valor empreendedora.\u003c/li>\n\u003c/ul>\n","supportHtml":""}],"mapping":"## 📋 MAPEAMENTO DE HABILIDADES E OBJETIVOS DE APRENDIZAGEM\n\n### 1. Módulo: Etiqueta Corporativa e Imagem\n* **Habilidades Técnicas:**\n  * Adequar a linguagem e a apresentação pessoal ao ambiente de trabalho.\n  * Reconhecer como a vestimenta e a semiótica da imagem se conectam ao contexto de trabalho e às atividades desempenhadas.\n  * Identificar comportamentos adequados e inadequados no cotidiano corporativo.\n* **Habilidades Socioemocionais:**\n  * Demonstrar maturidade e bom senso na adaptação do comportamento ao contexto profissional.\n  * Desenvolver autocontrole, autorregulação e respeito diante de situações do cotidiano de trabalho.\n* **Objetivos de Aprendizagem:**\n  * Compreender o conceito de persona profissional e a importância de adaptar a linguagem ao contexto e público.\n  * Compreender o conceito de *dress code* e sua variação segundo a empresa, setor e situação.\n  * Reconhecer o papel da comunicação não verbal, dos sinais não verbais e da empatia na convivência diária.\n\n---\n\n### 2. Módulo: Comunicação Profissional\n* **Habilidades Técnicas:**\n  * Praticar a transição da linguagem coloquial para a linguagem corporativa.\n  * Utilizar a comunicação escrita e digital (e-mail, chat corporativo) com formalidade, estrutura e tom adequados.\n  * Discernir o nível de formalidade e o canal correto para cada tipo de mensagem, evitando ruídos.\n  * Identificar os elementos essenciais de um e-mail corporativo (assunto, corpo, assinatura).\n  * Estabelecer boas práticas de comunicação síncrona em aplicativos de mensagens instantâneas (WhatsApp e Teams).\n* **Habilidades Socioemocionais:**\n  * Agir com empatia, respeito e clareza na transmissão de mensagens rápidas e no relacionamento profissional.\n* **Objetivos de Aprendizagem:**\n  * Identificar pontos de inadequação em mensagens informais e reescrevê-las com formalidade e assertividade.\n  * Redigir e-mails corporativos técnicos com clareza, objetividade e aplicação de checklist de revisão.\n  * Elaborar manuais de boas práticas orientando linguagem, uso de áudio, organização de grupos e respeito aos horários de trabalho.\n\n---\n\n### 3. Módulo: Trabalho em Equipe e Convivência\n* **Habilidades Técnicas:**\n  * Identificar os papéis, níveis hierárquicos e estruturas organizacionais nas empresas.\n  * Compreender a função dos organogramas e reconhecer a representação gráfica das relações de autoridade e comunicação.\n* **Habilidades Socioemocionais:**\n  * Atuar de forma colaborativa e respeitosa, promovendo a integração entre profissionais de diferentes gerações.\n  * Valorizar o trabalho coletivo e compreender como a divisão funcional de papéis otimiza a resolução de problemas.\n* **Objetivos de Aprendizagem:**\n  * Diferenciar e construir modelos de organograma (como o organograma setorial utilizado em grandes corporações como a Unilever).\n  * Compreender os benefícios da colaboração intergeracional para o aumento da inovação e da qualidade das soluções.\n  * Experimentar a construção coletiva de soluções a partir da articulação entre frentes estratégicas, operacionais e de comunicação.\n\n---\n\n### 4. Módulo: Postura Profissional\n* **Habilidades Técnicas:**\n  * Compreender o feedback como ferramenta contínua de crescimento profissional.\n  * Identificar os princípios de ética, *compliance* e técnicas de recebimento/concessão de feedback.\n  * Identificar comportamentos éticos e antiéticos no cotidiano corporativo.\n  * Demonstrar atitudes proativas na resolução de situações do ambiente de trabalho.\n* **Habilidades Socioemocionais:**\n  * Agir com integridade e flexibilidade, demonstrando proatividade e maturidade ao lidar com correções e imprevistos.\n* **Objetivos de Aprendizagem:**\n  * Estruturar feedbacks construtivos utilizando o modelo SCI (Situação, Comportamento, Impacto) e definir planos de ação (começar, parar, continuar).\n  * Analisar estudos de caso sobre omissão corporativa, priorização de resultados a qualquer custo e conflitos éticos.\n  * Tomar decisões autônomas e rápidas diante do fator-surpresa e crises operacionais.\n\n---\n\n### 5. Módulo: Organização e Produtividade\n* **Habilidades Técnicas:**\n  * Classificar e priorizar tarefas utilizando a Matriz de Eisenhower com base em urgência e importância.\n  * Aplicar o Programa 5S para a organização do espaço de trabalho físico e digital.\n  * Utilizar ferramentas digitais de produtividade (Google Agenda) para planejar e gerenciar a rotina de trabalho.\n* **Habilidades Socioemocionais:**\n  * Desenvolver disciplina e autonomia na gestão do tempo e no cumprimento de prazos operacionais.\n* **Objetivos de Aprendizagem:**\n  * Organizar atividades em quatro quadrantes de priorização para evitar acúmulo e crises.\n  * Aplicar os sensos do 5S (*Seiri*, *Seiton*, *Seiso*, *Seiketsu*, *Shitsuke*) na padronização física e digital.\n  * Estruturar agendas semanais no Google Agenda, identificando conflitos de horários e reorganizando demandas frente a imprevistos.\n\n---\n\n### 6. Módulo: Iniciação Empreendedora\n* **Habilidades Técnicas:**\n  * Identificar modalidades de empreendedorismo (por oportunidade, por necessidade, corporativo, social, sustentável e individual).\n  * Analisar situações cotidianas para transformar problemas em oportunidades de negócio.\n  * Desenvolver e avaliar ideias de negócio com base em diagnósticos de mercado e ferramentas de validação.\n* **Habilidades Socioemocionais:**\n  * Desenvolver iniciativa, criatividade e protagonismo empreendedor na busca por inovações.\n* **Objetivos de Aprendizagem:**\n  * Classificar casos práticos de inovação e atitude empreendedora nas empresas e na sociedade.\n  * Mapear problemas complexos por meio da construção de Mapas Mentais (como o caso do iFood).\n  * Avaliar o potencial de ideias de negócio utilizando gráficos perceptuais e matrizes de diagnóstico.\n\n---\n\n","source":"revisao-CARREIRA E COMPETÊNCIAS-prova-paulista.md","stations":[{"title":"Sua presença no trabalho","subtitle":"Comunicar, conviver e colaborar","lessons":[0,1,2,3,4,5,6,7,8],"questions":[0,1,2,3,4,5],"activities":[0,1,2,3],"story":"{NOME}, você faz parte de uma equipe de Logística e precisa comunicar uma falha no sistema, conversar com pessoas de diferentes gerações e respeitar a organização dos cargos. Nesta estação, cada decisão passa pela sua linguagem, sua postura e sua colaboração.","command":"Antes de agir, identifique o contexto, o público e a responsabilidade de cada pessoa."},{"title":"Seu próximo passo","subtitle":"Agir, organizar e empreender","lessons":[9,10,11,12,13,14,15,16,17],"questions":[6,7,8,9,10,11,12],"activities":[4,5,6],"story":"{NOME}, agora você precisa lidar com imprevistos, dar feedback, organizar as prioridades e transformar um problema em uma oportunidade. Sua missão é justificar suas escolhas com ética, proatividade e os conceitos estudados.","command":"Relacione sua decisão ao conceito: SCI, prioridades, 5S ou modalidade de empreendedorismo."}],"mappingHtml":"\u003ch2>📋 MAPEAMENTO DE HABILIDADES E OBJETIVOS DE APRENDIZAGEM\u003c/h2>\n\u003ch3>1. Módulo: Etiqueta Corporativa e Imagem\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Adequar a linguagem e a apresentação pessoal ao ambiente de trabalho.\u003c/li>\n\u003cli>Reconhecer como a vestimenta e a semiótica da imagem se conectam ao contexto de trabalho e às atividades desempenhadas.\u003c/li>\n\u003cli>Identificar comportamentos adequados e inadequados no cotidiano corporativo.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Demonstrar maturidade e bom senso na adaptação do comportamento ao contexto profissional.\u003c/li>\n\u003cli>Desenvolver autocontrole, autorregulação e respeito diante de situações do cotidiano de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Compreender o conceito de persona profissional e a importância de adaptar a linguagem ao contexto e público.\u003c/li>\n\u003cli>Compreender o conceito de \u003cem>dress code\u003c/em> e sua variação segundo a empresa, setor e situação.\u003c/li>\n\u003cli>Reconhecer o papel da comunicação não verbal, dos sinais não verbais e da empatia na convivência diária.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>2. Módulo: Comunicação Profissional\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Praticar a transição da linguagem coloquial para a linguagem corporativa.\u003c/li>\n\u003cli>Utilizar a comunicação escrita e digital (e-mail, chat corporativo) com formalidade, estrutura e tom adequados.\u003c/li>\n\u003cli>Discernir o nível de formalidade e o canal correto para cada tipo de mensagem, evitando ruídos.\u003c/li>\n\u003cli>Identificar os elementos essenciais de um e-mail corporativo (assunto, corpo, assinatura).\u003c/li>\n\u003cli>Estabelecer boas práticas de comunicação síncrona em aplicativos de mensagens instantâneas (WhatsApp e Teams).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Agir com empatia, respeito e clareza na transmissão de mensagens rápidas e no relacionamento profissional.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Identificar pontos de inadequação em mensagens informais e reescrevê-las com formalidade e assertividade.\u003c/li>\n\u003cli>Redigir e-mails corporativos técnicos com clareza, objetividade e aplicação de checklist de revisão.\u003c/li>\n\u003cli>Elaborar manuais de boas práticas orientando linguagem, uso de áudio, organização de grupos e respeito aos horários de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>3. Módulo: Trabalho em Equipe e Convivência\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u0 car modalidades de empreendedorismo (por oportunidade, por necessidade, corporativo, social, sustentável e individual).\u003c/li>\n\u003cli>Analisar situações cotidianas para transformar problemas em oportunidades de negócio.\u003c/li>\n\u003cli>Desenvolver e avaliar ideias de negócio com base em diagnósticos de mercado e ferramentas de validação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Desenvolver iniciativa, criatividade e protagonismo empreendedor na busca por inovações.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Classificar casos práticos de inovação e atitude empreendedora nas empresas e na sociedade.\u003c/li>\n\u003cli>Mapear problemas complexos por meio da construção de Mapas Mentais (como o caso do iFood).\u003c/li>\n\u003cli>Avaliar o potencial de ideias de negócio utilizando gráficos perceptuais e matrizes de diagnóstico.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n"},{"id":"estoques","name":"Planejamento e Organização de Estoques","short":"Estoques","icon":"stock","summary":"Do inventário à reposição: decisões para organizar e controlar o estoque.","lessons":[{"id":0,"module":0,"title":"Aula 1: Importância, Objetivos e Obrigações na Gestão de Estoques (LOGANO1C2B3S15A1)","moduleTitle":"Inventário e acuracidade","body":"* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\n* **Conceitos Chave & Teoria:**\n  - **Conceito de Contagem de Estoque:** Nos estoques, a contagem consiste no procedimento de verificação física dos materiais da empresa em um período definido, comparando os dados apurados com os registros do sistema WMS (*Warehouse Management System* / Sistema de Gerenciamento de Armazéns), planilhas eletrônicas ou controles internos.\n  - **Objetivo da Contagem:** Manter informações confiáveis e reduzir significativamente as divergências entre o estoque físico e o sistema de informação da empresa.\n  - **Parâmetros Fundamentais:** Uma gestão eficiente exige o acompanhamento constante da demanda, da rotatividade dos materiais e da classificação por relevância (Curva ABC).\n* **Aplicações Práticas & Exemplos:**\n  - **Estudo de Caso Loja Alfa:** A Loja Alfa enfrentava graves gargalos operacionais e prejuízos por realizar contagens esporádicas e desprovidas de critérios claros. A implementação da Classificação ABC permitiu à loja priorizar o controle rigoroso dos itens de maior valor financeiro e impacto operacional.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003cbr>**Socioemocional:** Gerenciar emoções e impulsos para manter a concentração; expressar opiniões com confiança; colaborar harmoniosamente.\n\n**Objetivos de aprendizagem**\n\nReconhecer a importância da contagem de inventário, compreendendo os parâmetros fundamentais para uma gestão eficiente de estoques, como demanda, rotatividade e classificação ABC.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Conceito de Contagem de Estoque:\u003c/strong> Nos estoques, a contagem consiste no procedimento de verificação física dos materiais da empresa em um período definido, comparando os dados apurados com os registros do sistema WMS (\u003cem>Warehouse Management System\u003c/em> / Sistema de Gerenciamento de Armazéns), planilhas eletrônicas ou controles internos.\u003c/li>\n\u003cli>\u003cstrong>Objetivo da Contagem:\u003c/strong> Manter informações confiáveis e reduzir significativamente as divergências entre o estoque físico e o sistema de informação da empresa.\u003c/li>\n\u003cli>\u003cstrong>Parâmetros Fundamentais:\u003c/strong> Uma gestão eficiente exige o acompanhamento constante da demanda, da rotatividade dos materiais e da classificação por relevância (Curva ABC).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Estudo de Caso Loja Alfa:\u003c/strong> A Loja Alfa enfrentava graves gargalos operacionais e prejuízos por realizar contagens esporádicas e desprovidas de critérios claros. A implementação da Classificação ABC permitiu à loja priorizar o controle rigoroso dos itens de maior valor financeiro e impacto operacional.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Gerenciar emoções e impulsos para manter a concentração; expressar opiniões com confiança; colaborar harmoniosamente.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Reconhecer a importância da contagem de inventário, compreendendo os parâmetros fundamentais para uma gestão eficiente de estoques, como demanda, rotatividade e classificação ABC.\u003c/p>\n","review":{"title":"Por que contar o estoque?","goal":"Explicar como a contagem ajuda a manter informações confiáveis.","keywords":["Estoque físico","Registros","Curva ABC"],"points":["Contar é verificar fisicamente os materiais e comparar com os registros.","A comparação ajuda a reduzir divergências e melhorar a confiabilidade.","Demanda, giro e classificação ABC orientam as prioridades de controle."]}},{"id":1,"module":0,"title":"Aula 2: Tipos, Técnicas e Formulários de Contagem de Estoque (LOGANO1C2B3S15A2)","moduleTitle":"Inventário e acuracidade","body":"* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\n* **Conceitos Chave & Teoria:**\n  - **Método de Contagem Periódica:** Consiste na contagem física do estoque realizada em intervalos fixos e predefinidos (mensal, trimestral ou anual). Durante o intervalo, o sistema não é atualizado a cada movimentação; a verificação e o ajuste ocorrem estritamente nas datas programadas.\n  - **Método de Contagem Permanente (Contínua):** O controle e os registros são atualizados em tempo real a cada entrada ou saída de mercadoria, oferecendo alta visibilidade e prevenindo rupturas.\n  - **Método de Contagem Manual:** A verificação é executada diretamente pelos colaboradores nas prateleiras e estruturas de armazenagem, conferindo itens, prazos de validade e avarias, com anotação em formulários físicos ou planilhas simples.\n  - **Método de Contagem por Amostragem:** Realiza-se a contagem de uma fração representativa do estoque (porções de prateleiras ou grupos específicos) com o objetivo de identificar padrões de erro, falhas de registro ou rupturas sem necessitar paralisar toda a operação.\n  - **Estrutura do Formulário do Inventário Manual:** Para assegurar a confiabilidade, o formulário de contagem deve conter obrigatoriamente:\n    1. *Fila / Unidade*\n    2. *Data e Localização física*\n    3. *Categoria do produto*\n    4. *Código e Descrição completa do produto*\n    5. *Quantidade em estoque registrada no sistema*\n    6. *Quantidade em estoque apurada na contagem física*\n    7. *Discrepâncias (Diferença entre apurado vs. registrado no sistema)*\n    8. *Observações, Ações corretivas e Comentários*\n    9. *Identificação do Responsável, Assinatura e Data*\n* **Aplicações Práticas & Exemplos:**\n  - **Rede Tem Tudo:** Nas unidades de menor porte sem WMS, a equipe da seção de utilidades domésticas utiliza a contagem manual semanal. No setor de eletrônicos (alto valor e giro elevado), utiliza-se o controle permanente para evitar vendas de produtos indisponíveis. Nas lojas de grande porte, adota-se a contagem por amostragem para otimizar tempo e recursos.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003cbr>**Socioemocional:** Gerenciar emoções; expressar opiniões com confiança; colaborar harmoniosamente.\n\n**Objetivos de aprendizagem**\n\nIdentificar diferentes métodos de contagem de estoques e formulários aplicados durante esse processo.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Método de Contagem Periódica:\u003c/strong> Consiste na contagem física do estoque realizada em intervalos fixos e predefinidos (mensal, trimestral ou anual). Durante o intervalo, o sistema não é atualizado a cada movimentação; a verificação e o ajuste ocorrem estritamente nas datas programadas.\u003c/li>\n\u003cli>\u003cstrong>Método de Contagem Permanente (Contínua):\u003c/strong> O controle e os registros são atualizados em tempo real a cada entrada ou saída de mercadoria, oferecendo alta visibilidade e prevenindo rupturas.\u003c/li>\n\u003cli>\u003cstrong>Método de Contagem Manual:\u003c/strong> A verificação é executada diretamente pelos colaboradores nas prateleiras e estruturas de armazenagem, conferindo itens, prazos de validade e avarias, com anotação em formulários físicos ou planilhas simples.\u003c/li>\n\u003cli>\u003cstrong>Método de Contagem por Amostragem:\u003c/strong> Realiza-se a contagem de uma fração representativa do estoque (porções de prateleiras ou grupos específicos) com o objetivo de identificar padrões de erro, falhas de registro ou rupturas sem necessitar paralisar toda a operação.\u003c/li>\n\u003cli>\u003cstrong>Estrutura do Formulário do Inventário Manual:\u003c/strong> Para assegurar a confiabilidade, o formulário de contagem deve conter obrigatoriamente:\u003col>\n\u003cli>\u003cem>Fila / Unidade\u003c/em>\u003c/li>\n\u003cli>\u003cem>Data e Localização física\u003c/em>\u003c/li>\n\u003cli>\u003cem>Categoria do produto\u003c/em>\u003c/li>\n\u003cli>\u003cem>Código e Descrição completa do produto\u003c/em>\u003c/li>\n\u003cli>\u003cem>Quantidade em estoque registrada no sistema\u003c/em>\u003c/li>\n\u003cli>\u003cem>Quantidade em estoque apurada na contagem física\u003c/em>\u003c/li>\n\u003cli>\u003cem>Discrepâncias (Diferença entre apurado vs. registrado no sistema)\u003c/em>\u003c/li>\n\u003cli>\u003cem>Observações, Ações corretivas e Comentários\u003c/em>\u003c/li>\n\u003cli>\u003cem>Identificação do Responsável, Assinatura e Data\u003c/em>\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Rede Tem Tudo:\u003c/strong> Nas unidades de menor porte sem WMS, a equipe da seção de utilidades domésticas utiliza a contagem manual semanal. No setor de eletrônicos (alto valor e giro elevado), utiliza-se o controle permanente para evitar vendas de produtos indisponíveis. Nas lojas de grande porte, adota-se a contagem por amostragem para otimizar tempo e recursos.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Gerenciar emoções; expressar opiniões com confiança; colaborar harmoniosamente.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Identificar diferentes métodos de contagem de estoques e formulários aplicados durante esse processo.\u003c/p>\n","review":{"title":"Métodos de contagem","goal":"Escolher o método que combina com o porte e a operação da loja.","keywords":["Periódica","Permanente","Manual e amostragem"],"points":["Periódica: verificação em intervalos definidos. Permanente: registros atualizados a cada entrada e saída.","Manual: conferência direta com formulários ou planilhas. Amostragem: contagem de uma parte representativa.","O formulário registra identificação, localização, quantidades, diferenças, observações e responsável."]}},{"id":2,"module":0,"title":"Aula 3: Planejamento para a Contagem de Inventário (LOGANO1C2B3S15A3)","moduleTitle":"Inventário e acuracidade","body":"* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e ferramentas da gestão de estoques para classificar, categorizar, calcular e efetuar previsões de demanda.\n* **Conceitos Chave & Teoria:**\n  - **Etapas do Planejamento de Inventário:** A execução da contagem exige uma preparação sequencial e estruturada:\n    1. *Planejamento Antecipado:* Definição clara dos objetivos, escopo, equipes de trabalho, recursos necessários, cronograma e tempos previstos.\n    2. *Comunicação Interna:* Informar previamente todos os setores envolvidos sobre datas, regras operacionais e orientações.\n    3. *Preparação do Local:* Organizar, arrumar e sinalizar o espaço físico do estoque para facilitar a identificação visual e a contagem dos produtos.\n    4. *Procedimentos de Contagem Física:* Executar a conferência física conforme o método escolhido (manual, coletor de dados ou por amostragem).\n    5. *Análise de Divergências:* Comparar os dados apurados fisicamente com os saldos registrados no sistema e investigar as origens das diferenças.\n  - **Inventário Geral vs. Contagem Cíclica (Rotativa):**\n    - *Inventário Geral:* Envolve a contagem de todos os itens do acervo simultaneamente. É um processo longo e mais complexo, geralmente realizado no encerramento do exercício fiscal para balanço legal, exigindo grande mobilização de pessoal e, frequentemente, a paralisação das atividades.\n    - *Contagem Cíclica ou Rotativa:* Ocorre continuamente ao longo do ano, dividida em ciclos por setores, categorias de produtos ou curva ABC. Permite manter a precisão das informações sem interromper as vendas ou a operação.\n* **Aplicações Práticas & Exemplos:**\n  - **Estratégia na Rede Tem Tudo:** Para cumprir as obrigações fiscais sem fechar as grandes filiais por períodos prolongados, a rede divide o inventário geral em etapas planejadas e utiliza contagens cíclicas diárias nos produtos críticos de alto giro.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar os conceitos e ferramentas da gestão de estoques para classificar, categorizar, calcular e efetuar previsões de demanda.\u003cbr>**Socioemocional:** Autorregulação, expressão confiante e colaboração.\n\n**Objetivos de aprendizagem**\n\nReconhecer as etapas da contagem de inventário, distinguindo as características da contagem geral e da contagem cíclica ou rotativa.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar os conceitos e ferramentas da gestão de estoques para classificar, categorizar, calcular e efetuar previsões de demanda.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Etapas do Planejamento de Inventário:\u003c/strong> A execução da contagem exige uma preparação sequencial e estruturada:\u003col>\n\u003cli>\u003cem>Planejamento Antecipado:\u003c/em> Definição clara dos objetivos, escopo, equipes de trabalho, recursos necessários, cronograma e tempos previstos.\u003c/li>\n\u003cli>\u003cem>Comunicação Interna:\u003c/em> Informar previamente todos os setores envolvidos sobre datas, regras operacionais e orientações.\u003c/li>\n\u003cli>\u003cem>Preparação do Local:\u003c/em> Organizar, arrumar e sinalizar o espaço físico do estoque para facilitar a identificação visual e a contagem dos produtos.\u003c/li>\n\u003cli>\u003cem>Procedimentos de Contagem Física:\u003c/em> Executar a conferência física conforme o método escolhido (manual, coletor de dados ou por amostragem).\u003c/li>\n\u003cli>\u003cem>Análise de Divergências:\u003c/em> Comparar os dados apurados fisicamente com os saldos registrados no sistema e investigar as origens das diferenças.\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>Inventário Geral vs. Contagem Cíclica (Rotativa):\u003c/strong>\u003cul>\n\u003cli>\u003cem>Inventário Geral:\u003c/em> Envolve a contagem de todos os itens do acervo simultaneamente. É um processo longo e mais complexo, geralmente realizado no encerramento do exercício fiscal para balanço legal, exigindo grande mobilização de pessoal e, frequentemente, a paralisação das atividades.\u003c/li>\n\u003cli>\u003cem>Contagem Cíclica ou Rotativa:\u003c/em> Ocorre continuamente ao longo do ano, dividida em ciclos por setores, categorias de produtos ou curva ABC. Permite manter a precisão das informações sem interromper as vendas ou a operação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Estratégia na Rede Tem Tudo:\u003c/strong> Para cumprir as obrigações fiscais sem fechar as grandes filiais por períodos prolongados, a rede divide o inventário geral em etapas planejadas e utiliza contagens cíclicas diárias nos produtos críticos de alto giro.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar os conceitos e ferramentas da gestão de estoques para classificar, categorizar, calcular e efetuar previsões de demanda.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Autorregulação, expressão confiante e colaboração.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Reconhecer as etapas da contagem de inventário, distinguindo as características da contagem geral e da contagem cíclica ou rotativa.\u003c/p>\n","review":{"title":"Planejamento do inventário","goal":"Organizar a contagem e diferenciar inventário geral de cíclico.","keywords":["Escopo","Inventário geral","Contagem cíclica"],"points":["Defina objetivos, equipe, recursos e cronograma; comunique os setores e prepare o espaço.","O inventário geral conta todos os itens; a contagem cíclica distribui o trabalho ao longo do ano.","No caso da Tem Tudo, planejar a contagem geral em etapas reduz longas paralisações."]}},{"id":3,"module":0,"title":"Aula 4: Condução da Contagem – Passo a Passo (LOGANO1C2B3S15A4)","moduleTitle":"Inventário e acuracidade","body":"* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\n* **Conceitos Chave & Teoria:**\n  - **Técnicas e Critérios Operacionais da Contagem Cíclica:** A contagem cíclica requer a definição de critérios de priorização para determinar a frequência de contagem:\n    1. *Classificação ABC:* Produtos da Classe A são contados com alta frequência (ex: semanal ou quinzenal); Classe B com frequência intermediária (mensal); Classe C em ciclos mais longos.\n    2. *Criticidade e Valor:* Itens de alto valor agregado (como eletrônicos) ou de alto risco de roubo/avaria exigem monitoramento constante.\n    3. *Localização e Categoria:* Divisão do armazém por corredores ou tipos de produtos (vestuário, perecíveis, utilidades).\n  - **Benefícios da Contagem Cíclica:** Reduz rupturas em gôndolas, previne excesso de estoque armazenado e melhora o fluxo de ressuprimento entre filiais.\n* **Aplicações Práticas & Exemplos:**\n  - **Filial Araraquara (Rede Tem Tudo):** No planejamento do levantamento inicial da filial, a primeira medida estratégica é definir o escopo e os objetivos da contagem (definindo categorias, métodos e datas). Os postos-chave comunicados à alta gerência incluem nível real de estoque, principais divergências (físico vs. sistema), riscos de ruptura e necessidades de ajuste de processos.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar conceitos e ferramentas de gestão para classificação, cálculos e previsões de demanda.\u003cbr>**Socioemocional:** Concentração, comunicação assertiva e trabalho colaborativo.\n\n**Objetivos de aprendizagem**\n\nCompreender os principais aspectos e técnicas da contagem cíclica de inventário, considerando critérios operacionais e de organização.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Técnicas e Critérios Operacionais da Contagem Cíclica:\u003c/strong> A contagem cíclica requer a definição de critérios de priorização para determinar a frequência de contagem:\u003col>\n\u003cli>\u003cem>Classificação ABC:\u003c/em> Produtos da Classe A são contados com alta frequência (ex: semanal ou quinzenal); Classe B com frequência intermediária (mensal); Classe C em ciclos mais longos.\u003c/li>\n\u003cli>\u003cem>Criticidade e Valor:\u003c/em> Itens de alto valor agregado (como eletrônicos) ou de alto risco de roubo/avaria exigem monitoramento constante.\u003c/li>\n\u003cli>\u003cem>Localização e Categoria:\u003c/em> Divisão do armazém por corredores ou tipos de produtos (vestuário, perecíveis, utilidades).\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>Benefícios da Contagem Cíclica:\u003c/strong> Reduz rupturas em gôndolas, previne excesso de estoque armazenado e melhora o fluxo de ressuprimento entre filiais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Filial Araraquara (Rede Tem Tudo):\u003c/strong> No planejamento do levantamento inicial da filial, a primeira medida estratégica é definir o escopo e os objetivos da contagem (definindo categorias, métodos e datas). Os postos-chave comunicados à alta gerência incluem nível real de estoque, principais divergências (físico vs. sistema), riscos de ruptura e necessidades de ajuste de processos.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar conceitos e ferramentas de gestão para classificação, cálculos e previsões de demanda.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Concentração, comunicação assertiva e trabalho colaborativo.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Compreender os principais aspectos e técnicas da contagem cíclica de inventário, considerando critérios operacionais e de organização.\u003c/p>\n","review":{"title":"Contagem cíclica","goal":"Priorizar o que contar com mais frequência e o que informar à gestão.","keywords":["Classe A","Criticidade","Frequência"],"points":["Use valor, criticidade, localização e categoria para planejar as contagens.","Itens A exigem maior frequência; B têm controle intermediário e C têm ciclos mais longos.","Informe o estoque real, as divergências, os riscos de ruptura e as necessidades de ajuste."]}},{"id":4,"module":0,"title":"Aula 5: Contagem de Inventário – Periodicidade e Análise de Discrepâncias (LOGANO1C2B3S16A1)","moduleTitle":"Inventário e acuracidade","body":"* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\n* **Conceitos Chave & Teoria:**\n  - **Identificação e Análise de Discrepâncias:** Sempre que forem identificadas divergências entre o estoque físico e os registros sistêmicos, o protocolo exige:\n    1. *Confirmação:* Realizar uma recontagem física imediata para descartar erro de apuração.\n    2. *Investigação das Causas:* Identificar se a origem foi erro de contagem, falha de registro de entrada/saída, furto/perda, avaria ou obsolescência.\n    3. *Registro em Formulário:* Anotar as discrepâncias e os motivos observados em formulário padronizado.\n  - **Reconciliação de Estoque:** É o processo formal de ajuste dos saldos do sistema para igualá-los ao físico, exigindo autorização hierárquica e integração com o setor contábil.\n  - **Melhoria Contínua:** Propor ações corretivas e preventivas permanentes, como treinamento de equipes, uso de leitores de código de barras e automação.\n* **Aplicações Práticas & Exemplos:**\n  - **Setor de Supermercados:** A realização de inventários frequentes previne a divergência entre o sistema e a gôndola, garantindo a reposição ágil antes que ocorra a ruptura (falta de produto), protegendo o faturamento.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003cbr>**Socioemocional:** Colaborar com os demais de forma harmoniosa, reconhecendo o valor das relações e da interdependência.\n\n**Objetivos de aprendizagem**\n\nIdentificar a importância da contagem de inventário na gestão de estoques e a periodicidade adequada de sua realização.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Identificação e Análise de Discrepâncias:\u003c/strong> Sempre que forem identificadas divergências entre o estoque físico e os registros sistêmicos, o protocolo exige:\u003col>\n\u003cli>\u003cem>Confirmação:\u003c/em> Realizar uma recontagem física imediata para descartar erro de apuração.\u003c/li>\n\u003cli>\u003cem>Investigação das Causas:\u003c/em> Identificar se a origem foi erro de contagem, falha de registro de entrada/saída, furto/perda, avaria ou obsolescência.\u003c/li>\n\u003cli>\u003cem>Registro em Formulário:\u003c/em> Anotar as discrepâncias e os motivos observados em formulário padronizado.\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>Reconciliação de Estoque:\u003c/strong> É o processo formal de ajuste dos saldos do sistema para igualá-los ao físico, exigindo autorização hierárquica e integração com o setor contábil.\u003c/li>\n\u003cli>\u003cstrong>Melhoria Contínua:\u003c/strong> Propor ações corretivas e preventivas permanentes, como treinamento de equipes, uso de leitores de código de barras e automação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Setor de Supermercados:\u003c/strong> A realização de inventários frequentes previne a divergência entre o sistema e a gôndola, garantindo a reposição ágil antes que ocorra a ruptura (falta de produto), protegendo o faturamento.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Colaborar com os demais de forma harmoniosa, reconhecendo o valor das relações e da interdependência.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Identificar a importância da contagem de inventário na gestão de estoques e a periodicidade adequada de sua realização.\u003c/p>\n","review":{"title":"Discrepâncias de estoque","goal":"Descrever o que fazer quando o físico não bate com o sistema.","keywords":["Recontagem","Investigação","Reconciliação"],"points":["Faça uma recontagem para confirmar a diferença.","Investigue causas como falhas de registro, perdas, avarias e erros de contagem; registre as informações.","O ajuste formal exige autorização e integração contábil. Proponha ações para evitar novos erros."]}},{"id":5,"module":0,"title":"Aula 6: Ferramentas Lean na Gestão de Estoques – Kanban e Just in Time (LOGANO1C2B3S16A2)","moduleTitle":"Inventário e acuracidade","body":"* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\n* **Conceitos Chave & Teoria:**\n  - **Sistema Kanban:** Ferramenta visual de gestão de fluxo que utiliza cartões ou quadros sinalizadores para indicar exatamente o momento de sinalizar a reposição de materiais, evitando excessos e falhas de comunicação.\n  - **Sistema Just in Time (JIT):** Filosofia de produção e gestão de materiais na qual a reposição e o fornecimento ocorrem estritamente no momento em que são necessários, alinhando o estoque à demanda real e eliminando estoques desnecessários.\n  - **Eliminação do Dilema de Estoque:** Trata a ocorrência simultânea de excesso de determinados produtos e falta de outros, problema típico da falta de integração entre vendas, reposição e inventário.\n* **Aplicações Práticas & Exemplos:**\n  - **Reestruturação Varejista
