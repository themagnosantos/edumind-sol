 <div class="section-heading"><h2>${known?'Agora escolha sua matéria 👇':'Duas matérias. Bora destravar?'}</h2><span class="small muted">Todo o conteúdo dos materiais está aqui.</span></div><section class="subject-grid" aria-label="Escolha uma matéria">${COURSES.map((c,i)=>{const p=state.courses[c.id];return `<article class="subject ${i?'warm':''}"><div class="subject-top"><div class="subject-icon">${icon(c.icon)}</div><span class="chip ${p.status==='completed'?'green':''}">${p.status==='completed'?'✓ Concluída':p.status==='active'?percent(c)+'% percorrido':'TRILHA 0'+(i+1)}</span></div><h3>${esc(c.name)}</h3><p>${i?'Contar, organizar e repor. Você sabe qual decisão tomar em cada situação?':'Comunicar, colaborar e decidir. Vamos colocar sua postura profissional à prova?'}</p><div class="subject-meta"><span>${c.lessons.length} aulas</span><span>${c.questions.length} questões</span><span>${c.activities.length} atividades</span></div>${p.status!=='new'?reviewMini(c):''}<button class="btn ${i?'aqua':'violet'} full" data-action="enter" data-course="${c.id}" ${known?'':'disabled'}>${p.status==='completed'?'Ver meu resultado':p.status==='active'?'Continuar minha revisão':'Começar '+c.short} ${icon('arrow')}</button>${p.status!=='new'?`<button class="btn text full" data-action="learning-map" data-course="${c.id}">👀 Ver o que sei e o que revisar</button>`:''}</article>`}).join('')}</section>
 <section class="quick-rules"><p>⏱️ <strong>3 minutos por questão</strong> para pontuação integral.</p><p>✍️ <strong>Escolheu? Explique o porquê.</strong> O acerto sozinho não basta.</p><p>👀 <strong>Foco na missão.</strong> Trocar de aba ou tentar colar gera vacilo.</p></section><details class="inline-details"><summary>Como funciona a pontuação e o modo foco?</summary><div class="rules-text">${rulesHTML()}</div></details><p class="coverage-note">37 aulas · 18 questões originais · 17 atividades. Pontuação de revisão, sem equivalência à nota oficial da Prova Paulista.</p></main>
 <footer class="footer"><span>Seu raciocínio é a parte principal da revisão.</span><div class="actions"><button class="btn text small" data-action="import">Restaurar progresso</button>${known?'<button class="btn text small" data-action="backup">Salvar progresso</button>':''}</div></footer><input id="backup-file" class="backup-input" type="file" accept=".json,application/json" aria-label="Selecionar cópia do progresso">`;
}
function rulesHTML(){return `<p><strong>Você está se preparando para uma prova importante.</strong> Em cada questão, terá até 3 minutos para escolher e justificar sua resposta com pontuação integral. Depois disso, o valor da questão diminui. Leia, pense e explique!</p><ul><li>Cada matéria tem duas estações sequenciais: leitura, quiz e caderno de atividades. Todos os conteúdos dos dois materiais didáticos estão incluídos: 37 aulas, 18 questões com as cinco alternativas originais e 17 atividades.</li><li>A justificativa exige no mínimo 80 caracteres após desconsiderar espaços nas extremidades; cada atividade exige 300. O texto salvo permanece exatamente como você o digitou. O professor avalia a qualidade do raciocínio.</li><li>Uma questão correta vale 1 ponto até 03:00, inclusive. Depois, perde 10% do valor original por bloco iniciado de 30 segundos, até o limite de 50%. Questão incorreta vale zero. O tempo inclui a justificativa; não há envio automático.</li><li>Resposta e justificativa ficam definitivas após a confirmação. O gabarito é apresentado somente depois. Ler o feedback não inicia o cronômetro da próxima questão.</li><li>Colar, arrastar texto ou usar Ctrl+V / Cmd+V é bloqueado. Cada tentativa e cada saída da aba durante a atividade registra um vacilo. O botão direito também fica bloqueado durante a trilha. Um vacilo desconta 1 ponto na nota da matéria; atraso de questão não é vacilo.</li><li>O modo de tela cheia é exigido quando o navegador oferece esse recurso. Em aparelhos sem suporte, a atividade usa modo foco e registra essa limitação no boletim. Sair da tela cheia pede o retorno; o cronômetro continua.</li><li>Fechar ou atualizar o arquivo não reinicia os tempos. Uma questão aberta continua contando, inclusive fora da página. Entre questões, saia pelo botão “Matérias” se precisar interromper a revisão.</li><li>Para contemplar todas as atividades, a nota usa ${COURSES[0].questions.length+COURSES[0].activities.length} componentes em Carreira e ${COURSES[1].questions.length+COURSES[1].activities.length} em Estoques, com o mesmo peso dentro de cada matéria. Cada produção enviada vale 1 ponto de conclusão, sem correção conceitual automática. As duas matérias têm o mesmo peso na média conjunta.</li><li>Os exercícios mantêm as instruções originais para duplas, grupos e AVA. Aqui você registra uma resposta individual e entrega o boletim. Quando um dado ou recurso citado não está anexado, a limitação e a orientação de uso são sinalizadas na atividade.</li><li>O Fiscal do Foco é um personagem da revisão e reage às respostas e aos eventos de foco registrados na página. O mapa distingue acertos, erros e dúvidas marcadas por você; não corrige automaticamente sua justificativa. A revisão funciona offline. O progresso é local e pode variar entre navegadores, dispositivos e nomes de arquivo. Salve uma cópia para transferir a sessão. Os registros de foco indicam eventos, não comprovam cola; arquivos locais não são invioláveis.</li></ul>`}
function renderWorkspace(){
 const c=course(),p=progress(),s=score(c),phase=['read','quiz','write'].indexOf(p.phase);
 return `<header class="app-top"><div class="topbar">${brand()}<div class="topbar-right"><button class="btn text small" data-action="home" ${openQuestion()?'disabled':''}>${icon('home')} Matérias</button><button class="btn ghost small" data-action="backup" aria-label="Salvar uma cópia do progresso">${icon('download')}<span class="desktop">Salvar</span></button></div></div><div class="hud"><span>${icon('clock')} Total <b id="total-time">${duration(s.totalTime)}</b></span><span>${icon('alert')} Vacilos <b id="vacilos">${s.vacilos}</b></span><span>${icon('map')} <b>${p.status==='completed'?'Concluído':'Estação '+(p.station+1)+'/2'}</b></span><span class="hud-question" id="hud-question" ${p.phase==='quiz'&&p.status==='active'?'':'hidden'}></span></div></header>
 <div class="workspace"><main id="main" class="main-panel" tabindex="-1"><div class="course-line"><span>${icon(c.icon)} ${esc(c.name)}</span><button class="btn ghost small" data-action="learning-map" data-course="${c.id}" ${openQuestion()?'disabled':''}>👀 Meu mapa</button></div><div class="progress-caption"><span>${esc(state.name)} · ${esc(state.classroom)}</span><span>${percent(c)}% da jornada</span></div><div class="progress" role="progressbar" aria-label="Progresso da matéria" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent(c)}"><span style="width:${percent(c)}%"></span></div>${p.status==='active'?`<ol class="simple-steps" aria-label="Etapas da revisão">${['Aprenda','Teste','Aplique'].map((t,i)=>`<li class="${phase===i?'current':phase>i?'done':''}" ${phase===i?'aria-current="step"':''}><b>${phase>i?'✓':i+1}</b><span>${t}</span></li>`).join('')}</ol>`:''}${p.status==='active'&&!fullscreenCapable()?'<p class="focus-note">👀 Modo foco ativo. Este navegador não oferece tela cheia.</p>':''}${p.status==='completed'?renderResult(c):p.phase==='read'?renderReading():p.phase==='quiz'?renderQuiz():renderWriting()}</main></div>`;
}
function stepHeading(label,title,subtitle){return `<header class="step-head"><p class="eyebrow">${label}</p><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></header>`}
function renderReading(){
 const c=course(),p=progress(),st=station(),l=c.lessons[st.lessons[p.index]],last=p.index===st.lessons.length-1;
 return `<header class="step-head"><span class="eyebrow">APRENDA · AULA ${p.index+1} DE ${st.lessons.length} NESTA ESTAÇÃO</span><h1>${esc(l.review.title)}</h1><p>Leia os três pontos abaixo. Depois, diga como você ficou com esse tema.</p></header><article class="card lesson-card">${lessonPocket(l)}<details class="full-lesson"><summary>${icon('book')} Clique para ler a explicação completa</summary><div class="content">${l.html}</div><details class="skills"><summary>Habilidades e objetivos da aula</summary><div class="content">${l.skillsHtml}</div></details></details>${p.index===0?`<details class="skills"><summary>Qual é a minha missão nesta estação?</summary><p>${esc(replaceName(st.story))}</p><p><strong>Você no comando:</strong> ${esc(st.command)}</p></details>`:''}<section class="confidence-check"><h2>E aí, ficou claro?</h2><p>Escolha um botão para ${last?'iniciar o quiz':'ir à próxima aula'}. Marcar uma dúvida não tira pontos.</p><div class="confidence-buttons"><button class="btn lime" data-action="read-next" data-rating="clear">✓ Entendi · ${last?'Iniciar quiz':'Próxima'}</button><button class="btn coral-soft" data-action="read-next" data-rating="review">↻ Preciso revisar · Avançar</button></div><small>“Entendi” é sua autoavaliação. Os quizzes vão mostrar como você aplica o conteúdo.</small></section><div class="lesson-footer"><button class="btn text small" data-action="read-back" ${p.index===0?'disabled':''}>${icon('back')} Aula anterior</button><button class="btn text small" data-action="contents">Ver aulas da estação</button></div></article>`;
}
function ensureAnswer(q){const p=progress();if(!p.answers[q.id]){p.answers[q.id]={choice:null,reason:'',startedAt:Date.now(),submittedAt:null,warnings:[],warningText:''};save()}return p.answers[q.id]}
function renderQuiz(){const c=course(),p=progress(),st=station(),q=c.questions[st.questions[p.index]],a=ensureAnswer(q),r=questionScore(q,a);return `${stepHeading('Estação '+(p.station+1)+' · Passo 2 de 3','Teste o que ficou.','1. Marque uma alternativa. 2. Explique o porquê. 3. Confirme para ver o resultado.')}<article class="card lesson-card"><div class="quiz-top"><span class="question-number">QUESTÃO ${p.index+1} DE ${st.questions.length}<br><span class="small muted">Questão ${q.id+1} de ${c.questions.length} na matéria</span></span><div class="question-timer ${a.submittedAt&&r.delay?'late':''}" id="question-timer"><span id="timer-label">${a.submittedAt?'Tempo de resposta':'Tempo restante'}</span><strong id="question-clock">${a.submittedAt?duration(r.ms):'03:00'}</strong><span id="available-points">${a.submittedAt?fmt(r.points)+' / 1 ponto':'100% disponíveis'}</span></div></div><p class="action-label"><span class="step-number">1</span> Leia e clique em uma alternativa</p><fieldset><legend class="question-prompt">${q.promptHtml}</legend><div class="options">${q.options.map(o=>`<label class="option ${a.choice===o.letter?'selected':''} ${a.submittedAt?(o.letter===q.correct?'correct':a.choice===o.letter?'wrong':''):''}" data-letter="${o.letter}"><input type="radio" name="choice" value="${o.letter}" ${a.choice===o.letter?'checked':''} ${a.submittedAt?'disabled':''}><span class="option-letter">${o.letter}</span><span>${o.html}</span>${a.submittedAt&&o.letter===q.correct?'<span class="small" aria-label="Resposta correta">✓</span>':a.submittedAt&&o.letter===a.choice?'<span class="small" aria-label="Resposta incorreta">✕</span>':''}</label>`).join('')}</div></fieldset><div id="time-warning" class="time-warning" role="status" aria-live="polite" ${!a.warningText||a.submittedAt?'hidden':''}>${esc(a.warningText)}</div><div class="answer-area"><label for="justification"><span class="step-number">2</span> Explique por que escolheu essa resposta</label><p class="hint" id="reason-help">Qual conceito explica sua escolha? Relacione esse conceito à situação. Escreva pelo menos 80 caracteres; seu professor avaliará o raciocínio.</p><textarea id="justification" aria-describedby="reason-help reason-counter" placeholder="Minha escolha se apoia no conceito de… porque, nesta situação…" ${a.submittedAt?'disabled':''}></textarea><div class="counter-row"><span>${a.submittedAt?'Enviado. Agora leia o feedback.':'O botão libera com alternativa + 80 caracteres.'}</span><b id="reason-counter">${a.reason.trim().length}/80</b></div>${a.submittedAt?'':`<button id="confirm-answer" class="btn orange full" data-action="confirm-answer" ${a.choice&&a.reason.trim().length>=80?'':'disabled'}>3. Confirmar e ver meu resultado ${icon('check')}</button>`}</div>${a.submittedAt?feedbackHTML(c,q,a):''}${a.submittedAt?`<div class="lesson-footer"><span class="small muted">Leu o porquê? Clique no botão para continuar. O próximo relógio só começa depois do clique.</span><button class="btn" data-action="quiz-next">${p.index===st.questions.length-1?'Ir para as atividades':'Próxima questão'} ${icon('arrow')}</button></div>`:''}</article>`}
function feedbackHTML(c,q,a){
 const r=questionScore(q,a),chosen=q.options.find(o=>o.letter===a.choice),correct=q.options.find(o=>o.letter===q.correct);
 return `<section class="feedback ${r.correct?'':'error'}" aria-label="Feedback da resposta">${speech(feedbackMessage(c,q,r.correct),r.correct?'happy':'oops')}<div class="answer-verdict"><span class="chip ${r.correct?'green':'pink'}">${r.correct?'✓ Acertei no quiz':'↻ Preciso revisar'}</span><strong>${esc(q.review.topic)}</strong></div><p class="keywords-title">${r.correct?'Guarda esse raciocínio!':'A chave para não cair nessa de novo:'}</p>${keywordChips([q.review.key])}<p class="key-takeaway">${esc(q.review.takeaway)}</p><h3>Por que está correta?</h3><div class="content">${q.explanationHtml}</div><div class="correct-answer"><strong>Resposta correta: ${q.correct})</strong> ${correct.html}</div><div class="feedback-numbers"><span>${r.correct?'✓ Acerto':'✕ Erro'} registrado no seu mapa</span><span>⏱️ ${duration(r.ms)}</span><span><strong>${fmt(r.points)}/1</strong> ponto</span></div>${r.correct&&r.discount>0?`<p class="small muted">Você acertou. O desconto de ${Math.round(r.discount*100)}% foi pelo tempo, não pelo conteúdo.</p>`:''}<details class="feedback-more"><summary>Ver minha justificativa e a análise das alternativas</summary><h4>Sua resposta: ${a.choice})</h4><div class="content">${chosen.html}</div><h4>Seu raciocínio, exatamente como enviado</h4><div class="student-text">${esc(a.reason)}</div><h4>Por que as demais não se aplicam</h4><ul>${Object.entries(q.distractors).map(([letter,text])=>`<li><strong>${letter})</strong> ${esc(text)}</li>`).join('')}</ul><h4>Onde revisar no material</h4><p>${esc(c.lessons[q.evidenceLesson].review.title)}</p>${timeStrip(r)}</details><p class="hint" style="margin-top:16px">O mapa registra o resultado da alternativa. Seu professor avalia a qualidade da justificativa.</p></section>`;
}
function timeStrip(r){return `<div class="score-strip"><div>Tempo total<strong>${duration(r.ms)}</strong></div><div>Atraso<strong>${duration(r.delay)}</strong></div><div>Desconto<strong>${Math.round(r.discount*100)}%</strong></div><div>Pontos<strong>${fmt(r.points)} / 1</strong></div></div><p class="small muted">Duração exata: ${r.ms} ms · atraso: ${r.delay} ms. O desconto usa milissegundos, sem arredondamento prévio.</p>`}
function ensureWriting(a){const p=progress();if(!p.writings[a.id]){p.writings[a.id]={text:'',submittedAt:null};save()}return p.writings[a.id]}
function renderWriting(){const c=course(),p=progress(),st=station(),a=c.activities[st.activities[p.index]],w=ensureWriting(a);return `${stepHeading('Estação '+(p.station+1)+' · Passo 3 de 3','Agora é com você.','Leia o desafio, escreva sua decisão e explique por que ela faz sentido.')}<article class="card lesson-card"><span class="chip orange">${icon('pen')} Atividade ${p.index+1} de ${st.activities.length} nesta estação</span><h2 class="lesson-title" style="margin-top:22px">${esc(a.title)}</h2><div class="content">${a.promptHtml}</div>${a.gap?`<div class="note warn"><strong>O que está disponível no material</strong><p class="small" style="margin-top:7px">${esc(a.gap)}</p></div>`:''}${a.support?`<details class="skills"><summary>Texto de apoio mencionado na orientação</summary><div class="content">${a.supportHtml}</div></details>`:''}<div class="note small"><strong>👉 Faça assim</strong><p style="margin-top:7px">${esc(a.adapt)}</p><p>Inclua a decisão, o conceito utilizado e o motivo da escolha. Se faltar um dado, indique a limitação. Não há limite individual de 3 minutos para esta produção.</p></div><details class="skills"><summary>Consultar as aulas desta estação</summary><div class="content">${st.lessons.map(id=>`<details class="skills"><summary>${esc(c.lessons[id].title)}</summary>${c.lessons[id].html}</details>`).join('')}</div></details><div class="answer-area"><label for="writing-text">✍️ Escreva sua resposta e explique suas escolhas</label><p class="hint" id="writing-help">Responda aos itens do desafio e diga o porquê. Com 300 caracteres, o botão de envio será liberado. Seu texto será salvo inteiro.</p><textarea id="writing-text" class="writing-textarea" aria-describedby="writing-help writing-counter" placeholder="Organize sua resposta por itens e explique o porquê de cada decisão…" ${w.submittedAt?'disabled':''}></textarea><div class="counter-row"><span>${w.submittedAt?'Produção enviada e bloqueada para edição.':'Seu rascunho é salvo a cada alteração.'}</span><b id="writing-counter">${w.text.trim().length}/300</b></div>${w.submittedAt?'':`<button id="submit-writing" class="btn orange full" data-action="submit-writing" ${w.text.trim().length>=300?'':'disabled'}>Enviar minha resposta ${icon('check')}</button>`}</div>${w.submittedAt?`<section class="feedback"><h3>✓ Tá entregue! O Fiscal recebeu seu raciocínio. 👀</h3><p>1 ponto de conclusão. A correção conceitual e a qualidade da justificativa serão avaliadas pelo professor.</p><h4>Expectativa de resposta do material</h4><div class="content">${a.expectationHtml}</div><h4>Sua resposta integral</h4><div class="student-text">${esc(w.text)}</div></section><div class="lesson-footer"><span class="small muted">Enviada em ${stamp(w.submittedAt)}</span><button class="btn" data-action="writing-next">${p.index<st.activities.length-1?'Próxima atividade':p.station===0?'Concluir estação 1':'Concluir matéria'} ${icon('arrow')}</button></div>`:''}</article>`}
function attachValues(){if($('justification'))$('justification').value=answerData()?.reason||'';if($('writing-text')){const a=course().activities[station().activities[progress().index]];$('writing-text').value=progress().writings[a.id].text}}
function focusMain(){try{$('main')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}catch{}}
async function enter(id){const c=COURSES.find(c=>c.id===id);if(!c||!state.name)return;state.active=id;const p=progress();if(p.status==='new'){p.status='active';p.startedAt=Date.now()}state.view=p.status==='completed'?'report':'work';save();if(p.status==='active')await requestFocus();render();focusMain()}
async function requestFocus(){if(!live())return;if(!fullscreenCapable()){progress().focusMode='Modo foco: tela cheia não suportada pelo navegador';save();return}try{const root=document.documentElement;await (root.requestFullscreen?root.requestFullscreen():root.webkitRequestFullscreen());progress().focusMode='Tela cheia';save()}catch{toast('Toque em “Entrar em tela cheia” para continuar. O navegador precisa autorizar esse modo.')}syncFocus()}
function syncFocus(){const blocked=focusBlocked();const gate=$('focus-gate');gate.hidden=!blocked;$('app').inert=blocked;if(blocked){gate.innerHTML=`<section class="gate-card" role="dialog" aria-modal="true" aria-labelledby="focus-title">${icon('focus')}<h2 id="focus-title">Volte para a missão.</h2><p>A atividade usa tela cheia para ajudar na concentração. Toque abaixo para continuar.</p><p class="small muted">Se uma questão estiver aberta, o cronômetro continua contando.</p><button class="btn full" data-action="fullscreen">Entrar em tela cheia ${icon('focus')}</button></section>`;gate.querySelector('button')?.focus()}else gate.innerHTML=''}
function home(){if(openQuestion())return;state.active=null;state.view='home';save();render();focusMain()}
function readNext(rating='clear'){if(!live()||focusBlocked()||progress().phase!=='read')return;const p=progress(),st=station(),id=st.lessons[p.index];if(!['clear','review'].includes(rating))return;p.confidence??={};p.confidence[id]=rating;if(!p.read.includes(id))p.read.push(id);if(p.index<st.lessons.length-1)p.index++;else{if(st.lessons.some(x=>!p.read.includes(x)))return;p.phase='quiz';p.index=0}save();render();focusMain();if(rating==='review')toast(state.name+', dúvida anotada: '+course().lessons[id].review.title+'. Esse tema foi para seu mapa de revisão.')}
function confirmAnswer(){if(!live()||focusBlocked()||progress().phase!=='quiz')return;const q=questionData(),a=answerData();if(!a||a.submittedAt||!a.choice||a.reason.trim().length<80)return;a.submittedAt=Math.max(Date.now(),a.startedAt);const r=questionScore(q,a);Object.assign(a,{durationMs:r.ms,delayMs:r.delay,discount:r.discount,points:r.points,correct:r.correct});save();render();$('main').focus({preventScroll:true});document.querySelector('.feedback')?.scrollIntoView({behavior:'smooth',block:'start'})}
function quizNext(){if(!live()||focusBlocked()||!answerData()?.submittedAt)return;const p=progress(),st=station();if(p.index<st.questions.length-1)p.index++;else{if(st.questions.some(id=>!p.answers[id]?.submittedAt))return;p.phase='write';p.index=0}save();render();focusMain()}
function submitWriting(){if(!live()||focusBlocked()||progress().phase!=='write')return;const a=course().activities[station().activities[progress().index]],w=progress().writings[a.id];if(!w||w.submittedAt||w.text.trim().length<300)return;w.submittedAt=Date.now();save();render();document.querySelector('.feedback')?.scrollIntoView({behavior:'smooth',block:'start'})}
function writingNext(){if(!live()||focusBlocked()||progress().phase!=='write')return;const c=course(),p=progress(),st=station();if(!p.writings[st.activities[p.index]]?.submittedAt)return;if(p.index<st.activities.length-1)p.index++;else if(p.station===0){if(st.activities.some(id=>!p.writings[id]?.submittedAt))return;p.station=1;p.phase='read';p.index=0}else{if(c.questions.some(q=>!p.answers[q.id]?.submittedAt)||c.activities.some(a=>!p.writings[a.id]?.submittedAt)||c.lessons.some(l=>!p.read.includes(l.id)))return;p.status='completed';p.endedAt=Date.now();state.view='report'}save();render();focusMain()}
function updateHUD(){if(!state.active)return;const c=course(),p=progress(),s=score(c);if($('total-time'))$('total-time').textContent=duration(s.totalTime);if($('vacilos'))$('vacilos').textContent=String(s.vacilos);if(!live()||p.phase!=='quiz')return;const a=answerData();if(!a)return;const ms=Math.max(0,(a.submittedAt||Date.now())-a.startedAt),t=calcTime(ms);if($('hud-question'))$('hud-question').textContent=a.submittedAt?'Resposta enviada · '+duration(ms)+' · '+fmt(questionScore(questionData(),a).points)+' ponto(s)':ms<=180000?'Questão: '+duration(180000-ms)+' · 100% disponíveis':'Questão: +'+duration(ms-180000)+' · '+Math.round(t.available*100)+'% disponíveis';if(a.submittedAt)return;if($('timer-label'))$('timer-label').textContent=ms<=180000?'Tempo restante':'Tempo excedido';if($('question-clock'))$('question-clock').textContent=(ms>180000?'+':'')+duration(ms<=180000?180000-ms:ms-180000);if($('available-points'))$('available-points').textContent=Math.round(t.available*100)+'% disponíveis';$('question-timer')?.classList.toggle('late',ms>180000);if(document.hidden)return;
 const marks=[120000,150000,180001,210001,240001,270001,300001],idx=marks.reduce((n,v,i)=>ms>=v?i:n,-1);if(idx>=0&&!a.warnings.includes(idx)){a.warnings=Array.from(new Set([...a.warnings,...marks.map((v,i)=>ms>=v?i:-1).filter(i=>i>=0)]));a.warningText=idx===0?`${state.name}, falta 1 minuto! Organiza o raciocínio e explica sua escolha. ⏱️`:idx===1?`${state.name}, reta final! Faltam 30 segundos para responder com pontuação integral.`:idx===2?`${state.name}, cê tá vacilando, ein... 😅 Passou dos 3 minutos! Esta questão agora vale 90% se você acertar. Capricha na justificativa!`:idx===6?`${state.name}, o desconto chegou ao limite de 50%. Respira e conclui seu raciocínio!`:`Bora, ${state.name}! Esta questão agora vale ${Math.round(t.available*100)}% se acertar. Mostra o porquê da sua resposta!`;save();if($('time-warning')){$('time-warning').hidden=false;$('time-warning').textContent=a.warningText}}
}
function addVacilo(type){if(!live())return;const p=progress();p.events.push({type,at:Date.now(),station:p.station,phase:p.phase,forgiven:false});save();const msgs=type==='Troca de aba'?[`${state.name}, sua concentração foi dar um rolê? 😅 Volta pro foco!`,`${state.name}, F no chat para essa distração. Bora retomar a missão!`,`${state.name}, −1000 de aura imaginária! Na revisão foi 1 vacilo. Olho na missão!`]:[`${state.name}, Ctrl+V aqui não entra! Explique com suas palavras. ✍️`,`${state.name}, bora mostrar seu próprio raciocínio! A tentativa de colar foi bloqueada.`,`${state.name}, cê tá vacilando, ein... 😅 Digite sua ideia e justifique.`];toast(msgs[(p.events.length-1)%msgs.length]+' (−1 ponto na matéria.)');updateHUD()}
function blockPaste(e){if(!live())return;e.preventDefault();const now=Date.now();if(now-pasteAt>700){pasteAt=now;addVacilo('Tentativa de colar ou arrastar texto')}}
function resetVacilos(){if(!state.name)return;if(!$('dialog-layer').hidden)closeDialog();$('print-root').innerHTML='';for(const p of Object.values(state.courses))for(const e of p.events)if(!e.forgiven){e.forgiven=true;e.forgivenAt=Date.now()}save();render();toast('Vacilos zerados. Respostas, justificativas, tempos e descontos por atraso foram preservados.')}
function dialog(title,html,big=false){lastFocus=document.activeElement;const root=$('dialog-layer');root.hidden=false;root.innerHTML=`<div class="modal-backdrop"><section class="modal ${big?'big':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-header"><h2 id="dialog-title">${esc(title)}</h2><button class="btn ghost small" data-action="close-dialog" aria-label="Fechar janela">${icon('close')}</button></div>${html}</section></div>`;$('app').inert=true;root.querySelector('button')?.focus()}
function closeDialog(){const r=$('dialog-layer');r.hidden=true;r.innerHTML='';$('app').inert=focusBlocked();if(lastFocus?.isConnected)lastFocus.focus();else $('main')?.focus({preventScroll:true})}
function contents(){if(!live()||progress().phase!=='read')return;const c=course(),p=progress();dialog('Aulas desta estação',`<p class="small muted">As aulas são percorridas em sequência. Você pode reler as já concluídas.</p><ol class="contents-list">${station().lessons.map((id,i)=>`<li><button data-action="read-jump" data-index="${i}" ${i>p.index&&!p.read.includes(id)?'disabled':''}>${p.read.includes(id)?'✓ ':''}${esc(c.lessons[id].review.title)}</button></li>`).join('')}</ol>`)}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
const safeName=()=>state.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'Estudante';
function backup(){save();download('Progresso-'+safeName()+'.json',JSON.stringify({format:'trilha-prova-paulista-v1',exportedAt:Date.now(),state},null,2),'application/json');toast('Cópia do progresso preparada. Use “Restaurar progresso” na tela inicial para recuperá-la.')}
async function importBackup(file){if(!file)return;try{if(file.size>12000000)throw Error('Arquivo muito grande.');const data=JSON.parse(await file.text());if(data.format!=='trilha-prova-paulista-v1')throw Error('Selecione uma cópia gerada por esta revisão.');const incoming=validateState(data.state);dialog('Restaurar uma sessão',`<p>Esta cópia pertence a <strong>${esc(incoming.name)}</strong>, turma ${esc(incoming.classroom)}. Ela substituirá a sessão aberta neste navegador.</p><p class="small muted">Os horários originais serão mantidos. Se houver questão aberta, o tempo decorrido também será mantido.</p><div class="actions"><button class="btn" id="confirm-import">Restaurar esta cópia</button><button class="btn ghost" data-action="close-dialog">Cancelar</button></div>`);$('confirm-import').addEventListener('click',()=>{state=incoming;state.active=null;state.view='home';save();closeDialog();render();focusMain();toast('Progresso restaurado com os horários originais.')},{once:true})}catch(e){toast('Não foi possível restaurar: '+e.message)}}
document.addEventListener('submit',e=>{if(e.target.id!=='registration')return;e.preventDefault();const name=$('student-name').value.trim(),classroom=$('classroom').value.trim();if(name.length<2||!classroom){$('registration-error').hidden=false;$('registration-error').textContent='Preencha seu nome e sua turma para continuar.';return}state.name=name;state.classroom=classroom;save();render();document.querySelector('.subject')?.scrollIntoView({behavior:'smooth',block:'center'});toast('Missão aceita, '+state.name+'! Escolha a primeira matéria.')});
document.addEventListener('input',e=>{if(!live()||focusBlocked())return;if(e.target.id==='justification'){const a=answerData();if(!a||a.submittedAt)return;a.reason=e.target.value;save();$('reason-counter').textContent=a.reason.trim().length+'/80';$('confirm-answer').disabled=!(a.choice&&a.reason.trim().length>=80)}if(e.target.id==='writing-text'){const p=progress(),a=course().activities[station().activities[p.index]],w=p.writings[a.id];if(!w||w.submittedAt)return;w.text=e.target.value;save();$('writing-counter').textContent=w.text.trim().length+'/300';$('submit-writing').disabled=w.text.trim().length<300}});
document.addEventListener('change',e=>{if(e.target.id==='backup-file'){importBackup(e.target.files?.[0]);return}if(e.target.name==='choice'&&live()&&!focusBlocked()){const a=answerData();if(!a||a.submittedAt)return;a.choice=e.target.value;save();document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x.dataset.letter===a.choice));$('confirm-answer').disabled=a.reason.trim().length<80}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(focusBlocked()&&action!=='fullscreen')return;switch(action){case 'enter':await enter(b.dataset.course);break;case 'home':home();break;case 'fullscreen':await requestFocus();break;case 'rules':if(!openQuestion())dialog('Regras da sua missão',rulesHTML(),true);break;case 'contents':contents();break;case 'read-next':readNext(b.dataset.rating||'clear');break;case 'learning-map':learningMap(b.dataset.course||state.active);break;case 'review-lesson':reviewLesson(b.dataset.course,Number(b.dataset.lesson));break;case 'review-clear':markReviewClear(b.dataset.course,Number(b.dataset.lesson));break;case 'read-back':if(live()&&progress().phase==='read'&&progress().index>0){progress().index--;save();render();focusMain()}break;case 'read-jump':{const i=Number(b.dataset.index);if(live()&&progress().phase==='read'&&i>=0&&i<station().lessons.length&&(i<=progress().index||progress().read.includes(station().lessons[i]))){progress().index=i;save();closeDialog();render();focusMain()}break}case 'confirm-answer':confirmAnswer();break;case 'quiz-next':quizNext();break;case 'submit-writing':submitWriting();break;case 'writing-next':writingNext();break;case 'close-dialog':closeDialog();break;case 'backup':backup();break;case 'import':$('backup-file')?.click();break;case 'print':printReport(b.dataset.scope||state.active);break;case 'export-md':exportMarkdown(b.dataset.scope||state.active);break;case 'combined':combined();break;case 'source':showSource(Number(b.dataset.source));break;case 'source-download':{const i=Number(b.dataset.source);if(canSource(i))download(DATA.sources[i].name,DATA.sources[i].text,'text/markdown;charset=utf-8');break}}});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='q'){e.preventDefault();resetVacilos();return}if(live()&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){blockPaste(e);return}if(e.key==='Escape'&&!$('dialog-layer').hidden){e.preventDefault();closeDialog()}if(e.key==='Tab'&&(!$('dialog-layer').hidden||!$('focus-gate').hidden)){const box=!$('focus-gate').hidden?$('focus-gate'):$('dialog-layer');const focusable=[...box.querySelectorAll('button:not(:disabled),a[href],input,textarea,select,summary,[tabindex="0"]')].filter(x=>x.getClientRects().length);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('paste',blockPaste);document.addEventListener('drop',blockPaste);document.addEventListener('dragover',e=>{if(live())e.preventDefault()});document.addEventListener('contextmenu',e=>{if(live())e.preventDefault()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)addVacilo('Troca de aba');else updateHUD()});
document.addEventListener('fullscreenchange',syncFocus);document.addEventListener('webkitfullscreenchange',syncFocus);
window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);

function scoreRows(c){const s=score(c);return `<div class="report-row"><span>Acertos nas alternativas</span><strong>${s.correct}/${c.questions.length}</strong></div><div class="report-row"><span>Produções concluídas (avaliação qualitativa pendente)</span><strong>${s.activities}/${c.activities.length}</strong></div><div class="report-row"><span>Nota antes dos descontos</span><strong>${fmt(s.raw)}</strong></div><div class="report-row"><span>Perda por tempo na nota</span><strong>−${fmt(s.loss)}</strong></div><div class="report-row"><span>Nota após descontos de tempo</span><strong>${fmt(s.after)}</strong></div><div class="report-row"><span>Penalidade por vacilos</span><strong>−${s.vacilos}</strong></div><div class="report-row total"><span>Nota final da revisão</span><strong>${fmt(s.final)} / 10</strong></div><p class="small muted" style="margin-top:14px">Cálculo: (${fmt(s.points)} pontos nas questões + ${s.activities} produções) ÷ ${s.components} × 10; depois, −${s.vacilos} vacilo(s), com mínimo zero. Os cálculos não são arredondados antes da exibição.</p>`}
function actionReports(scope){return `<div class="actions" style="margin:24px 0"><button class="btn" data-action="print" data-scope="${scope}">${icon('print')} Imprimir / salvar PDF</button><button class="btn ghost" data-action="export-md" data-scope="${scope}">${icon('download')} Exportar boletim .MD</button></div>`}
function renderResult(c){
 const p=state.courses[c.id],s=score(c),n=reviewCounts(c),review=n.wrong+n.doubts;return `<section class="report-hero"><span class="chip green">✓ MATÉRIA CONCLUÍDA</span><h1>${esc(state.name)}, olha sua evolução!</h1><p>${review?'Seu mapa mostra por onde começar a próxima revisão.':'Você chegou ao final. Reforce os conceitos e confira suas explicações.'}</p>${speech(n.wrong?`${state.name}, missão feita! Meu radar separou os pontos para revisar. Errar aqui também ajuda a aprender.`:`${state.name}, seu radar ficou verdinho nas alternativas! Agora capricha em explicar os conceitos sem olhar.`,n.wrong?'watch':'happy')}</section>${mapHTML(c)}<div class="result-score"><div><span>PONTUAÇÃO DA REVISÃO</span><strong>${fmt(s.final)}<small> / 10</small></strong></div><p>A pontuação inclui tempo e vacilos.<br><strong>Para estudar, siga os temas do seu mapa.</strong></p></div><details class="report-details"><summary>Como minha pontuação foi calculada?</summary><div>${scoreRows(c)}</div></details><div class="next-cue"><span>📄</span><p><strong>Hora de entregar sua revisão.</strong><br>Use um dos botões abaixo para salvar o boletim com todas as respostas.</p></div>${actionReports(c.id)}<details class="report-details"><summary>Ver todas as minhas respostas e justificativas</summary><div>${courseReport(c)}</div></details><details class="report-details"><summary>Consultar todas as aulas desta matéria</summary><div>${c.lessons.map(l=>`<details class="full-lesson"><summary>${esc(l.review.title)}</summary>${lessonPocket(l)}<div class="content">${l.html}</div><details class="skills"><summary>Habilidades e objetivos</summary><div class="content">${l.skillsHtml}</div></details></details>`).join('')}</div></details><p class="hint">Este documento registra a resposta enviada pelo estudante. A nota da revisão não é a nota oficial da Prova Paulista.</p><div class="actions">${COURSES.every(x=>state.courses[x.id].status==='completed')?'<button class="btn lime" data-action="combined">Ver boletim das duas matérias '+icon('arrow')+'</button>':`<button class="btn lime" data-action="enter" data-course="${COURSES.find(x=>x.id!==c.id).id}">Ir para a outra matéria ${icon('arrow')}</button>`}<button class="btn ghost" data-action="home">Voltar às matérias</button></div>`;
}
function courseReport(c){const p=state.courses[c.id],s=score(c);if(p.status!=='completed')return '';return `<section class="course-report"><header class="print-title"><p class="eyebrow">Trilha do Conhecimento · Prova Paulista</p><h2>${esc(c.name)}</h2><p><strong>Estudante:</strong> ${esc(state.name)}<br><strong>Turma:</strong> ${esc(state.classroom)}<br><strong>Tema:</strong> O que aprendemos durante este bimestre?<br><strong>Início:</strong> ${stamp(p.startedAt)}<br><strong>Conclusão:</strong> ${stamp(p.endedAt)}<br><strong>Tempo total decorrido:</strong> ${duration(s.totalTime)} (${s.totalTime} ms)<br><strong>Modo de realização:</strong> ${esc(p.focusMode||'Não registrado')}</p></header><p>Este documento registra a resposta enviada pelo estudante.</p><p class="small muted">Pontuação da revisão, sem equivalência automática à nota oficial da Prova Paulista. As justificativas e as produções textuais aguardam avaliação qualitativa do professor. O tempo total inclui os intervalos desde o início da matéria até a conclusão.</p><section class="report-section"><h3>Meu mapa da revisão</h3>${mapHTML(c,true)}</section><section class="report-section"><h3>Resultado e cálculo da nota</h3>${scoreRows(c)}</section>${c.stations.map((st,si)=>`<section class="report-section"><h3>Estação ${si+1} · ${esc(st.title)}</h3><p class="small">Aulas estudadas: ${st.lessons.map(id=>esc(c.lessons[id].title)).join('; ')}.</p>${st.questions.map(id=>questionReport(c,c.questions[id],p.answers[id])).join('')}${st.activities.map(id=>writingReport(c,c.activities[id],p.writings[id])).join('')}</section>`).join('')}<section class="report-section"><h3>Registro de foco e intervenções</h3><p class="small">Eventos indicam saídas da página ou tentativas bloqueadas; não comprovam uso de consulta externa. O atalho do professor pode zerar somente os vacilos. Descontos por tempo são independentes.</p>${p.events.length?`<ul>${p.events.map(e=>`<li>${stamp(e.at)} · ${esc(e.type)} · estação ${e.station+1} / ${esc(e.phase)} · ${e.forgiven?'desconsiderado pelo professor em '+stamp(e.forgivenAt):'−1 ponto'}</li>`).join('')}</ul>`:'<p>Nenhum vacilo registrado.</p>'}</section><footer class="source-footer">Fonte: ${esc(c.source)}. Referências numéricas de edição foram retiradas para facilitar a leitura. A notação matemática foi ajustada para leitura na interface, mantendo os conceitos e valores. Arquivo original integral disponível após a conclusão.</footer></section>`}
function questionReport(c,q,a){const r=questionScore(q,a);return `<section class="report-section quiz-report"><h4>${esc(q.title)}</h4><div class="content">${q.promptHtml}<ol type="A">${q.options.map(o=>`<li>${o.html}</li>`).join('')}</ol></div><p><strong>Alternativa marcada:</strong> ${esc(a.choice)} · <strong>Alternativa correta:</strong> ${q.correct} · <strong>Resultado:</strong> ${r.correct?'Acerto':'Erro'}</p><h4>Justificativa integral do estudante</h4><div class="student-text">${esc(a.reason)}</div><h4>Por que está correta</h4><div class="content">${q.explanationHtml}</div><h4>Por que as demais não se aplicam</h4><ul>${Object.entries(q.distractors).map(([l,t])=>`<li><strong>${l})</strong> ${esc(t)}</li>`).join('')}</ul><p><strong>Evidência:</strong> ${esc(q.evidence)} · ${esc(c.source)}</p><h4>Para a prova</h4><div class="content">${q.examTipHtml}</div>${timeStrip(r)}<p class="small"><strong>Início da questão:</strong> ${stamp(a.startedAt)} (${a.startedAt})<br><strong>Envio:</strong> ${stamp(a.submittedAt)} (${a.submittedAt})<br><strong>Marcos de tempo registrados:</strong> ${a.warnings.map(i=>['02:00','02:30','acima de 03:00','acima de 03:30','acima de 04:00','acima de 04:30','acima de 05:00'][i]).join(', ')||'Nenhum'}.</p></section>`}
function writingReport(c,a,w){return `<section class="report-section writing"><h4>${esc(a.title)}</h4><div class="content">${a.promptHtml}</div>${a.gap?`<p><strong>Limitação informada ao estudante:</strong> ${esc(a.gap)}</p>`:''}<p><strong>Orientação de registro individual:</strong> ${esc(a.adapt)}</p>${a.support?`<h4>Texto de apoio utilizado</h4><div class="content">${a.supportHtml}</div>`:''}<h4>Produção e justificativa integral do estudante</h4><div class="student-text">${esc(w.text)}</div><p class="small">Enviada em ${stamp(w.submittedAt)} (${w.submittedAt}) · ${w.text.trim().length} caracteres após trim() · 1 ponto de conclusão. Avaliação qualitativa: a realizar pelo professor.</p><h4>Expectativa de resposta do material</h4><div class="content">${a.expectationHtml}</div></section>`}
function reportCourses(scope){const cs=scope==='all'?COURSES:COURSES.filter(c=>c.id===scope);if(!cs.length||cs.some(c=>state.courses[c.id].status!=='completed'))return [];return cs}
function combinedHTML(){const values=COURSES.map(c=>score(c));const mean=values.reduce((a,b)=>a+b.final,0)/2;return `<section class="print-title"><h1>Boletim das duas matérias</h1><p><strong>Estudante:</strong> ${esc(state.name)} · <strong>Turma:</strong> ${esc(state.classroom)}</p><p><strong>Média conjunta da revisão:</strong> ${fmt(mean)} / 10. Cada matéria tem peso de 50%.</p>${COURSES.map((c,i)=>`<div class="report-row"><span>${esc(c.name)}</span><strong>${fmt(values[i].final)}</strong></div>`).join('')}<p class="small muted" style="margin-top:15px">Média calculada com os valores sem arredondamento. As duas notas e todos os descontos estão discriminados a seguir. Os textos exigem avaliação qualitativa do professor.</p></section>`}
function combined(){if(!reportCourses('all').length)return;dialog('Seu boletim completo',`${combinedHTML()}${actionReports('all')}<p class="small muted">O PDF e o arquivo .MD contêm todas as 18 respostas com justificativa e todas as 17 produções, sem cortes.</p><details class="skills"><summary>Arquivos de origem e decisões da adaptação</summary><p class="small">O pedido de incluir tudo prevalece sobre o limite de quatro questões do modelo. A aplicação mantém duas estações por matéria, usa todas as cinco alternativas originais e recalcula a pontuação com todos os componentes.</p><p class="small">O título foi ajustado para as duas matérias solicitadas. As atividades com recursos ausentes estão sinalizadas. Fórmulas com caracteres de formatação danificados no anexo foram apenas recompostas para leitura; os arquivos originais abaixo foram mantidos integralmente.</p>${DATA.sources.map((s,i)=>`<p><button class="btn ghost small" data-action="source" data-source="${i}">${esc(s.name)}</button></p>`).join('')}</details>`,true)}
function printReport(scope){const cs=reportCourses(scope);if(!cs.length)return;$('print-root').innerHTML=(scope==='all'?combinedHTML():'')+cs.map(courseReport).join('');const title=document.title;document.title='Boletim-'+safeName()+'-'+(scope==='all'?'Duas-Materias':scope);window.print();document.title=title}
function literalMD(text){const runs=text.match(/`+/g)||[];const fence='`'.repeat(Math.max(3,...runs.map(x=>x.length+1)));return fence+'text\n'+text+'\n'+fence}
function markdownCourse(c){const p=state.courses[c.id],s=score(c);let out=`# ${c.name}\n\nTrilha do Conhecimento · Revisão Prova Paulista\n\nEstudante: ${state.name}\nTurma: ${state.classroom}\nTema: O que aprendemos durante este bimestre?\nInício: ${stamp(p.startedAt)} (${p.startedAt})\nConclusão: ${stamp(p.endedAt)} (${p.endedAt})\nTempo total decorrido: ${duration(s.totalTime)} (${s.totalTime} ms)\nModo de realização: ${p.focusMode||'Não registrado'}\n\nEste documento registra a resposta enviada pelo estudante.\nPontuação da revisão; não é nota oficial da Prova Paulista. Justificativas e produções aguardam avaliação qualitativa do professor. O tempo total inclui os intervalos entre início e conclusão.\n\n## Resultado\n\n- Acertos: ${s.correct}/${c.questions.length}\n- Produções concluídas: ${s.activities}/${c.activities.length}\n- Nota antes dos descontos: ${fmt(s.raw)}\n- Perda por tempo na nota: ${fmt(s.loss)}\n- Nota após tempo: ${fmt(s.after)}\n- Penalidade por vacilos: ${s.vacilos}\n- Nota final: ${fmt(s.final)} / 10\n- Cálculo: (${s.points} pontos nas questões + ${s.activities} produções) / ${s.components} × 10; depois, menos ${s.vacilos} vacilos, com piso zero.\n- Valor da nota antes do arredondamento de exibição: ${s.final}\n\n`;
 for(const [si,st] of c.stations.entries()){out+=`## Estação ${si+1}: ${st.title}\n\nAulas estudadas:\n${st.lessons.map(id=>'- '+c.lessons[id].title).join('\n')}\n\n`;for(const id of st.questions){const q=c.questions[id],a=p.answers[id],r=questionScore(q,a);out+=`### ${q.title}\n\n${q.prompt}\n\n${q.options.map(o=>o.letter+') '+o.text).join('\n\n')}\n\n**Alternativa marcada:** ${a.choice}\n**Alternativa correta:** ${q.correct}\n**Resultado:** ${r.correct?'Acerto':'Erro'}\n\n**Justificativa integral do estudante:**\n\n${literalMD(a.reason)}\n\n**Por que está correta:**\n\n${q.explanation}\n\n**Por que as demais não se aplicam:**\n\n${Object.entries(q.distractors).map(([l,t])=>'- '+l+') '+t).join('\n')}\n\n**Evidência no material:** ${q.evidence} · ${c.source}\n\n**Para a prova:** ${q.examTip}\n\n- Início: ${stamp(a.startedAt)} (${a.startedAt})\n- Envio: ${stamp(a.submittedAt)} (${a.submittedAt})\n- Tempo individual: ${duration(r.ms)} (${r.ms} ms)\n- Atraso: ${duration(r.delay)} (${r.delay} ms)\n- Desconto: ${Math.round(r.discount*100)}%\n- Pontos: ${fmt(r.points)} / 1\n- Marcos de tempo registrados: ${a.warnings.map(i=>['02:00','02:30','acima de 03:00','acima de 03:30','acima de 04:00','acima de 04:30','acima de 05:00'][i]).join(', ')||'Nenhum'}\n\n`;}
 for(const id of st.activities){const a=c.activities[id],w=p.writings[id];out+=`### Atividade: ${a.title}\n\n${a.promptMd||a.prompt}\n\n${a.gap?'**Limitação informada:** '+a.gap+'\n\n':''}**Orientação de registro individual:** ${a.adapt}\n\n${a.support?'**Texto de apoio utilizado:**\n\n'+a.support+'\n\n':''}**Produção e justificativa integral do estudante:**\n\n${literalMD(w.text)}\n\nEnviada em ${stamp(w.submittedAt)} (${w.submittedAt}) · ${w.text.trim().length} caracteres após trim() · 1 ponto de conclusão. Avaliação qualitativa: a realizar pelo professor.\n\n**Expectativa de resposta do material:**\n\n${a.expectation}\n\n`;}}
 out+='## Registro de foco e intervenções\n\nEventos indicam saídas da página ou tentativas bloqueadas, não comprovam consulta externa. Descontos por tempo são independentes.\n\n'+(p.events.length?p.events.map(e=>`- ${stamp(e.at)} · ${e.type} · estação ${e.station+1} / ${e.phase} · ${e.forgiven?'Desconsiderado pelo professor em '+stamp(e.forgivenAt):'−1 ponto'}`).join('\n'):'Nenhum vacilo registrado.')+`\n\nFonte: ${c.source}. Referências numéricas de edição foram retiradas para facilitar a leitura.\n\n`;
 return out+mapMarkdown(c);
}
function exportMarkdown(scope){const cs=reportCourses(scope);if(!cs.length)return;const header=scope==='all'?`# Boletim das duas matérias\n\nEstudante: ${state.name}\nTurma: ${state.classroom}\nMédia conjunta da revisão: ${fmt(COURSES.reduce((a,c)=>a+score(c).final,0)/2)} / 10\nCada matéria tem peso de 50%.\n\n${COURSES.map(c=>'- '+c.name+': '+fmt(score(c).final)).join('\n')}\n\n---\n\n`:'';download('Boletim-'+safeName()+'-'+(scope==='all'?'Duas-Materias':scope)+'.md',header+cs.map(markdownCourse).join('\n---\n\n'),'text/markdown;charset=utf-8');toast('Boletim .MD preparado com todas as respostas e justificativas.')}
function canSource(i){return Number.isInteger(i)&&i>=0&&i<DATA.sources.length&&(i===2?COURSES.every(c=>state.courses[c.id].status==='completed'):state.courses[COURSES[i].id].status==='completed')}
function showSource(i){if(!canSource(i))return;const s=DATA.sources[i];dialog('Arquivo original: '+s.name,`<p class="small muted">Texto do anexo com referências numéricas de edição ocultas para leitura. O download mantém o original recebido.</p><button class="btn ghost small" data-action="source-download" data-source="${i}">${icon('download')} Baixar original .MD</button><pre class="source-text">${esc(s.text.replace(/[ \t]*\[\d+(?:\s*[,;–-]\s*\d+)*\]/g,''))}</pre>`,true)}
window.addEventListener('beforeprint',()=>{if(!$('print-root').textContent.trim()){const cs=state.active?reportCourses(state.active):reportCourses('all');if(cs.length)$('print-root').innerHTML=(cs.length===2?combinedHTML():'')+cs.map(courseReport).join('');else $('print-root').textContent='Conclua as duas estações de uma matéria para gerar seu boletim completo.'}});
window.addEventListener('afterprint',()=>{$('print-root').innerHTML=''});
function mascot(mood='watch'){return `<span class="fiscal-face ${mood}" aria-hidden="true"><span class="eye"><i></i></span><span class="eye"><i></i></span><span class="fiscal-mouth"></span></span>`}
function speech(message,mood='watch'){return `<div class="fiscal-speech ${mood}">${mascot(mood)}<div><span class="fiscal-name">Fiscal do Foco 👀</span><p>${esc(message)}</p></div></div>`}
function keywordChips(words){return `<div class="keyword-list" aria-label="Palavras-chave">${words.map((w,i)=>`<span class="keyword k${i%3}">${esc(w)}</span>`).join('')}</div>`}
function reviewCounts(c){const p=state.courses[c.id];const answered=c.questions.filter(q=>p.answers[q.id]?.submittedAt);return {correct:answered.filter(q=>p.answers[q.id].choice===q.correct).length,wrong:answered.filter(q=>p.answers[q.id].choice!==q.correct).length,pending:c.questions.length-answered.length,doubts:c.lessons.filter(l=>p.confidence?.[l.id]==='review').length}}
function reviewMini(c){const n=reviewCounts(c);return `<div class="review-mini" aria-label="Seu resultado nos quizzes"><span class="mini-right">✓ <b>${n.correct}</b> acertos</span><span class="mini-wrong">↻ <b>${n.wrong}</b> erros para revisar</span><span>◷ <b>${n.pending}</b> por responder</span></div>`}
function lessonPocket(l){return `<div class="learn-goal"><span class="eyebrow">O que você precisa aprender</span><p>${esc(l.review.goal)}</p></div><p class="keywords-title">🟡 Palavras-chave para guardar</p>${keywordChips(l.review.keywords)}<ol class="takeaways">${l.review.points.map((t,i)=>`<li><span>${i+1}</span><p>${esc(t)}</p></li>`).join('')}</ol>`}
function feedbackMessage(c,q,correct){
 const name=state.name;
 const yes=[`${name}, gabaritou e nem disfarçou! Meu radar aprovou essa. 😎`,`${name}, tô de olho! Essa foi na mosca. O conceito chegou ao endereço certo. 🎯`,`${name}, resposta com entrega expressa de conhecimento! Pode comemorar. 📦`,`${name}, o Fiscal do Foco levantou a plaquinha: ACERTOU! 🚀`,`${name}, +1000 de aura imaginária! Agora confere o porquê desse acerto. ✨`,`${name}, essa entrou no estoque dos acertos. Inventário conferido! ✅`];
 const no=[`${name}, meu radar fez PÍ-PÍ! O conceito deu um desvio de rota. Bora recalcular? 🧭`,`${name}, flagrei uma confusão! Ainda bem que estamos na revisão. Vamos destravar isso. 👀`,`${name}, essa alternativa veio sem etiqueta! Bora achar o conceito certo. 📦`,`${name}, o Fiscal do Foco pediu uma pausa: essa não foi. Mas a explicação tá logo aqui! 😅`,`${name}, deu ruim nessa escolha, mas dá tempo de virar o jogo. Olha o detalhe abaixo. 🎮`,`${name}, essa resposta pegou a saída errada. Vem comigo que eu mostro o caminho. 🚚`];
 return (correct?yes:no)[(q.id+COURSES.indexOf(c)*3)%(correct?yes:no).length];
}
function mapHTML(c,print=false){
 const p=state.courses[c.id],n=reviewCounts(c),right=c.questions.filter(q=>p.answers[q.id]?.submittedAt&&p.answers[q.id].choice===q.correct),wrong=c.questions.filter(q=>p.answers[q.id]?.submittedAt&&p.answers[q.id].choice!==q.correct),doubts=c.lessons.filter(l=>p.confidence?.[l.id]==='review');
 const row=(q,good)=>`<li><span class="map-dot ${good?'good':'again'}">${good?'✓':'↻'}</span><div><strong>${esc(q.review.topic)}</strong><p>${esc(q.review.takeaway)}</p></div>${print?'':`<button class="btn ghost small" data-action="review-lesson" data-course="${c.id}" data-lesson="${q.evidenceLesson}">${good?'Rever':'Revisar agora'} ${icon('arrow')}</button>`}</li>`;
 return `<div class="learning-map"><div class="map-counts"><div class="good"><strong>${n.correct}</strong><span>Acertei no quiz</span></div><div class="again"><strong>${n.wrong}</strong><span>Errei · vou revisar</span></div><div class="pending"><strong>${n.pending}</strong><span>Ainda vou responder</span></div></div><p class="hint">Acertos e erros vêm das alternativas enviadas. As dúvidas abaixo são marcadas por você. A qualidade da explicação é avaliada pelo professor.</p><section class="map-group needs"><h3>↻ Minha próxima revisão</h3>${wrong.length?`<p class="small">Comece pelos temas em que a alternativa não estava correta:</p><ul class="map-list">${wrong.map(q=>row(q,false)).join('')}</ul>`:`<p class="small">${n.pending?'Nenhum erro registrado até agora. Ainda há questões para responder.':'Nenhum erro nas alternativas desta matéria. Reforce os conceitos e suas explicações.'}</p>`}</section><section class="map-group"><h3>🙋 Minhas dúvidas da leitura <span class="chip">${doubts.length}</span></h3>${doubts.length?`<ul class="map-list">${doubts.map(l=>`<li><span class="map-dot doubt">?</span><div><strong>${esc(l.review.title)}</strong><p>${esc(l.review.goal)}</p></div>${print?'':`<button class="btn ghost small" data-action="review-lesson" data-course="${c.id}" data-lesson="${l.id}">Revisar agora</button>`}</li>`).join('')}</ul>`:'<p class="small">Nenhuma dúvida marcada. Nas aulas, use “Preciso revisar” quando um conceito ainda não estiver claro.</p>'}</section><${print?'section':'details'} class="map-group"><${print?'h3':'summary'}>✓ O que já acertei <span class="chip green">${right.length}</span></${print?'h3':'summary'}>${right.length?`<ul class="map-list">${right.map(q=>row(q,true)).join('')}</ul>`:'<p class="small">Seus acertos aparecerão aqui depois de confirmar as respostas.</p>'}</${print?'section':'details'}><p class="small muted map-footnote">Nem todas as ${c.lessons.length} aulas têm uma questão objetiva no material. Ler ou marcar “Entendi” não confirma domínio do tema; continue usando as atividades para explicar suas decisões.</p></div>`;
}
function learningMap(id){if(openQuestion())return;const c=COURSES.find(x=>x.id===id);if(!c)return;dialog('Meu mapa · '+c.short,mapHTML(c),true)}
function reviewLesson(id,lessonId){if(openQuestion())return;const c=COURSES.find(x=>x.id===id),l=c?.lessons[lessonId];if(!l)return;const p=state.courses[id];if(!p.read.includes(lessonId)&&p.status!=='completed')return;dialog('Revisão rápida · '+l.review.title,`${lessonPocket(l)}<details class="full-lesson"><summary>Clique para abrir a aula completa</summary><div class="content">${l.html}</div></details><div class="note small">Releia e tente explicar o conceito com suas palavras. O resultado do quiz continua registrado como foi enviado.</div><div class="actions"><button class="btn lime" data-action="review-clear" data-course="${id}" data-lesson="${lessonId}">✓ Agora ficou mais claro</button><button class="btn ghost" data-action="learning-map" data-course="${id}">Voltar ao meu mapa</button></div>`,true)}
function markReviewClear(id,lessonId){if(openQuestion())return;const c=COURSES.find(x=>x.id===id),p=state.courses[id];if(!c?.lessons[lessonId]||!p||(!p.read.includes(lessonId)&&p.status!=='completed'))return;p.confidence??={};p.confidence[lessonId]='clear';save();render();learningMap(id);toast('Dúvida da leitura atualizada. Acertos, erros e pontuação do quiz foram preservados.')}
function mapMarkdown(c){const p=state.courses[c.id],n=reviewCounts(c);let s=`## Meu mapa da revisão\n\n- Acertei no quiz: ${n.correct}\n- Errei e preciso revisar: ${n.wrong}\n- Questões ainda não respondidas: ${n.pending}\n\n`;
 for(const [label,correct] of [['O que já acertei',true],['O que preciso revisar',false]]){const qs=c.questions.filter(q=>p.answers[q.id]?.submittedAt&&(p.answers[q.id].choice===q.correct)===correct);s+=`### ${label}\n\n${qs.map(q=>'- '+q.review.topic+' — '+q.review.takeaway).join('\n')||'Nenhum tema registrado nesta categoria.'}\n\n`;}
 const ds=c.lessons.filter(l=>p.confidence?.[l.id]==='review');return s+`### Dúvidas marcadas na leitura\n\n${ds.map(l=>'- '+l.review.title).join('\n')||'Nenhuma dúvida marcada.'}\n\nO mapa registra alternativas e autoavaliação. As justificativas dependem de avaliação qualitativa do professor. Ler não confirma domínio do tema.\n\n`;}
render();setInterval(updateHUD,1000);
</script>
</body>
</html>
