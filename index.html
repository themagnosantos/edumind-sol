<script id="course-data" type="application/json">{"courses":[{"id":"carreira","name":"Carreira e Competências","short":"Carreira","icon":"career","summary":"Comunicação, postura e escolhas que constroem o seu futuro profissional.","lessons":[{"id":0,"module":0,"title":"Aula 1: O Conceito de Persona Profissional","moduleTitle":"MÓDULO 1: ETIQUETA CORPORATIVA E IMAGEM","body":"* **Habilidade(s) Relacionada(s):** Adequar a linguagem e a apresentação pessoal ao ambiente de trabalho.\n* **Conceitos Chave & Teoria:**\n  * **Persona Profissional e Expressão:** A forma de se expressar e se comportar no ambiente de trabalho influencia diretamente a percepção de profissionalismo que a organização e os colegas têm do indivíduo.\n  * **Adequação da Linguagem:** A comunicação corporativa exige a transição da linguagem coloquial para uma postura formal, clara e objetiva. A escolha do tom e da estrutura da mensagem depende fundamentalmente do **contexto** (formal, operacional ou de crise) e do **público** (gestor, cliente, colega).\n* **Aplicações Práticas & Exemplos:**\n  * *Reestruturação de Comunicação Informal:* Transformação de recados informais e desorganizados em comunicados claros dirigidos a gestores, reportando falhas operacionais e mantendo a equipe à disposição.","skills":"* **Habilidades Técnicas:**\n  * Adequar a linguagem e a apresentação pessoal ao ambiente de trabalho.\n  * Reconhecer como a vestimenta e a semiótica da imagem se conectam ao contexto de trabalho e às atividades desempenhadas.\n  * Identificar comportamentos adequados e inadequados no cotidiano corporativo.\n* **Habilidades Socioemocionais:**\n  * Demonstrar maturidade e bom senso na adaptação do comportamento ao contexto profissional.\n  * Desenvolver autocontrole, autorregulação e respeito diante de situações do cotidiano de trabalho.\n* **Objetivos de Aprendizagem:**\n  * Compreender o conceito de persona profissional e a importância de adaptar a linguagem ao contexto e público.\n  * Compreender o conceito de *dress code* e sua variação segundo a empresa, setor e situação.\n  * Reconhecer o papel da comunicação não verbal, dos sinais não verbais e da empatia na convivência diária.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Adequar a linguagem e a apresentação pessoal ao ambiente de trabalho.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Persona Profissional e Expressão:\u003c/strong> A forma de se expressar e se comportar no ambiente de trabalho influencia diretamente a percepção de profissionalismo que a organização e os colegas têm do indivíduo.\u003c/li>\n\u003cli>\u003cstrong>Adequação da Linguagem:\u003c/strong> A comunicação corporativa exige a transição da linguagem coloquial para uma postura formal, clara e objetiva. A escolha do tom e da estrutura da mensagem depende fundamentalmente do \u003cstrong>contexto\u003c/strong> (formal, operacional ou de crise) e do \u003cstrong>público\u003c/strong> (gestor, cliente, colega).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Reestruturação de Comunicação Informal:\u003c/em> Transformação de recados informais e desorganizados em comunicados claros dirigidos a gestores, reportando falhas operacionais e mantendo a equipe à disposição.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Adequar a linguagem e a apresentação pessoal ao ambiente de trabalho.\u003c/li>\n\u003cli>Reconhecer como a vestimenta e a semiótica da imagem se conectam ao contexto de trabalho e às atividades desempenhadas.\u003c/li>\n\u003cli>Identificar comportamentos adequados e inadequados no cotidiano corporativo.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Demonstrar maturidade e bom senso na adaptação do comportamento ao contexto profissional.\u003c/li>\n\u003cli>Desenvolver autocontrole, autorregulação e respeito diante de situações do cotidiano de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Compreender o conceito de persona profissional e a importância de adaptar a linguagem ao contexto e público.\u003c/li>\n\u003cli>Compreender o conceito de \u003cem>dress code\u003c/em> e sua variação segundo a empresa, setor e situação.\u003c/li>\n\u003cli>Reconhecer o papel da comunicação não verbal, dos sinais não verbais e da empatia na convivência diária.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Persona profissional","goal":"Escolher a linguagem de acordo com quem recebe a mensagem e com a situação.","keywords":["Contexto","Público","Clareza"],"points":["A forma de falar e agir influencia a percepção de profissionalismo.","Pense primeiro na situação: rotina, comunicação formal ou crise.","Adapte o tom ao destinatário: gestor, cliente ou colega."]}},{"id":1,"module":0,"title":"Aula 2: Dress Code e Semiótica da Imagem","moduleTitle":"MÓDULO 1: ETIQUETA CORPORATIVA E IMAGEM","body":"* **Habilidade(s) Relacionada(s):** Reconhecer como a vestimenta e a apresentação pessoal se conectam ao contexto de trabalho.\n* **Conceitos Chave & Teoria:**\n  * **Comunicação Não Verbal:** A comunicação no trabalho vai além da linguagem verbal, abrangendo comportamento, postura e apresentação pessoal.\n  * **Conceito de Dress Code:** O *dress code* (código de vestimenta) conecta a apresentação pessoal ao contexto da empresa, às atividades desempenhadas e às exigências de segurança/rotina.\n  * **Variabilidade do Dress Code:** O *dress code* não é fixo nem universal; ele varia conforme a empresa, o setor e a situação profissional.\n* **Aplicações Práticas & Exemplos:**\n  * *Adequação ao Setor de Atuação:* Análise das diferenças de vestimenta entre setores operacionais/logísticos (que exigem conforto, mobilidade e equipamentos de segurança) e ambientes corporativos tradicionais.","skills":"* **Habilidades Técnicas:**\n  * Adequar a linguagem e a apresentação pessoal ao ambiente de trabalho.\n  * Reconhecer como a vestimenta e a semiótica da imagem se conectam ao contexto de trabalho e às atividades desempenhadas.\n  * Identificar comportamentos adequados e inadequados no cotidiano corporativo.\n* **Habilidades Socioemocionais:**\n  * Demonstrar maturidade e bom senso na adaptação do comportamento ao contexto profissional.\n  * Desenvolver autocontrole, autorregulação e respeito diante de situações do cotidiano de trabalho.\n* **Objetivos de Aprendizagem:**\n  * Compreender o conceito de persona profissional e a importância de adaptar a linguagem ao contexto e público.\n  * Compreender o conceito de *dress code* e sua variação segundo a empresa, setor e situação.\n  * Reconhecer o papel da comunicação não verbal, dos sinais não verbais e da empatia na convivência diária.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Reconhecer como a vestimenta e a apresentação pessoal se conectam ao contexto de trabalho.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Comunicação Não Verbal:\u003c/strong> A comunicação no trabalho vai além da linguagem verbal, abrangendo comportamento, postura e apresentação pessoal.\u003c/li>\n\u003cli>\u003cstrong>Conceito de Dress Code:\u003c/strong> O \u003cem>dress code\u003c/em> (código de vestimenta) conecta a apresentação pessoal ao contexto da empresa, às atividades desempenhadas e às exigências de segurança/rotina.\u003c/li>\n\u003cli>\u003cstrong>Variabilidade do Dress Code:\u003c/strong> O \u003cem>dress code\u003c/em> não é fixo nem universal; ele varia conforme a empresa, o setor e a situação profissional.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Adequação ao Setor de Atuação:\u003c/em> Análise das diferenças de vestimenta entre setores operacionais/logísticos (que exigem conforto, mobilidade e equipamentos de segurança) e ambientes corporativos tradicionais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Adequar a linguagem e a apresentação pessoal ao ambiente de trabalho.\u003c/li>\n\u003cli>Reconhecer como a vestimenta e a semiótica da imagem se conectam ao contexto de trabalho e às atividades desempenhadas.\u003c/li>\n\u003cli>Identificar comportamentos adequados e inadequados no cotidiano corporativo.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Demonstrar maturidade e bom senso na adaptação do comportamento ao contexto profissional.\u003c/li>\n\u003cli>Desenvolver autocontrole, autorregulação e respeito diante de situações do cotidiano de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Compreender o conceito de persona profissional e a importância de adaptar a linguagem ao contexto e público.\u003c/li>\n\u003cli>Compreender o conceito de \u003cem>dress code\u003c/em> e sua variação segundo a empresa, setor e situação.\u003c/li>\n\u003cli>Reconhecer o papel da comunicação não verbal, dos sinais não verbais e da empatia na convivência diária.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Dress code","goal":"Explicar por que a apresentação pessoal muda conforme o ambiente de trabalho.","keywords":["Vestimenta","Contexto","Comunicação não verbal"],"points":["Dress code é o código de vestimenta ligado à empresa e às atividades.","Ele varia conforme a empresa, o setor e a situação; não é uma regra universal.","Postura, comportamento e apresentação pessoal também comunicam."]}},{"id":2,"module":0,"title":"Aula 3: Postura e Etiqueta Diária","moduleTitle":"MÓDULO 1: ETIQUETA CORPORATIVA E IMAGEM","body":"* **Habilidade(s) Relacionada(s):** Demonstrar maturidade, autorregulação e respeito nas interações profissionais.\n* **Conceitos Chave & Teoria:**\n  * **Etiqueta Diária e Convivência:** Conjunto de atitudes e comportamentos adequados que garantem o respeito e a harmonia no ambiente de trabalho.\n  * **Pilares do Relacionamento:** A postura profissional baseia-se na compreensão das diferenças entre os tipos de empatia, no exercício da autorregulação emocional e na consciência sobre o impacto dos sinais não verbais.\n* **Aplicações Práticas & Exemplos:**\n  * *Simulação de Situações do Cotidiano:* Análise e correção de comportamentos inadequados em reuniões e espaços compartilhados de trabalho.","skills":"* **Habilidades Técnicas:**\n  * Adequar a linguagem e a apresentação pessoal ao ambiente de trabalho.\n  * Reconhecer como a vestimenta e a semiótica da imagem se conectam ao contexto de trabalho e às atividades desempenhadas.\n  * Identificar comportamentos adequados e inadequados no cotidiano corporativo.\n* **Habilidades Socioemocionais:**\n  * Demonstrar maturidade e bom senso na adaptação do comportamento ao contexto profissional.\n  * Desenvolver autocontrole, autorregulação e respeito diante de situações do cotidiano de trabalho.\n* **Objetivos de Aprendizagem:**\n  * Compreender o conceito de persona profissional e a importância de adaptar a linguagem ao contexto e público.\n  * Compreender o conceito de *dress code* e sua variação segundo a empresa, setor e situação.\n  * Reconhecer o papel da comunicação não verbal, dos sinais não verbais e da empatia na convivência diária.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Demonstrar maturidade, autorregulação e respeito nas interações profissionais.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u00 /li>\n\u003c/ul>\n","review":{"title":"Postura e etiqueta","goal":"Reconhecer atitudes que tornam a convivência profissional respeitosa.","keywords":["Respeito","Empatia","Autorregulação"],"points":["Etiqueta profissional envolve atitudes adequadas no cotidiano.","Considere o efeito do seu comportamento sobre as outras pessoas.","Autocontrole e atenção aos sinais não verbais ajudam nas interações."]}},{"id":3,"module":1,"title":"Aula 1: A Arte da Formalidade Suave","moduleTitle":"MÓDULO 2: COMUNICAÇÃO PROFISSIONAL","body":"* **Habilidade(s) Relacionada(s):** Praticar a transição da linguagem coloquial para a corporativa e discernir o canal e o tom corretos.\n* **Conceitos Chave & Teoria:**\n  * **Linguagem Corporativa Assertiva:** A comunicação corporativa deve prezar pela clareza, objetividade e respeito, eliminando gírias, expressões muito informais e desorganização.\n  * **Garantia de Profissionalismo:** Adaptar a linguagem ao contexto de trabalho é indispensável para assegurar a perfeita compreensão da mensagem e fortalecer a credibilidade profissional do colaborador.\n* **Aplicações Práticas & Exemplos:**\n  * *Análise Crítica de Mensagens:* Identificação de sete pontos de inadequação profissional em mensagens informais sobre prazos e entregas e reescrita de comunicações corporativas formais.","skills":"* **Habilidades Técnicas:**\n  * Praticar a transição da linguagem coloquial para a linguagem corporativa.\n  * Utilizar a comunicação escrita e digital (e-mail, chat corporativo) com formalidade, estrutura e tom adequados.\n  * Discernir o nível de formalidade e o canal correto para cada tipo de mensagem, evitando ruídos.\n  * Identificar os elementos essenciais de um e-mail corporativo (assunto, corpo, assinatura).\n  * Estabelecer boas práticas de comunicação síncrona em aplicativos de mensagens instantâneas (WhatsApp e Teams).\n* **Habilidades Socioemocionais:**\n  * Agir com empatia, respeito e clareza na transmissão de mensagens rápidas e no relacionamento profissional.\n* **Objetivos de Aprendizagem:**\n  * Identificar pontos de inadequação em mensagens informais e reescrevê-las com formalidade e assertividade.\n  * Redigir e-mails corporativos técnicos com clareza, objetividade e aplicação de checklist de revisão.\n  * Elaborar manuais de boas práticas orientando linguagem, uso de áudio, organização de grupos e respeito aos horários de trabalho.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Praticar a transição da linguagem coloquial para a corporativa e discernir o canal e o tom corretos.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Linguagem Corporativa Assertiva:\u003c/strong> A comunicação corporativa deve prezar pela clareza, objetividade e respeito, eliminando gírias, expressões muito informais e desorganização.\u003c/li>\n\u003cli>\u003cstrong>Garantia de Profissionalismo:\u003c/strong> Adaptar a linguagem ao contexto de trabalho é indispensável para assegurar a perfeita compreensão da mensagem e fortalecer a credibilidade profissional do colaborador.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Análise Crítica de Mensagens:\u003c/em> Identificação de sete pontos de inadequação profissional em mensagens informais sobre prazos e entregas e reescrita de comunicações corporativas formais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Praticar a transição da linguagem coloquial para a linguagem corporativa.\u003c/li>\n\u003cli>Utilizar a comunicação escrita e digital (e-mail, chat corporativo) com formalidade, estrutura e tom adequados.\u003c/li>\n\u003cli>Discernir o nível de formalidade e o canal correto para cada tipo de mensagem, evitando ruídos.\u003c/li>\n\u003cli>Identificar os elementos essenciais de um e-mail corporativo (assunto, corpo, assinatura).\u003c/li>\n\u003cli>Estabelecer boas práticas de comunicação síncrona em aplicativos de mensagens instantâneas (WhatsApp e Teams).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Agir com empatia, respeito e clareza na transmissão de mensagens rápidas e no relacionamento profissional.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Identificar pontos de inadequação em mensagens informais e reescrevê-las com formalidade e assertividade.\u003c/li>\n\u003cli>Redigir e-mails corporativos técnicos com clareza, objetividade e aplicação de checklist de revisão.\u003c/li>\n\u003cli>Elaborar manuais de boas práticas orientando linguagem, uso de áudio, organização de grupos e respeito aos horários de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Linguagem profissional","goal":"Transformar uma mensagem informal em uma comunicação clara e respeitosa.","keywords":["Clareza","Objetividade","Respeito"],"points":["Evite gírias, informalidade excessiva e mensagens desorganizadas.","Adapte o tom e o canal ao ambiente e à pessoa que vai receber a mensagem.","O objetivo é garantir compreensão e profissionalismo, sem complicar o texto."]}},{"id":4,"module":1,"title":"Aula 2: E-mail Corporativo e Escrita Técnica","moduleTitle":"MÓDULO 2: COMUNICAÇÃO PROFISSIONAL","body":"* **Habilidade(s) Relacionada(s):** Identificar elementos essenciais de um e-mail e utilizar a escrita técnica corporativa.\n* **Conceitos Chave & Teoria:**\n  * **Função do E-mail Corporativo:** O e-mail é uma das principais ferramentas de comunicação no trabalho, utilizado para registrar informações, organizar demandas e garantir clareza e formalidade.\n  * **Estrutura Essencial do E-mail:**\n    1. **Assunto:** Deve resumir claramente o tema.\n    2. **Saudação e Despedida:** Uso de fórmulas adequadas (ex: \"Prezado(a)\", \"Atenciosamente\").\n    3. **Corpo da Mensagem:** Texto conciso, objetivo, especificando prazos e solicitações.\n    4. **Assinatura:** Identificação do remetente com cargo e contato.\n  * **Erros Comuns a Evitar:** Uso indevido de \"Responder a todos\" quando a mensagem não interessa a todos; esquecimento de anexos citados; confusão entre e-mail (comunicação formal/detalhada) e chat (dúvidas rápidas); e erros de ortografia/concordância.\n  * **Assertividade:** Comunicar-se com respeito, clareza e objetividade.\n* **Aplicações Práticas & Exemplos:**\n  * *Prática em Trios:* Redação de e-mails para confirmação de reuniões, envio de documentos e solicitação de prazos, utilizando checklists de verificação.","skills":"* **Habilidades Técnicas:**\n  * Praticar a transição da linguagem coloquial para a linguagem corporativa.\n  * Utilizar a comunicação escrita e digital (e-mail, chat corporativo) com formalidade, estrutura e tom adequados.\n  * Discernir o nível de formalidade e o canal correto para cada tipo de mensagem, evitando ruídos.\n  * Identificar os elementos essenciais de um e-mail corporativo (assunto, corpo, assinatura).\n  * Estabelecer boas práticas de comunicação síncrona em aplicativos de mensagens instantâneas (WhatsApp e Teams).\n* **Habilidades Socioemocionais:**\n  * Agir com empatia, respeito e clareza na transmissão de mensagens rápidas e no relacionamento profissional.\n* **Objetivos de Aprendizagem:**\n  * Identificar pontos de inadequação em mensagens informais e reescrevê-las com formalidade e assertividade.\n  * Redigir e-mails corporativos técnicos com clareza, objetividade e aplicação de checklist de revisão.\n  * Elaborar manuais de boas práticas orientando linguagem, uso de áudio, organização de grupos e respeito aos horários de trabalho.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Identificar elementos essenciais de um e-mail e utilizar a escrita técnica corporativa.\u003c/li>\n\u00  contexto, excesso de áudios longos, mensagens fora do horário de expediente, linguagem informal excessiva e misturar assuntos pessoais com profissionais em grupos de trabalho.\n  * **Boas Práticas:** Definição de diretrizes sobre objetividade, uso moderado de áudios e respeito aos horários contratuais.\n* **Aplicações Práticas & Exemplos:**\n  * *Manual de Boas Práticas:* Elaboração de documento com orientações práticas para equipes administrativas e logísticas.","skills":"* **Habilidades Técnicas:**\n  * Praticar a transição da linguagem coloquial para a linguagem corporativa.\n  * Utilizar a comunicação escrita e digital (e-mail, chat corporativo) com formalidade, estrutura e tom adequados.\n  * Discernir o nível de formalidade e o canal correto para cada tipo de mensagem, evitando ruídos.\n  * Identificar os elementos essenciais de um e-mail corporativo (assunto, corpo, assinatura).\n  * Estabelecer boas práticas de comunicação síncrona em aplicativos de mensagens instantâneas (WhatsApp e Teams).\n* **Habilidades Socioemocionais:**\n  * Agir com empatia, respeito e clareza na transmissão de mensagens rápidas e no relacionamento profissional.\n* **Objetivos de Aprendizagem:**\n  * Identificar pontos de inadequação em mensagens informais e reescrevê-las com formalidade e assertividade.\n  * Redigir e-mails corporativos técnicos com clareza, objetividade e aplicação de checklist de revisão.\n  * Elaborar manuais de boas práticas orientando linguagem, uso de áudio, organização de grupos e respeito aos horários de trabalho.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Discernir o nível de formalidade e as boas práticas no uso de mensagens instantâneas profissionais.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Comunicação Instantânea no Trabalho:\u003c/strong> O uso de aplicativos como WhatsApp e Teams exige regras claras para evitar ruídos operacionais e conflitos.\u003c/li>\n\u003cli>\u003cstrong>Problemas Recorrentes:\u003c/strong> Mensagens confusas/sem contexto, excesso de áudios longos, mensagens fora do horário de expediente, linguagem informal excessiva e misturar assuntos pessoais com profissionais em grupos de trabalho.\u003c/li>\n\u003cli>\u003cstrong>Boas Práticas:\u003c/strong> Definição de diretrizes sobre objetividade, uso moderado de áudios e respeito aos horários contratuais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Manual de Boas Práticas:\u003c/em> Elaboração de documento com orientações práticas para equipes administrativas e logísticas.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Praticar a transição da linguagem coloquial para a linguagem corporativa.\u003c/li>\n\u003cli>Utilizar a comunicação escrita e digital (e-mail, chat corporativo) com formalidade, estrutura e tom adequados.\u003c/li>\n\u003cli>Discernir o nível de formalidade e o canal correto para cada tipo de mensagem, evitando ruídos.\u003c/li>\n\u003cli>Identificar os elementos essenciais de um e-mail corporativo (assunto, corpo, assinatura).\u003c/li>\n\u003cli>Estabelecer boas práticas de comunicação síncrona em aplicativos de mensagens instantâneas (WhatsApp e Teams).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Agir com empatia, respeito e clareza na transmissão de mensagens rápidas e no relacionamento profissional.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Identificar pontos de inadequação em mensagens informais e reescrevê-las com formalidade e assertividade.\u003c/li>\n\u003cli>Redigir e-mails corporativos técnicos com clareza, objetividade e aplicação de checklist de revisão.\u003c/li>\n\u003cli>Elaborar manuais de boas práticas orientando linguagem, uso de áudio, organização de grupos e respeito aos horários de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"WhatsApp e Teams","goal":"Escolher boas práticas para mensagens rápidas no trabalho.","keywords":["Contexto","Objetividade","Horário"],"points":["Dê contexto à mensagem para evitar interpretações confusas.","Evite áudios longos, informalidade excessiva e assuntos pessoais nos grupos profissionais.","Respeite os horários de trabalho e combine regras de comunicação."]}},{"id":6,"module":2,"title":"Aula 1: Hierarquia no Trabalho e Organogramas","moduleTitle":"MÓDULO 3: TRABALHO EM EQUIPE E CONVIVÊNCIA","body":"* **Habilidade(s) Relacionada(s):** Identificar papéis e níveis hierárquicos e compreender estruturas organizacionais.\n* **Conceitos Chave & Teoria:**\n  * **Organograma:** Representação gráfica da estrutura formal de uma empresa que evidencia a divisão de setores, os cargos e as relações de subordinação.\n  * **Organograma Setorial:** Modelo voltado para um departamento ou setor específico, muito utilizado em grandes corporações como a Unilever para organizar suas divisões internas.\n  * **Linhas de Conexão:** No organograma, as linhas entre os cargos indicam as **relações de autoridade e comunicação**, mostrando quem se reporta a quem e qual o fluxo formal de informações.\n* **Aplicações Práticas & Exemplos:**\n  * *Mapeamento de Linhas de Comando:* Identificação do fluxo de resolução de problemas operacionais respeitando a cadeia hierárquica.","skills":"* **Habilidades Técnicas:**\n  * Identificar os papéis, níveis hierárquicos e estruturas organizacionais nas empresas.\n  * Compreender a função dos organogramas e reconhecer a representação gráfica das relações de autoridade e comunicação.\n* **Habilidades Socioemocionais:**\n  * Atuar de forma colaborativa e respeitosa, promovendo a integração entre profissionais de diferentes gerações.\n  * Valorizar o trabalho coletivo e compreender como a divisão funcional de papéis otimiza a resolução de problemas.\n* **Objetivos de Aprendizagem:**\n  * Diferenciar e construir modelos de organograma (como o organograma setorial utilizado em grandes corporações como a Unilever).\n  * Compreender os benefícios da colaboração intergeracional para o aumento da inovação e da qualidade das soluções.\n  * Experimentar a construção coletiva de soluções a partir da articulação entre frentes estratégicas, operacionais e de comunicação.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Identificar papéis e níveis hierárquicos e compreender estruturas organizacionais.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Organograma:\u003c/strong> Representação gráfica da estrutura formal de uma empresa que evidencia a divisão de setores, os cargos e as relações de subordinação.\u003c/li>\n\u003cli>\u003cstrong>Organograma Setorial:\u003c/strong> Modelo voltado para um departamento ou setor específico, muito utilizado em grandes corporações como a Unilever para organizar suas divisões internas.\u003c/li>\n\u003cli>\u003cstrong>Linhas de Conexão:\u003c/strong> No organograma, as linhas entre os cargos indicam as \u003cstrong>relações de autoridade e comunicação\u003c/strong>, mostrando quem se reporta a quem e qual o fluxo formal de informações.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Mapeamento de Linhas de Comando:\u003c/em> Identificação do fluxo de resolução de problemas operacionais respeitando a cadeia hierárquica.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Identificar os papéis, níveis hierárquicos e estruturas organizacionais nas empresas.\u003c/li>\n\u003cli>Compreender a função dos organogramas e reconhecer a representação gráfica das relações de autoridade e comunicação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Atuar de forma colaborativa e respeitosa, promovendo a integração entre profissionais de diferentes gerações.\u003c/li>\n\u003cli>Valorizar o trabalho coletivo e compreender como a divisão funcional de papéis otimiza a resolução de problemas.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Diferenciar e construir modelos de organograma (como o organograma setorial utilizado em grandes corporações como a Unilever).\u003c/li>\n\u003cli>Compreender os benefícios da colaboração intergeracional para o aumento da inovação e da qualidade das soluções.\u003c/li>\n\u003cli>Experimentar a construção coletiva de soluções a partir da articulação entre frentes estratégicas, operacionais e de comunicação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Organogramas","goal":"Identificar quem se reporta a quem e como a comunicação circula.","keywords":["Hierarquia","Autoridade","Comunicação"],"points":["O organograma mostra a estrutura formal: setores, cargos e subordinação.","As linhas indicam relações de autoridade e comunicação.","O organograma setorial detalha um departamento ou setor específico."]}},{"id":7,"module":2,"title":"Aula 2: Diversidade no Trabalho e Colaboração Intergeracional","moduleTitle":"MÓDULO 3: TRABALHO EM EQUIPE E CONVIVÊNCIA","body":"* **Habilidade(s) Relacionada(s):** Atuar de forma colaborativa e valorizar a diversidade de gerações e perfis.\n* **Conceitos Chave & Teoria:**\n  * **Colaboração Intergeracional:** Integração produtiva entre profissionais de diferentes idades e tempos de experiência.\n  * **Sinergia entre Tradição e Inovação:** O zelo pelo legado, tradição e qualidade (trazidos por profissionais experientes) soma-se à vontade de inovar, utilizar novas mídias e acelerar processos (trazida por jovens profissionais).\n  * **Benefício Principal:** A troca de conhecimentos e perspectivas entre gerações gera **aumento da inovação e da qualidade das soluções**.\n* **Aplicações Práticas & Exemplos:**\n  * *Estudo de Caso Padaria (Sr. Manoel e Enzo):* Criação de estratégias digitais que unem o conhecimento tradicional de fabricação artesanal às técnicas de edição e redes sociais.","skills":"* **Habilidades Técnicas:**\n  * Identificar os papéis, níveis hierárquicos e estruturas organizacionais nas empresas.\n  * Compreender a função dos organogramas e reconhecer a representação gráfica das relações de autoridade e comunicação.\n* **Habilidades Socioemocionais:**\n  * Atuar de forma colaborativa e respeitosa, promovendo a integração entre profissionais de diferentes gerações.\n  * Valorizar o trabalho coletivo e compreender como a divisão funcional de papéis otimiza a resolução de problemas.\n* **Objetivos de Aprendizagem:**\n  * Diferenciar e construir modelos de organograma (como o organograma setorial utilizado em grandes corporações como a Unilever).\n  * Compreender os benefícios da colaboração intergeracional para o aumento da inovação e da qualidade das soluções.\n  * Experimentar a construção coletiva de soluções a partir da articulação entre frentes estratégicas, operacionais e de comunicação.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Atuar de forma colaborativa e valorizar a diversidade de gerações e perfis.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Colaboração Intergeracional:\u003c/strong> Integração produtiva entre profissionais de diferentes idades e tempos de experiência.\u003c/li>\n\u003cli>\u003cstrong>Sinergia entre Tradição e Inovação:\u003c/strong> O zelo pelo legado, tradição e qualidade (trazidos por profissionais experientes) soma-se à vontade de inovar, utilizar novas mídias e acelerar processos (trazida por jovens profissionais).\u003c/li>\n\u003cli>\u003cstrong>Benefício Principal:\u003c/strong> A troca de conhecimentos e perspectivas entre gerações gera \u003cstrong>aumento da inovação e da qualidade das soluções\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Estudo de Caso Padaria (Sr. Manoel e Enzo):\u003c/em> Criação de estratégias digitais que unem o conhecimento tradicional de fabricação artesanal às técnicas de edição e redes sociais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Identificar os papéis, níveis hierárquicos e estruturas organizacionais nas empresas.\u003c/li>\n\u003cli>Compreender a função dos organogramas e reconhecer a representação gráfica das relações de autoridade e comunicação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Atuar de forma colaborativa e respeitosa, promovendo a integração entre profissionais de diferentes gerações.\u003c/li>\n\u003cli>Valorizar o trabalho coletivo e compreender como a divisão funcional de papéis otimiza a resolução de problemas.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Diferenciar e construir modelos de organograma (como o organograma setorial utilizado em grandes corporações como a Unilever).\u003c/li>\n\u003cli>Compreender os benefícios da colaboração intergeracional para o aumento da inovação e da qualidade das soluções.\u003c/li>\n\u003cli>Experimentar a construção coletiva de soluções a partir da articulação entre frentes estratégicas, operacionais e de comunicação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Gerações no trabalho","goal":"Relacionar a troca entre gerações à melhoria das soluções.","keywords":["Colaboração","Diversidade","Inovação"],"points":["Profissionais de diferentes idades e experiências podem colaborar.","Conhecimento tradicional e novas ideias se complementam.","A diversidade de perspectivas favorece a inovação e a qualidade das soluções."]}},{"id":8,"module":2,"title":"Aula 3: Trabalho em Equipe e Construção Coletiva","moduleTitle":"MÓDULO 3: TRABALHO EM EQUIPE E CONVIVÊNCIA","body":"* **Habilidade(s) Relacionada(s):** Atuar colaborativamente e integrar visões individuais em soluções coletivas.\n* **Conceitos Chave & Teoria:**\n  * **Construção Coletiva:** O trabalho em equipe eficaz combina a reflexão e criação individual com a síntese em grupo, resultando em propostas mais completas do que a soma das partes isoladas.\n  * **Divisão de Papéis:** Organização do grupo em frentes de trabalho (Estratégia, Operações e Comunicação) para garantir eficiência na execução.\n* **Aplicações Práticas & Exemplos:**\n  * *Dinâmica em Etapas:* Etapa individual em silêncio seguida do compartilhamento e consolidação de uma única solução unificada pela equipe.","skills":"* **Habilidades Técnicas:**\n  * Identificar os papéis, níveis hierárquicos e estruturas organizacionais nas empresas.\n  * Compreender a função dos organogramas e reconhecer a representação gráfica das relações de autoridade e comunicação.\n* **Habilidades Socioemocionais:**\n  * Atuar de forma colaborativa e respeitosa, promovendo a integração entre profissionais de diferentes gerações.\n  * Valorizar o trabalho coletivo e compreender como a divisão funcional de papéis otimiza a resolução de problemas.\n* **Objetivos de Aprendizagem:**\n  * Diferenciar e construir modelos de organograma (como o organograma setorial utilizado em grandes corporações como a Unilever).\n  * Compreender os benefícios da colaboração intergeracional para o aumento da inovação e da qualidade das soluções.\n  * Experimentar a construção coletiva de soluções a partir da articulação entre frentes estratégicas, operacionais e de comunicação.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Atuar colaborativamente e integrar visões individuais em soluções coletivas.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Construção Coletiva:\u003c/strong> O trabalho em equipe eficaz combina a reflexão e criação individual com a síntese em grupo, resultando em propostas mais completas do que a soma das partes isoladas.\u003c/li>\n\u003cli>\u003cstrong>Divisão de Papéis:\u003c/strong> Organização do grupo em frentes de trabalho (Estratégia, Operações e Comunicação) para garantir eficiência na execução.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Dinâmica em Etapas:\u003c/em> Etapa individual em silêncio seguida do compartilhamento e consolidação de uma única solução unificada pela equipe.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Identificar os papéis, níveis hierárquicos e estruturas organizacionais nas empresas.\u003c/li>\n\u003cli>Compreender a função dos organogramas e reconhecer a representação gráfica das relações de autoridade e comunicação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Atuar de forma colaborativa e respeitosa, promovendo a integração entre profissionais de diferentes gerações.\u003c/li>\n\u003cli>Valorizar o trabalho coletivo e compreender como a divisão funcional de papéis otimiza a resolução de problemas.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Diferenciar e construir modelos de organograma (como o organograma setorial utilizado em grandes corporações como a Unilever).\u003c/li>\n\u003cli>Compreender os benefícios da colaboração intergeracional para o aumento da inovação e da qualidade das soluções.\u003c/li>\n\u003cli>Experimentar a construção coletiva de soluções a partir da articulação entre frentes estratégicas, operacionais e de comunicação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Trabalho em equipe","goal":"Explicar como contribuições individuais viram uma solução coletiva.","keywords":["Papéis","Integração","Construção coletiva"],"points":["A reflexão individual ajuda a preparar a contribuição de cada pessoa.","O grupo compartilha e integra as ideias em uma solução unificada.","Frentes como Estratégia, Operações e Comunicação organizam a execução."]}},{"id":9,"module":3,"title":"Aula 1: Feedback Profissional e Modelo SCI","moduleTitle":"MÓDULO 4: POSTURA PROFISSIONAL","body":"* **Habilidade(s) Relacionada(s):** Compreender o feedback como ferramenta de crescimento e aplicar o modelo SCI.\n* **Conceitos Chave & Teoria:**\n  * **Feedback Construtivo:** Comunicação orientada ao desenvolvimento contínuo, valorizando acertos e apontando pontos de melhoria com objetividade.\n  * **Modelo SCI:** Estrutura para concessão de feedback que organiza a mensagem em:\n    * **S (Situação):** Descrição do contexto e momento exato do fato.\n    * **C (Comportamento):** Descrição da ação observável sem julgamentos morais.\n    * **I (Impacto):** Explicação da consequência gerada para o processo ou equipe.\n  * **Plano de Ação:** O feedback deve ser convertido em compromissos práticos divididos nas categorias: *Começar a fazer*, *Parar de fazer* e *Continuar fazendo*.\n* **Aplicações Práticas & Exemplos:**\n  * *Simulação de Feedback em Duplas:* Execução de simulações com observadores avaliando a postura, clareza e respeito na comunicação.","skills":"* **Habilidades Técnicas:**\n  * Compreender o feedback como ferramenta contínua de crescimento profissional.\n  * Identificar os princípios de ética, *compliance* e técnicas de recebimento/concessão de feedback.\n  * Identificar comportamentos éticos e antiéticos no cotidiano corporativo.\n  * Demonstrar atitudes proativas na resolução de situações do ambiente de trabalho.\n* **Habilidades Socioemocionais:**\n  * Agir com integridade e flexibilidade, demonstrando proatividade e maturidade ao lidar com correções e imprevistos.\n* **Objetivos de Aprendizagem:**\n  * Estruturar feedbacks construtivos utilizando o modelo SCI (Situação, Comportamento, Impacto) e definir planos de ação (começar, parar, continuar).\n  * Analisar estudos de caso sobre omissão corporativa, priorização de resultados a qualquer custo e conflitos éticos.\n  * Tomar decisões autônomas e rápidas diante do fator-surpresa e crises operacionais.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Compreender o feedback como ferramenta de crescimento e aplicar o modelo SCI.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Feedback Construtivo:\u003c/strong> Comunicação orientada ao desenvolvimento contínuo, valorizando acertos e apontando pontos de melhoria com objetividade.\u003c/li>\n\u003cli>\u003cstrong>Modelo SCI:\u003c/strong> Estrutura para concessão de feedback que organiza a mensagem em:\u003cul>\n\u003cli>\u003cstrong>S (Situação):\u003c/strong> Descrição do contexto e momento exato do fato.\u003c/li>\n\u003cli>\u003cstrong>C (Comportamento):\u003c/strong> Descrição da ação observável sem julgamentos morais.\u003c/li>\n\u003cli>\u003cstrong>I (Impacto):\u003c/strong> Explicação da consequência gerada para o processo ou equipe.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Plano de Ação:\u003c/strong> O feedback deve ser convertido em compromissos práticos divididos nas categorias: \u003cem>Começar a fazer\u003c/em>, \u003cem>Parar de fazer\u003c/em> e \u003cem>Continuar fazendo\u003c/em>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Simulação de Feedback em Duplas:\u003c/em> Execução de simulações com observadores avaliando a postura, clareza e respeito na comunicação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Compreender o feedback como ferramenta contínua de crescimento profissional.\u003c/li>\n\u003cli>Identificar os princípios de ética, \u003cem>compliance\u003c/em> e técnicas de recebimento/concessão de feedback.\u003c/li>\n\u003cli>Identificar comportamentos éticos e antiéticos no cotidiano corporativo.\u003c/li>\n\u003cli>Demonstrar atitudes proativas na resolução de situações do ambiente de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Agir com integridade e flexibilidade, demonstrando proatividade e maturidade ao lidar com correções e imprevistos.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Estruturar feedbacks construtivos utilizando o modelo SCI (Situação, Comportamento, Impacto) e definir planos de ação (começar, parar, continuar).\u003c/li>\n\u003cli>Analisar estudos de caso sobre omissão corporativa, priorização de resultados a qualquer custo e conflitos éticos.\u003c/li>\n\u003cli>Tomar decisões autônomas e rápidas diante do fator-surpresa e crises operacionais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Feedback SCI","goal":"Organizar um feedback com situação, comportamento e impacto.","keywords":["Situação","Comportamento","Impacto"],"points":["Situação: diga em que contexto e momento o fato aconteceu.","Comportamento: descreva a ação observada, sem julgamento moral. Impacto: explique a consequência.","Transforme o feedback em ações: começar, parar e continuar fazendo."]}},{"id":10,"module":3,"title":"Aula 2: Ética Profissional e Consequências da Omissão","moduleTitle":"MÓDULO 4: POSTURA PROFISSIONAL","body":"* **Habilidade(s) Relacionada(s):** Identificar comportamentos éticos e antiéticos no cotidiano corporativo.\n* **Conceitos Chave & Teoria:**\n  * **Dilemas Éticos Corporativos:** Conflitos gerados quando a busca por resultados econômicos atropela princípios morais e a responsabilidade social.\n  * **Consequências da Omissão:**\n    * *Para os Usuários/Clientes:* Prejuízos, uso indevido de dados e danos ao bem-estar.\n    * *Para a Empresa:* Danos à reputação, perda de confiança, processos e multas.\n    * *Para os Profissionais:* Comprometimento ético e risco à carreira.\n  * **Atitude Esperada:** Posicionamento responsável, questionamento fundamentado em dados e uso de canais oficiais de *compliance*.\n* **Aplicações Práticas & Exemplos:**\n  * *Estudo de Caso Tecnológico:* Análise de empresas que mantiveram sistemas nocivos ativos para garantir lucros, avaliando as respostas éticas cabíveis.","skills":"* **Habilidades Técnicas:**\n  * Compreender o feedback como ferramenta contínua de crescimento profissional.\n  * Identificar os princípios de ética, *compliance* e técnicas de recebimento/concessão de feedback.\n  * Identificar comportamentos éticos e antiéticos no cotidiano corporativo.\n  * Demonstrar atitudes proativas na resolução de situações do ambiente de trabalho.\n* **Habilidades Socioemocionais:**\n  * Agir com integridade e flexibilidade, demonstrando proatividade e maturidade ao lidar com correções e imprevistos.\n* **Objetivos de Aprendizagem:**\n  * Estruturar feedbacks construtivos utilizando o modelo SCI (Situação, Comportamento, Impacto) e definir planos de ação (começar, parar, continuar).\n  * Analisar estudos de caso sobre omissão corporativa, priorização de resultados a qualquer custo e conflitos éticos.\n  * Tomar decisões autônomas e rápidas diante do fator-surpresa e crises operacionais.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Identificar comportamentos éticos e antiéticos no cotidiano corporativo.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Dilemas Éticos Corporativos:\u003c/strong> Conflitos gerados quando a busca por resultados econômicos atropela princípios morais e a responsabilidade social.\u003c/li>\n\u003cli>\u003cstrong>Consequências da Omissão:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Para os Usuários/Clientes:\u003c/em> Prejuízos, uso indevido de dados e danos ao bem-estar.\u003c/li>\n\u003cli>\u003cem>Para a Empresa:\u003c/em> Danos à reputação, perda de confiança, processos e multas.\u003c/li>\n\u003cli>\u003cem>Para os Profissionais:\u003c/em> Comprometimento ético e risco à carreira.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Atitude Esperada:\u003c/strong> Posicionamento responsável, questionamento fundamentado em dados e uso de canais oficiais de \u003cem>compliance\u003c/em>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Estudo de Caso Tecnológico:\u003c/em> Análise de empresas que mantiveram sistemas nocivos ativos para garantir lucros, avaliando as respostas éticas cabíveis.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Compreender o feedback como ferramenta contínua de crescimento profissional.\u003c/li>\n\u003cli>Identificar os princípios de ética, \u003cem>compliance\u003c/em> e técnicas de recebimento/concessão de feedback.\u003c/li>\n\u003cli>Identificar comportamentos éticos e antiéticos no cotidiano corporativo.\u003c/li>\n\u003cli>Demonstrar atitudes proativas na resolução de situações do ambiente de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Agir com integridade e flexibilidade, demonstrando proatividade e maturidade ao lidar com correções e imprevistos.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Estruturar feedbacks construtivos utilizando o modelo SCI (Situação, Comportamento, Impacto) e definir planos de ação (começar, parar, continuar).\u003c/li>\n\u003cli>Analisar estudos de caso sobre omissão corporativa, priorização de resultados a qualquer custo e conflitos éticos.\u003c/li>\n\u003cli>Tomar decisões autônomas e rápidas diante do fator-surpresa e crises operacionais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Ética profissional","goal":"Reconhecer consequências da omissão e escolher uma postura responsável.","keywords":["Integridade","Omissão","Compliance"],"points":["Buscar resultados a qualquer custo pode criar conflitos éticos.","A omissão pode prejudicar clientes, reputação da empresa e carreira dos profissionais.","Questione com base em dados e utilize os canais oficiais de compliance."]}},{"id":11,"module":3,"title":"Aula 3: Proatividade e Resolução de Situações do Trabalho","moduleTitle":"MÓDULO 4: POSTURA PROFISSIONAL","body":"* **Habilidade(s) Relacionada(s):** Demonstrar atitudes proativas na resolução de problemas e crises.\n* **Conceitos Chave & Teoria:**\n  * **Proatividade Corporativa:** Agir antecipadamente para evitar problemas maiores e tomar decisões sem depender de supervisão constante.\n  * **Gestão do Fator-Surpresa:** Capacidade de diagnosticar riscos, avaliar consequências e implementar planos de ação imediatos frente a imprevistos operacionais.\n* **Aplicações Práticas & Exemplos:**\n  * *Simulação de Crise Operacional:* Ações práticas imediatas (interromper envios, reorganizar etiquetas, redistribuir tarefas e acionar transportadoras) seguidas de reporte estruturado ao gestor.","skills":"* **Habilidades Técnicas:**\n  * Compreender o feedback como ferramenta contínua de crescimento profissional.\n  * Identificar os princípios de ética, *compliance* e técnicas de recebimento/concessão de feedback.\n  * Identificar comportamentos éticos e antiéticos no cotidiano corporativo.\n  * Demonstrar atitudes proativas na resolução de situações do ambiente de trabalho.\n* **Habilidades Socioemocionais:**\n  * Agir com integridade e flexibilidade, demonstrando proatividade e maturidade ao lidar com correções e imprevistos.\n* **Objetivos de Aprendizagem:**\n  * Estruturar feedbacks construtivos utilizando o modelo SCI (Situação, Comportamento, Impacto) e definir planos de ação (começar, parar, continuar).\n  * Analisar estudos de caso sobre omissão corporativa, priorização de resultados a qualquer custo e conflitos éticos.\n  * Tomar decisões autônomas e rápidas diante do fator-surpresa e crises operacionais.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Demonstrar atitudes proativas na resolução de problemas e crises.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Proatividade Corporativa:\u003c/strong> Agir antecipadamente para evitar problemas maiores e tomar decisões sem depender de supervisão constante.\u003c/li>\n\u003cli>\u003cstrong>Gestão do Fator-Surpresa:\u003c/strong> Capacidade de diagnosticar riscos, avaliar consequências e implementar planos de ação imediatos frente a imprevistos operacionais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Simulação de Crise Operacional:\u003c/em> Ações práticas imediatas (interromper envios, reorganizar etiquetas, redistribuir tarefas e acionar transportadoras) seguidas de reporte estruturado ao gestor.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Compreender o feedback como ferramenta contínua de crescimento profissional.\u003c/li>\n\u003cli>Identificar os princípios de ética, \u003cem>compliance\u003c/em> e técnicas de recebimento/concessão de feedback.\u003c/li>\n\u003cli>Identificar comportamentos éticos e antiéticos no cotidiano corporativo.\u003c/li>\n\u003cli>Demonstrar atitudes proativas na resolução de situações do ambiente de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Agir com integridade e flexibilidade, demonstrando proatividade e maturidade ao lidar com correções e imprevistos.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Estruturar feedbacks construtivos utilizando o modelo SCI (Situação, Comportamento, Impacto) e definir planos de ação (começar, parar, continuar).\u003c/li>\n\u003cli>Analisar estudos de caso sobre omissão corporativa, priorização de resultados a qualquer custo e conflitos éticos.\u003c/li>\n\u003cli>Tomar decisões autônomas e rápidas diante do fator-surpresa e crises operacionais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Proatividade","goal":"Explicar como antecipar problemas e agir diante de um imprevisto.","keywords":["Antecipação","Riscos","Plano de ação"],"points":["Proatividade é agir antes que o problema aumente, sem depender sempre de supervisão.","Diante de uma surpresa, identifique os riscos e avalie as consequências.","Implemente ações e comunique ao gestor o que foi feito."]}},{"id":12,"module":4,"title":"Aula 1: Gestão do Tempo e Matriz de Eisenhower","moduleTitle":"MÓDULO 5: ORGANIZAÇÃO E PRODUTIVIDADE","body":"* **Habilidade(s) Relacionada(s):** Classificar e priorizar tarefas com base em urgência e importância.\n* **Conceitos Chave & Teoria:**\n  * **Matriz de Eisenhower:** Ferramenta de gerenciamento do tempo que organiza tarefas em quatro quadrantes:\n    1. **Importante e Urgente:** Resolver imediatamente (ex: estudar para a prova, finalizar trabalho com prazo hoje).\n    2. **Importante, mas Não Urgente:** Planejar e agendar para médio/longo prazo (ex: organizar espaço de estudo).\n    3. **Urgente, mas Não Importante:** Delegar ou resolver rapidamente sem prioridade alta (ex: responder certas mensagens no grupo).\n    4. **Não Importante nem Urgente:** Eliminar ou postergar (ex: assistir a séries durante tarefas acumuladas).\n* **Aplicações Práticas & Exemplos:**\n  * *Classificação do Caso Votação:* Votar em enquete de formatura com prazo de 4 dias no meio de tarefas acadêmicas/profissionais com entrega hoje deve ser classificado como **Importante, mas não urgente**.","skills":"* **Habilidades Técnicas:**\n  * Classificar e priorizar tarefas utilizando a Matriz de Eisenhower com base em urgência e importância.\n  * Aplicar o Programa 5S para a organização do espaço de trabalho físico e digital.\n  * Utilizar ferramentas digitais de produtividade (Google Agenda) para planejar e gerenciar a rotina de trabalho.\n* **Habilidades Socioemocionais:**\n  * Desenvolver disciplina e autonomia na gestão do tempo e no cumprimento de prazos operacionais.\n* **Objetivos de Aprendizagem:**\n  * Organizar atividades em quatro quadrantes de priorização para evitar acúmulo e crises.\n  * Aplicar os sensos do 5S (*Seiri*, *Seiton*, *Seiso*, *Seiketsu*, *Shitsuke*) na padronização física e digital.\n  * Estruturar agendas semanais no Google Agenda, identificando conflitos de horários e reorganizando demandas frente a imprevistos.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Classificar e priorizar tarefas com base em urgência e importância.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Matriz de Eisenhower:\u003c/strong> Ferramenta de gerenciamento do tempo que organiza tarefas em quatro quadrantes:\u003col>\n\u003cli>\u003cstrong>Importante e Urgente:\u003c/strong> Resolver imediatamente (ex: estudar para a prova, finalizar trabalho com prazo hoje).\u003c/li>\n\u003cli>\u003cstrong>Importante, mas Não Urgente:\u003c/strong> Planejar e agendar para médio/longo prazo (ex: organizar espaço de estudo).\u003c/li>\n\u003cli>\u003cstrong>Urgente, mas Não Importante:\u003c/strong> Delegar ou resolver rapidamente sem prioridade alta (ex: responder certas mensagens no grupo).\u003c/li>\n\u003cli>\u003cstrong>Não Importante nem Urgente:\u003c/strong> Eliminar ou postergar (ex: assistir a séries durante tarefas acumuladas).\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Classificação do Caso Votação:\u003c/em> Votar em enquete de formatura com prazo de 4 dias no meio de tarefas acadêmicas/profissionais com entrega hoje deve ser classificado como \u003cstrong>Importante, mas não urgente\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Classificar e priorizar tarefas utilizando a Matriz de Eisenhower com base em urgência e importância.\u003c/li>\n\u003cli>Aplicar o Programa 5S para a organização do espaço de trabalho físico e digital.\u003c/li>\n\u003cli>Utilizar ferramentas digitais de produtividade (Google Agenda) para planejar e gerenciar a rotina de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Desenvolver disciplina e autonomia na gestão do tempo e no cumprimento de prazos operacionais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Organizar atividades em quatro quadrantes de priorização para evitar acúmulo e crises.\u003c/li>\n\u003cli>Aplicar os sensos do 5S (\u003cem>Seiri\u003c/em>, \u003cem>Seiton\u003c/em>, \u003cem>Seiso\u003c/em>, \u003cem>Seiketsu\u003c/em>, \u003cem>Shitsuke\u003c/em>) na padronização física e digital.\u003c/li>\n\u003cli>Estruturar agendas semanais no Google Agenda, identificando conflitos de horários e reorganizando demandas frente a imprevistos.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Matriz de Eisenhower","goal":"Separar importância de urgência para decidir o que fazer primeiro.","keywords":["Urgência","Importância","Prioridade"],"points":["Importante e urgente: resolva agora. Importante e não urgente: planeje.","Urgente e não importante: delegue ou resolva rapidamente. Nem importante nem urgente: elimine ou adie.","A votação da formatura com prazo de quatro dias é importante, mas não urgente no caso do material."]}},{"id":13,"module":4,"title":"Aula 2: Organização do Trabalho e Método 5S","moduleTitle":"MÓDULO 5: ORGANIZAÇÃO E PRODUTIVIDADE","body":"* **Habilidade(s) Relacionada(s):** Aplicar os princípios do 5S para organizar o ambiente físico e digital.\n* **Conceitos Chave & Teoria:**\n  * **Programa 5S:** Metodologia de organização e qualidade constituída por cinco sensos:\n    * *Seiri* (Senso de Utilização): Separar o útil do inútil.\n    * *Seiton* (Senso de Organização): Um lugar para cada coisa.\n    * *Seiso* (Senso de Limpeza): Eliminar sujeira e manter o espaço limpo.\n    * *Seiketsu* (Senso de Padronização): Definir regras visuais e padrões de identificação.\n    * *Shitsuke* (Senso de Disciplina): Manter a rotina de organização continuamente.\n  * **Aplicação Digital do Seiketsu:** Nomear todos os arquivos virtuais utilizando uma mesma estrutura padronizada (ex: `atividade_matematica_data`) para facilitar o acesso de qualquer pessoa é uma aplicação do **Senso de Padronização (*Seiketsu*)**.\n* **Aplicações Práticas & Exemplos:**\n  * *Reorganização de Escritório:* Identificação de problemas físicos e virtuais em empresas e redação de e-mail corporativo propondo plano de melhoria baseado no 5S.","skills":"* **Habilidades Técnicas:**\n  * Classificar e priorizar tarefas utilizando a Matriz de Eisenhower com base em urgência e importância.\n  * Aplicar o Programa 5S para a organização do espaço de trabalho físico emplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Reorganização de Escritório:\u003c/em> Identificação de problemas físicos e virtuais em empresas e redação de e-mail corporativo propondo plano de melhoria baseado no 5S.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Classificar e priorizar tarefas utilizando a Matriz de Eisenhower com base em urgência e importância.\u003c/li>\n\u003cli>Aplicar o Programa 5S para a organização do espaço de trabalho físico e digital.\u003c/li>\n\u003cli>Utilizar ferramentas digitais de produtividade (Google Agenda) para planejar e gerenciar a rotina de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Desenvolver disciplina e autonomia na gestão do tempo e no cumprimento de prazos operacionais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Organizar atividades em quatro quadrantes de priorização para evitar acúmulo e crises.\u003c/li>\n\u003cli>Aplicar os sensos do 5S (\u003cem>Seiri\u003c/em>, \u003cem>Seiton\u003c/em>, \u003cem>Seiso\u003c/em>, \u003cem>Seiketsu\u003c/em>, \u003cem>Shitsuke\u003c/em>) na padronização física e digital.\u003c/li>\n\u003cli>Estruturar agendas semanais no Google Agenda, identificando conflitos de horários e reorganizando demandas frente a imprevistos.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"5S físico e digital","goal":"Associar cada senso à ação correta no ambiente de trabalho.","keywords":["Utilização","Organização e limpeza","Padronização e disciplina"],"points":["Seiri: separar o útil do inútil. Seiton: um lugar para cada coisa. Seiso: manter limpo.","Seiketsu: definir padrões. Shitsuke: manter a rotina de organização.","Dar aos arquivos uma estrutura comum de nomes é Seiketsu, o senso de padronização."]}},{"id":14,"module":4,"title":"Aula 3: Ferramentas de Produtividade (Google Agenda)","moduleTitle":"MÓDULO 5: ORGANIZAÇÃO E PRODUTIVIDADE","body":"* **Habilidade(s) Relacionada(s):** Utilizar ferramentas digitais para planejamento e acompanhamento de tarefas.\n* **Conceitos Chave & Teoria:**\n  * **Planejamento de Agenda:** Utilização do Google Agenda para inserção de compromissos operacionais, visualização da distribuição de tempo e detecção de sobreposições de horários.\n  * **Flexibilidade no Planejamento:** Capacidade de reorganizar a agenda semanal diante de novos imprevistos e demandas urgentes sem perder o controle das metas.\n* **Aplicações Práticas & Exemplos:**\n  * *Montagem de Agenda Semanal:* Criação individual de calendário digital com simulação de alteração de horários e envio do registro via AVA.","skills":"* **Habilidades Técnicas:**\n  * Classificar e priorizar tarefas utilizando a Matriz de Eisenhower com base em urgência e importância.\n  * Aplicar o Programa 5S para a organização do espaço de trabalho físico e digital.\n  * Utilizar ferramentas digitais de produtividade (Google Agenda) para planejar e gerenciar a rotina de trabalho.\n* **Habilidades Socioemocionais:**\n  * Desenvolver disciplina e autonomia na gestão do tempo e no cumprimento de prazos operacionais.\n* **Objetivos de Aprendizagem:**\n  * Organizar atividades em quatro quadrantes de priorização para evitar acúmulo e crises.\n  * Aplicar os sensos do 5S (*Seiri*, *Seiton*, *Seiso*, *Seiketsu*, *Shitsuke*) na padronização física e digital.\n  * Estruturar agendas semanais no Google Agenda, identificando conflitos de horários e reorganizando demandas frente a imprevistos.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Utilizar ferramentas digitais para planejamento e acompanhamento de tarefas.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Planejamento de Agenda:\u003c/strong> Utilização do Google Agenda para inserção de compromissos operacionais, visualização da distribuição de tempo e detecção de sobreposições de horários.\u003c/li>\n\u003cli>\u003cstrong>Flexibilidade no Planejamento:\u003c/strong> Capacidade de reorganizar a agenda semanal diante de novos imprevistos e demandas urgentes sem perder o controle das metas.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Montagem de Agenda Semanal:\u003c/em> Criação individual de calendário digital com simulação de alteração de horários e envio do registro via AVA.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Classificar e priorizar tarefas utilizando a Matriz de Eisenhower com base em urgência e importância.\u003c/li>\n\u003cli>Aplicar o Programa 5S para a organização do espaço de trabalho físico e digital.\u003c/li>\n\u003cli>Utilizar ferramentas digitais de produtividade (Google Agenda) para planejar e gerenciar a rotina de trabalho.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Desenvolver disciplina e autonomia na gestão do tempo e no cumprimento de prazos operacionais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Organizar atividades em quatro quadrantes de priorização para evitar acúmulo e crises.\u003c/li>\n\u003cli>Aplicar os sensos do 5S (\u003cem>Seiri\u003c/em>, \u003cem>Seiton\u003c/em>, \u003cem>Seiso\u003c/em>, \u003cem>Seiketsu\u003c/em>, \u003cem>Shitsuke\u003c/em>) na padronização física e digital.\u003c/li>\n\u003cli>Estruturar agendas semanais no Google Agenda, identificando conflitos de horários e reorganizando demandas frente a imprevistos.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Agenda e produtividade","goal":"Planejar a rotina e reorganizá-la quando aparecer um imprevisto.","keywords":["Planejamento","Horários","Flexibilidade"],"points":["Uma agenda permite distribuir o tempo e acompanhar compromissos.","Verifique se há atividades com horários sobrepostos.","Reorganize a semana diante de novas demandas sem perder as metas."]}},{"id":15,"module":5,"title":"Aula 1: Atitude Empreendedora e Modalidades","moduleTitle":"MÓDULO 6: INICIAÇÃO EMPREENDEDORA","body":"* **Habilidade(s) Relacionada(s):** Identificar características empreendedoras e modalidades de negócio.\n* **Conceitos Chave & Teoria:**\n  * **Empreendedorismo por Oportunidade:** Ocorre quando o indivíduo identifica uma necessidade ou lacuna no mercado e cria uma solução de forma proativa e planejada, sem a pressão de falta de renda imediata.\n  * **Empreendedorismo Corporativo (Intraempreendedorismo):** Inovações e melhorias criadas por funcionários dentro de uma empresa já existente para otimizar processos e aumentar a competitividade.\n  * **Empreendedorismo Sustentável:** Soluções que geram valor econômico e lucro mantendo a preservação ambiental e a redução de impactos ecológicos.\n* **Aplicações Práticas & Exemplos:**\n  * *Estudante e Cronograma:* Criação de aplicativo para auxiliar colegas nos estudos sem necessidade financeira imediata configura **Empreendedorismo por Oportunidade**.\n  * *Inovação na Expedição:* Métodos novos criados por funcionários dentro da empresa configuram **Empreendedorismo Corporativo**.","skills":"* **Habilidades Técnicas:**\n  * Identificar modalidades de empreendedorismo (por oportunidade, por necessidade, corporativo, social, sustentável e individual).\n  * Analisar situações cotidianas para transformar problemas em oportunidades de negócio.\n  * Desenvolver e avaliar ideias de negócio com base em diagnósticos de mercado e ferramentas de validação.\n* **Habilidades Socioemocionais:**\n  * Desenvolver iniciativa, criatividade e protagonismo empreendedor na busca por inovações.\n* **Objetivos de Aprendizagem:**\n  * Classificar casos práticos de inovação e atitude empreendedora nas empresas e na sociedade.\n  * Mapear problemas complexos por meio da construção de Mapas Mentais (como o caso do iFood).\n  * Avaliar o potencial de ideias de negócio utilizando gráficos perceptuais e matrizes de diagnóstico.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Identificar características empreendedoras e modalidades de negócio.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Empreendedorismo por Oportunidade:\u003c/strong> Ocorre quando o indivíduo identifica uma necessidade ou lacuna no mercado e cria uma solução de forma proativa e planejada, sem a pressão de falta de renda imediata.\u003c/li>\n\u003cli>\u003cstrong>Empreendedorismo Corporativo (Intraempreendedorismo):\u003c/strong> Inovações e melhorias criadas por funcionários dentro de uma empresa já existente para otimizar processos e aumentar a competitividade.\u003c/li>\n\u003cli>\u003cstrong>Empreendedorismo Sustentável:\u003c/strong> Soluções que geram valor econômico e lucro mantendo a preservação ambiental e a redução de impactos ecológicos.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Estudante e Cronograma:\u003c/em> Criação de aplicativo para auxiliar colegas nos estudos sem necessidade financeira imediata configura \u003cstrong>Empreendedorismo por Oportunidade\u003c/strong>.\u003c/li>\n\u003cli>\u003cem>Inovação na Expedição:\u003c/em> Métodos novos criados por funcionários dentro da empresa configuram \u003cstrong>Empreendedorismo Corporativo\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Identificar modalidades de empreendedorismo (por oportunidade, por necessidade, corporativo, social, sustentável e  avaliação; mapas com formato mais amplo e equilibrado indicam maior viabilidade e impacto da proposta.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Preenchimento e Análise de Gráfico:\u003c/em> Diagnóstico individual de ideias empreendedoras e discussão coletiva para ajustes no modelo de negócio.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cul>\n\u003cli>\u003cstrong>Habilidades Técnicas:\u003c/strong>\u003cul>\n\u003cli>Identificar modalidades de empreendedorismo (por oportunidade, por necessidade, corporativo, social, sustentável e individual).\u003c/li>\n\u003cli>Analisar situações cotidianas para transformar problemas em oportunidades de negócio.\u003c/li>\n\u003cli>Desenvolver e avaliar ideias de negócio com base em diagnósticos de mercado e ferramentas de validação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Habilidades Socioemocionais:\u003c/strong>\u003cul>\n\u003cli>Desenvolver iniciativa, criatividade e protagonismo empreendedor na busca por inovações.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Objetivos de Aprendizagem:\u003c/strong>\u003cul>\n\u003cli>Classificar casos práticos de inovação e atitude empreendedora nas empresas e na sociedade.\u003c/li>\n\u003cli>Mapear problemas complexos por meio da construção de Mapas Mentais (como o caso do iFood).\u003c/li>\n\u003cli>Avaliar o potencial de ideias de negócio utilizando gráficos perceptuais e matrizes de diagnóstico.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","review":{"title":"Validação de ideias","goal":"Usar o mapa perceptual para analisar o potencial de uma proposta.","keywords":["Validação","Viabilidade","Impacto"],"points":["Validar uma ideia envolve analisar o público e a viabilidade da proposta.","No mapa perceptual, observe o alcance das respostas nos eixos de avaliação.","O material associa formatos mais amplos e equilibrados a maior viabilidade e impacto."]}}],"questions":[{"id":0,"title":"Questão 1 (Módulo 1 / Aula 1: Persona Profissional)","prompt":"Na escolha da linguagem a ser utilizada na comunicação corporativa, o que o profissional deve considerar principalmente para garantir a adequação da mensagem?","options":[{"letter":"A","text":"O tamanho do texto e o horário do envio.","html":"O tamanho do texto e o horário do envio."},{"letter":"B","text":"O cargo do remetente e o uso de termos estrangeiros.","html":"O cargo do remetente e o uso de termos estrangeiros."},{"letter":"C","text":"Contexto e público.","html":"Contexto e público."},{"letter":"D","text":"O canal tecnológico e o uso de figurinhas.","html":"O canal tecnológico e o uso de figurinhas."},{"letter":"E","text":"Apenas a opinião pessoal do emissor.","html":"Apenas a opinião pessoal do emissor."}],"correct":"C","explanation":"Adaptar a linguagem ao contexto e ao público é essencial para garantir clareza, adequação e profissionalismo nas interações no ambiente de trabalho.","original":"### Questão 1 (Módulo 1 / Aula 1: Persona Profissional)\n**Enunciado:** Na escolha da linguagem a ser utilizada na comunicação corporativa, o que o profissional deve considerar principalmente para garantir a adequação da mensagem? [7]\n\n* A) O tamanho do texto e o horário do envio.\n* B) O cargo do remetente e o uso de termos estrangeiros.\n* C) Contexto e público.\n* D) O canal tecnológico e o uso de figurinhas.\n* E) Apenas a opinião pessoal do emissor.\n\n* **Resposta Correta:** **C) Contexto e público.** [7]\n* **Justificativa Teórica Oficial:** Adaptar a linguagem ao contexto e ao público é essencial para garantir clareza, adequação e profissionalismo nas interações no ambiente de trabalho [7].","distractors":{"A":"O material define contexto e público como critérios centrais; tamanho e horário não substituem esses critérios.","B":"O cargo e termos estrangeiros não são apresentados como os critérios centrais de adequação.","D":"O canal e figurinhas não subs  de acordo com a empresa, o setor e a situação, influenciando diretamente a imagem profissional.","original":"### Questão 2 (Módulo 1 / Aula 2: Dress Code)\n**Enunciado:** O *dress code* no ambiente corporativo é um conceito rígido e imutável para todas as organizações? [15]\n\n* A) Sim, todas as empresas devem exigir traje social completo.\n* B) Pode variar conforme o contexto.\n* C) Não existe mais *dress code* nas empresas modernas.\n* D) Depende exclusivamente do gosto pessoal do funcionário.\n* E) Aplica-se apenas à diretoria.\n\n* **Resposta Correta:** **B) Pode variar conforme o contexto.** [15]\n* **Justificativa Teórica Oficial:** O *dress code* não é fixo. Ele varia de acordo com a empresa, o setor e a situação, influenciando diretamente a imagem profissional [15].","distractors":{"A":"A fonte afirma que o código de vestimenta varia por empresa, setor e situação.","C":"O material descreve o dress code e sua aplicação; não afirma que ele deixou de existir.","D":"A apresentação pessoal se relaciona ao contexto da empresa e às atividades, além do gosto pessoal.","E":"A fonte inclui setores operacionais e ambientes corporativos; não restringe o conceito à diretoria."},"evidence":"MÓDULO 1: ETIQUETA CORPORATIVA E IMAGEM · Aula 2: Dress Code e Semiótica da Imagem","evidenceLesson":1,"examTip":"O *dress code* não é fixo. Ele varia de acordo com a empresa, o setor e a situação, influenciando diretamente a imagem profissional.","promptHtml":"O \u003cem>dress code\u003c/em> no ambiente corporativo é um conceito rígido e imutável para todas as organizações?","explanationHtml":"\u003cp>O \u003cem>dress code\u003c/em> não é fixo. Ele varia de acordo com a empresa, o setor e a situação, influenciando diretamente a imagem profissional.\u003c/p>\n","examTipHtml":"\u003cp>O \u003cem>dress code\u003c/em> não é fixo. Ele varia de acordo com a empresa, o setor e a situação, influenciando diretamente a imagem profissional.\u003c/p>\n","review":{"topic":"Dress code","key":"O contexto define","takeaway":"O código de vestimenta muda conforme a empresa, o setor e a situação."}},{"id":2,"title":"Questão 3 (Módulo 2 / Aula 1: Formalidade na Linguagem)","prompt":"Por que é necessário realizar a adaptação constante da linguagem ao ambiente corporativo?","options":[{"letter":"A","text":"Para demonstrar superioridade acadêmica.","html":"Para demonstrar superioridade acadêmica."},{"letter":"B","text":"Para garantir compreensão e profissionalismo.","html":"Para garantir compreensão e profissionalismo."},{"letter":"C","text":"Para cumprir exigência jurídica sem impacto prático.","html":"Para cumprir exigência jurídica sem impacto prático."},{"letter":"D","text":"Para evitar conversar com outros setores.","html":"Para evitar conversar com outros setores."},{"letter":"E","text":"Para utilizar termos difíceis.","html":"Para utilizar termos difíceis."}],"correct":"B","explanation":"Adaptar a linguagem ao ambiente de trabalho é essencial para garantir que a mensagem seja compreendida de forma clara e que a comunicação transmita profissionalismo, fortalecendo a imagem do indivíduo.","original":"### Questão 3 (Módulo 2 / Aula 1: Formalidade na Linguagem)\n**Enunciado:** Por que é necessário realizar a adaptação constante da linguagem ao ambiente corporativo? [28]\n\n* A) Para demonstrar superioridade acadêmica.\n* B) Para garantir compreensão e profissionalismo.\n* C) Para cumprir exigência jurídica sem impacto prático.\n* D) Para evitar conversar com outros setores.\n* E) Para utilizar termos difíceis.\n\n* **Resposta Correta:** **B) Para garantir compreensão e profissionalismo.** [28]\n* **Justificativa Teórica Oficial:** Adaptar a linguagem ao ambiente de trabalho é essencial para garantir que a mensagem seja compreendida de forma clara e que a comunicação transmita profissionalismo, fortalecendo a imagem do indivíduo [28].","distractors":{"A":"A finalidade apresentada é clareza e profissionalismo, sem objetivo de superioridade.","C":"A justificativa do
