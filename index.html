 na Loja Tem Tudo:** A implementação de sinalizadores visuais Kanban nas gôndolas em conjunto com entregas fracionadas JIT por fornecedores eliminou o acúmulo de mercadorias paradas nos depósitos de fundo de loja e zerou as rupturas nos itens de curva A.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar conceitos e ferramentas de gestão de estoques para classificação e controle.\u003cbr>**Socioemocional:** Trabalho colaborativo e interdependência.\n\n**Objetivos de aprendizagem**\n\nIdentificar como os sistemas Kanban e Just in Time contribuem para a melhoria contínua do controle de estoques.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Sistema Kanban:\u003c/strong> Ferramenta visual de gestão de fluxo que utiliza cartões ou quadros sinalizadores para indicar exatamente o momento de sinalizar a reposição de materiais, evitando excessos e falhas de comunicação.\u003c/li>\n\u003cli>\u003cstrong>Sistema Just in Time (JIT):\u003c/strong> Filosofia de produção e gestão de materiais na qual a reposição e o fornecimento ocorrem estritamente no momento em que são necessários, alinhando o estoque à demanda real e eliminando estoques desnecessários.\u003c/li>\n\u003cli>\u003cstrong>Eliminação do Dilema de Estoque:\u003c/strong> Trata a ocorrência simultânea de excesso de determinados produtos e falta de outros, problema típico da falta de integração entre vendas, reposição e inventário.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Reestruturação Varejista na Loja Tem Tudo:\u003c/strong> A implementação de sinalizadores visuais Kanban nas gôndolas em conjunto com entregas fracionadas JIT por fornecedores eliminou o acúmulo de mercadorias paradas nos depósitos de fundo de loja e zerou as rupturas nos itens de curva A.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar conceitos e ferramentas de gestão de estoques para classificação e controle.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Trabalho colaborativo e interdependência.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Identificar como os sistemas Kanban e Just in Time contribuem para a melhoria contínua do controle de estoques.\u003c/p>\n","review":{"title":"Kanban e Just in Time","goal":"Diferenciar a sinalização visual da reposição no momento necessário.","keywords":["Kanban","JIT","Demanda real"],"points":["Kanban usa cartões ou quadros para sinalizar a necessidade de reposição.","Just in Time alinha o fornecimento ao momento em que o material é necessário.","A integração entre vendas, reposição e inventário ajuda a evitar excesso de alguns itens e falta de outros."]}},{"id":6,"module":0,"title":"Aula 7: Acuracidade de Estoques e Auditoria (LOGANO1C2B3S16A4)","moduleTitle":"Inventário e acuracidade","body":"* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\n* **Conceitos Chave & Teoria:**\n  - **Conceito de Acuracidade de Estoque:** Indicador percentual que mede a exatidão e a confiabilidade do estoque. Representa o grau de correspondência entre os dados registrados no sistema de informação e a quantidade física real existente no armazém:\n    $$\text{Acuracidade (\\%)} = \\left( \frac{\text{Número de Itens sem Divergência}}{\text{Número Total de Itens Auditados}} \right) \times 100$$\n  - **Auditoria Interna de Estoques:** Processo independente e sistemático responsável por validar os resultados das contagens, verificar a conformidade dos procedimentos operacionais e diagnosticar falhas nos processos de registro.\n  - **Mecanismos Preventivos:** A combinação de contagem rotativa com Kanban e JIT reduz movimentações desnecessárias, diminui erros operacionais e mantém a acuracidade em níveis elevados de forma contínua.\n* **Aplicações Práticas & Exemplos:**\n  - **Estudo de Caso Gama Supply:** A empresa operava com acuracidade de 92% (abaixo da meta de 98%), gerando dados não confiáveis no ERP e falhas no atendimento. A solução adotada combinou inventário cíclico diário nos itens de alto giro, sinalização visual Kanban nas posições de armazenagem e auditorias quinzenais.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar conceitos e ferramentas da gestão de estoques para previsões e controle.\u003cbr>**Socioemocional:** Colaboração harmoniosa e responsabilidade coletiva.\n\n**Objetivos de aprendizagem**\n\nPropor ações de melhoria da acuracidade de estoques com base na contagem, auditoria e uso de sistemas, como Kanban e Just in Time.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Conceito de Acuracidade de Estoque:\u003c/strong> Indicador percentual que mede a exatidão e a confiabilidade do estoque. Representa o grau de correspondência entre os dados registrados no sistema de informação e a quantidade física real existente no armazém:\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"formula\">Acuracidade (%) = (Número de itens sem divergência ÷ Número total de itens auditados) × 100\u003c/div>\n\n\n\u003cul>\n\u003cli>\u003cstrong>Auditoria Interna de Estoques:\u003c/strong> Processo independente e sistemático responsável por validar os resultados das contagens, verificar a conformidade dos procedimentos operacionais e diagnosticar falhas nos processos de registro.\u003c/li>\n\u003cli>\u003cstrong>Mecanismos Preventivos:\u003c/strong> A combinação de contagem rotativa com Kanban e JIT reduz movimentações desnecessárias, diminui erros operacionais e mantém a acuracidade em níveis elevados de forma contínua.\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Estudo de Caso Gama Supply:\u003c/strong> A empresa operava com acuracidade de 92% (abaixo da meta de 98%), gerando dados não confiáveis no ERP e falhas no atendimento. A solução adotada combinou inventário cíclico diário nos itens de alto giro, sinalização visual Kanban nas posições de armazenagem e auditorias quinzenais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar conceitos e ferramentas da gestão de estoques para previsões e controle.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Colaboração harmoniosa e responsabilidade coletiva.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Propor ações de melhoria da acuracidade de estoques com base na contagem, auditoria e uso de sistemas, como Kanban e Just in Time.\u003c/p>\n","review":{"title":"Acuracidade e auditoria","goal":"Interpretar a confiabilidade do estoque e propor melhorias.","keywords":["Acuracidade","Auditoria","Confiabilidade"],"points":["Acuracidade (%) = itens sem divergência ÷ total de itens auditados × 100.","A auditoria verifica contagens, procedimentos e possíveis falhas de registro.","No caso Gama Supply, a situação é 92% para uma meta de 98%; as ações incluem contagem cíclica, Kanban e auditorias."]}},{"id":7,"module":1,"title":"Aula 8: Descrição Geral das Etapas do Processo Logístico (LOGANO1C2B3S17A1)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Identificar as principais etapas iniciais do processo logístico, relacionando registro, triagem e processamento ao controle de estoques.\n* **Conceitos Chave & Teoria:**\n  - **Visão Sistêmica do Processo Logístico:** A gestão de estoques não ocorre isolada, mas integrada a um fluxo de etapas encadeadas: Registro de Entrada $\rightarrow$ Triagem $\rightarrow$ Processamento $\rightarrow$ Armazenagem $\rightarrow$ Distribuição.\n  - **Importância do Registro e Triagem:** As falhas cometidas na entrada do material (como digitação errada ou falta de checagem de especificações) propagam-se por toda a cadeia, comprometendo a precisão dos estoques e os relatórios operacionais.\n* **Aplicações Práticas & Exemplos:**\n  - **Paralelo Pedagógico da Cadeia Crítica:** Análise do fluxo logístico hospitalar/transfusional, demonstrando que a triagem rigorosa e a identificação precisa na entrada garantem a rastreabilidade total do produto até a entrega ao cliente final.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Identificar as principais etapas iniciais do processo logístico, relacionando registro, triagem e processamento ao controle de estoques.\u003cbr>**Socioemocional:** Expressar opiniões, sentimentos e necessidades com confiança.\n\n**Objetivos de aprendizagem**\n\nExplorar como as estratégias de organização e o controle de estoques se entrelaçam com cada etapa logística.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Identificar as principais etapas iniciais do processo logístico, relacionando registro, triagem e processamento ao controle de estoques.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Visão Sistêmica do Processo Logístico:\u003c/strong> A gestão de estoques não ocorre isolada, mas integrada a um fluxo de etapas encadeadas: Registro de Entrada → Triagem → Processamento → Armazenagem → Distribuição.\u003c/li>\n\u003cli>\u003cstrong>Importância do Registro e Triagem:\u003c/strong> As falhas cometidas na entrada do material (como digitação errada ou falta de checagem de especificações) propagam-se por toda a cadeia, comprometendo a precisão dos estoques e os relatórios operacionais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Paralelo Pedagógico da Cadeia Crítica:\u003c/strong> Análise do fluxo logístico hospitalar/transfusional, demonstrando que a triagem rigorosa e a identificação precisa na entrada garantem a rastreabilidade total do produto até a entrega ao cliente final.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Identificar as principais etapas iniciais do processo logístico, relacionando registro, triagem e processamento ao controle de estoques.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Expressar opiniões, sentimentos e necessidades com confiança.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Explorar como as estratégias de organização e o controle de estoques se entrelaçam com cada etapa logística.\u003c/p>\n","review":{"title":"O fluxo logístico","goal":"Explicar por que um erro na entrada pode afetar toda a operação.","keywords":["Registro","Triagem","Integração"],"points":["O fluxo apresentado passa por registro, triagem, processamento, armazenagem e distribuição.","Erros de identificação ou registro na entrada se propagam pela cadeia.","Identificação precisa e triagem rigorosa favorecem a rastreabilidade."]}},{"id":8,"module":1,"title":"Aula 9: Etapas do Processo Logístico – Recebimento (LOGANO1C2B3S17A2)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Reconhecer as práticas logísticas de armazenagem, com foco na separação, organização e controle de estoques.\n* **Conceitos Chave & Teoria:**\n  - **Fases do Recebimento de Materiais:**\n    1. *Conferência Documental:* Validação da Nota Fiscal e do Pedido de Compra (verificação de quantidades, valores e especificações contratuais).\n    2. *Conferência Física (Cega ou Direta):* Inspeção quantitativa e qualitativa das mercadorias recebidas (verificação de avarias, embalagens e prazos de validade).\n    3. *Entrada Sistêmica:* Registro de entrada no sistema ERP/WMS para atualização imediata do saldo de estoque disponível.\n* **Aplicações Práticas & Exemplos:**\n  - **Recebimento e Separação de Cargas:** Procedimentos operacionais para identificação de avarias no momento do descarregamento da transportadora, prevenindo a entrada de itens defeituosos no estoque e acionando termos de recusa ou devolução.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Reconhecer as práticas logísticas de armazenagem, com foco na separação, organização e controle de estoques.\u003cbr>**Socioemocional:** Expressão confiante e colaboração.\n\n**Objetivos de aprendizagem**\n\nExplorar a integração entre estratégias de organização de estoques e o recebimento de materiais.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Reconhecer as práticas logísticas de armazenagem, com foco na separação, organização e controle de estoques.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Fases do Recebimento de Materiais:\u003c/strong>\u003col>\n\u003cli>\u003cem>Conferência Documental:\u003c/em> Validação da Nota Fiscal e do Pedido de Compra (verificação de quantidades, valores e especificações contratuais).\u003c/li>\n\u003cli>\u003cem>Conferência Física (Cega ou Direta):\u003c/em> Inspeção quantitativa e qualitativa das mercadorias recebidas (verificação de avarias, embalagens e prazos de validade).\u003c/li>\n\u003cli>\u003cem>Entrada Sistêmica:\u003c/em> Registro de entrada no sistema ERP/WMS para atualização imediata do saldo de estoque disponível.\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Recebimento e Separação de Cargas:\u003c/strong> Procedimentos operacionais para identificação de avarias no momento do descarregamento da transportadora, prevenindo a entrada de itens defeituosos no estoque e acionando termos de recusa ou devolução.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Reconhecer as práticas logísticas de armazenagem, com foco na separação, organização e controle de estoques.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Expressão confiante e colaboração.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Explorar a integração entre estratégias de organização de estoques e o recebimento de materiais.\u003c/p>\n","review":{"title":"Recebimento","goal":"Reconhecer as três conferências que preparam a entrada do material.","keywords":["Documentos","Conferência física","Registro"],"points":["Confira a nota fiscal e o pedido de compra: quantidades, valores e especificações.","Inspecione fisicamente quantidade, qualidade, embalagens, avarias e validade.","Registre a entrada no ERP ou WMS para atualizar o saldo de estoque."]}},{"id":9,"module":1,"title":"Aula 10: Etapas do Processo Logístico – Armazenagem (LOGANO1C2B3S17A3)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Descrever as etapas de distribuição no processo logístico, bem como as estratégias de entrega e acompanhamento ao cliente final.\n* **Conceitos Chave & Teoria:**\n  - **Práticas de Armazenagem e Organização:**\n    - *Endereçamento Logístico:* Código único atribuído a cada posição no armazém (Rua, Bloco, Módulo, Nível) para rápida localização.\n    - *Preservação e Acondicionamento:* Garantir temperatura, iluminação, umidade e estruturas físicas (porta-paletes, prateleiras) adequadas a cada tipo de material.\n    - *Otimização de Espaço:* Utilização de racionalização vertical e disposição condizente com a rotatividade do item.\n* **Aplicações Práticas & Exemplos:**\n  - **Disposição Estratégica:** Alocação de produtos de alta movimentação mais próximos às docas de expedição e áreas de movimentação central, reduzindo o tempo de deslocamento das equipes.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Descrever as etapas de distribuição e estratégias de acompanhamento.\u003cbr>**Socioemocional:** Expressão confiante e posicionamento crítico.\n\n**Objetivos de aprendizagem**\n\nExplorar o papel da armazenagem e organização no fluxo produtivo e logístico.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Descrever as etapas de distribuição no processo logístico, bem como as estratégias de entrega e acompanhamento ao cliente final.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Práticas de Armazenagem e Organização:\u003c/strong>\u003cul>\n\u003cli>\u003cem>Endereçamento Logístico:\u003c/em> Código único atribuído a cada posição no armazém (Rua, Bloco, Módulo, Nível) para rápida localização.\u003c/li>\n\u003cli>\u003cem>Preservação e Acondicionamento:\u003c/em> Garantir temperatura, iluminação, umidade e estruturas físicas (porta-paletes, prateleiras) adequadas a cada tipo de material.\u003c/li>\n\u003cli>\u003cem>Otimização de Espaço:\u003c/em> Utilização de racionalização vertical e disposição condizente com a rotatividade do item.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Disposição Estratégica:\u003c/strong> Alocação de produtos de alta movimentação mais próximos às docas de expedição e áreas de movimentação central, reduzindo o tempo de deslocamento das equipes.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Descrever as etapas de distribuição e estratégias de acompanhamento.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Expressão confiante e posicionamento crítico.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Explorar o papel da armazenagem e organização no fluxo produtivo e logístico.\u003c/p>\n","review":{"title":"Armazenagem","goal":"Relacionar endereço, conservação e disposição à localização dos itens.","keywords":["Endereçamento","Conservação","Espaço"],"points":["O endereço logístico identifica a posição por rua, bloco, módulo e nível.","Condições e estruturas adequadas preservam os materiais.","Itens de alta movimentação próximos das áreas de expedição reduzem deslocamentos."]}},{"id":10,"module":1,"title":"Aula 11: Etapas do Processo Logístico – Distribuição (LOGANO1C2B3S17A4)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Integrar as diferentes etapas logísticas, compreendendo o fluxo completo desde o recebimento até a entrega final.\n* **Conceitos Chave & Teoria:**\n  - **Fluxo Integrado da Cadeia Logística (End-to-End):** Conexão harmônica entre Recebimento $\rightarrow$ Armazenagem $\rightarrow$ Separação (*Picking*) $\rightarrow$ Embalagem (*Packing*) $\rightarrow$ Expedição e Distribuição.\n  - **Rastreabilidade e Acompanhamento:** Monitoramento do pedido e das entregas ao cliente final para assegurar cumprimento do prazo (*OTIF - On Time In Full*) e manutenção da confiabilidade do serviço.\n* **Aplicações Práticas & Exemplos:**\n  - **Operações de Expedição e Entrega:** Estratégias de roterização e monitoramento de entregas diretas ao consumidor, conectando informações do estoque físico diretamente com a logística de transporte.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Integrar as diferentes etapas logísticas, compreendendo o fluxo completo desde o recebimento até a entrega final.\u003cbr>**Socioemocional:** Colaboração e visão sistêmica.\n\n**Objetivos de aprendizagem**\n\nCompreender o fluxo completo da cadeia logística e a entrega ao cliente final.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Integrar as diferentes etapas logísticas, compreendendo o fluxo completo desde o recebimento até a entrega final.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Fluxo Integrado da Cadeia Logística (End-to-End):\u003c/strong> Conexão harmônica entre Recebimento → Armazenagem → Separação (\u003cem>Picking\u003c/em>) → Embalagem (\u003cem>Packing\u003c/em>) → Expedição e Distribuição.\u003c/li>\n\u003cli>\u003cstrong>Rastreabilidade e Acompanhamento:\u003c/strong> Monitoramento do pedido e das entregas ao cliente final para assegurar cumprimento do prazo (\u003cem>OTIF - On Time In Full\u003c/em>) e manutenção da confiabilidade do serviço.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Operações de Expedição e Entrega:\u003c/strong> Estratégias de roterização e monitoramento de entregas diretas ao consumidor, conectando informações do estoque físico diretamente com a logística de transporte.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Integrar as diferentes etapas logísticas, compreendendo o fluxo completo desde o recebimento até a entrega final.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Colaboração e visão sistêmica.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Compreender o fluxo completo da cadeia logística e a entrega ao cliente final.\u003c/p>\n","review":{"title":"Distribuição","goal":"Conectar a separação do pedido à entrega e ao acompanhamento.","keywords":["Picking","Packing","Rastreabilidade"],"points":["O fluxo integra recebimento, armazenagem, separação, embalagem, expedição e distribuição.","Picking é separação; packing é embalagem.","O acompanhamento do pedido ajuda a assegurar prazo e confiabilidade da entrega."]}},{"id":11,"module":1,"title":"Aula 12: Organização de Estoques – Classificação, Inventário e Categorias (LOGANO1C2B3S18A1)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Controlar níveis de estoque, identificar produtos com baixa rotatividade e aplicar práticas de organização.\n* **Conceitos Chave & Teoria:**\n  - **Pilares Básicos da Organização de Estoques:**\n    1. *Classificação dos Produtos:* Agrupamento dos itens segundo características físicas, operacionais ou valor.\n    2. *Categorização Física:* Criação de zonas e identificações visuais no armazém para acelerar a separação e localização de pedidos.\n    3. *Inventário Periódico:* Conferência sistemática do estoque físico em prazos estabelecidos para alinhamento contínuo com o sistema.\n  - **Impactos da Desorganização:** Gera erros na separação de pedidos, atrasos no envio, contagens divergentes e perda de produtividade operacional.\n* **Aplicações Práticas & Exemplos:**\n  - **Estudo de Caso Centro de Distribuição LogMais:** O CD enfrentava graves atrasos e erros de envio de pedidos. A auditoria diagnosticou falta de critérios de organização, ausência de categorização de SKUs e inexistência de inventários periódicos. A implementação da padronização e categorização física reduziu bruscamente os tempos de separação.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Organizar estoques por meio de classificação, categorização e inventários periódicos.\u003cbr>**Socioemocional:** Colaboração, pensamento crítico e responsabilidade na tomada de decisões.\n\n**Objetivos de aprendizagem**\n\nIdentificar problemas de desorganização no estoque e aplicar práticas básicas de classificação, categorização física e inventário periódico.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Controlar níveis de estoque, identificar produtos com baixa rotatividade e aplicar práticas de organização.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Pilares Básicos da Organização de Estoques:\u003c/strong>\u003col>\n\u003cli>\u003cem>Classificação dos Produtos:\u003c/em> Agrupamento dos itens segundo características físicas, operacionais ou valor.\u003c/li>\n\u003cli>\u003cem>Categorização Física:\u003c/em> Criação de zonas e identificações visuais no armazém para acelerar a separação e localização de pedidos.\u003c/li>\n\u003cli>\u003cem>Inventário Periódico:\u003c/em> Conferência sistemática do estoque físico em prazos estabelecidos para alinhamento contínuo com o sistema.\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>Impactos da Desorganização:\u003c/strong> Gera erros na separação de pedidos, atrasos no envio, contagens divergentes e perda de produtividade operacional.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Estudo de Caso Centro de Distribuição LogMais:\u003c/strong> O CD enfrentava graves atrasos e erros de envio de pedidos. A auditoria diagnosticou falta de critérios de organização, ausência de categorização de SKUs e inexistência de inventários periódicos. A implementação da padronização e categorização física reduziu bruscamente os tempos de separação.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Organizar estoques por meio de classificação, categorização e inventários periódicos.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Colaboração, pensamento crítico e responsabilidade na tomada de decisões.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Identificar problemas de desorganização no estoque e aplicar práticas básicas de classificação, categorização física e inventário periódico.\u003c/p>\n","review":{"title":"Organizar para encontrar","goal":"Propor ações para reduzir erros e atrasos na separação.","keywords":["Classificar","Categorizar","Inventariar"],"points":["Classifique os produtos por características, uso ou valor.","Crie categorias e identificações físicas para facilitar a localização.","Faça inventários periódicos para conferir quantidades e alinhar físico e sistema."]}},{"id":12,"module":1,"title":"Aula 13: Giro de Estoque, Entradas e Saídas e Necessidade do Público (LOGANO1C2B3S18A2)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Aplicar estratégias de controle de entradas e saídas e utilizar o giro de estoque como ferramenta para decisões operacionais.\n* **Conceitos Chave & Teoria:**\n  - **Giro de Estoque (Rotatividade):** Indicador que mede quantas vezes o estoque se renova durante um determinado período de tempo.\n  - **Controle Rigoroso de Entradas e Saídas:** Registro diário e disciplinado de toda e qualquer movimentação de material no estoque, fundamental para evitar rupturas e perdas não identificadas.\n  - **Decisões Baseadas no Consumo do Público:** O planejamento de compras e o nível de abastecimento devem ser guiados pelo histórico e perfil real de demanda do cliente.\n  - **Cuidados Prévios ao Inventário:** Antes de iniciar qualquer contagem física, deve-se:\n    - Definir o momento adequado (preferencialmente com a operação paralisada ou em período de menor movimento).\n    - Padronizar ferramentas de coleta (leitores de código de barras, coletores e softwares apropriados).\n    - Organizar previamente as áreas, identificando e arrumando todos os setores.\n* **Aplicações Práticas & Exemplos:**\n  - **Gestão em Supermercados:** O acompanhamento contínuo do giro de produtos perecíveis orienta os pedidos de compra para evitar vencimentos na prateleira e garantir disponibilidade constante dos itens essenciais.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Controlar os níveis de estoque, identificar produtos com baixa rotatividade e gerenciar prazos de vencimento e métodos para reposição de materiais.\u003cbr>**Socioemocional:** Demonstrar responsabilidade e proatividade na organização e controle de estoques, colaborando de forma respeitosa e crítica.\n\n**Objetivos de aprendizagem**\n\nAplicar estratégias de controle de entradas e saídas e utilizar o giro de estoque como ferramenta para decisões operacionais.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar estratégias de controle de entradas e saídas e utilizar o giro de estoque como ferramenta para decisões operacionais.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Giro de Estoque (Rotatividade):\u003c/strong> Indicador que mede quantas vezes o estoque se renova durante um determinado período de tempo.\u003c/li>\n\u003cli>\u003cstrong>Controle Rigoroso de Entradas e Saídas:\u003c/strong> Registro diário e disciplinado de toda e qualquer movimentação de material no estoque, fundamental para evitar rupturas e perdas não identificadas.\u003c/li>\n\u003cli>\u003cstrong>Decisões Baseadas no Consumo do Público:\u003c/strong> O planejamento de compras e o nível de abastecimento devem ser guiados pelo histórico e perfil real de demanda do cliente.\u003c/li>\n\u003cli>\u003cstrong>Cuidados Prévios ao Inventário:\u003c/strong> Antes de iniciar qualquer contagem física, deve-se:\u003cul>\n\u003cli>Definir o momento adequado (preferencialmente com a operação paralisada ou em período de menor movimento).\u003c/li>\n\u003cli>Padronizar ferramentas de coleta (leitores de código de barras, coletores e softwares apropriados).\u003c/li>\n\u003cli>Organizar previamente as áreas, identificando e arrumando todos os setores.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Gestão em Supermercados:\u003c/strong> O acompanhamento contínuo do giro de produtos perecíveis orienta os pedidos de compra para evitar vencimentos na prateleira e garantir disponibilidade constante dos itens essenciais.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Controlar os níveis de estoque, identificar produtos com baixa rotatividade e gerenciar prazos de vencimento e métodos para reposição de materiais.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Demonstrar responsabilidade e proatividade na organização e controle de estoques, colaborando de forma respeitosa e crítica.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Aplicar estratégias de controle de entradas e saídas e utilizar o giro de estoque como ferramenta para decisões operacionais.\u003c/p>\n","review":{"title":"Giro e movimentação","goal":"Usar entradas, saídas e consumo para orientar o abastecimento.","keywords":["Giro","Entradas e saídas","Demanda"],"points":["Giro indica quantas vezes o estoque se renova no período.","Registre cada movimentação para evitar rupturas e perdas não identificadas.","Antes da contagem, escolha o momento, organize o espaço e padronize ferramentas e procedimentos."]}},{"id":13,"module":1,"title":"Aula 14: Relação com Fornecedores, Capacitação e Gestão do Espaço (LOGANO1C2B3S18A3)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Propor ações para melhorar a organização dos estoques, considerando espaço físico, relacionamento com fornecedores e capacitação da equipe.\n* **Conceitos Chave & Teoria:**\n  - **Integração com Fornecedores:** O fluxo de estoques inicia-se antes da chegada da mercadoria. Parcerias estratégicas e alinhamento de prazos de entrega (*lead time*) evitam atrasos, rupturas e custos de frete emergencial.\n  - **Treinamento de Colaboradores:** Processos bem organizados dependem do preparo da equipe. A capacitação contínua padroniza procedimentos operacionais e elimina erros de registro e manuseio.\n  - **Avaliação do Espaço Físico (Layout):** A distribuição espacial das estruturas e corredores influencia a produtividade, a segurança do trabalhador e a preservação das mercadorias.\n* **Aplicações Práticas & Exemplos:**\n  - **Reorganização de Armazéns Logísticos:** Reestruturação do layout com alocação estratégica de produtos de alta demanda perto do picking, aliada à capacitação dos operadores em coletores de dados e reuniões periódicas de alinhamento com fornecedores.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Controlar os níveis de estoque, identificar produtos de baixa rotatividade e gerenciar prazos e métodos de reposição.\u003cbr>**Socioemocional:** Responsabilidade, proatividade e colaboração respeitosa e crítica.\n\n**Objetivos de aprendizagem**\n\nPropor ações para melhorar a organização dos estoques, considerando espaço físico, relacionamento com fornecedores e capacitação da equipe.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Propor ações para melhorar a organização dos estoques, considerando espaço físico, relacionamento com fornecedores e capacitação da equipe.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Integração com Fornecedores:\u003c/strong> O fluxo de estoques inicia-se antes da chegada da mercadoria. Parcerias estratégicas e alinhamento de prazos de entrega (\u003cem>lead time\u003c/em>) evitam atrasos, rupturas e custos de frete emergencial.\u003c/li>\n\u003cli>\u003cstrong>Treinamento de Colaboradores:\u003c/strong> Processos bem organizados dependem do preparo da equipe. A capacitação contínua padroniza procedimentos operacionais e elimina erros de registro e manuseio.\u003c/li>\n\u003cli>\u003cstrong>Avaliação do Espaço Físico (Layout):\u003c/strong> A distribuição espacial das estruturas e corredores influencia a produtividade, a segurança do trabalhador e a preservação das mercadorias.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Reorganização de Armazéns Logísticos:\u003c/strong> Reestruturação do layout com alocação estratégica de produtos de alta demanda perto do picking, aliada à capacitação dos operadores em coletores de dados e reuniões periódicas de alinhamento com fornecedores.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Controlar os níveis de estoque, identificar produtos de baixa rotatividade e gerenciar prazos e métodos de reposição.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Responsabilidade, proatividade e colaboração respeitosa e crítica.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Propor ações para melhorar a organização dos estoques, considerando espaço físico, relacionamento com fornecedores e capacitação da equipe.\u003c/p>\n","review":{"title":"Pessoas, espaço e fornecedores","goal":"Propor melhorias nas três dimensões que apoiam a organização do estoque.","keywords":["Fornecedores","Capacitação","Layout"],"points":["Alinhe prazos e rotinas de comunicação com os fornecedores.","Treine a equipe para padronizar registros e manuseio.","Organize estruturas e corredores considerando produtividade, segurança e preservação."]}},{"id":14,"module":1,"title":"Aula 15: Sazonalidade, Automação, Níveis de Estoque e Análise de Vendas (LOGANO1C2B3S18A4)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Analisar fatores que influenciam o controle de estoques, como sazonalidade, automatização e níveis mínimos e máximos.\n* **Conceitos Chave & Teoria:**\n  - **Sazonalidade da Demanda:** Variações previsíveis no consumo em decorrência de datas comemorativas, clima ou estações do ano (ex: chocolates na Páscoa, artigos escolares em janeiro, condicionadores de ar e bebidas no Verão).\n  - **Sistemas de Identificação Automatizada:** Tecnologias como Código de Barras, QR Code e RFID (*Radio-Frequency Identification* / Identificação por Radiofrequência) aceleram a leitura, reduzem falhas humanas e permitem rastreamento em tempo real.\n  - **Dimensionamento por Níveis Mínimos e Máximos:** Estabelecimento de patamares para equilibrar disponibilidade e custo financeiro.\n  - **Análise dos Produtos Mais e Menos Vendidos:** Permite reorganizar o layout físico, planejar promoções e substituir SKUs sem giro.\n* **Aplicações Práticas & Exemplos:**\n  - **Aplicações na Automação Comercial:** Uso de leitores RFID no varejo e atacado para realizar inventários de centenas de itens por minuto via radiofrequência sem necessidade de visada direta caixa a caixa.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Controlar os níveis de estoque, identificar produtos com baixa rotatividade e gerenciar prazos de vencimento.\u003cbr>**Socioemocional:** Demonstrar responsabilidade, proatividade e postura profissional crítica em equipe.\n\n**Objetivos de aprendizagem**\n\nAnalisar fatores que influenciam o controle de estoques, como sazonalidade, automatização e níveis mínimos e máximos.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Analisar fatores que influenciam o controle de estoques, como sazonalidade, automatização e níveis mínimos e máximos.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Sazonalidade da Demanda:\u003c/strong> Variações previsíveis no consumo em decorrência de datas comemorativas, clima ou estações do ano (ex: chocolates na Páscoa, artigos escolares em janeiro, condicionadores de ar e bebidas no Verão).\u003c/li>\n\u003cli>\u003cstrong>Sistemas de Identificação Automatizada:\u003c/strong> Tecnologias como Código de Barras, QR Code e RFID (\u003cem>Radio-Frequency Identification\u003c/em> / Identificação por Radiofrequência) aceleram a leitura, reduzem falhas humanas e permitem rastreamento em tempo real.\u003c/li>\n\u003cli>\u003cstrong>Dimensionamento por Níveis Mínimos e Máximos:\u003c/strong> Estabelecimento de patamares para equilibrar disponibilidade e custo financeiro.\u003c/li>\n\u003cli>\u003cstrong>Análise dos Produtos Mais e Menos Vendidos:\u003c/strong> Permite reorganizar o layout físico, planejar promoções e substituir SKUs sem giro.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Aplicações na Automação Comercial:\u003c/strong> Uso de leitores RFID no varejo e atacado para realizar inventários de centenas de itens por minuto via radiofrequência sem necessidade de visada direta caixa a caixa.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Controlar os níveis de estoque, identificar produtos com baixa rotatividade e gerenciar prazos de vencimento.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Demonstrar responsabilidade, proatividade e postura profissional crítica em equipe.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Analisar fatores que influenciam o controle de estoques, como sazonalidade, automatização e níveis mínimos e máximos.\u003c/p>\n","review":{"title":"Sazonalidade e automação","goal":"Reconhecer variações de demanda e como a tecnologia apoia o controle.","keywords":["Sazonalidade","Identificação","Níveis de estoque"],"points":["Datas, clima e estações podem gerar variações previsíveis no consumo.","Código de barras, QR Code e RFID ajudam na identificação e no rastreamento.","A análise de vendas e dos níveis mínimos e máximos apoia compras e organização."]}},{"id":15,"module":1,"title":"Aula 16: Previsão de Demanda na Prática (LOGANO1C2B3S19A1)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Aplicar as boas práticas na gestão de estoques por meio do uso de metodologias de previsão de demanda e da definição do uso de parâmetros de monitoramento e tecnologias.\n* **Conceitos Chave & Teoria:**\n  - **Previsão de Demanda:** Utilização de dados históricos de vendas e consumo para projetar a necessidade futura de produtos acabados, insumos e matérias-primas.\n  - **Dimensionamento de Insumos:** Cálculo e planejamento das quantidades de materiais necessárias para atender à produção ou às vendas projetadas, evitando excesso de capital imobilizado ou paradas de linha por falta de suprimentos.\n* **Aplicações Práticas & Exemplos:**\n  - **Exercício Prático de Previsão:** Projeção da necessidade de matérias-primas para o trimestre com base na média móvel das vendas dos últimos meses, ajustando o plano de compras da indústria logístico-produtiva.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar as boas práticas na gestão de estoques por meio do uso de metodologias de previsão de demanda e parâmetros de monitoramento.\u003cbr>**Socioemocional:** Colaborar com os outros de forma harmoniosa e reconhecer a interdependência.\n\n**Objetivos de aprendizagem**\n\nCalcular a previsão de vendas e dimensionar os insumos necessários em situações práticas.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar as boas práticas na gestão de estoques por meio do uso de metodologias de previsão de demanda e da definição do uso de parâmetros de monitoramento e tecnologias.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Previsão de Demanda:\u003c/strong> Utilização de dados históricos de vendas e consumo para projetar a necessidade futura de produtos acabados, insumos e matérias-primas.\u003c/li>\n\u003cli>\u003cstrong>Dimensionamento de Insumos:\u003c/strong> Cálculo e planejamento das quantidades de materiais necessárias para atender à produção ou às vendas projetadas, evitando excesso de capital imobilizado ou paradas de linha por falta de suprimentos.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Exercício Prático de Previsão:\u003c/strong> Projeção da necessidade de matérias-primas para o trimestre com base na média móvel das vendas dos últimos meses, ajustando o plano de compras da indústria logístico-produtiva.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar as boas práticas na gestão de estoques por meio do uso de metodologias de previsão de demanda e parâmetros de monitoramento.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Colaborar com os outros de forma harmoniosa e reconhecer a interdependência.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Calcular a previsão de vendas e dimensionar os insumos necessários em situações práticas.\u003c/p>\n","review":{"title":"Previsão de demanda","goal":"Relacionar o histórico de consumo à necessidade futura de materiais.","keywords":["Histórico","Previsão","Insumos"],"points":["Use dados de vendas e consumo para projetar necessidades futuras.","Dimensionar insumos é planejar as quantidades para atender a produção ou as vendas previstas.","O material cita média móvel de vendas para ajustar a necessidade e o plano de compras."]}},{"id":16,"module":1,"title":"Aula 17: Parâmetros de Controle de Estoque – Mínimo, Ressuprimento e Máximo (LOGANO1C2B3S19A2)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Aplicar as boas práticas na gestão de estoques por meio da definição e uso de parâmetros de monitoramento e tecnologias.\n* **Conceitos Chave & Teoria:**\n  - **Estoque Mínimo ($E_{min}$ ou Estoque de Segurança):** Quantidade mínima de segurança mantida para cobrir eventuais atrasos na entrega pelo fornecedor ou picos inesperados de demanda:\n    $$E_{min} = \text{Consumo Diário Média} \times \text{Dias de Margem de Segurança}$$\n  - **Ponto de Pedido ($PP$ ou Nível de Ressuprimento):** Nível do estoque físico que, ao ser atingido, determina a emissão imediata de um novo pedido de compra:\n    $$PP = (\text{Consumo Diário} \times \text{Tempo de Ressuprimento / Lead Time em Dias}) + E_{min}$$\n  - **Estoque Máximo ($E_{max}$):** Limite máximo de material que a empresa pode ou deve manter estocado (restringido por espaço físico ou capacidade financeira):\n    $$E_{max} = E_{min} + \text{Lote de Compra ($Q$)}$$\n* **Aplicações Práticas & Exemplos:**\n  - **Cálculo de Ressuprimento Industrial:** Uma empresa com consumo diário de 50 unidades, tempo de entrega de 10 dias e estoque de segurança de 200 unidades terá seu Ponto de Pedido disparado exatamente quando o saldo atingir $PP = (50 \times 10) + 200 = 700$ unidades.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar boas práticas de gestão de estoques e parâmetros de monitoramento.\u003cbr>**Socioemocional:** Trabalho em equipe e colaboração.\n\n**Objetivos de aprendizagem**\n\nDefinir e calcular estoque mínimo, nível de ressuprimento (ponto de pedido) e estoque máximo.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar as boas práticas na gestão de estoques por meio da definição e uso de parâmetros de monitoramento e tecnologias.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Estoque Mínimo (E\u003csub>min\u003c/sub> ou Estoque de Segurança):\u003c/strong> Quantidade mínima de segurança mantida para cobrir eventuais atrasos na entrega pelo fornecedor ou picos inesperados de demanda:\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"formula\">E\u003csub>min\u003c/sub> = Consumo diário médio × Dias de margem de segurança\u003c/div>\n\n\n\u003cul>\n\u003cli>\u003cstrong>Ponto de Pedido (PP ou Nível de Ressuprimento):\u003c/strong> Nível do estoque físico que, ao ser atingido, determina a emissão imediata de um novo pedido de compra:\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"formula\">PP = (Consumo diário × Tempo de ressuprimento / lead time em dias) + E\u003csub>min\u003c/sub>\u003c/div>\n\n\n\u003cul>\n\u003cli>\u003cstrong>Estoque Máximo (E\u003csub>max\u003c/sub>):\u003c/strong> Limite máximo de material que a empresa pode ou deve manter estocado (restringido por espaço físico ou capacidade financeira):\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"formula\">E\u003csub>max\u003c/sub> = E\u003csub>min\u003c/sub> + Lote de compra (Q)\u003c/div>\n\n\n\u003cul>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Cálculo de Ressuprimento Industrial:\u003c/strong> Uma empresa com consumo diário de 50 unidades, tempo de entrega de 10 dias e estoque de segurança de 200 unidades terá seu Ponto de Pedido disparado exatamente quando o saldo atingir PP = (50 × 10) + 200 = 700 unidades.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar boas práticas de gestão de estoques e parâmetros de monitoramento.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Trabalho em equipe e colaboração.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Definir e calcular estoque mínimo, nível de ressuprimento (ponto de pedido) e estoque máximo.\u003c/p>\n","review":{"title":"Mínimo, pedido e máximo","goal":"Distinguir os parâmetros e calcular o ponto de pedido do exemplo.","keywords":["Estoque mínimo","Ponto de pedido","Estoque máximo"],"points":["Mínimo = consumo diário médio × dias de margem de segurança.","Ponto de pedido = consumo diário × lead time + estoque mínimo. No exemplo: 50 × 10 + 200 = 700 unidades.","Máximo = estoque mínimo + lote de compra."]}},{"id":17,"module":1,"title":"Aula 18: Giro de Estoque e Classificação ABC Aplicada ao Inventário (LOGANO1C2B3S19A3)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Aplicar os conhecimentos sobre giro de estoque e classificação ABC de modo a ajustar estoques com base nos resultados.\n* **Conceitos Chave & Teoria:**\n  - **Giro de Estoque:** Métrica que indica a rotatividade dos materiais no armazém:\n    $$\text{Giro de Estoque} = \frac{\text{Consumo Total no Período (ou Vendas)}}{\text{Estoque Médio no Período}}$$\n  - **Classificação ABC (Curva de Pareto):**\n    - *Classe A:* Representa aproximadamente 80% do valor financeiro acumulado e 20% do total de itens. Exige controle extremamente rígido, relatórios diários e inventários cíclicos frequentes.\n    - *Classe B:* Representa cerca de 15% do valor financeiro e 30% dos itens. Exige controle e contagens intermediárias.\n    - *Classe C:* Representa cerca de 5% do valor financeiro e 50% dos itens. Controle e acompanhamento simplificados.\n* **Aplicações Práticas & Exemplos:**\n  - **Priorização do Inventário Cíclico:** Itens classificados na Categoria A passam por contagens cíclicas semanais; itens C são contados em intervalos trimestrais ou semestrais, otimizando o esforço das equipes logísticas.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar boas práticas através de monitoramento de parâmetros e tecnologias.\u003cbr>**Socioemocional:** Colaboração harmoniosa e análise crítica conjunta.\n\n**Objetivos de aprendizagem**\n\nAplicar os conhecimentos sobre giro de estoque e classificação ABC de modo a ajustar estoques com base nos resultados.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Aplicar os conhecimentos sobre giro de estoque e classificação ABC de modo a ajustar estoques com base nos resultados.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Giro de Estoque:\u003c/strong> Métrica que indica a rotatividade dos materiais no armazém:\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"formula\">Giro de estoque = Consumo total no período (ou vendas) ÷ Estoque médio no período\u003c/div>\n\n\n\u003cul>\n\u003cli>\u003cstrong>Classificação ABC (Curva de Pareto):\u003c/strong>\u003cul>\n\u003cli>\u003cem>Classe A:\u003c/em> Representa aproximadamente 80% do valor financeiro acumulado e 20% do total de itens. Exige controle extremamente rígido, relatórios diários e inventários cíclicos frequentes.\u003c/li>\n\u003cli>\u003cem>Classe B:\u003c/em> Representa cerca de 15% do valor financeiro e 30% dos itens. Exige controle e contagens intermediárias.\u003c/li>\n\u003cli>\u003cem>Classe C:\u003c/em> Representa cerca de 5% do valor financeiro e 50% dos itens. Controle e acompanhamento simplificados.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cul>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Priorização do Inventário Cíclico:\u003c/strong> Itens classificados na Categoria A passam por contagens cíclicas semanais; itens C são contados em intervalos trimestrais ou semestrais, otimizando o esforço das equipes logísticas.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar boas práticas através de monitoramento de parâmetros e tecnologias.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Colaboração harmoniosa e análise crítica conjunta.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Aplicar os conhecimentos sobre giro de estoque e classificação ABC de modo a ajustar estoques com base nos resultados.\u003c/p>\n","review":{"title":"Giro e curva ABC","goal":"Relacionar valor e rotatividade à intensidade do controle.","keywords":["Rotatividade","Valor financeiro","Prioridade"],"points":["Giro = consumo total ou vendas no período ÷ estoque médio no período.","No material, A concentra cerca de 80% do valor; B, 15%; C, 5%.","Itens A exigem controle rígido e contagens frequentes; itens C têm acompanhamento simplificado."]}},{"id":18,"module":1,"title":"Aula 19: Sistemas e Tecnologias Aplicados ao Controle de Estoques (LOGANO1C2B3S19A4)","moduleTitle":"Fluxos, organização e planejamento","body":"* **Habilidade(s) Relacionada(s):** Identificar tecnologias aplicáveis à gestão de estoques e aplicar as boas práticas operacionais.\n* **Conceitos Chave & Teoria:**\n  - **Sistemas de Gestão Integrada:**\n    - *ERP (Enterprise Resource Planning):* Sistema integrado de gestão empresarial que conecta estoque, compras, vendas e contabilidade.\n    - *WMS (Warehouse Management System):* Sistema focado no gerenciamento operacional do armazém (endereçamento, recebimento, picking e expedição).\n  - **Consolidação do Guia de 6 Passos para Boa Gestão de Estoques:** Síntese prática do processo operacional:\n    1. *Classificar, cadastrar e manter o estoque organizado.*\n    2. *Fazer o inventário periodicamente.*\n    3. *Criar categorias para facilitar a identificação visual.*\n    4. *Girar o estoque de modo estratégico.*\n    5. *Demarcar e registrar todas as entradas e saídas.*\n    6. *Analisar continuamente a necessidade do público.*\n* **Aplicações Práticas & Exemplos:**\n  - **Automação Integrada:** Uso de coletores de dados móveis integrados via WMS/ERP para atualização instantânea de inventários físicos nas empresas de grande porte.","skills":"**Habilidades técnicas e socioemocionais**\n\n**Técnica:** Aplicar boas práticas na gestão de estoques usando metodologias e tecnologias.\u003cbr>**Socioemocional:** Colaboração e trabalho interdisciplinar.\n\n**Objetivos de aprendizagem**\n\nIdentificar tecnologias aplicáveis à gestão de estoques (ERP, WMS, RFID, código de barras) e consolidar as boas práticas operacionais.","html":"\u003cul>\n\u003cli>\u003cstrong>Habilidade(s) Relacionada(s):\u003c/strong> Identificar tecnologias aplicáveis à gestão de estoques e aplicar as boas práticas operacionais.\u003c/li>\n\u003cli>\u003cstrong>Conceitos Chave &amp; Teoria:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Sistemas de Gestão Integrada:\u003c/strong>\u003cul>\n\u003cli>\u003cem>ERP (Enterprise Resource Planning):\u003c/em> Sistema integrado de gestão empresarial que conecta estoque, compras, vendas e contabilidade.\u003c/li>\n\u003cli>\u003cem>WMS (Warehouse Management System):\u003c/em> Sistema focado no gerenciamento operacional do armazém (endereçamento, recebimento, picking e expedição).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Consolidação do Guia de 6 Passos para Boa Gestão de Estoques:\u003c/strong> Síntese prática do processo operacional:\u003col>\n\u003cli>\u003cem>Classificar, cadastrar e manter o estoque organizado.\u003c/em>\u003c/li>\n\u003cli>\u003cem>Fazer o inventário periodicamente.\u003c/em>\u003c/li>\n\u003cli>\u003cem>Criar categorias para facilitar a identificação visual.\u003c/em>\u003c/li>\n\u003cli>\u003cem>Girar o estoque de modo estratégico.\u003c/em>\u003c/li>\n\u003cli>\u003cem>Demarcar e registrar todas as entradas e saídas.\u003c/em>\u003c/li>\n\u003cli>\u003cem>Analisar continuamente a necessidade do público.\u003c/em>\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Aplicações Práticas &amp; Exemplos:\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>Automação Integrada:\u003c/strong> Uso de coletores de dados móveis integrados via WMS/ERP para atualização instantânea de inventários físicos nas empresas de grande porte.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","skillsHtml":"\u003cp>\u003cstrong>Habilidades técnicas e socioemocionais\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Técnica:\u003c/strong> Aplicar boas práticas na gestão de estoques usando metodologias e tecnologias.\u003cbr>\u003cstrong>Socioemocional:\u003c/strong> Colaboração e trabalho interdisciplinar.\u003c/p>\n\u003cp>\u003cstrong>Objetivos de aprendizagem\u003c/strong>\u003c/p>\n\u003cp>Identificar tecnologias aplicáveis à gestão de estoques (ERP, WMS, RFID, código de barras) e consolidar as boas práticas operacionais.\u003c/p>\n","review":{"title":"ERP, WMS e boas práticas","goal":"Distinguir o sistema integrado da gestão operacional do armazém.","keywords":["ERP","WMS","Integração"],"points":["ERP integra áreas como estoque, compras, vendas e contabilidade.","WMS gerencia operações do armazém, como endereço, recebimento, picking e expedição.","Boas práticas incluem organização, inventário, categorias, giro, registros e análise da necessidade do público."]}}],"questions":[{"id":0,"title":"Questão 1 (Aula 1 - LOGANO1C2B3S15A1)","prompt":"A Loja Alfa enfrenta problemas por realizar contagens esporádicas e sem critérios claros. Qual prática poderia ajudar a priorizar o controle dos itens mais relevantes do estoque?","options":[{"letter":"A","text":"Registrar apenas os produtos vendidos.","html":"Registrar apenas os produtos vendidos."},{"letter":"B","text":"Contar todos os produtos apenas uma vez por ano.","html":"Contar todos os produtos apenas uma vez por ano."},{"letter":"C","text":"Classificar os itens por valor e impacto (ABC).","html":"Classificar os itens por valor e impacto (ABC)."},{"letter":"D","text":"Realizar contagens diárias de todo o acervo sem distinção.","html":"Realizar contagens diárias de todo o acervo sem distinção."},{"letter":"E","text":"Eliminar o registro do sistema e confiar apenas no estoque físico.","html":"Eliminar o registro do sistema e confiar apenas no estoque físico."}],"correct":"C","explanation":"A Classificação ABC categoriza os produtos de acordo com seu valor financeiro e impacto operacional (itens A representam maior valor e exigem controle prioritário). Essa prática permite direcionar a atenção da gestão para os itens mais críticos, em vez de despender esforço uniforme em produtos de baixa relevância.","original":"### Questão 1 (Aula 1 - LOGANO1C2B3S15A1)\n* **Enunciado:** A Loja Alfa enfrenta problemas por realizar contagens esporádicas e sem critérios claros. Qual prática poderia ajudar a priorizar o controle dos itens mais relevantes do estoque? [4]\n* **Alternativas:**\n  - (A) Registrar apenas os produtos vendidos. [4]\n  - (B) Contar todos os produtos apenas uma vez por ano. [4]\n  - (C) Classificar os itens por valor e impacto (ABC). [4]\n  - (D) Realizar contagens diárias de todo o acervo sem distinção.\n  - (E) Eliminar o registro do sistema e confiar apenas no estoque físico.\n* **Resposta Correta:** **(C) Classificar os itens por valor e impacto (ABC).** [4]\n* **Justificativa Teórica:** A Classificação ABC categoriza os produtos de acordo com seu valor financeiro e impacto operacional (itens A representam maior valor e exigem controle prioritário). Essa prática permite direcionar a atenção da gestão para os itens mais críticos, em vez de despender esforço uniforme em produtos de baixa relevância [4, 5].","distractors":{"A":"Registrar apenas vendas não aplica o critério de valor e impacto solicitado.","B":"Contagem anual igual para todos não prioriza os itens mais relevantes.","D":"Contar todo o acervo sem distinção mantém esforço uniforme, sem a priorização ABC.","E":"O objetivo é comparar e alinhar físico e sistema, preservando informações confiáveis."},"evidence":"Inventário e acuracidade · Aula 1: Importância, Objetivos e Obrigações na Gestão de Estoques (LOGANO1C2B3S15A1)","evidenceLesson":0,"examTip":"A Classificação ABC categoriza os produtos de acordo com seu valor financeiro e impacto operacional (itens A representam maior valor e exigem controle prioritário). Essa prática permite direcionar a atenção da gestão para os itens mais críticos, em vez de despender esforço uniforme em produtos de baixa relevância.","promptHtml":"A Loja Alfa enfrenta problemas por realizar contagens esporádicas e sem critérios claros. Qual prática poderia ajudar a priorizar o controle dos itens mais relevantes do estoque?","explanationHtml":"\u003cp>A Classificação ABC categoriza os produtos de acordo com seu valor financeiro e impacto operacional (itens A representam maior valor e exigem controle prioritário). Essa prática permite direcionar a atenção da gestão para os itens mais críticos, em vez de despender esforço uniforme em produtos de baixa relevância.\u003c/p>\n","examTipHtml":"\u003cp>A Classificação ABC categoriza os produtos de acordo com seu valor financeiro e impacto operacional (itens A representam maior valor e exigem controle prioritário). Essa prática permite direcionar a atenção da gestão para os itens mais críticos, em vez de despender esforço uniforme em produtos de baixa relevância.\u003c/p>\n","review":{"topic":"Prioridade pela curva ABC","key":"Valor + impacto","takeaway":"A curva ABC direciona o controle para os itens mais te para alto giro/complexidade, periódica/manual para unidades menores ou amostragem para grande porte), garantindo redução de custos operacionais e dados confiáveis no sistema.\u003c/p>\n","examTipHtml":"\u003cp>Não existe um método único superior para todas as situações. Cada loja e perfil de produto exige a escolha do método mais condizente (permanente para alto giro/complexidade, periódica/manual para unidades menores ou amostragem para grande porte), garantindo redução de custos operacionais e dados confiáveis no sistema.\u003c/p>\n","review":{"topic":"Escolha do método de contagem","key":"Método adequado à operação","takeaway":"Porte, giro e complexidade orientam a escolha do método de contagem."}},{"id":2,"title":"Questão 3 (Aula 3 - LOGANO1C2B3S15A3)","prompt":"A Tem Tudo precisa realizar o inventário para fins legais, mas quer evitar longas paralisações nas lojas maiores. Qual estratégia de contagem é mais adequada para conciliar controle, tempo e impacto operacional?","options":[{"letter":"A","text":"Aplicar somente contagem por amostragem.","html":"Aplicar somente contagem por amostragem."},{"letter":"B","text":"Evitar a contagem e não ajustar os dados.","html":"Evitar a contagem e não ajustar os dados."},{"letter":"C","text":"Realizar apenas contagem manual diária.","html":"Realizar apenas contagem manual diária."},{"letter":"D","text":"Planejar a contagem geral em etapas.","html":"Planejar a contagem geral em etapas."},{"letter":"E","text":"Cancelar o balanço anual obrigatório.","html":"Cancelar o balanço anual obrigatório."}],"correct":"D","explanation":"O planejamento antecipado da contagem geral por etapas (setores ou cronogramas fracionados) possibilita organizar equipes, cumprir a exigência legal do balanço e reduzir o impacto no atendimento ao cliente, evitando o fechamento prolongado das lojas.","original":"### Questão 3 (Aula 3 - LOGANO1C2B3S15A3)\n* **Enunciado:** A Tem Tudo precisa realizar o inventário para fins legais, mas quer evitar longas paralisações nas lojas maiores. Qual estratégia de contagem é mais adequada para conciliar controle, tempo e impacto operacional? [23]\n* **Alternativas:**\n  - (A) Aplicar somente contagem por amostragem. [23]\n  - (B) Evitar a contagem e não ajustar os dados. [23]\n  - (C) Realizar apenas contagem manual diária. [23]\n  - (D) Planejar a contagem geral em etapas. [23]\n  - (E) Cancelar o balanço anual obrigatório.\n* **Resposta Correta:** **(D) Planejar a contagem geral em etapas.** [23, 28]\n* **Justificativa Teórica:** O planejamento antecipado da contagem geral por etapas (setores ou cronogramas fracionados) possibilita organizar equipes, cumprir a exigência legal do balanço e reduzir o impacto no atendimento ao cliente, evitando o fechamento prolongado das lojas [28].","distractors":{"A":"Amostragem isolada não é a estratégia indicada pelo gabarito para a contagem geral do caso.","B":"Evitar contagem e ajuste contraria o objetivo de manter registros confiáveis.","C":"Contagem manual diária, por si só, não corresponde ao planejamento geral por etapas solicitado.","E":"O caso pede realizar o inventário; cancelá-lo não resolve o problema apresentado."},"evidence":"Inventário e acuracidade · Aula 3: Planejamento para a Contagem de Inventário (LOGANO1C2B3S15A3)","evidenceLesson":2,"examTip":"O planejamento antecipado da contagem geral por etapas (setores ou cronogramas fracionados) possibilita organizar equipes, cumprir a exigência legal do balanço e reduzir o impacto no atendimento ao cliente, evitando o fechamento prolongado das lojas.","promptHtml":"A Tem Tudo precisa realizar o inventário para fins legais, mas quer evitar longas paralisações nas lojas maiores. Qual estratégia de contagem é mais adequada para conciliar controle, tempo e impacto operacional?","explanationHtml":"\u003cp>O planejamento antecipado da contagem geral por etapas (setores ou cronogramas fracionados) possibilita organizar equipes, cumprir a exigência legal do balanço e reduzir o impacto o de estoques de uma grande rede de varejo, a equipe encontrou diferenças entre as quantidades apuradas nas prateleiras e as registradas no sistema. Qual é o objetivo fundamental de realizar o inventário e analisar essas discrepâncias? [47]\n* **Alternativas:**\n  - (A) Alterar os preços de venda dos produtos imediatamente.\n  - (B) Garantir dados confiáveis no sistema de gestão. [47]\n  - (C) Aumentar o limite máximo de armazenamento do depósito.\n  - (D) Justificar o descarte imediato de itens sem inspeção.\n  - (E) Reduzir o número de colaboradores responsáveis pelo almoxarifado.\n* **Resposta Correta:** **(B) Garantir dados confiáveis no sistema de gestão.** [47]\n* **Justificativa Teórica:** O inventário busca alinhar o estoque físico com os registros do sistema, permitindo identificar falhas de registro, erros de contagem, perdas ou avarias, assegurando que as decisões de compra e vendas sejam tomadas com base em informações precisas [42, 47].","distractors":{"A":"A análise trata da confiabilidade dos registros, não da alteração imediata de preços.","C":"Aumentar a capacidade do depósito não corrige divergências entre físico e sistema.","D":"A fonte orienta recontagem e investigação; não descarte imediato sem inspeção.","E":"Redução de equipe não é o objetivo fundamental indicado para o inventário."},"evidence":"Inventário e acuracidade · Aula 5: Contagem de Inventário – Periodicidade e Análise de Discrepâncias (LOGANO1C2B3S16A1)","evidenceLesson":4,"examTip":"O inventário busca alinhar o estoque físico com os registros do sistema, permitindo identificar falhas de registro, erros de contagem, perdas ou avarias, assegurando que as decisões de compra e vendas sejam tomadas com base em informações precisas.","promptHtml":"Durante o processo de verificação de estoques de uma grande rede de varejo, a equipe encontrou diferenças entre as quantidades apuradas nas prateleiras e as registradas no sistema. Qual é o objetivo fundamental de realizar o inventário e analisar essas discrepâncias?","explanationHtml":"\u003cp>O inventário busca alinhar o estoque físico com os registros do sistema, permitindo identificar falhas de registro, erros de contagem, perdas ou avarias, assegurando que as decisões de compra e vendas sejam tomadas com base em informações precisas.\u003c/p>\n","examTipHtml":"\u003cp>O inventário busca alinhar o estoque físico com os registros do sistema, permitindo identificar falhas de registro, erros de contagem, perdas ou avarias, assegurando que as decisões de compra e vendas sejam tomadas com base em informações precisas.\u003c/p>\n","review":{"topic":"Objetivo do inventário","key":"Dados confiáveis","takeaway":"Comparar físico e sistema e investigar diferenças melhora a informação usada nas decisões."}},{"id":4,"title":"Questão 5 (Aula 1 - LOGANO1C2B3S18A1)","prompt":"Um centro de distribuição enfrenta sérios problemas operacionais, com falhas frequentes na localização de produtos e atrasos no envio de pedidos aos clientes. Qual medida de organização é indispensável para restabelecer a confiabilidade das informações e a eficiência das operações?","options":[{"letter":"A","text":"Aumentar a velocidade das empilhadeiras.","html":"Aumentar a velocidade das empilhadeiras."},{"letter":"B","text":"Fazer inventário periódico.","html":"Fazer inventário periódico."},{"letter":"C","text":"Terceirizar toda a frota de entrega.","html":"Terceirizar toda a frota de entrega."},{"letter":"D","text":"Armazenar produtos sem identificação para economizar espaço.","html":"Armazenar produtos sem identificação para economizar espaço."},{"letter":"E","text":"Realizar compras emergenciais sem checar o saldo existente.","html":"Realizar compras emergenciais sem checar o saldo existente."}],"correct":"B","explanation":"A realização de inventários periódicos permite conferir as quantidades reais existentes no armazém, corrigir divergências com o sistema, reordenar a localização física dos itens e diminuir drasticamente os erros de separação e envio.","original":"### Questão 5 (Aula 1 - LOGANO1C2B3S18A1)\n* **Enunciado:** Um centro de distribuição enfrenta sérios problemas operacionais, com falhas frequentes na localização de produtos e atrasos no envio de pedidos aos clientes. Qual medida de organização é indispensável para restabelecer a confiabilidade das informações e a eficiência das operações? [81]\n* **Alternativas:**\n  - (A) Aumentar a velocidade das empilhadeiras.\n  - (B) Fazer inventário periódico. [81]\n  - (C) Terceirizar toda a frota de entrega.\n  - (D) Armazenar produtos sem identificação para economizar espaço.\n  - (E) Realizar compras emergenciais sem checar o saldo existente.\n* **Resposta Correta:** **(B) Fazer inventário periódico.** [81]\n* **Justificativa Teórica:** A realização de inventários periódicos permite conferir as quantidades reais existentes no armazém, corrigir divergências com o sistema, reordenar a localização física dos itens e diminuir drasticamente os erros de separação e envio [81, 85].","distractors":{"A":"Acelerar equipamentos não substitui a conferência dos saldos e a organização.","C":"Terceirização de frota não resolve o controle interno descrito no caso.","D":"O material recomenda categorias, identificação e endereçamento dos produtos.","E":"Compras sem checar o saldo não sustentam decisões baseadas em informações confiáveis."},"evidence":"Fluxos, organização e planejamento · Aula 12: Organização de Estoques – Classificação, Inventário e Categorias (LOGANO1C2B3S18A1)","evidenceLesson":11,"examTip":"A realização de inventários periódicos permite conferir as quantidades reais existentes no armazém, corrigir divergências com o sistema, reordenar a localização física dos itens e diminuir drasticamente os erros de separação e envio.","promptHtml":"Um centro de distribuição enfrenta sérios problemas operacionais, com falhas frequentes na localização de produtos e atrasos no envio de pedidos aos clientes. Qual medida de organização é indispensável para restabelecer a confiabilidade das informações e a eficiência das operações?","explanationHtml":"\u003cp>A realização de inventários periódicos permite conferir as quantidades reais existentes no armazém, corrigir divergências com o sistema, reordenar a localização física dos itens e diminuir drasticamente os erros de separação e envio.\u003c/p>\n","examTipHtml":"\u003cp>A realização de inventários periódicos permite conferir as quantidades reais existentes no armazém, corrigir divergências com o sistema, reordenar a localização física dos itens e diminuir drasticamente os erros de separação e envio.\u003c/p>\n","review":{"topic":"Organização e inventário","key":"Inventário periódico","takeaway":"Conferências regulares ajudam a corrigir divergências e a reduzir erros de separação e envio."}}],"activities":[{"id":0,"title":"1. Atividade de Fixação \"Todo Mundo Escreve\" – Classificação e Organização de Estoques (Aula 1 - LOGANO1C2B3S15A1)","prompt":"* **Instruções Completas:**\n  1. Classifique os grupos de produtos fornecidos nas categorias A, B ou C, justificando com base no valor financeiro e no impacto que causam na operação do estoque.\n  2. Proponha uma organização dos produtos por tipo ou finalidade e indique as vantagens desse agrupamento para a gestão de estoques na empresa.","expectation":"- Os estudantes devem aplicar a curva ABC colocando itens de maior valor/criticidade na Classe A, valor intermediário na Classe B e itens de menor valor na Classe C.\n  - A organização proposta deve agrupar produtos por semelhança ou área de uso, justificando que isso reduz o tempo de busca, previne contaminações ou avarias e facilita a contagem durante os inventários.","original":"### 1. Atividade de Fixação \"Todo Mundo Escreve\" – Classificação e Organização de Estoques (Aula 1 - LOGANO1C2B3S15A1)\n* **Instruções Completas:**\n  1. Classifique os grupos de produtos fornecidos nas categorias A, B ou C, justificando com base no valor financeiro e no impacto que causam na operação do estoque [5].\n  2. Proponha uma organização dos produtos por tipo ou finalidade e indique as vantagens desse agrupamento para a gestão de estoques na empresa [5].\n* **Sugestão de Resposta / Gabarito Oficial:**\n  - Os estudantes devem aplicar a curva ABC colocando itens de maior valor/criticidade na Classe A, valor intermediário na Classe B e itens de menor valor na Classe C [5].\n  - A organização proposta deve agrupar produtos por semelhança ou área de uso, justificando que isso reduz o tempo de busca, previne contaminações ou avarias e facilita a contagem durante os inventários [5, 8].","gap":"A lista de produtos citada não consta no anexo. Explique os critérios de classificação e de agrupamento, sem inventar SKUs ou valores. Registre quais dados seriam necessários para classificar produtos específicos.","adapt":"Registre sua produção individual neste caderno. Atenda a todos os itens e explique por que suas decisões se apoiam nos conceitos estudados.","support":"","promptMd":"* **Instruções Completas:**\n  1. Classifique os grupos de produtos fornecidos nas categorias A, B ou C, justificando com base no valor financeiro e no impacto que causam na operação do estoque.\n  2. Proponha uma organização dos produtos por tipo ou finalidade e indique as vantagens desse agrupamento para a gestão de estoques na empresa.","promptHtml":"\u003cul>\n\u003cli>\u003cstrong>Instruções Completas:\u003c/strong>\u003col>\n\u003cli>Classifique os grupos de produtos fornecidos nas categorias A, B ou C, justificando com base no valor financeiro e no impacto que causam na operação do estoque.\u003c/li>\n\u003cli>Proponha uma organização dos produtos por tipo ou finalidade e indique as vantagens desse agrupamento para a gestão de estoques na empresa.\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n","expectationHtml":"\u003cul>\n\u003cli>Os estudantes devem aplicar a curva ABC colocando itens de maior valor/criticidade na Classe A, valor intermediário na Classe B e itens de menor valor na Classe C.\u003cul>\n\u003cli>A organização proposta deve agrupar produtos por semelhança ou área de uso, justificando que isso reduz o tempo de busca, previne contaminações ou avarias e facilita a contagem durante os inventários.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","supportHtml":""},{"id":1,"title":"2. Estudo de Caso Rede Tem Tudo – Métodos de Contagem (Aula 2 - LOGANO1C2B3S15A2)","prompt":"* **Instruções Completas:**\n  Em duplas, leiam a situação-problema da rede Tem Tudo (problemas de rupturas, excessos e divergências entre o estoque físico e o sistema em filiais de portes distintos) e respondam individualmente às questões:\n  1. *Considerando as operações e as demandas logísticas das lojas Tem Tudo, qual método de contagem de estoque você avalia ser mais eficiente: periódica ou permanente?*\n  2. *Considerando a estrutura operacional das lojas Tem Tudo sem acesso aos sistemas WMS e ERP, você sugere a implementação de uma contagem manual de todo o estoque ou uma abordagem amostral por departamento?*","expectation":"1. *Questão 1:* A contagem permanente é a mais eficiente para as lojas com maior volume de vendas e maior complexidade (como o setor de eletrônicos), pois permite atualização em tempo real e reduz rupturas. A contagem periódica pode ser mantida em unidades menores com menor giro.\n  2. *Questão 2:* Recomenda-se a contagem manual total para unidades menores ou setores muito críticos para garantir uma base precisa; para lojas de grande porte, recomenda-se a abordagem amostral por departamento para otimizar tempo e recursos.","original":"### 2. Estudo de Caso Rede Tem Tudo – Métodos de Contagem (Aula 2 - LOGANO1C2B3S15A2)\n* **Instruções Completas:**\n  Em duplas, leiam a situação-problema da rede Tem Tudo (problemas de rupturas, excessos e divergências entre o estoque físico e o sistema em filiais de portes distintos) e respondam individualmente às questões [17, 18]:\n  1. *Considerando as operações e as demandas logísticas das lojas Tem Tudo, qual método de contagem de estoque você avalia ser mais eficiente: periódica ou permanente?* [18]\n  2. *Considerando a estrutura operacional das lojas Tem Tudo sem acesso aos sistemas WMS e ERP, você sugere a implementação de uma contagem manual de todo o estoque ou uma abordagem amostral por departamento?* [18]\n* **Sugestão de Resposta / Gabarito Oficial:**\n  1. *Questão 1:* A contagem permanente é a mais eficiente para as lojas com maior volume de vendas e maior complexidade (como o setor de eletrônicos), pois permite atualização em tempo real e reduz rupturas [18]. A contagem periódica pode ser mantida em unidades menores com menor giro [18].\n  2. *Questão 2:* Recomenda-se a contagem manual total para unidades menores ou setores muito críticos para garantir uma base precisa; para lojas de grande porte, recomenda-se a abordagem amostral por departamento para otimizar tempo e recursos [18].","adapt":"Registre sua produção individual neste caderno. Atenda a todos os itens e explique por que suas decisões se apoiam nos conceitos estudados.","gap":"","support":"","promptMd":"* **Instruções Completas:**\n  Em duplas, leiam a situação-problema da rede Tem Tudo (problemas de rupturas, excessos e divergências entre o estoque físico e o sistema em filiais de portes distintos) e respondam individualmente às questões:\n  1. *Considerando as operações e as demandas logísticas das lojas Tem Tudo, qual método de contagem de estoque você avalia ser mais eficiente: periódica ou permanente?*\n  2. *Considerando a estrutura operacional das lojas Tem Tudo sem acesso aos sistemas WMS e ERP, você sugere a implementação de uma contagem manual de todo o estoque ou uma abordagem amostral por departamento?*","promptHtml":"\u003cul>\n\u003cli>\u003cstrong>Instruções Completas:\u003c/strong>\nEm duplas, leiam a situação-problema da rede Tem Tudo (problemas de rupturas, excessos e divergências entre o estoque físico e o sistema em filiais de portes distintos) e respondam ind
