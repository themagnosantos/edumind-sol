e apurada na contagem física*\n    7. *Discrepâncias (Diferença entre apurado vs. registrado no sistema)*\n    8. *Observações, Ações corretivas e Comentários*\n    9. *Identificação do Responsável, Assinatura e Data*\n* **Aplicações Práticas & Exemplos:**\n  - **Rede Tem Tudo:** Nas unidades de menor porte sem WMS, a equipe da seção de utilidades domésticas utiliza a contagem manual semanal [12]. No setor de eletrônicos (alto valor e giro elevado), utiliza-se o controle permanente para evitar vendas de produtos indisponíveis [16]. Nas lojas de grande porte, adota-se a contagem por amostragem para otimizar tempo e recursos [16, 18].\n\n---\n\n### Aula 3: Planejamento para a Contagem de Inventário (LOGANO1C2B3S15A3)\n\n* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e ferramentas da gestão de estoques para classificar, categorizar, calcular e efetuar previsões de demanda [21].\n* **Conceitos Chave & Teoria:**\n  - **Etapas do Planejamento de Inventário:** A execução da contagem exige uma preparação sequencial e estruturada [22, 28]:\n    1. *Planejamento Antecipado:* Definição clara dos objetivos, escopo, equipes de trabalho, recursos necessários, cronograma e tempos previstos [28].\n    2. *Comunicação Interna:* Informar previamente todos os setores envolvidos sobre datas, regras operacionais e orientações [22].\n    3. *Preparação do Local:* Organizar, arrumar e sinalizar o espaço físico do estoque para facilitar a identificação visual e a contagem dos produtos [22].\n    4. *Procedimentos de Contagem Física:* Executar a conferência física conforme o método escolhido (manual, coletor de dados ou por amostragem) [22].\n    5. *Análise de Divergências:* Comparar os dados apurados fisicamente com os saldos registrados no sistema e investigar as origens das diferenças [22].\n  - **Inventário Geral vs. Contagem Cíclica (Rotativa):**\n    - *Inventário Geral:* Envolve a contagem de todos os itens do acervo simultaneamente. É um processo longo e mais complexo, geralmente realizado no encerramento do exercício fiscal para balanço legal, exigindo grande mobilização de pessoal e, frequentemente, a paralisação das atividades [28].\n    - *Contagem Cíclica ou Rotativa:* Ocorre continuamente ao longo do ano, dividida em ciclos por setores, categorias de produtos ou curva ABC. Permite manter a precisão das informações sem interromper as vendas ou a operação [28].\n* **Aplicações Práticas & Exemplos:**\n  - **Estratégia na Rede Tem Tudo:** Para cumprir as obrigações fiscais sem fechar as grandes filiais por períodos prolongados, a rede divide o inventário geral em etapas planejadas e utiliza contagens cíclicas diárias nos produtos críticos de alto giro [23, 28, 31].\n\n---\n\n### Aula 4: Condução da Contagem – Passo a Passo (LOGANO1C2B3S15A4)\n\n* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda [34].\n* **Conceitos Chave & Teoria:**\n  - **Técnicas e Critérios Operacionais da Contagem Cíclica:** A contagem cíclica requer a definição de critérios de priorização para determinar a frequência de contagem [35, 37]:\n    1. *Classificação ABC:* Produtos da Classe A são contados com alta frequência (ex: semanal ou quinzenal); Classe B com frequência intermediária (mensal); Classe C em ciclos mais longos [37].\n    2. *Criticidade e Valor:* Itens de alto valor agregado (como eletrônicos) ou de alto risco de roubo/avaria exigem monitoramento constante [37].\n    3. *Localização e Categoria:* Divisão do armazém por corredores ou tipos de produtos (vestuário, perecíveis, utilidades) [37].\n  - **Benefícios da Contagem Cíclica:** Reduz rupturas em gôndolas, previne excesso de estoque armazenado e melhora o fluxo de ressuprimento entre filiais [35].\n* **Aplicações Práticas & Exemplos:**\n  - **Filial Araraquara (Rede Tem Tudo):** No planejamento do levantamento inicial da filial, a primeira medida estratégica é definir o escopo e os objetivos da contagem (definindo categorias, métodos e datas) [38]. Os postos-chave comunicados à alta gerência incluem nível real de estoque, principais divergências (físico vs. sistema), riscos de ruptura e necessidades de ajuste de processos [38].\n\n---\n\n### Aula 5: Contagem de Inventário – Periodicidade e Análise de Discrepâncias (LOGANO1C2B3S16A1)\n\n* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda [41].\n* **Conceitos Chave & Teoria:**\n  - **Identificação e Análise de Discrepâncias:** Sempre que forem identificadas divergências entre o estoque físico e os registros sistêmicos, o protocolo exige [42]:\n    1. *Confirmação:* Realizar uma recontagem física imediata para descartar erro de apuração.\n    2. *Investigação das Causas:* Identificar se a origem foi erro de contagem, falha de registro de entrada/saída, furto/perda, avaria ou obsolescência.\n    3. *Registro em Formulário:* Anotar as discrepâncias e os motivos observados em formulário padronizado.\n  - **Reconciliação de Estoque:** É o processo formal de ajuste dos saldos do sistema para igualá-los ao físico, exigindo autorização hierárquica e integração com o setor contábil [47].\n  - **Melhoria Contínua:** Propor ações corretivas e preventivas permanentes, como treinamento de equipes, uso de leitores de código de barras e automação [47].\n* **Aplicações Práticas & Exemplos:**\n  - **Setor de Supermercados:** A realização de inventários frequentes previne a divergência entre o sistema e a gôndola, garantindo a reposição ágil antes que ocorra a ruptura (falta de produto), protegendo o faturamento [46].\n\n---\n\n### Aula 6: Ferramentas Lean na Gestão de Estoques – Kanban e Just in Time (LOGANO1C2B3S16A2)\n\n* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda [51].\n* **Conceitos Chave & Teoria:**\n  - **Sistema Kanban:** Ferramenta visual de gestão de fluxo que utiliza cartões ou quadros sinalizadores para indicar exatamente o momento de sinalizar a reposição de materiais, evitando excessos e falhas de comunicação [51, 52].\n  - **Sistema Just in Time (JIT):** Filosofia de produção e gestão de materiais na qual a reposição e o fornecimento ocorrem estritamente no momento em que são necessários, alinhando o estoque à demanda real e eliminando estoques desnecessários [51, 52].\n  - **Eliminação do Dilema de Estoque:** Trata a ocorrência simultânea de excesso de determinados produtos e falta de outros, problema típico da falta de integração entre vendas, reposição e inventário [54].\n* **Aplicações Práticas & Exemplos:**\n  - **Reestruturação Varejista na Loja Tem Tudo:** A implementação de sinalizadores visuais Kanban nas gôndolas em conjunto com entregas fracionadas JIT por fornecedores eliminou o acúmulo de mercadorias paradas nos depósitos de fundo de loja e zerou as rupturas nos itens de curva A [52, 54].\n\n---\n\n### Aula 7: Acuracidade de Estoques e Auditoria (LOGANO1C2B3S16A4)\n\n* **Habilidade(s) Relacionada(s):** Aplicar os conceitos e as ferramentas da gestão de estoques em uma organização para classificar, categorizar, calcular e efetuar previsões de demanda [57].\n* **Conceitos Chave & Teoria:**\n  - **Conceito de Acuracidade de Estoque:** Indicador percentual que mede a exatidão e a confiabilidade do estoque. Representa o grau de correspondência entre os dados registrados no sistema de informação e a quantidade física real existente no armazém [58, 64]:\n    $$\text{Acuracidade (\\%)} = \\left( \frac{\text{Número de Itens sem Divergência}}{\text{Número Total de Itens Auditados}} \right) \times 100$$\n  - **Auditoria Interna de Estoques:** Processo independente e sistemático responsável por validar os resultados das contagens, verificar a conformidade dos procedimentos operacionais e diagnosticar falhas nos processos de registro [59, 63].\n  - **Mecanismos Preventivos:** A combinação de contagem rotativa com Kanban e JIT reduz movimentações desnecessárias, diminui erros operacionais e mantém a acuracidade em níveis elevados de forma contínua [59, 66].\n* **Aplicações Práticas & Exemplos:**\n  - **Estudo de Caso Gama Supply:** A empresa operava com acuracidade de 92% (abaixo da meta de 98%), gerando dados não confiáveis no ERP e falhas no atendimento [65]. A solução adotada combinou inventário cíclico diário nos itens de alto giro, sinalização visual Kanban nas posições de armazenagem e auditorias quinzenais [66].\n\n---\n\n### Aula 8: Descrição Geral das Etapas do Processo Logístico (LOGANO1C2B3S17A1)\n\n* **Habilidade(s) Relacionada(s):** Identificar as principais etapas iniciais do processo logístico, relacionando registro, triagem e processamento ao controle de estoques [69].\n* **Conceitos Chave & Teoria:**\n  - **Visão Sistêmica do Processo Logístico:** A gestão de estoques não ocorre isolada, mas integrada a um fluxo de etapas encadeadas: Registro de Entrada $\rightarrow$ Triagem $\rightarrow$ Processamento $\rightarrow$ Armazenagem $\rightarrow$ Distribuição [69].\n  - **Importância do Registro e Triagem:** As falhas cometidas na entrada do material (como digitação errada ou falta de checagem de especificações) propagam-se por toda a cadeia, comprometendo a precisão dos estoques e os relatórios operacionais [69].\n* **Aplicações Práticas & Exemplos:**\n  - **Paralelo Pedagógico da Cadeia Crítica:** Análise do fluxo logístico hospitalar/transfusional, demonstrando que a triagem rigorosa e a identificação precisa na entrada garantem a rastreabilidade total do produto até a entrega ao cliente final [69].\n\n---\n\n### Aula 9: Etapas do Processo Logístico – Recebimento (LOGANO1C2B3S17A2)\n\n* **Habilidade(s) Relacionada(s):** Reconhecer as práticas logísticas de armazenagem, com foco na separação, organização e controle de estoques [72].\n* **Conceitos Chave & Teoria:**\n  - **Fases do Recebimento de Materiais:**\n    1. *Conferência Documental:* Validação da Nota Fiscal e do Pedido de Compra (verificação de quantidades, valores e especificações contratuais) [72].\n    2. *Conferência Física (Cega ou Direta):* Inspeção quantitativa e qualitativa das mercadorias recebidas (verificação de avarias, embalagens e prazos de validade) [72].\n    3. *Entrada Sistêmica:* Registro de entrada no sistema ERP/WMS para atualização imediata do saldo de estoque disponível [72].\n* **Aplicações Práticas & Exemplos:**\n  - **Recebimento e Separação de Cargas:** Procedimentos operacionais para identificação de avarias no momento do descarregamento da transportadora, prevenindo a entrada de itens defeituosos no estoque e acionando termos de recusa ou devolução [72].\n\n---\n\n### Aula 10: Etapas do Processo Logístico – Armazenagem (LOGANO1C2B3S17A3)\n\n* **Habilidade(s) Relacionada(s):** Descrever as etapas de distribuição no processo logístico, bem como as estratégias de entrega e acompanhamento ao cliente final [74].\n* **Conceitos Chave & Teoria:**\n  - **Práticas de Armazenagem e Organização:**\n    - *Endereçamento Logístico:* Código único atribuído a cada posição no armazém (Rua, Bloco, Módulo, Nível) para rápida localização [74].\n    - *Preservação e Acondicionamento:* Garantir temperatura, iluminação, umidade e estruturas físicas (porta-paletes, prateleiras) adequadas a cada tipo de material [74].\n    - *Otimização de Espaço:* Utilização de racionalização vertical e disposição condizente com a rotatividade do item [74].\n* **Aplicações Práticas & Exemplos:**\n  - **Disposição Estratégica:** Alocação de produtos de alta movimentação mais próximos às docas de expedição e áreas de movimentação central, reduzindo o tempo de deslocamento das equipes [74].\n\n---\n\n### Aula 11: Etapas do Processo Logístico – Distribuição (LOGANO1C2B3S17A4)\n\n* **Habilidade(s) Relacionada(s):** Integrar as diferentes etapas logísticas, compreendendo o fluxo completo desde o recebimento até a entrega final [77].\n* **Conceitos Chave & Teoria:**\n  - **Fluxo Integrado da Cadeia Logística (End-to-End):** Conexão harmônica entre Recebimento $\rightarrow$ Armazenagem $\rightarrow$ Separação (*Picking*) $\rightarrow$ Embalagem (*Packing*) $\rightarrow$ Expedição e Distribuição [77].\n  - **Rastreabilidade e Acompanhamento:** Monitoramento do pedido e das entregas ao cliente final para assegurar cumprimento do prazo (*OTIF - On Time In Full*) e manutenção da confiabilidade do serviço [77].\n* **Aplicações Práticas & Exemplos:**\n  - **Operações de Expedição e Entrega:** Estratégias de roterização e monitoramento de entregas diretas ao consumidor, conectando informações do estoque físico diretamente com a logística de transporte [77].\n\n---\n\n### Aula 12: Organização de Estoques – Classificação, Inventário e Categorias (LOGANO1C2B3S18A1)\n\n* **Habilidade(s) Relacionada(s):** Controlar níveis de estoque, identificar produtos com baixa rotatividade e aplicar práticas de organização [79, 85].\n* **Conceitos Chave & Teoria:**\n  - **Pilares Básicos da Organização de Estoques:**\n    1. *Classificação dos Produtos:* Agrupamento dos itens segundo características físicas, operacionais ou valor [82, 85].\n    2. *Categorização Física:* Criação de zonas e identificações visuais no armazém para acelerar a separação e localização de pedidos [82, 85].\n    3. *Inventário Periódico:* Conferência sistemática do estoque físico em prazos estabelecidos para alinhamento contínuo com o sistema [81, 85].\n  - **Impactos da Desorganização:** Gera erros na separação de pedidos, atrasos no envio, contagens divergentes e perda de produtividade operacional [82, 85].\n* **Aplicações Práticas & Exemplos:**\n  - **Estudo de Caso Centro de Distribuição LogMais:** O CD enfrentava graves atrasos e erros de envio de pedidos. A auditoria diagnosticou falta de critérios de organização, ausência de categorização de SKUs e inexistência de inventários periódicos. A implementação da padronização e categorização física reduziu bruscamente os tempos de separação [83, 85].\n\n---\n\n### Aula 13: Giro de Estoque, Entradas e Saídas e Necessidade do Público (LOGANO1C2B3S18A2)\n\n* **Habilidade(s) Relacionada(s):** Aplicar estratégias de controle de entradas e saídas e utilizar o giro de estoque como ferramenta para decisões operacionais [88].\n* **Conceitos Chave & Teoria:**\n  - **Giro de Estoque (Rotatividade):** Indicador que mede quantas vezes o estoque se renova durante um determinado período de tempo [88, 90].\n  - **Controle Rigoroso de Entradas e Saídas:** Registro diário e disciplinado de toda e qualquer movimentação de material no estoque, fundamental para evitar rupturas e perdas não identificadas [90].\n  - **Decisões Baseadas no Consumo do Público:** O planejamento de compras e o nível de abastecimento devem ser guiados pelo histórico e perfil real de demanda do cliente [90].\n  - **Cuidados Prévios ao Inventário:** Antes de iniciar qualquer contagem física, deve-se [89, 93]:\n    - Definir o momento adequado (preferencialmente com a operação paralisada ou em período de menor movimento).\n    - Padronizar ferramentas de coleta (leitores de código de barras, coletores e softwares apropriados).\n    - Organizar previamente as áreas, identificando e arrumando todos os setores.\n* **Aplicações Práticas & Exemplos:**\n  - **Gestão em Supermercados:** O acompanhamento contínuo do giro de produtos perecíveis orienta os pedidos de compra para evitar vencimentos na prateleira e garantir disponibilidade constante dos itens essenciais [90, 93].\n\n---\n\n### Aula 14: Relação com Fornecedores, Capacitação e Gestão do Espaço (LOGANO1C2B3S18A3)\n\n* **Habilidade(s) Relacionada(s):** Propor ações para melhorar a organização dos estoques, considerando espaço físico, relacionamento com fornecedores e capacitação da equipe [98].\n* **Conceitos Chave & Teoria:**\n  - **Integração com Fornecedores:** O fluxo de estoques inicia-se antes da chegada da mercadoria. Parcerias estratégicas e alinhamento de prazos de entrega (*lead time*) evitam atrasos, rupturas e custos de frete emergencial [101, 102].\n  - **Treinamento de Colaboradores:** Processos bem organizados dependem do preparo da equipe. A capacitação contínua padroniza procedimentos operacionais e elimina erros de registro e manuseio [102].\n  - **Avaliação do Espaço Físico (Layout):** A distribuição espacial das estruturas e corredores influencia a produtividade, a segurança do trabalhador e a preservação das mercadorias [102].\n* **Aplicações Práticas & Exemplos:**\n  - **Reorganização de Armazéns Logísticos:** Reestruturação do layout com alocação estratégica de produtos de alta demanda perto do picking, aliada à capacitação dos operadores em coletores de dados e reuniões periódicas de alinhamento com fornecedores [102, 103].\n\n---\n\n### Aula 15: Sazonalidade, Automação, Níveis de Estoque e Análise de Vendas (LOGANO1C2B3S18A4)\n\n* **Habilidade(s) Relacionada(s):** Analisar fatores que influenciam o controle de estoques, como sazonalidade, automatização e níveis mínimos e máximos [106].\n* **Conceitos Chave & Teoria:**\n  - **Sazonalidade da Demanda:** Variações previsíveis no consumo em decorrência de datas comemorativas, clima ou estações do ano (ex: chocolates na Páscoa, artigos escolares em janeiro, condicionadores de ar e bebidas no Verão) [109].\n  - **Sistemas de Identificação Automatizada:** Tecnologias como Código de Barras, QR Code e RFID (*Radio-Frequency Identification* / Identificação por Radiofrequência) aceleram a leitura, reduzem falhas humanas e permitem rastreamento em tempo real [107, 109].\n  - **Dimensionamento por Níveis Mínimos e Máximos:** Estabelecimento de patamares para equilibrar disponibilidade e custo financeiro [109].\n  - **Análise dos Produtos Mais e Menos Vendidos:** Permite reorganizar o layout físico, planejar promoções e substituir SKUs sem giro [109].\n* **Aplicações Práticas & Exemplos:**\n  - **Aplicações na Automação Comercial:** Uso de leitores RFID no varejo e atacado para realizar inventários de centenas de itens por minuto via radiofrequência sem necessidade de visada direta caixa a caixa [107, 109].\n\n---\n\n### Aula 16: Previsão de Demanda na Prática (LOGANO1C2B3S19A1)\n\n* **Habilidade(s) Relacionada(s):** Aplicar as boas práticas na gestão de estoques por meio do uso de metodologias de previsão de demanda e da definição do uso de parâmetros de monitoramento e tecnologias [116].\n* **Conceitos Chave & Teoria:**\n  - **Previsão de Demanda:** Utilização de dados históricos de vendas e consumo para projetar a necessidade futura de produtos acabados, insumos e matérias-primas [116, 120].\n  - **Dimensionamento de Insumos:** Cálculo e planejamento das quantidades de materiais necessárias para atender à produção ou às vendas projetadas, evitando excesso de capital imobilizado ou paradas de linha por falta de suprimentos [116, 120].\n* **Aplicações Práticas & Exemplos:**\n  - **Exercício Prático de Previsão:** Projeção da necessidade de matérias-primas para o trimestre com base na média móvel das vendas dos últimos meses, ajustando o plano de compras da indústria logístico-produtiva [116, 120].\n\n---\n\n### Aula 17: Parâmetros de Controle de Estoque – Mínimo, Ressuprimento e Máximo (LOGANO1C2B3S19A2)\n\n* **Habilidade(s) Relacionada(s):** Aplicar as boas práticas na gestão de estoques por meio da definição e uso de parâmetros de monitoramento e tecnologias [118].\n* **Conceitos Chave & Teoria:**\n  - **Estoque Mínimo ($E_{min}$ ou Estoque de Segurança):** Quantidade mínima de segurança mantida para cobrir eventuais atrasos na entrega pelo fornecedor ou picos inesperados de demanda [118, 120]:\n    $$E_{min} = \text{Consumo Diário Média} \times \text{Dias de Margem de Segurança}$$\n  - **Ponto de Pedido ($PP$ ou Nível de Ressuprimento):** Nível do estoque físico que, ao ser atingido, determina a emissão imediata de um novo pedido de compra [118, 120]:\n    $$PP = (\text{Consumo Diário} \times \text{Tempo de Ressuprimento / Lead Time em Dias}) + E_{min}$$\n  - **Estoque Máximo ($E_{max}$):** Limite máximo de material que a empresa pode ou deve manter estocado (restringido por espaço físico ou capacidade financeira) [118, 120]:\n    $$E_{max} = E_{min} + \text{Lote de Compra ($Q$)}$$\n* **Aplicações Práticas & Exemplos:**\n  - **Cálculo de Ressuprimento Industrial:** Uma empresa com consumo diário de 50 unidades, tempo de entrega de 10 dias e estoque de segurança de 200 unidades terá seu Ponto de Pedido disparado exatamente quando o saldo atingir $PP = (50 \times 10) + 200 = 700$ unidades [120].\n\n---\n\n### Aula 18: Giro de Estoque e Classificação ABC Aplicada ao Inventário (LOGANO1C2B3S19A3)\n\n* **Habilidade(s) Relacionada(s):** Aplicar os conhecimentos sobre giro de estoque e classificação ABC de modo a ajustar estoques com base nos resultados [122].\n* **Conceitos Chave & Teoria:**\n  - **Giro de Estoque:** Métrica que indica a rotatividade dos materiais no armazém [124]:\n    $$\text{Giro de Estoque} = \frac{\text{Consumo Total no Período (ou Vendas)}}{\text{Estoque Médio no Período}}$$\n  - **Classificação ABC (Curva de Pareto):**\n    - *Classe A:* Representa aproximadamente 80% do valor financeiro acumulado e 20% do total de itens. Exige controle extremamente rígido, relatórios diários e inventários cíclicos frequentes [124, 125].\n    - *Classe B:* Representa cerca de 15% do valor financeiro e 30% dos itens. Exige controle e contagens intermediárias [124, 125].\n    - *Classe C:* Representa cerca de 5% do valor financeiro e 50% dos itens. Controle e acompanhamento simplificados [124, 125].\n* **Aplicações Práticas & Exemplos:**\n  - **Priorização do Inventário Cíclico:** Itens classificados na Categoria A passam por contagens cíclicas semanais; itens C são contados em intervalos trimestrais ou semestrais, otimizando o esforço das equipes logísticas [125].\n\n---\n\n### Aula 19: Sistemas e Tecnologias Aplicados ao Controle de Estoques (LOGANO1C2B3S19A4)\n\n* **Habilidade(s) Relacionada(s):** Identificar tecnologias aplicáveis à gestão de estoques e aplicar as boas práticas operacionais [127].\n* **Conceitos Chave & Teoria:**\n  - **Sistemas de Gestão Integrada:**\n    - *ERP (Enterprise Resource Planning):* Sistema integrado de gestão empresarial que conecta estoque, compras, vendas e contabilidade [65, 127].\n    - *WMS (Warehouse Management System):* Sistema focado no gerenciamento operacional do armazém (endereçamento, recebimento, picking e expedição) [3, 127].\n  - **Consolidação do Guia de 6 Passos para Boa Gestão de Estoques:** Síntese prática do processo operacional [129]:\n    1. *Classificar, cadastrar e manter o estoque organizado.*\n    2. *Fazer o inventário periodicamente.*\n    3. *Criar categorias para facilitar a identificação visual.*\n    4. *Girar o estoque de modo estratégico.*\n    5. *Demarcar e registrar todas as entradas e saídas.*\n    6. *Analisar continuamente a necessidade do público.*\n* **Aplicações Práticas & Exemplos:**\n  - **Automação Integrada:** Uso de coletores de dados móveis integrados via WMS/ERP para atualização instantânea de inventários físicos nas empresas de grande porte [127, 128].\n\n---\n\n## ✏️ ATIVIDADES E EXERCÍCIOS PRÁTICOS\n\n### 1. Atividade de Fixação \"Todo Mundo Escreve\" – Classificação e Organização de Estoques (Aula 1 - LOGANO1C2B3S15A1)\n* **Instruções Completas:**\n  1. Classifique os grupos de produtos fornecidos nas categorias A, B ou C, justificando com base no valor financeiro e no impacto que causam na operação do estoque [5].\n  2. Proponha uma organização dos produtos por tipo ou finalidade e indique as vantagens desse agrupamento para a gestão de estoques na empresa [5].\n* **Sugestão de Resposta / Gabarito Oficial:**\n  - Os estudantes devem aplicar a curva ABC colocando itens de maior valor/criticidade na Classe A, valor intermediário na Classe B e itens de menor valor na Classe C [5].\n  - A organização proposta deve agrupar produtos por semelhança ou área de uso, justificando que isso reduz o tempo de busca, previne contaminações ou avarias e facilita a contagem durante os inventários [5, 8].\n\n---\n\n### 2. Estudo de Caso Rede Tem Tudo – Métodos de Contagem (Aula 2 - LOGANO1C2B3S15A2)\n* **Instruções Completas:**\n  Em duplas, leiam a situação-problema da rede Tem Tudo (problemas de rupturas, excessos e divergências entre o estoque físico e o sistema em filiais de portes distintos) e respondam individualmente às questões [17, 18]:\n  1. *Considerando as operações e as demandas logísticas das lojas Tem Tudo, qual método de contagem de estoque você avalia ser mais eficiente: periódica ou permanente?* [18]\n  2. *Considerando a estrutura operacional das lojas Tem Tudo sem acesso aos sistemas WMS e ERP, você sugere a implementação de uma contagem manual de todo o estoque ou uma abordagem amostral por departamento?* [18]\n* **Sugestão de Resposta / Gabarito Oficial:**\n  1. *Questão 1:* A contagem permanente é a mais eficiente para as lojas com maior volume de vendas e maior complexidade (como o setor de eletrônicos), pois permite atualização em tempo real e reduz rupturas [18]. A contagem periódica pode ser mantida em unidades menores com menor giro [18].\n  2. *Questão 2:* Recomenda-se a contagem manual total para unidades menores ou setores muito críticos para garantir uma base precisa; para lojas de grande porte, recomenda-se a abordagem amostral por departamento para otimizar tempo e recursos [18].\n\n---\n\n### 3. Estudo de Caso Rede Tem Tudo – Planejamento do Inventário (Aula 3 - LOGANO1C2B3S15A3)\n* **Instruções Completas:**\n  Analisem a necessidade da rede Tem Tudo em realizar o inventário legal anual sem fechar ou prejudicar a operação das filiais maiores e respondam [30, 31]:\n  1. *Que recomendações vocês fariam para o planejamento da contagem do inventário geral das lojas Tem Tudo?* [31]\n  2. *Quais estratégias de planejamento vocês sugeririam para a implementação da contagem do inventário físico, cíclico ou rotativo, nas lojas Tem Tudo?* [31]\n* **Sugestão de Resposta / Gabarito Oficial:**\n  1. *Questão 1:* Definir claramente o escopo, escolher períodos de menor movimento comercial, organizar antecipadamente o espaço físico, realizar comunicação prévia a todos os envolvidos e capacitar as equipes [31].\n  2. *Questão 2:* Combinar métodos: utilizar o inventário geral planejado por etapas para cumprimento de exigências legais e implantar contagens cíclicas contínuas ao longo do ano, priorizando itens críticos e de alto giro (curva A) [31].\n\n---\n\n### 4. Estudo de Caso Filial Araraquara – Condução da Contagem (Aula 4 - LOGANO1C2B3S15A4)\n* **Instruções Completas:**\n  Diante do plano de reestruturação do estoque da filial de Araraquara, respondam às perguntas [38]:\n  1. *Qual seria a primeira medida a ser tomada no planejamento da contagem de inventário e estoque da filial de Araraquara?* [38]\n  2. *Quais são os postos-chaves relacionados ao estoque da filial de Araraquara que devem ser comunicados à alta gerência da rede de lojas Tem Tudo?* [38]\n* **Sugestão de Resposta / Gabarito Oficial:**\n  1. *Questão 1:* A primeira medida é definir o escopo e os objetivos da contagem (identificando setores, SKUs, método de contagem e o cronograma do levantamento inicial) [38].\n  2. *Questão 2:* Devem ser informados: o nível real apurado no estoque, as principais divergências registradas entre o físico e o sistema, os produtos críticos ou de alto valor, os riscos de ruptura/excesso e as propostas de ajustes em processos e sistemas [38].\n\n---\n\n### 5. Atividade Prática de Análise de Discrepâncias em Tabela (Aula 1 - LOGANO1C2B3S16A1)\n* **Instruções Completas:**\n  Analisem a tabela contendo o formulário de inventário manual da Rede Tem Tudo. Para cada produto com divergência entre a quantidade do sistema e a apurada fisicamente [43, 48]:\n  1. Identifiquem as possíveis causas da discrepância.\n  2. Apresentem uma ação prática preventiva/corretiva para evitar a recorrência do erro em inventários futuros.\n  3. Organizem a resolução em formato de tabela no caderno e enviem foto individualmente ao AVA [43].\n* **Sugestão de Resposta / Gabarito Oficial:**\n  - *Causas prováveis:* Erros de digitação na entrada, não registro de saídas/vendas, furtos, produtos danificados descartados sem baixa no sistema ou erros de contagem física [42, 47].\n  - *Ações práticas:* Treinamento da equipe de retaguarda, obrigatoriedade de baixa via leitor de código de barras, realização de recontagem imediata para confirmação e implantação de inventários cíclicos rotativos [47, 48].\n\n---\n\n### 6. Estudo de Caso Gama Supply – Acuracidade, Kanban e JIT (Aula 4 - LOGANO1C2B3S16A4)\n* **Instruções Completas:**\n  Analisem os dados operacionais da empresa Gama Supply: acuracidade de estoque atual em 92% (meta de 98%), operação contínua sem paralisações e divergências concentradas nos produtos de alto giro. Respondam [65, 66]:\n  1. *Qual estratégia combinada de controle você recomendaria para elevar a acuracidade de estoque de 92% para 98%? Considere tipo de contagem, frequência e uso de ferramentas visuais.* [66]\n  2. *Explique como Kanban e Just in Time podem atuar como mecanismos preventivos, reduzindo a reincidência de divergências e mantendo a acuracidade após a contagem.* [66]\n* **Sugestão de Resposta / Gabarito Oficial:**\n  1. *Questão 1:* Adoção da contagem rotativa (cíclica) diária/semanal focada nos produtos de alto giro, sem paralisar a operação. Ajuste imediato das divergências no ERP acompanhado do uso de sinalizações visuais nas posições de armazenagem [66].\n  2. *Questão 2:* O Kanban torna o fluxo de reposição visual e padronizado, eliminando falhas de registro; o Just in Time reduz estoques desnecessários e alinha a guarda à demanda real, minimizando movimentações e oportunidades de erro [66].\n\n---\n\n### 7. Estudo de Caso CD LogMais – Diagnóstico de Organização (Aula 1 - LOGANO1C2B3S18A1)\n* **Instruções Completas:**\n  Em duplas, analisem os problemas enfrentados pelo Centro de Distribuição LogMais (atrasos na separação e envios errados de pedidos) e executem o roteiro [83, 84]:\n  1. Identifiquem os problemas do controle e organização do estoque do CD LogMais [85].\n  2. Apontem as soluções teóricas e práticas discutidas na aula [85].\n  3. Relacionem essas soluções às melhorias operacionais esperadas [85].\n* **Sugestão de Resposta / Gabarito Oficial:**\n  1. *Problemas:* Inexistência de critérios de organização, falta de categorização física de produtos, ausência de inventário periódico e falhas operacionais na separação de pedidos [85].\n  2. *Soluções:* Classificação metódica dos itens, criação de categorias e endereçamento físico no armazém e realização de inventários periódicos de conferência [85].\n  3. *Melhorias Esperadas:* Maior rapidez na localização das mercadorias, eliminação de erros no picking, redução de divergências físico-sistêmicas e ganho de agilidade logístico-operacional [85].\n\n---\n\n### 8. Dinâmica \"Virem e Conversem\" – Preparação Prévia para o Inventário (Aula 2 - LOGANO1C2B3S18A2)\n* **Instruções Completas:**\n  Após assistirem ao vídeo instrutivo sobre inventários em supermercados, discutam em duplas [89, 92]: *O que é importante definir antes de iniciar a contagem dos produtos?* [89]\n* **Sugestão de Resposta / Gabarito Oficial:**\n  - Os alunos devem identificar que antes de iniciar a contagem é indispensável realizar um planejamento estruturado: escolher o momento ideal (loja fechada ou com menor movimento), selecionar softwares e ferramentas adequadas (coletores de dados, leitores de código de barras), organizar e arrumar previamente o estoque por setores e treinar e padronizar os procedimentos da equipe responsável [93].\n\n---\n\n### 9. Estudo de Caso Integrado – Relação com Fornecedores, Treinamento e Espaço (Aula 3 - LOGANO1C2B3S18A3)\n* **Instruções Completas:**\n  Em grupos, proponham soluções práticas para os problemas operacionais de um armazém logístico, contemplando três dimensões [103]:\n  1. *Ações na relação com fornecedores.* [103]\n  2. *Ações no treinamento de colaboradores.* [103]\n  3. *Ações na reorganização do espaço físico.* [103]\n* **Sugestão de Resposta / Gabarito Oficial:**\n  1. *Fornecedores:* Estabelecer rotinas formais de comunicação, alinhar lead times de entrega e criar janelas de agendamento de descarregamento [102, 103].\n  2. *Treinamento:* Implementar programas de capacitação em procedimentos operacionais padrão (POP) e uso de coletores de dados [102, 103].\n  3. *Espaço Físico:* Reorganizar o layout alocando itens de alto giro perto das expedições e sinalizar os corredores com endereçamento lógico [102, 103].\n\n---\n\n### 10. Atividade Prática de Dimensionamento e Parâmetros de Estoque (Aulas 2 e 3 - LOGANO1C2B3S19A2 e LOGANO1C2B3S19A3)\n* **Instruções Completas:**\n  Em grupos, realizem os cálculos com base na tabela de dados históricos de consumo fornecida e determinem [120, 124]:\n  1. *Estoque Mínimo ($E_{min}$):* Considerem consumo médio diário e margem de segurança em dias.\n  2. *Ponto de Pedido ($PP$):* $PP = (\text{Consumo Diário} \times \text{Lead Time}) + E_{min}$.\n  3. *Estoque Máximo ($E_{max}$):* $E_{max} = E_{min} + \text{Lote de Compra ($Q$)}$.\n  4. *Giro de Estoque e Curva ABC:* Calculem a rotatividade e classifiquem os itens em A, B ou C [124].\n  5. *Responda individualmente:* Como a análise do giro de estoque e da curva ABC ajuda a definir a frequência de contagens de inventário, a prioridade de controle e as decisões de compra? [125]\n* **Sugestão de Resposta / Gabarito Oficial:**\n  - *Questão Reflexiva:* A análise do giro e da curva ABC permite direcionar o esforço de gestão. Itens de Classe A e alto giro exigem reposição constante, compras rigorosas e inventários cíclicos com alta frequência para evitar rupturas; itens de baixo giro e Classe C têm controles mais simplificados e contagens espaçadas, evitando capital parado em excesso [125].\n\n---\n\n## ❓ QUIZZES E QUESTÕES DE AVALIAÇÃO (COM GABARITO E JUSTIFICATIVA)\n\n### Questão 1 (Aula 1 - LOGANO1C2B3S15A1)\n* **Enunciado:** A Loja Alfa enfrenta problemas por realizar contagens esporádicas e sem critérios claros. Qual prática poderia ajudar a priorizar o controle dos itens mais relevantes do estoque? [4]\n* **Alternativas:**\n  - (A) Registrar apenas os produtos vendidos. [4]\n  - (B) Contar todos os produtos apenas uma vez por ano. [4]\n  - (C) Classificar os itens por valor e impacto (ABC). [4]\n  - (D) Realizar contagens diárias de todo o acervo sem distinção.\n  - (E) Eliminar o registro do sistema e confiar apenas no estoque físico.\n* **Resposta Correta:** **(C) Classificar os itens por valor e impacto (ABC).** [4]\n* **Justificativa Teórica:** A Classificação ABC categoriza os produtos de acordo com seu valor financeiro e impacto operacional (itens A representam maior valor e exigem controle prioritário). Essa prática permite direcionar a atenção da gestão para os itens mais críticos, em vez de despender esforço uniforme em produtos de baixa relevância [4, 5].\n\n---\n\n### Questão 2 (Aula 2 - LOGANO1C2B3S15A2)\n* **Enunciado:** As filiais de grande e pequeno porte da rede Tem Tudo demandam diferentes abordagens de verificação física. Para garantir registros confiáveis, redução de divergências e decisões mais corretas na gestão de estoques, qual é a conduta inicial recomendada? [15]\n* **Alternativas:**\n  - (A) Adotar a mesma contagem manual anual para todas as filiais.\n  - (B) Escolher um método de contagem adequado ao contexto de cada operação. [15]\n  - (C) Eliminar os formulários físicos de contagem nas lojas pequenas.\n  - (D) Realizar a substituição imediata de todos os colaboradores do almoxarifado.\n  - (E) Suspender o controle de estoque nos setores de alto giro.\n* **Resposta Correta:** **(B) Escolher um método de contagem adequado ao contexto de cada operação.** [15]\n* **Justificativa Teórica:** Não existe um método único superior para todas as situações. Cada loja e perfil de produto exige a escolha do método mais condizente (permanente para alto giro/complexidade, periódica/manual para unidades menores ou amostragem para grande porte), garantindo redução de custos operacionais e dados confiáveis no sistema [15, 16].\n\n---\n\n### Questão 3 (Aula 3 - LOGANO1C2B3S15A3)\n* **Enunciado:** A Tem Tudo precisa realizar o inventário para fins legais, mas quer evitar longas paralisações nas lojas maiores. Qual estratégia de contagem é mais adequada para conciliar controle, tempo e impacto operacional? [23]\n* **Alternativas:**\n  - (A) Aplicar somente contagem por amostragem. [23]\n  - (B) Evitar a contagem e não ajustar os dados. [23]\n  - (C) Realizar apenas contagem manual diária. [23]\n  - (D) Planejar a contagem geral em etapas. [23]\n  - (E) Cancelar o balanço anual obrigatório.\n* **Resposta Correta:** **(D) Planejar a contagem geral em etapas.** [23, 28]\n* **Justificativa Teórica:** O planejamento antecipado da contagem geral por etapas (setores ou cronogramas fracionados) possibilita organizar equipes, cumprir a exigência legal do balanço e reduzir o impacto no atendimento ao cliente, evitando o fechamento prolongado das lojas [28].\n\n---\n\n### Questão 4 (Aula 1 - LOGANO1C2B3S16A1)\n* **Enunciado:** Durante o processo de verificação de estoques de uma grande rede de varejo, a equipe encontrou diferenças entre as quantidades apuradas nas prateleiras e as registradas no sistema. Qual é o objetivo fundamental de realizar o inventário e analisar essas discrepâncias? [47]\n* **Alternativas:**\n  - (A) Alterar os preços de venda dos produtos imediatamente.\n  - (B) Garantir dados confiáveis no sistema de gestão. [47]\n  - (C) Aumentar o limite máximo de armazenamento do depósito.\n  - (D) Justificar o descarte imediato de itens sem inspeção.\n  - (E) Reduzir o número de colaboradores responsáveis pelo almoxarifado.\n* **Resposta Correta:** **(B) Garantir dados confiáveis no sistema de gestão.** [47]\n* **Justificativa Teórica:** O inventário busca alinhar o estoque físico com os registros do sistema, permitindo identificar falhas de registro, erros de contagem, perdas ou avarias, assegurando que as decisões de compra e vendas sejam tomadas com base em informações precisas [42, 47].\n\n---\n\n### Questão 5 (Aula 1 - LOGANO1C2B3S18A1)\n* **Enunciado:** Um centro de distribuição enfrenta sérios problemas operacionais, com falhas frequentes na localização de produtos e atrasos no envio de pedidos aos clientes. Qual medida de organização é indispensável para restabelecer a confiabilidade das informações e a eficiência das operações? [81]\n* **Alternativas:**\n  - (A) Aumentar a velocidade das empilhadeiras.\n  - (B) Fazer inventário periódico. [81]\n  - (C) Terceirizar toda a frota de entrega.\n  - (D) Armazenar produtos sem identificação para economizar espaço.\n  - (E) Realizar compras emergenciais sem checar o saldo existente.\n* **Resposta Correta:** **(B) Fazer inventário periódico.** [81]\n* **Justificativa Teórica:** A realização de inventários periódicos permite conferir as quantidades reais existentes no armazém, corrigir divergências com o sistema, reordenar a localização física dos itens e diminuir drasticamente os erros de separação e envio [81, 85].\n","sha256":"27f030c484a6ea5a51521facb5f42202808723e968bcb9594f36e2f113d3468a"},{"name":"REVISAO PROVA PAULISTA.md","text":"# REVISÃO PROVA PAULISTA - AUTOMAÇÃO LOGÍSTICA\n\nVocê atuará simultaneamente como DOIS especialistas:\n\n**1) Desenvolvedor Front-end Sênior**\nEspecialista em UI/UX, HTML5, CSS3 e JavaScript puro, com foco em aplicações educacionais offline, responsivas, acessíveis e robustas.\n\n**2) Professor carismático, dinâmico e especialista em Educação Profissional**\nEspecialista em transformar conteúdos técnicos de cursos profissionalizantes em experiências interativas, contextualizadas, motivadoras e pedagogicamente coerentes.\n\n\\---\n\n# CONTEXTO DO PROJETO\n\nDISCIPLINA/CURSO: CARREIRA E COMPETÊNCIAS\nUse os dados reais presentes no arquivo anexado.\n\nTURMA: 2 SOL\t\t\nUse os dados fornecidos pelo solicitante ou, na ausência deles, não invente.\n\nTEMA DA TRILHA: O QUE APRENDEMOS DURANTE ESSE BIMESTRE?\n\n\n\n## FONTE DA VERDADE\n\nLeia integralmente o arquivo `.MD` anexado antes de produzir o código.\n\nO conteúdo do `.MD` é a **FONTE ÚNICA DA VERDADE**.\n\nVocê deve:\n\n* extrair os conceitos realmente presentes no material;\n* utilizar a terminologia existente no material;\n* preservar os dados, exemplos, números, processos e conceitos do material;\n* construir narrativas e perguntas somente a partir do conteúdo disponível no `.MD`;\n* não inventar informações técnicas;\n* não introduzir fatos externos;\n* não “corrigir” silenciosamente o conteúdo fornecido;\n* não substituir dados do material por conhecimento geral;\n* não criar respostas de quiz que dependam de informação ausente no `.MD`.\n\nQuando uma informação não estiver presente no material, NÃO INVENTE.\n\n\\---\n\n# FINALIDADE PEDAGÓGICA — REVISÃO PARA UMA PROVA IMPORTANTE\n\nEsta aplicação é uma revisão preparatória para a **Prova Paulista**, uma avaliação importante. O objetivo é consolidar os conteúdos do bimestre, identificar dúvidas e treinar raciocínio, precisão e administração do tempo.\n\nNão basta marcar uma alternativa: **em cada questão de cada quiz, o aluno deve explicar por que escolheu aquela resposta, relacionando sua decisão ao conteúdo estudado**. Toda atividade deve evidenciar o raciocínio do estudante; a atividade escrita também deve exigir uma decisão justificada com base no material.\n\nApresentar na abertura: “Você está se preparando para uma prova importante. Em cada questão, terá até 3 minutos para escolher e justificar sua resposta com pontuação integral. Depois disso, o valor da questão diminui. Leia, pense e explique!”\n\nA pontuação é da revisão e não deve ser apresentada como nota oficial da Prova Paulista.\n\n# OBJETIVO\n\nDesenvolva uma **Single Page Application (SPA)** educacional chamada:\n\n# “REVISÃO PROVA PAULISTA - AUTOMAÇÃO LOGÍSTICA”\n\nA aplicação deve estar inteira em:\n\n**UM ÚNICO ARQUIVO `index.html`**\n\nO arquivo deve conter:\n\n* HTML;\n* CSS;\n* JavaScript;\n\ntodos embutidos no próprio arquivo.\n\n## RESTRIÇÕES\n\nNão utilizar:\n\n* frameworks;\n* bibliotecas externas;\n* CDN;\n* Bootstrap;\n* Tailwind;\n* React;\n* Vue;\n* Angular;\n* jQuery;\n* bibliotecas de gráficos;\n* bibliotecas de PDF;\n* fontes externas;\n* APIs externas obrigatórias para funcionamento.\n\nA aplicação precisa:\n\n* funcionar offline;\n* funcionar ao abrir diretamente o arquivo no navegador;\n* funcionar em `file://`;\n* ser compartilhável por WhatsApp como arquivo HTML;\n* não depender de servidor;\n* não depender de internet.\n\n\\---\n\n# DESIGN VISUAL\n\nUtilize estética:\n\n**Glassmorphism + Soft UI**\n\nA interface deve ser:\n\n* moderna;\n* limpa;\n* vibrante;\n* educacional;\n* profissional;\n* amigável para estudantes;\n* visualmente agradável em desktop e celular.\n\nÉ PROIBIDO utilizar:\n\n* brutalismo;\n* neo-brutalismo;\n* caixas quadradas agressivas;\n* interfaces excessivamente rígidas.\n\nUtilize:\n\n* cantos arredondados;\n* sombras suaves;\n* blur;\n* transparências;\n* gradientes;\n* microinterações;\n* transições suaves;\n* cards;\n* indicadores visuais;\n* hierarquia tipográfica clara.\n\nO background deve ser criado apenas com CSS.\n\nPode utilizar:\n\n* gradientes;\n* formas abstratas;\n* pseudo-elementos;\n* padrões CSS;\n* SVG embutido diretamente no HTML.\n\nNão utilizar imagens externas obrigatórias.\n\n\\---\n\n# PALETA\n\nAzul Conhecimento; #2A629A; Cor primária para cabeçalhos, títulos de destaque e botões de navegação principais.\n\nLaranja Engajamento; #FF7A00; Cor de acento para botões de ação prioritários, alertas, prazos e elementos de destaque visual.\n\nAzul Marinho Leitura; #0F172A; Cor para textos principais, enunciados de questões e alternativas, garantindo máximo contraste e legibilidade.\n\nVerde Sucesso; #10B981; Cor de feedback para acertos de questões, indicadores de progresso e confirmações de envio.\n\nCinza Superfície; #F1F5F9; Cor de fundo secundária para delimitação de cards, blocos de alternativas e painéis laterais.\n\nBranco Lousa; #FFFFFF; Cor de fundo principal da interface para garantir clareza visual e conforto durante longos períodos de estudo.---\n\n# RESPONSIVIDADE\n\nA aplicação deve ser:\n\n**Mobile First**\n\nUtilize:\n\n* Flexbox;\n* CSS Grid;\n* media queries;\n* unidades responsivas.\n\nDeve funcionar corretamente em:\n\n* celular;\n* tablet;\n* notebook;\n* desktop.\n\nNão permita:\n\n* overflow horizontal inesperado;\n* elementos cortados;\n* botões inacessíveis;\n* texto ultrapassando cards.\n\n\\---\n\n# ACESSIBILIDADE\n\nImplemente:\n\n(SÓ PODER FAZER EM TELA CHEIA)\n\n* foco visível para teclado;\n* elementos navegáveis por teclado;\n* contraste adequado;\n* labels;\n* `aria-label` quando necessário;\n* `aria-live` para mensagens dinâmicas;\n* botões reais quando a ação for interativa;\n* suporte a `prefers-reduced-motion`.\n\nQuando `prefers-reduced-motion: reduce` estiver ativo:\n\n* reduza;\n* desative;\n* ou simplifique animações decorativas.\n\n\\---\n\n# ESTRUTURA DA EXPERIÊNCIA\n\nA aplicação deve funcionar como uma SPA.\n\nNão recarregar a página para trocar de tela.\n\nUtilize apenas JavaScript para alternar as telas.\n\n\\---\n\n# IMPORTANTES\n\nA aplicação deve possuir:\n\n**EXATAMENTE 2 ESTAÇÕES**, amplas e complementares, que contemplem o conteúdo e enfatizem as habilidades presentes no material didático `.MD`.\n\nTodo o conteúdo principal das aulas deve ser distribuído pedagogicamente entre as duas estações.\n\nAs duas estações, em conjunto, devem trabalhar os principais eixos do `.MD`.\n\n\\---\n\n# TELA INICIAL\n\nCriar uma apresentação envolvente.\n\nDeve conter:\n\n* logo/ícone visual;\n* título “Trilha do Conhecimento”;\n* subtítulo relacionado ao tema real;\n* pequena contextualização;\n* campo para o nome do aluno;\n* botão “Começar”;\n* regras da missão;\n* aviso divertido sobre os “vacilos”.\n\nO nome digitado deve ser salvo e utilizado posteriormente.\n\nExemplo de personalização:\n\n“Preparado, {NOME}?”\n\nO placeholder `{NOME}` deve ser substituído por JavaScript.\n\n\\---\n\n# MAPA\n\nCriar um pequeno mapa visual com duas estações sequenciais.\n\nExemplo:\n\n🚀 Início → ▶️ Estação 1 → 🔒 Estação 2 → ✅ Resultado\n\nA primeira estação deve começar como:\n\n▶️ atual\n\nAo concluir todos os passos:\n\n✅ concluída\n\nLiberar a segunda estação após concluir a primeira. Não permitir acessar o resultado sem concluir ambas.\n\n\\---\n\n# ESTRUTURA DE CADA ESTAÇÃO\n\nCada uma das duas estações deve possuir exatamente 3 passos internos.\n\n## PASSO 1 — NARRATIVA\n\nCrie uma narrativa contextualizada.\n\nO aluno deve ser sempre o protagonista.\n\nUtilizar:\n\n`{NOME}`\n\ne substituir dinamicamente via JavaScript.\n\nA narrativa deve:\n\n* contextualizar o problema;\n* ensinar o conteúdo;\n* transformar conceitos técnicos em uma situação prática;\n* conectar teoria à Logística;\n* utilizar linguagem envolvente;\n* manter fidelidade absoluta ao `.MD`.\n\nAdicionar caixas visuais como:\n\n**💡 VOCÊ NO COMANDO**\n\nEssas caixas devem destacar decisões, conceitos ou responsabilidades do aluno.\n\nNão transformar a narrativa em um resumo superficial.\n\nA narrativa deve ser suficiente para preparar o aluno para o quiz e para a atividade.\n\n\\---\n\n# PASSO 2 — QUIZ\n\nCriar:\n\n**2 questões de múltipla escolha por estação, totalizando 4 questões**\n\nCada questão deve possuir:\n\n* 4 alternativas;\n* exatamente 1 correta.\n\nAs perguntas devem ser EXATAMENTE IGUAIS AS QUE TEM NO (.MD)\n\nNão criar perguntas de conhecimento externo.\n\n## Resposta com justificativa obrigatória\n\nMostrar uma questão por vez, com enunciado, quatro alternativas, cronômetro individual e campo “Por que você escolheu essa resposta?”.\n\nOrientar: “Explique com suas palavras qual conceito do material sustenta sua escolha e como ele se aplica à situação.” Não aceitar somente a letra da alternativa como justificativa.\n\nExigir pelo menos **80 caracteres não vazios após `trim()`** na justificativa e mostrar contador `0/80`. O mínimo é uma validação de preenchimento, não uma avaliação automática da qualidade do raciocínio. Preservar o texto original integral, sem aplicar `trim()` ao valor salvo.\n\nAo selecionar uma alternativa, registrar a seleção provisória, sem revelar o gabarito. Permitir mudar essa seleção e editar a justificativa até clicar em **“Confirmar resposta e justificativa”**. O botão só fica habilitado com alternativa selecionada e justificativa válida.\n\nAo confirmar:\n\n1. registrar definitivamente alternativa e justificativa, juntas;\n2. registrar o instante de envio e o tempo total da questão;\n3. calcular a redução por atraso e os pontos obtidos;\n4. bloquear alternativas, justificativa e botão contra alterações e envios duplicados;\n5. destacar a correta em verde e, se houver erro, a escolhida em vermelho;\n6. apresentar o gabarito e o feedback fundamentado no material;\n7. permitir avançar para a próxima questão somente após a confirmação.\n\n**Nunca revelar resposta correta, explicação ou pistas que entreguem o gabarito antes de o aluno enviar sua própria justificativa.** Após confirmar, a resposta é definitiva.\n\n## Cronômetro individual — até 3 minutos\n\nCada questão tem **180 segundos para pontuação integral**, incluindo leitura, seleção da alternativa e escrita da justificativa. Iniciar a contagem quando a questão for exibida pela primeira vez. Iniciar a próxima somente quando o aluno clicar em “Próxima questão”. O tempo de leitura do feedback não entra no tempo da questão seguinte.\n\nMostrar `Tempo restante: 03:00`, com atualização a cada segundo. Depois do prazo, mostrar `Tempo excedido: +00:01` e a porcentagem atual de pontuação disponível.\n\nApós 3 minutos, a questão permanece aberta: não enviar automaticamente, não revelar o gabarito e não impedir a conclusão. Reduzir apenas a pontuação daquela questão.\n\n### Regra de redução por atraso\n\nCada questão correta vale 1 ponto-base. Aplicar redução de **10% do valor original por bloco de 30 segundos de atraso iniciado**, limitada a **50%**:\n\n```javascript\nconst atrasoMs = Math.max(0, tempoRespostaMs - 180000);\nconst blocosAtraso = Math.ceil(atrasoMs / 30000);\nconst descontoTempo = Math.min(0.50, blocosAtraso \\* 0.10);\nconst pontosQuestao = acertou ? (1 - descontoTempo) : 0;\n```\n\n* Até 03:00, inclusive: questão correta vale 1,00 ponto.\n* Acima de 03:00 até 03:30: vale 0,90 ponto.\n* Acima de 03:30 até 04:00: vale 0,80 ponto.\n* Acima de 04:00 até 04:30: vale 0,70 ponto.\n* Acima de 04:30 até 05:00: vale 0,60 ponto.\n* Acima de 05:00: vale 0,50 ponto, sem novas reduções.\n* Resposta incorreta: zero, nunca pontuação negativa.\n\nCalcular pelo tempo em milissegundos, sem arredondamento antes do cálculo. A perda é proporcional ao valor da questão, não uma subtração direta na média final. O atraso não adiciona um “vacilo”: manter desconto temporal e vacilos separados.\n\n### Avisos de tempo\n\nUsar mensagens divertidas, curtas e personalizadas, sem humilhar o aluno:\n\n* Aos 02:00: “{NOME}, falta 1 minuto! Organiza o raciocínio e explica sua escolha. ⏱️”\n* Aos 02:30: “{NOME}, reta final! Faltam 30 segundos para responder com pontuação integral.”\n* Ao ultrapassar 03:00: “{NOME}, cê tá vacilando, ein... 😅 Passou dos 3 minutos! Esta questão agora vale 90% se você acertar. Capricha na justificativa!”\n* Nas próximas reduções: “Bora, {NOME}! Esta questão agora vale {PERCENTUAL}% se acertar. Mostra o porquê da sua resposta!”\n* Ao atingir 50%: “{NOME}, o desconto chegou ao limite. Respira e conclui seu raciocínio!”\n\nExibir cada aviso uma única vez por marco. Se vários marcos passarem com a página oculta, ao retornar mostrar somente a condição atual, sem uma sequência de avisos acumulados. Não usar modais bloqueantes; manter aviso visível e acessível com `aria-live=\"polite\"`, sem anunciar cada segundo do relógio.\n\n### Feedback que evidencia o porquê\n\nEm **todas as questões**, após o envio, mostrar:\n\n1. **Sua resposta:** alternativa marcada.\n2. **Seu raciocínio:** justificativa integral e literal do aluno.\n3. **Resposta correta:** alternativa do gabarito.\n4. **Por que está correta:** explicação do conceito e sua aplicação à questão, baseada no `.MD`.\n5. **Por que as demais não se aplicam:** explicação de cada alternativa incorreta, se sustentada pelo material; sinalizar lacunas em vez de inventar.\n6. **Evidência no material:** seção, título ou trecho curto real que sustenta o gabarito, sem inventar referências.\n7. **Para a prova:** síntese do raciocínio que o aluno precisa dominar.\n8. **Tempo e pontos:** duração, atraso, desconto percentual e pontuação obtida.\n\nNão tratar quantidade de caracteres como prova de compreensão. A justificativa deve ficar disponível para avaliação qualitativa do professor; não atribuir automaticamente uma nota semântica em JavaScript nem afirmar que a explicação do aluno está correta só porque a alternativa está certa.\n\n\\---\n\n# PASSO 3 — ATIVIDADE ESCRITA\n\nCriar UMA atividade de produção textual.\n\nO aluno deve escrever:\n\n**mínimo de 300 caracteres**\n\nO botão de conclusão deve permanecer bloqueado até atingir o mínimo.\n\nMostrar contador em tempo real:\n\n`0/300`\n\n`84/300`\n\n`173/300`\n\n`300/300`\n\netc.\n\n\\---\n\n\\---\n\n# TEXTO DIGITADO\n\nO texto do aluno deve ser preservado exatamente.\n\nNão:\n\n* resumir;\n* corrigir;\n* modificar;\n* formatar;\n* apagar.\n\nSalvar exatamente o conteúdo digitado.\n\n\\---\n\n# ANTI-COLA / ANTI-VACILO\n\nCriar sistema de “vacilos”.\n\nCada vacilo:\n\n**−1 ponto na média final**\n\n\n\n\n\n**Botão direito do mouse é bloqueado no site**\n\n\n\n## Detectar\n\n### 1\\. Troca de aba/saída da página\n\nUtilizar:\n\n`visibilitychange`\n\nQuando a página ficar oculta durante a atividade:\n\n* adicionar 1 vacilo;\n* salvar imediatamente;\n* mostrar toast.\n\n### 2\\. Colar\n\nBloquear:\n\n* paste;\n* drop;\n* Ctrl+V;\n* Cmd+V.\n\nAo tentar:\n\n* impedir a ação;\n* adicionar 1 vacilo;\n* mostrar toast.\n\nNão bloquear digitação normal.\n\n\\---\n\n# MENSAGENS DOS VACILOS\n\nAs mensagens precisam ser divertidas, pedagógicas e variadas.\n\n\n\n\"1. -1000 de Aura.\n\n\"Saiu da aba do nada? Sua aura acabou de despencar, meu cria. Foca na tela antes que você termine a aula com aura negativa.\"\n\n\n\n2\\. Comportamento de NPC.\n\n\"Trocar de aba bem no meio da atividade? Literalmente atitude de NPC. O sistema já registrou seu vacilo!\"\n\n\n\n3\\. F no Chat.\n\n\"Tomou um vacilo de graça porque foi dar alt+tab. F no chat para o seu foco. Volta pra cá!\"\n\n\n\n4\\. Foi de Base.\n\n\"A sua concentração simplesmente foi de arrasta pra cima. Retorne para a aba antes que a sua média vá junto.\"\n\n\n\n5\\. Puro Loss.\n\n\"O ego foi lá em cima achando que o sistema não ia pegar a troca de aba, né? Menos ego e mais foco, meu parceiro, senão é puro loss.\"\n\n\n\n6\\. A Red Flag Máxima.\n\n\"Mudar de tela bem na hora da logística? Essa é uma senhora red flag. Vacilo anotado com sucesso.\"\n\n\n\n7\\. Tá Moscando?\n\n\"Deu uma espiada fora da página e achou que ia passar batido? Tá de chapéu. O radar de vacilos não perdoa ninguém.\"\n\n\n\n8\\. Caiu no Anti-Cheat.\n\n\"Meteu o migué de trocar de aba e o sistema pegou no pulo. Sua reputação na matéria acabou de sofrer um downgrade.\"\n\n\n\n9\\. Lá Ele!\n\n\"Saindo da tela de fininho pra ir fazer o quê? Lá ele! O contador de vacilos já fez o trabalho dele, volta pro foco.\"\n\n\n\n10\\. O Puro Suco do Vacilo.\n\n\"O cara realmente abandonou a aba principal pra dar um rolê na internet... É muito vacilo numa atitude só. Menos 500 de aura pra conta!\"\"\n\n\n\n\n\n\n\nSempre citar o nome do aluno.\n\nExemplos de estilo:\n\n“Ô {NOME}, Tô de olho! 😅”\n\n“Ei, {NOME}! Ctrl+V detectado! Aqui é na raça: conhecimento digitado! 🚚”\n\n“{NOME}, esse vacilo custou 1 ponto. vacilão!. ♻️”\n\nCriar várias mensagens aleatórias.\n\nNão repetir sempre a mesma.\n\n\\---\n\n# HUD FIXO\n\nDurante a trilha mostrar um HUD fixo com:\n\n* ⏱️ cronômetro total da revisão;\n* cronômetro individual da questão e pontuação percentual disponível;\n* 🚨 quantidade de vacilos;\n* 📍 progresso.\n\nExemplo:\n\n`⏱️ 08:42 | 🚨 Vacilos: 1 | 📍 Estação 1/2`\n\nO cronômetro deve continuar funcionando enquanto o aluno estiver na atividade.\n\n\\---\n\n# PERSISTÊNCIA\n\nSalvar TODO o estado com:\n\n`localStorage`\n\nSalvar:\n\n* nome;\n* etapa;\n* passo atual;\n* respostas e justificativas integrais, provisórias e definitivas;\n* por questão: início (`startedAt`), envio (`submittedAt`), tempo em milissegundos, atraso, desconto, pontos e avisos já apresentados;\n* texto da atividade;\n* vacilos;\n* tempo;\n* status da missão;\n* conclusão.\n\nAo atualizar a página:\n\n**NÃO RESETAR**\n\nA aplicação deve voltar exatamente para o ponto em que estava.\n\nO cronômetro individual deve usar o instante inicial persistido (`Date.now() - startedAt`), não apenas um contador de `setInterval`. Recarregar, ocultar a aba ou fechar e reabrir o arquivo não reinicia o prazo. O tempo continua enquanto houver questão aberta sem envio. Ao restaurar, recalcular atraso e valor disponível. Congelar o tempo de questões enviadas em `submittedAt - startedAt`. Salvar rascunhos a cada alteração e impedir duplicidade de pontuação.\n\nUma aplicação local não garante proteção contra alteração do relógio ou dos dados pelo usuário; não prometer inviolabilidade.\n\n\\---\n\n# COMPATIBILIDADE COM FILE://\n\nTodo acesso ao `localStorage` deve estar dentro de `try/catch`.\n\nCaso o armazenamento esteja indisponível:\n\n* não quebrar a aplicação;\n* utilizar comportamento de fallback quando possível;\n* informar apenas se necessário.\n\n\\---\n\n# RESET DO PROFESSOR\n\nNão criar botão de reset visível para o aluno.\n\nCriar um pequeno CHEAT quando eu der (CTRL+Q) ele reseta retirando somente os vacilos e preservando todas as respostas, justificativas e descontos por tempo.\n\n# MECÂNICA DA NOTA\n\nSão **2 estações, 4 questões e 2 atividades escritas**, totalizando **6 componentes** de mesmo peso.\n\nCada questão correta vale até 1 ponto-base, ajustado pelo desconto temporal; cada questão incorreta vale zero. A justificativa é obrigatória para o envio, mas sua qualidade será apreciada pelo professor. Cada atividade escrita concluída vale 1 ponto-base ao atingir 300 caracteres após `trim()` e ser enviada; isso registra conclusão, não correção conceitual automática.\n\n```javascript\nconst totalComponentes = 6;\nconst notaConteudoSemDesconto = ((acertos + atividadesConcluidas) / totalComponentes) \\* 10;\nconst notaAposTempo = ((somaPontosQuestoes + atividadesConcluidas) / totalComponentes) \\* 10;\nconst perdaPorTempoNaNota = notaConteudoSemDesconto - notaAposTempo;\nconst mediaFinal = Math.max(0, notaAposTempo - vacilos);\n```\n\nSomar cada questão e atividade uma única vez. Arredondar somente para exibição, mantendo precisão nos cálculos. Exibir separadamente acertos, nota antes dos descontos, perda por tempo, nota após o tempo, penalidade por vacilos e média final.\n\nO atalho do professor `Ctrl+Q` zera somente os vacilos e recalcula a média; não altera respostas, justificativas, cronômetros, descontos por atraso ou atividades.\n\nExemplo: quatro acertos, sendo um com 03:20 (0,90 ponto), e duas atividades concluídas resultam em 5,90/6 × 10 = 9,83 antes dos vacilos. Com 1 vacilo, a média final é 8,83.\n\n\\---\n\n# FAIXAS DE DESEMPENHO\n\nNa tela final:\n\n### Média alta\n\nA partir de aproximadamente 8,5:\n\nMensagem eufórica.\n\nExemplo:\n\n“🚀 {NOME}, você mandou MUITO bem! Seu raciocínio logístico entrou no modo economia circular!”\n\nMostrar confetes em CSS/emoji.\n\n### Média intermediária\n\nEntre aproximadamente 6 e 8,49:\n\nMensagem:\n\n“👍 {NOME}, foi uma boa caminhada, mas alguns conceitos ainda precisam de treino.”\n\n### Média baixa\n\nAbaixo de 6:\n\nMensagem:\n\n“📚 {NOME}, é hora de voltar aos estudos e revisar os materiais antes da próxima missão.”\n\n\\---\n\n# TELA FINAL\n\nCriar um boletim visual.\n\nMostrar:\n\n* nome;\n* tema;\n* data;\n* acertos;\n* atividade concluída;\n* nota de conteúdo;\n* vacilos;\n* tempo total;\n* média final.\n\nMostrar também uma mensagem personalizada com o nome.\n\nAdicionar:\n\n**🖨️ Imprimir / salvar PDF**\n\ne:\n\n**📄 Exportar boletim .MD**\n\n\\---\n\n# PDF / IMPRESSÃO — MUITO IMPORTANTE\n\nO PDF deve funcionar como uma **atividade entregue pelo aluno**.\n\nNÃO imprimir somente a nota.\n\nO PDF precisa conter TODAS as respostas.\n\nRegistrar quanto tempo o aluno levou em cada questão, incluindo a justificativa. O PDF e o boletim `.MD` devem conter os mesmos dados completos: todas as respostas, justificativas, explicações, tempos individuais e detalhamento dos descontos e da nota.\n\n## O PDF deve conter:\n\n### 1\\. Identificação\n\n* nome do aluno;\n* tema;\n* data;\n* identificação da trilha.\n\n### 2\\. Resultado\n\n* acertos no quiz;\n* total de questões;\n* atividade concluída;\n* nota de conteúdo;\n* número de vacilos;\n* tempo total;\n* média final.\n\n### 3\\. Quiz COMPLETO\n\nPara cada questão:\n\n* pergunta inteira;\n* alternativa marcada pelo aluno;\n* alternativa correta;\n* resultado;\n* explicação educativa;\n* justificativa integral do aluno, preservada literalmente;\n* evidência do gabarito no material;\n* tempo individual em minutos e segundos;\n* atraso, desconto percentual e pontos obtidos.\n\n### 4\\. ATIVIDADE ESCRITA COMPLETA\n\nO texto deve ser incluído:\n\n**INTEGRALMENTE**\n\nNão resumir.\n\nNão cortar.\n\nNão truncar.\n\nNão limitar à altura do textarea.\n\nNão mostrar apenas o trecho atualmente visível na caixa.\n\n\\---\n\n# REGRA CRÍTICA PARA IMPRESSÃO DE TEXTOS LONGOS\n\nA interface pode utilizar um `\u003ctextarea>` para o aluno digitar.\n\nPORÉM:\n\n**NUNCA utilizar diretamente a altura do `\u003ctextarea>` como representação da resposta no documento de impressão.**\n\nAo gerar o relatório:\n\n1. obter o texto completo de:\n`state.writings`\n2. criar um elemento separado somente para impressão;\n3. inserir o texto completo nesse elemento;\n4. utilizar CSS específico para impressão.\n\nO elemento de impressão da resposta deve possuir propriedades equivalentes a:\n\n```css\n.student-text {\n    white-space: pre-wrap;\n    overflow: visible;\n    overflow-wrap: anywhere;\n    word-break: break-word;\n    height: auto;\n    max-height: none;\n    line-height: 1.6;\n}\n```\n\nNa impressão:\n\n```css\n.student-text {\n    overflow: visible !important;\n    white-space: pre-wrap !important;\n    max-height: none !important;\n    height: auto !important;\n    break-inside: auto !important;\n    page-break-inside: auto !important;\n}\n```\n\nAplicar essas mesmas regras às justificativas de todos os quizzes: nunca cortar o texto no relatório.\n\nA seção que contém a resposta também deve permitir quebra entre páginas:\n\n```css\n.writing {\n    break-inside: auto;\n    page-break-inside: auto;\n}\n```\n\nNÃO usar:\n\n```css\nbreak-inside: avoid;\n```\n\npara um bloco de texto potencialmente grande.\n\nIsso pode impedir o navegador de quebrar corretamente um texto longo entre páginas.\n\nA resposta do aluno pode ocupar:\n\n* meia página;\n* uma página;\n* duas páginas;\n* várias páginas.\n\nIsso deve funcionar automaticamente.\n\n\\---\n\n# PRESERVAÇÃO DE FORMATAÇÃO\n\nAo imprimir a resposta escrita:\n\n* preservar quebras de linha;\n* preservar parágrafos;\n* preservar espaços relevantes;\n* manter todo o conteúdo;\n* permitir quebra automática de linha;\n* permitir paginação.\n\nUtilizar:\n\n`white-space: pre-wrap`\n\ne inserir o texto de forma segura.\n\nSe necessário:\n\n```javascript\nescapeHtml(text)\n```\n\nantes de colocar o texto no documento.\n\n\\---\n\n# IMPRESSÃO\n\nPode utilizar:\n\n`window.open()`\n\ne depois:\n\n`window.print()`\n\nCriar um documento de impressão próprio.\n\nNão depender de bibliotecas PDF.\n\nO navegador deve ser responsável por:\n\n**Imprimir → Salvar como PDF**\n\nO documento de impressão deve ter:\n\n* cabeçalho;\n* identificação;\n* resultado;\n* respostas;\n* atividade escrita integral;\n* rodapé.\n\n\\---\n\n\\---\n\n# ÁREA DO BOLETIM\n\nNo boletim final, exibir também uma indicação:\n\n**“Este documento registra a resposta enviada pelo estudante.”**\n\nNão esconder a resposta.\n\n\\---\n\n# SEGURANÇA DE DADOS NA INTERFACE\n\nNunca usar `innerHTML` diretamente com texto livre do aluno sem escapar o conteúdo.\n\nCriar uma função como:\n\n```javascript\nfunction esc(value) {\n    return String(value)\n        .replace(/\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\&/g, \"\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\&amp;\")\n        .replace(/\u003c/g, \"\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\&lt;\")\n        .replace(/>/g, \"\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\&gt;\")\n        .replace(/\"/g, \"\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\&quot;\")\n        .replace(/'/g, \"\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\&#039;\");\n}\n```\n\nSempre escapar:\n\n* nome;\n* respostas;\n* textos escritos;\n* qualquer conteúdo digitado pelo estudante.\n\n\\---\n\n# EXPERIÊNCIA DO ALUNO\n\nA interface precisa parecer uma missão.\n\nUsar microcopys divertidos.\n\nExemplos:\n\n“🚚 Missão aceita!”\n\n“♻️ Hora de colocar o conhecimento em circulação!”\n\n“🧠 Essa resposta é definitiva. Pense como um profissional!”\n\n“📦 Agora é você quem toma a decisão!”\n\nAs frases devem permanecer relacionadas ao contexto da disciplina.\n\n\\---\n\n# EVITAR\n\nNão fazer:\n\n* excesso de texto na interface;\n* menus complicados;\n* múltiplas páginas HTML;\n* dependência de internet;\n* dependência de CDN;\n* botão de reset visível;\n* quiz que permite trocar resposta;\n* atividade sem contador;\n* atividade sem dicas;\n* PDF que corta texto;\n* PDF que mostra apenas a parte visível do textarea;\n* placeholders vazios;\n* comentários como “preencher aqui”;\n* trechos incompletos;\n* pseudo-código;\n* funções faltando.\n\n\\---\n\n* \n\n\\---\n\n# RESULTADO ESPERADO\n\nProduza uma aplicação educacional realmente utilizável em sala de aula.\n\nEla deve parecer um pequeno produto educacional profissional, e não um formulário simples.\n\nO estudante deve sentir que está participando de uma missão.\n\nO professor deve conseguir:\n\n* receber o PDF;\n* identificar o aluno;\n* visualizar as respostas do quiz;\n* ler integralmente a resposta discursiva;\n* identificar a nota;\n* identificar eventuais vacilos;\n* verificar o tempo;\n* arquivar o documento como atividade entregue.\n\nA prioridade máxima é:\n\n**Fidelidade ao `.MD` + boa experiência pedagógica + robustez técnica + preservação integral das respostas no PDF.**\n\n\n\n# VERIFICAÇÃO OBRIGATÓRIA ANTES DA ENTREGA\n\n* Confirmar duas estações, quatro questões e duas atividades; se o material não contiver quatro questões originais, informar a insuficiência e solicitar o complemento, sem inventar ou repetir questões para completar a quantidade.\n* Diferenciar este prompt do material didático: se somente este prompt estiver disponível, solicitar o `.MD` com conteúdos e questões antes de gerar a aplicação.\n* Validar os limites de 180.000 ms (100%), 180.001 ms (90%), 210.000 ms (90%), 210.001 ms (80%) e 300.001 ms (50%).\n* Garantir que justificativa ausente bloqueia o envio, que o gabarito aparece somente depois da confirmação e que o cronômetro continua durante a escrita.\n* Confirmar que atualizar a página não reinicia a questão nem duplica pontos ou avisos.\n* Conferir que atraso não adiciona vacilo e que `Ctrl+Q` não remove descontos temporais.\n* Conferir justificativas longas, respostas e cálculos completos tanto no PDF quanto no `.MD`.\n\n","sha256":"aa48c6c2c067df13879237ebc8250929232532867638f5a8a90672f60fc0441e"}]}</script>
<script>'use strict';
const DATA=JSON.parse(document.getElementById('course-data').textContent);
const COURSES=DATA.courses;
const KEY='trilha-prova-paulista-duas-materias-v1';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const stamp=n=>n?new Date(n).toLocaleString('pt-BR'):'—';
const duration=ms=>{const sec=Math.max(0,Math.floor(ms/1000));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')};
const replaceName=s=>s.replaceAll('{NOME}',state.name);
const icon=(name,cls='')=>{const paths={book:'<path d="M3 5c3-1 6 0 9 2 3-2 6-3 9-2v14c-3-1-6 0-9 2-3-2-6-3-9-2z"/><path d="M12 7v14"/>',career:'<rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12c6 3 12 3 18 0M10 13v3h4v-3"/>',stock:'<path d="m12 3 9 5-9 5-9-5 9-5ZM3 8v10l9 5 9-5V8M12 13v10M7 5.7l9 5v4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>',pen:'<path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14l-1 7Z"/>',focus:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',print:'<path d="M6 8V3h12v5M6 17H3V9h18v8h-3M6 14h12v7H6zM17 11h1"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',map:'<path d="m3 5 6-2 6 3 6-2v16l-6 2-6-3-6 2V5ZM9 3v16M15 6v16"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>',alert:'<path d="m12 3 10 18H2L12 3ZM12 9v5M12 17v1"/>',home:'<path d="m3 10 9-7 9 7v11h-6v-8H9v8H3V10Z"/>'};return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.book}</svg>`};
const newCourse=()=>({status:'new',station:0,phase:'read',index:0,startedAt:null,endedAt:null,read:[],confidence:{},answers:{},writings:{},events:[],focusMode:null});
const fresh=()=>({version:1,name:'',classroom:'2 SOL',createdAt:Date.now(),active:null,view:'home',courses:Object.fromEntries(COURSES.map(c=>[c.id,newCourse()]))});
let storageOK=true,storageReason='',state=restore(),toastTimer=null,pasteAt=0,lastFocus=null,lastSaveAt=0;
function validateState(s){
 if(!s||s.version!==1||typeof s.name!=='string'||typeof s.classroom!=='string'||!s.courses)throw Error('Formato de progresso incompatível.');
 if(s.active!==null&&!COURSES.some(c=>c.id===s.active))throw Error('Matéria inválida.');
 for(const c of COURSES){const p=s.courses[c.id];if(!p||!['new','active','completed'].includes(p.status)||![0,1].includes(p.station)||!['read','quiz','write'].includes(p.phase)||!Number.isInteger(p.index)||p.index<0||!Array.isArray(p.read)||!Array.isArray(p.events)||!p.answers||!p.writings)throw Error('Progresso incompleto.');
  p.confidence??={};if(typeof p.confidence!=='object'||Array.isArray(p.confidence)||Object.entries(p.confidence).some(([id,v])=>!c.lessons[Number(id)]||!['clear','review'].includes(v)))throw Error('Autoavaliação inválida.');
  const max=c.stations[p.station][{read:'lessons',quiz:'questions',write:'activities'}[p.phase]].length;if(p.index>=max)throw Error('Etapa fora da trilha.');
  if(p.startedAt!==null&&(!Number.isFinite(p.startedAt)||p.startedAt<=0))throw Error('Data de início inválida.');
  for(const [id,a] of Object.entries(p.answers)){if(!c.questions[Number(id)]||typeof a.reason!=='string'||(a.choice!==null&&!['A','B','C','D','E'].includes(a.choice))||!Number.isFinite(a.startedAt)||!Array.isArray(a.warnings))throw Error('Resposta inválida.');if(a.submittedAt!==null&&(!Number.isFinite(a.submittedAt)||a.submittedAt<a.startedAt||!a.choice||a.reason.trim().length<80))throw Error('Resposta enviada incompleta.');}
  for(const [id,w] of Object.entries(p.writings)){if(!c.activities[Number(id)]||typeof w.text!=='string'||(w.submittedAt!==null&&(!Number.isFinite(w.submittedAt)||w.text.trim().length<300)))throw Error('Atividade inválida.');}
  if(p.status==='completed'&&(!p.endedAt||c.questions.some(q=>!p.answers[q.id]?.submittedAt)||c.activities.some(a=>!p.writings[a.id]?.submittedAt)))throw Error('Conclusão incompleta.');
 }
 return s;
}
function restore(){try{const raw=localStorage.getItem(KEY);if(raw)return validateState(JSON.parse(raw));}catch(e){storageOK=false;storageReason='O progresso local não pôde ser lido. Você pode restaurar uma cópia ou continuar com uma nova sessão.';}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;storageReason='';lastSaveAt=Date.now();}catch(e){storageOK=false;storageReason='Este navegador não está salvando automaticamente. Use “Salvar progresso” antes de fechar.';}storageNotice()}
function storageNotice(){const e=$('storage-alert');if(!e)return;e.hidden=storageOK;if(!storageOK)e.textContent=storageReason||'Salvamento automático indisponível. Baixe uma cópia do progresso antes de fechar.'}
const course=()=>COURSES.find(c=>c.id===state.active);
const progress=()=>state.active?state.courses[state.active]:null;
const station=()=>course().stations[progress().station];
const live=()=>Boolean(state.active&&progress().status==='active'&&state.view==='work');
const fullscreen=()=>Boolean(document.fullscreenElement||document.webkitFullscreenElement);
const fullscreenCapable=()=>Boolean((document.documentElement.requestFullscreen&&document.fullscreenEnabled)||(document.documentElement.webkitRequestFullscreen&&document.webkitFullscreenEnabled));
const focusBlocked=()=>Boolean(live()&&fullscreenCapable()&&!fullscreen());
const questionData=()=>{if(!live()||progress().phase!=='quiz')return null;return course().questions[station().questions[progress().index]]};
const answerData=()=>{const q=questionData();return q?progress().answers[q.id]:null};
const openQuestion=()=>Boolean(questionData()&&!answerData()?.submittedAt);
function calcTime(ms){const delay=Math.max(0,ms-180000);const discount=Math.min(.5,Math.ceil(delay/30000)*.1);return {delay,discount,available:1-discount}}
function questionScore(q,a){if(!a?.submittedAt)return {points:0,correct:false,ms:0,...calcTime(0)};const ms=Math.max(0,a.submittedAt-a.startedAt);const t=calcTime(ms);const correct=a.choice===q.correct;return {...t,ms,correct,points:correct?t.available:0}}
function score(c){const p=state.courses[c.id];const all=c.questions.map(q=>questionScore(q,p.answers[q.id]));const correct=all.filter(a=>a.correct).length;const activities=c.activities.filter(a=>p.writings[a.id]?.submittedAt).length;const components=c.questions.length+c.activities.length;const raw=(correct+activities)/components*10;const points=all.reduce((s,a)=>s+a.points,0);const after=(points+activities)/components*10;const vacilos=p.events.filter(e=>!e.forgiven).length;return {correct,activities,components,raw,points,after,loss:raw-after,vacilos,final:Math.max(0,after-vacilos),totalTime:p.startedAt?Math.max(0,(p.endedAt||Date.now())-p.startedAt):0}}
function percent(c){const p=state.courses[c.id];const n=p.read.length+Object.values(p.answers).filter(a=>a.submittedAt).length+Object.values(p.writings).filter(a=>a.submittedAt).length;return Math.min(100,Math.round(n/(c.lessons.length+c.questions.length+c.activities.length)*100))}
function brand(){return `<div class="brand"><span class="brand-mark">${icon('spark')}</span><div><strong>Trilha do Conhecimento</strong><small>REVISÃO SEM MODO SONECA</small></div></div>`}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),6500)}
function render(){
 if(!state.name){state.active=null;state.view='home'}
 if(state.active&&state.view==='work'&&progress().status==='completed')state.view='report';
 $('app').innerHTML=state.active?renderWorkspace():renderHome();
 attachValues();updateHUD();syncFocus();storageNotice();
}
function renderHome(){
 const known=Boolean(state.name),complete=COURSES.every(c=>state.courses[c.id].status==='completed');
 return `<header class="topbar">${brand()}<div class="topbar-right"><span class="chip green">${icon('shield')} Funciona offline</span></div></header>
 <main id="main" class="landing" tabindex="-1"><section class="hero"><div><span class="chip violet">PROVA PAULISTA · REVISÃO DO BIMESTRE</span><h1>Menos “chute”.<br>Mais <span>“eu sei!”</span></h1><p class="hero-intro">Descubra o que você já acerta e o que ainda precisa revisar. Um conceito por vez, com explicação e sem enrolação.</p><div class="hero-flow"><span><b>1</b> Aprenda</span><span><b>2</b> Teste</span><span><b>3</b> Revise</span></div>${speech(known?`${state.name}, meu radar de conceitos está ligado. Bora descobrir o que já ficou na cabeça?`:'Tô de olho no seu raciocínio! Acertou? Eu comemoro. Errou? A gente entende o porquê.')}</div>
 <section class="sign-card">${known?`<span class="chip">${icon('user')} ${esc(state.classroom)}</span><h2 style="margin-top:18px">Bora, ${esc(state.name)}!</h2><p class="muted">${complete?'Missão cumprida! Seu mapa mostra os acertos e os temas que merecem mais uma rodada.':'Seu próximo passo é simples: escolha uma das matérias abaixo.'}</p><div class="next-cue"><span>👇</span><p><strong>${complete?'Confira seu mapa e seu boletim.':'Clique em “Começar” ou “Continuar”.'}</strong><br><small>O progresso é salvo neste navegador.</small></p></div>${complete?'<button class="btn lime full" data-action="combined">Ver meu boletim completo '+icon('arrow')+'</button>':'<button class="btn ghost full" data-action="backup">'+icon('download')+' Salvar uma cópia do progresso</button>'}`:`<span class="eyebrow">Primeiro, sua identificação</span><h2>Quem entrou no radar?</h2><form id="registration"><label for="student-name">Seu nome</label><input id="student-name" name="studentName" autocomplete="name" maxlength="100" placeholder="Digite seu nome completo" required><label for="classroom">Sua turma</label><input id="classroom" name="classroom" value="2 SOL" maxlength="60" required><p class="text-error" id="registration-error" hidden></p><button class="btn lime full" type="submit">Entrar na revisão ${icon('arrow')}</button></form><p class="hint" style="margin-top:16px">Preencha os dois campos e toque no botão. Depois, escolha a matéria.</p>`}</section></section>
