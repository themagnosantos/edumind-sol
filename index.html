:root{--bg-900:#0B1220;--bg-800:#121A2B;--glass-fill:rgba(255,255,255,.08);--glass-fill-2:rgba(255,255,255,.13);--glass-stroke:rgba(255,255,255,.18);--glass-blur:18px;--text-100:#F4F7FB;--text-300:#C3CCDA;--text-500:#8C98AC;--success:#22C55E;--error:#EF4444;--warn:#F59E0B;--info:#38BDF8;--r-sm:10px;--r-md:16px;--r-lg:24px;--r-pill:999px;--shadow-1:0 4px 16px rgba(0,0,0,.25);--shadow-2:0 12px 40px rgba(0,0,0,.35);--gap:clamp(12px,2.5vw,24px);--accent:#2563EB;--accent-2:#38BDF8;--font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 10%,#2563eb14,transparent 55%),var(--bg-900);color:var(--text-100);font:16px/1.65 var(--font-ui);min-height:100vh}body:before,body:after{content:"";position:fixed;width:32vw;height:32vw;background:var(--accent);filter:blur(100px);opacity:.07;border-radius:50%;pointer-events:none;z-index:-1}body:after{right:0;bottom:0}button,input,textarea{font:inherit}button{min-height:44px;border:1px solid var(--glass-stroke);border-radius:var(--r-sm);background:var(--glass-fill);color:var(--text-100);padding:12px 20px;cursor:pointer;transition:background .2s,transform .2s}button:hover:enabled{background:var(--glass-fill-2);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);color:#FFFFFF;font-weight:800;border:0}.primary:hover:enabled{background:var(--accent-2);color:#071824}:focus-visible{outline:3px solid var(--accent-2);outline-offset:4px}a{color:var(--accent-2)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.1rem,5vw,4rem);line-height:1.1;letter-spacing:-.045em;margin-bottom:20px}h2{font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.2}h3{line-height:1.3}.muted{color:var(--text-300)}.eyebrow{color:var(--accent-2);font:700 .8rem var(--font-mono);letter-spacing:.13em;text-transform:uppercase;margin-bottom:16px}.shell{width:min(1100px,100%);margin:auto;padding:36px 24px 120px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:42px;color:var(--text-300);font-size:.9rem}.brand svg{width:40px;height:40px;color:var(--accent-2)}.glass-card{background:var(--glass-fill);border:1px solid var(--glass-stroke);border-radius:var(--r-lg);padding:clamp(20px,3vw,32px);backdrop-filter:blur(var(--glass-blur));box-shadow:var(--shadow-1)}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center}.hero-subtitle{font-size:1.4rem;color:var(--accent-2)}.chip{display:inline-block;border:1px solid var(--glass-stroke);border-radius:var(--r-pill);padding:5px 12px;font-size:.8rem;color:var(--text-300);margin:0 6px 8px 0}.field-label{display:block;font-weight:650;margin:16px 0 8px}input,textarea{width:100%;min-width:0;background:#0b1220b3;border:1px solid var(--glass-stroke);border-radius:var(--r-sm);padding:14px;color:var(--text-100)}textarea{min-height:330px;resize:vertical;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.actions button{flex-shrink:1}.hud{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;background:#121a2bf2;border:1px solid var(--glass-stroke);border-radius:var(--r-pill);box-shadow:var(--shadow-2);padding:12px 22px;z-index:5;font-size:.85rem;font-family:var(--font-mono)}.hud-item{white-space:nowrap}.station-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);margin:28px 0}.station-card{display:flex;flex-direction:column;gap:10px}.station-card button{margin-top:auto}.station-num{font:700 2.5rem var(--font-mono);color:var(--accent-2)}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 28px}.step{padding:7px 12px;border-radius:var(--r-pill);color:var(--text-300);background:var(--glass-fill);font-size:.85rem}.step--active{border:1px solid var(--accent-2);color:var(--accent-2)}.narrative{max-width:850px;margin:auto}.narrative section{margin:0 0 28px}.command{border-left:3px solid var(--accent-2);background:var(--glass-fill);padding:24px;border-radius:var(--r-md)}.quiz-card{margin:18px 0}.quiz-alt{display:block;width:100%;text-align:left;margin-top:10px;opacity:1!important}.quiz-alt:disabled{color:var(--text-300)}.quiz-alt--correta{border:2px solid var(--success);background:#22c55e14;color:var(--text-100)!important}.quiz-alt--errada{border:2px solid var(--error);background:#ef444414;color:var(--text-100)!important}.feedback{padding:16px;border-radius:var(--r-sm);background:var(--glass-fill);margin-top:16px;color:var(--text-300)}.writing-area{width:100%}.counter{font-family:var(--font-mono);color:var(--warn);margin-top:8px}.counter--ok{color:var(--success)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}.metric strong{display:block;font-size:1.8rem;color:var(--accent-2)}.metric{padding:18px;background:var(--glass-fill);border-radius:var(--r-md);font-size:.85rem}.grade{font-size:clamp(3rem,9vw,6rem);line-height:1.2;color:var(--accent-2);font-weight:800}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));padding:16px 22px;background:#173344;border:1px solid var(--accent-2);border-radius:var(--r-md);box-shadow:var(--shadow-2);z-index:20}.toast:empty{display:none}.storage-warning{color:var(--warn);font-size:.85rem}.fullscreen-card{max-width:700px;margin:40px auto}.fullscreen-card h1{font-size:clamp(2rem,5vw,3rem)}.confetti{font-size:2rem;letter-spacing:12px;animation:celebrate 1s ease-out}@keyframes celebrate{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}.footer{margin-top:40px;font-size:.8rem;color:var(--text-300)}@media(max-width:720px){.hero,.station-grid{grid-template-columns:1fr}.shell{padding:24px 16px 140px}.brand{margin-bottom:28px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.hud{border-radius:var(--r-md);gap:5px 14px;font-size:.73rem}.actions button{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<script>
'use strict';
const CONFIG=Object.freeze({tema:'Gestão e Melhoria Contínua em Estoques',slug:'planejamento-gestao-estoques-4-estacoes',disciplina:'Planejamento e Organização de Estoques',turma:'',numEstacoes:4,questoesPorEstacao:3,minCaracteres:300,pesoVacilo:1,tetoVacilos:3});
const ESTACOES=[{"titulo": "Cadê o material? A reposição está atrasada!", "sub": "Tempo de reposição, demanda e risco de parar a linha", "icone": "01", "narrativa": [["Você entrou para o time da montadora", "{NOME}, você faz parte da equipe de logística de uma montadora de bicicletas. A missão é manter os materiais disponíveis para a produção seguir. Só que um item demora a chegar e falta com frequência. Antes de sair pedindo mais de tudo, pare e investigue: qual material está colocando a linha em risco? O material da aula mostra que planejar o estoque exige olhar para a demanda, o tempo de reposição, a importância de cada item e a continuidade da produção."], ["Lead time: entenda o prazo de reposição", "O nome parece complicado, mas a relação com o caso é direta: aqui, lead time é o tempo de reposição do material. Se um item demora para ser reposto e vive faltando, esse prazo é o primeiro fator a analisar. Compare o prazo planejado com o prazo real. Se a equipe planeja com um prazo, mas a entrega leva mais tempo, os atrasos precisam entrar na análise. Não basta olhar o que estava previsto e ignorar o que acontece de verdade."], ["O que tem hoje segura a produção até a entrega?", "Essa é a pergunta central: o estoque atual cobre a demanda até a chegada do material? Para responder, o estudo orienta observar consumo, lead time, atrasos, estoque atual e estoque de segurança. Também pede comparar se o problema está no consumo, no prazo ou na política de reposição. A falta de um item pode virar um gargalo de abastecimento e comprometer a continuidade da linha. O objetivo é descobrir o problema principal antes de escolher a mudança."], ["Planejamento se faz em equipe", "Depois de analisar o gargalo, avalie o estoque de segurança e a necessidade de revisar o ponto de pedido. Esses são elementos de controle citados no material e devem ser discutidos com compras, almoxarifado e produção. As áreas precisam conectar o que a operação consome ao que está disponível e ao que ainda vai chegar. O arquivo desta aula não traz a tabela numérica do roteiro: por isso, explique as relações sem inventar quantidades, prazos ou cálculos."], ["Você no comando: mostre seu raciocínio", "{NOME}, sua tarefa é explicar como investigaria a falta de material. Mostre o que compararia, quais informações buscaria e por que o tempo de reposição merece atenção. Use os termos técnicos, mas explique o que eles representam no caso. Não precisa escrever difícil: precisa conectar as informações e apresentar uma análise que a equipe consiga entender."]], "questoes": [["Um material demora para chegar e falta com frequência. O que você deve analisar primeiro?", ["A cor da embalagem.", "O tempo de reposição do material.", "O tamanho da etiqueta.", "O modelo da prateleira, sem olhar os prazos."], 1, "O tempo de reposição afeta diretamente a disponibilidade do material. É o primeiro fator indicado no estudo para investigar esse tipo de falta."], ["Para entender os atrasos, qual comparação faz sentido?", ["Comparar apenas o tamanho das embalagens.", "Considerar só o prazo planejado e ignorar as entregas reais.", "Usar o mesmo prazo para todos os itens sem analisar a operação.", "Comparar o lead time planejado com o lead time real."], 3, "O material orienta comparar o prazo de reposição planejado com o real. Assim, a análise considera os atrasos que podem ameaçar a produção."], ["Qual conjunto ajuda a analisar se o estoque cobre a espera pela reposição?", ["Consumo, lead time, atrasos, estoque atual e estoque de segurança.", "Somente a aparência das embalagens.", "Apenas a quantidade total de materiais, sem separar os itens.", "Somente o prazo planejado, sem considerar o consumo."], 0, "Essas são as informações apontadas no material para analisar o abastecimento. A pergunta é se o estoque disponível cobre a demanda até a chegada do material."]], "atividade": "Você está no time de logística da montadora e um item vive faltando. Explique, com suas palavras, como investigaria o problema. Relacione consumo, demanda, prazo planejado e real de reposição, estoque atual e estoque de segurança. Mostre por que compras, almoxarifado e produção precisam conversar antes de revisar o ponto de pedido. Use as relações do material, sem inventar números ou prazos."}, {"titulo": "Estoque lotado: está sobrando o que precisa?", "sub": "Capacidade de armazenagem e distribuição dos materiais", "icone": "02", "narrativa": [["Mais demanda, o mesmo espaço", "{NOME}, a demanda da montadora aumentou, mas o espaço de armazenagem continua igual. O desafio agora é entender se a capacidade do estoque acompanha o ritmo da operação. A primeira análise indicada no material é comparar essa capacidade com a demanda. Ignorar essa relação pode trazer falta de espaço, excesso de produtos ou rupturas no abastecimento. Ou seja: não é só colocar mais material para dentro e torcer para funcionar."], ["Cheio não significa equilibrado", "Um estoque pode ter muito material e ainda faltar o que a produção precisa. O estudo alerta que tanto a falta de itens críticos quanto o excesso de itens com baixa necessidade imediata prejudicam a operação. Por isso, observe quais materiais ocupam o espaço e quais precisam de mais atenção no controle. A quantidade total, sozinha, não explica se o estoque acompanha a demanda real."], ["Olhe para a distribuição, não só para o tamanho", "Pergunte: o espaço está sendo usado de forma estratégica? Há materiais ocupando capacidade além do necessário? O estoque está equilibrado com a demanda? Essas perguntas ajudam a analisar a distribuição dos itens no armazém. O material propõe reorganizar os materiais, revisar os níveis de estoque, priorizar os itens críticos e redistribuir o espaço. O foco é usar melhor a capacidade disponível, considerando o que a operação precisa."], ["Cada item merece uma análise", "Na gestão dos níveis de estoque, o estudo também pede atenção à rotatividade, aos prazos de validade e às estratégias de reposição. Não trate todos os materiais como se tivessem a mesma necessidade de controle. A organização deve buscar equilíbrio entre disponibilidade, espaço e eficiência. Sua proposta precisa mostrar por que uma mudança ajuda a atender à demanda e manter o ritmo da operação."], ["Você no comando: organize com propósito", "{NOME}, imagine que você vai explicar à equipe como melhorar o uso do armazém. Mostre o que observaria na capacidade, nos materiais parados e nos itens críticos. Proponha mudanças ligadas ao problema, em vez de só dizer que precisa de mais espaço. Nesta estação, a missão é conectar demanda, distribuição dos materiais e planejamento de armazenagem."]], "questoes": [["A demanda cresceu, mas o armazém continua com o mesmo espaço. O que analisar primeiro?", ["A capacidade do estoque em relação à demanda.", "A cor das embalagens.", "O leiaute do escritório, sem olhar o armazém.", "Apenas o tamanho das etiquetas."], 0, "A capacidade de estoque precisa ser comparada com a demanda e com o ritmo da operação. Essa é a análise indicada no material para o cenário apresentado."], ["Um armazém está cheio. Isso garante que a produção tenha os materiais necessários?", ["Sim, porque o volume total elimina qualquer risco de falta.", "Sim, porque itens críticos e itens parados têm sempre a mesma necessidade.", "Não. Pode haver excesso de materiais com baixa necessidade e falta de itens críticos.", "Não é necessário analisar a distribuição dos materiais."], 2, "O material alerta para o desequilíbrio: excesso de itens com baixa necessidade imediata e falta de itens críticos podem acontecer ao mesmo tempo."], ["Qual proposta combina com o planejamento de armazenagem descrito na aula?", ["Manter os mesmos níveis de estoque mesmo quando a demanda muda.", "Reorganizar materiais, revisar níveis de estoque, priorizar itens críticos e redistribuir o espaço.", "Controlar todos os itens sem considerar sua necessidade na operação.", "Observar apenas o espaço total, sem analisar o que está armazenado."], 1, "Essas são as propostas citadas no material para alinhar o uso do espaço e os níveis de estoque à demanda real."]], "atividade": "A demanda da montadora aumentou, mas o espaço não. Escreva uma proposta para usar melhor a capacidade do estoque. Explique por que um armazém cheio ainda pode ter falta de materiais importantes. Relacione a distribuição dos itens, a demanda, a rotatividade, os prazos de validade e as estratégias de reposição à sua proposta. Justifique como priorizaria os itens críticos, sem inventar dados."}, {"titulo": "Onde a operação está travando?", "sub": "Diagnóstico de faltas, excessos, perdas e retrabalho", "icone": "03", "narrativa": [["Tem material parado e pedido esperando", "{NOME}, a montadora tem produtos parados e dificuldade para atender novos pedidos. Esse cenário pode indicar problemas nos níveis de estoque e na capacidade produtiva. Agora você precisa ir além da descrição do problema. Dizer que está tudo bagunçado não explica o que está acontecendo. Sua missão é relacionar os desvios às consequências que eles trazem para a linha de montagem."], ["Procure os sinais do problema", "O estudo destaca três desvios: falta, excesso e má distribuição de materiais. Eles podem gerar perdas, paradas, retrabalho e desequilíbrio na operação. Observe qual problema está afetando mais a produção naquele momento. A dificuldade vem de uma ruptura, de um excesso ou da desorganização? Não escolha uma causa só porque parece a mais óbvia. Analise como os sinais se conectam ao funcionamento da operação."], ["Capacidade de estoque e capacidade produtiva", "Nas etapas anteriores, você analisou o espaço e o abastecimento. Agora conecte essas informações ao ritmo da produção. O material mostra que os problemas nos níveis de estoque podem comprometer diretamente a capacidade produtiva. Por isso, a análise precisa considerar o estoque, o fluxo dos materiais, o uso da capacidade, as perdas operacionais e o impacto na linha. Olhar cada parte isolada pode deixar o diagnóstico incompleto."], ["Diagnóstico: conecte causa e consequência", "Um diagnóstico profissional precisa mostrar o que foi observado e como isso afeta a produção. O material propõe identificar os sinais de um problema sistêmico: isso pede olhar o conjunto da operação, em vez de tratar cada dificuldade como um caso separado. Use as relações da aula para explicar por que faltas, excessos ou falhas de organização prejudicam o desempenho. A proposta de correção vem depois de entender o problema."], ["Você no comando: explique para a supervisão", "{NOME}, você vai apresentar sua análise à supervisão. Escolha os desvios do cenário, relacione-os às perdas, às paradas ou ao retrabalho e mostre por que precisam de atenção. Use frases claras. O objetivo é demonstrar pensamento crítico e responsabilidade, sem culpar uma área por algo que você ainda não investigou."]], "questoes": [["Materiais parados e dificuldade para atender novos pedidos podem indicar o quê?", ["Reposição sempre adequada.", "Previsão de demanda necessariamente correta.", "Fluxo equilibrado em todas as etapas.", "Problemas nos níveis de estoque e na capacidade produtiva."], 3, "O material relaciona esse cenário a problemas nos níveis de estoque e na capacidade produtiva. Ter materiais parados não significa que a operação esteja atendendo bem à demanda."], ["Qual análise é mais completa para investigar o problema da montadora?", ["Observar apenas a quantidade total no armazém.", "Analisar apenas a linha de montagem, sem olhar os materiais.", "Relacionar estoque, fluxo de materiais, uso da capacidade, perdas e impacto na linha.", "Escolher uma causa antes de verificar os sinais da operação."], 2, "O estudo pede um olhar integrado. Estoque, fluxo, capacidade, perdas e efeitos na linha precisam ser relacionados no diagnóstico."], ["Qual relação entre desvios e consequências aparece no material?", ["Faltas, excessos e má distribuição podem gerar perdas, paradas, retrabalho e desequilíbrio.", "Excesso de materiais garante que todos os pedidos serão atendidos.", "Má distribuição não interfere no ritmo da produção.", "Faltas de materiais não têm relação com a capacidade produtiva."], 0, "O material apresenta esses desvios e seus impactos na operação. Construir um diagnóstico é relacionar as causas observadas às consequências para a produção."]], "atividade": "Prepare uma mensagem profissional para a supervisão da montadora. O cenário é: há materiais parados e dificuldade para atender novos pedidos. Explique quais sinais investigaria, como faltas, excessos ou má distribuição podem afetar a produção e que consequências observaria. Conecte estoque, fluxo de materiais e capacidade produtiva. Escreva de forma clara e fundamente o diagnóstico antes de sugerir uma correção."}, {"titulo": "Bora melhorar: resolva hoje e acompanhe depois", "sub": "Prioridades, ações corretivas, prevenção e melhoria contínua", "icone": "04", "narrativa": [["Agora é hora de decidir", "{NOME}, sua equipe identificou um item acima do necessário, ocupando espaço e dificultando a organização do armazém. Ao mesmo tempo, outros materiais de maior saída correm risco de faltar nos próximos dias. A missão é escolher uma prioridade sem criar novos problemas. O material apresenta duas estratégias possíveis e pede que a equipe justifique a decisão com base nos impactos para a operação."], ["Duas estratégias, justificativas diferentes", "Uma opção é reorganizar o espaço e redistribuir os estoques imediatamente, priorizando os itens críticos. Essa ação reduz rapidamente o risco de falta e melhora a fluidez no curto prazo. A outra é manter a organização por enquanto e revisar primeiro os parâmetros de reposição e controle. Essa revisão atua na causa raiz, buscando evitar a repetição das falhas. Não há uma única resposta correta para esse dilema: as duas podem ser defendidas com uma boa justificativa."], ["Também dá para combinar as ações", "O material apresenta uma solução intermediária: juntar a ação emergencial de curto prazo com a revisão técnica dos critérios de controle no médio e no longo prazo. Então, não basta dizer que vai fazer tudo. Explique o que priorizaria, por que essa escolha faz sentido e como a revisão posterior ajudaria a evitar o mesmo problema. Considere o espaço, o risco de faltas e a eficiência da operação."], ["Melhoria contínua pede acompanhamento", "O estudo orienta transformar o diagnóstico em ações corretivas, preventivas e de acompanhamento. Entre as práticas citadas estão revisar estoques mínimos e de segurança, ajustar o ponto de pedido, organizar fisicamente os materiais, controlar perdas e usar o espaço de forma estratégica. Compras, almoxarifado e produção devem atuar de forma integrada. Monitorar, revisar processos e fazer ajustes constantes faz parte da melhoria: uma mudança isolada não encerra o trabalho."], ["Use as práticas que a aula desenvolveu", "A unidade menciona Lean Manufacturing, Six Sigma e Just in Time no contexto da melhoria contínua, mas o arquivo não explica métodos específicos dessas abordagens. Nesta missão, use as práticas de estoque que foram realmente apresentadas. Demonstre iniciativa, pensamento crítico e responsabilidade. Sua resposta precisa ajudar a equipe a entender a decisão e o acompanhamento, sem inventar fórmulas, prazos ou resultados."], ["Você no comando: defenda seu plano", "{NOME}, escolha uma estratégia ou uma combinação e explique sua prioridade. Mostre o que faria para corrigir o problema atual, evitar novas falhas e acompanhar a operação com as áreas envolvidas. Não existe uma frase secreta que vale a resposta certa. O professor vai analisar se sua justificativa faz sentido e se você conectou o plano ao caso da montadora."]], "questoes": [["No dilema da aula, existe uma única estratégia que todos precisam escolher?", ["Sim. Apenas reorganizar o espaço pode ser aceito.", "Não. As duas estratégias podem ser justificadas, e a combinação delas também é apresentada.", "Sim. Apenas revisar parâmetros pode ser acei let state=novoEstado(),storageOk=true,lastTick=Date.now(),toastTimer,lastVacilo={aba:-1,colar:-1},pasteStamp=0;

function emTelaCheia(){return Boolean(document.fullscreenElement||document.webkitFullscreenElement)}

function suporteTelaCheia(){const root=document.documentElement;return Boolean(root&&(root.requestFullscreen||root.webkitRequestFullscreen))}
async function solicitarTelaCheia(){
  if(emTelaCheia())return true;
  const root=document.documentElement,request=root&&(root.requestFullscreen||root.webkitRequestFullscreen);
  if(!request){toast('Este navegador não oferece o modo de tela cheia necessário. Abra o arquivo em um navegador compatível para realizar a atividade.');return false;}
  try{await request.call(root);if(emTelaCheia())return true;}catch(e){}

}

let ultimaTelaCheia=emTelaCheia();

t=e=>{state.aluno=e.target.value;document.getElementById('inicioComecar').disabled=!state.aluno.trim();save()};document.getElementById('inicioComecar').onclick=async()=>{if(!state.aluno.trim())return;if(!await solicitarTelaCheia())return;state.iniciadoEm=state.iniciadoEm||new Date().toISOString();lastTick=Date.now();irPara('mapa')}}

function bloquearColagem(ev){ev.preventDefault();const now=Date.now();if(now-pasteStamp<500)return;pasteStamp=now;addVacilo('colar')}
const mensagens={"aba": ["{NOME}, a rota do planejamento passa por esta aba. Vamos retomar! 🚲", "Opa, {NOME}! Sua missão na montadora está aqui. 📦", "{NOME}, o estoque espera sua atenção. Vamos manter o foco! 📋", "Atenção na operação, {NOME}: saída da aba registrada. 🧭", "{NOME}, mudou de aba? Reorganize a rota da atenção. 😅", "Ei, {NOME}, seu posto nesta missão é aqui! 🚲", "{NOME}, atenção em trânsito! Volte ao plano de estoques. 🚦", "Uma parada fora da rota, {NOME}. Agora é foco na melhoria! 📋"], "colar": ["{NOME}, o plano de estoques precisa das suas palavras. Digite sua ideia! ✍️", "Opa, {NOME}! A conferência encontrou uma colagem. Conte o que aprendeu! 📋", "{NOME}, colagem bloqueada. Sua explicação tem valor! 🧠", "Ei, {NOME}, esse diagnóstico precisa ser construído por você. Vamos tentar! 📦", "{NOME}, esse atalho não passa pela conferência. Vamos digitar! 😅", "Conhecimento autoral em primeiro lugar, {NOME}! ✍️", "A coragem de tentar vale, {NOME}! Agora construa seu próprio texto. 💡", "Alerta na montadora, {NOME}: deixe a colagem de lado e explique sua decisão! 🚲"]};
function addVacilo(tipo){if(state.tela!=='estacao'||![2,3].includes(state.passoAtual)||state.finalizadoEm)return;tick();state.vacilos++;state.eventosVacilo.push({tipo,ts:new Date().toISOString()});save();hud();const options=mensagens[tipo].map((v,i)=>i).filter(i=>i!==lastVacilo[tipo]);const idx=options[Math.floor(Math.random()*options.length)];lastVacilo[tipo]=idx;toast(personalizado(mensagens[tipo][idx])+' Desconto acumulado: '+numero(Math.min(state.vacilos*CONFIG.pesoVacilo,CONFIG.tetoVacilos))+'.')}
document.addEventListener('visibilitychange',()=>{tick();if(document.hidden)addVacilo('aba');save()});window.addEventListener('pagehide',()=>{tick();save()});document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='m'){e.preventDefault();state.vacilos=0;state.eventosVacilo=[];save();hud();if(state.tela==='resultado')renderResultado();toast('Vacilos zerados. Respostas e progresso preservados.')}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='r'){e.preventDefault();if(!confirm('Apagar todo o progresso desta trilha e começar novamente?'))return;state=novoEstado();lastTick=Date.now();save();render();toast('Trilha reiniciada com sucesso.')}});
function calcularNota(){const acertos=state.estacoes.reduce((n,e)=>n+e.respostas.filter(r=>r.correta===true).length,0),atividadesOk=state.estacoes.filter(e=>e.textoConcluido).length,totalComponentes=(CONFIG.questoesPorEstacao+1)*CONFIG.numEstacoes,notaConteudo=(acertos+atividadesOk)/totalComponentes*10,desconto=Math.min(state.vacilos*CONFIG.pesoVacilo,CONFIG.tetoVacilos),mediaFinal=Math.max(0,Math.min(10,notaConteudo-desconto));return{acertos,atividadesOk,totalComponentes,notaConteudo,desconto,mediaFinal}}
function finalizar(){if(!podeInteragir()){render();return;}if(!state.estacoes.every(e=>e.concluida))return;tick();state.finalizadoEm=state.finalizadoEm||new Date().toISOString();irPara('resultado')}
function desempenho(n){return personalizado(n>=8.5?'🚀 {NOME}, você mandou MUITO bem!':n>=6?'👍 {NOME}, foi uma boa caminhada, mas alguns conceitos ainda precisam de treino.':n>=5?'⚠️ {NOME}, deu pra passar, mas vale revisar os pontos que escaparam.':'📚 {NOME}, é hora de voltar aos estudos e revisar os materiais antes da próxima missão.')}
function data(v){return new Date(v).toLocaleString('pt-BR')}
function renderResultado(){const n=calcularNota();app.innerHTML=`<div class="eyebrow">Missão concluída · boletim</div><section class="glass-card"><h1>Seu percurso tem resultado.</h1>${n.mediaFinal>=8.5?'<div class="confetti" aria-hidden="true">🎉 📦 ✨ 🚀</div>':''}<p>${esc(state.aluno)} · ${CONFIG.tema}${CONFIG.turma?' · '+esc(CONFIG.turma):''}<br><span class="muted">${data(state.finalizadoEm)}</span></p><div class="grade">${numero(n.mediaFinal)}<span style="font-size:1.2rem"> / 10</span></div><p>${esc(desempenho(n.mediaFinal))}</p><div class="metrics"><div class="metric"><strong>${n.acertos}/${CONFIG.numEstacoes*CONFIG.questoesPorEstacao}</strong>Acertos no quiz</div><div class="metric"><strong>${n.atividadesOk}/${CONFIG.numEstacoes}</strong>Atividades concluídas</div><div class="metric"><strong>${numero(n.notaConteudo)}</strong>Nota de conteúdo</div><div class="metric"><strong>${state.vacilos}</strong>Vacilos · desconto ${numero(n.desconto)}</div><div class="metric"><strong>${formatarTempo(state.tempoTotalMs)}</strong>Tempo total</div><div class="metric"><strong>${CONFIG.numEstacoes}/${CONFIG.numEstacoes}</strong>Estações concluídas</div></div>${ESTACOES.map((e,i)=>`<p>✅ Estação ${i+1} · ${e.titulo}: ${state.estacoes[i].respostas.filter(r=>r.correta).length}/${CONFIG.questoesPorEstacao} acertos · atividade concluída.</p>`).join('')}<p class="muted">Concluir cada texto conta como uma parte da nota. O professor vai avaliar se suas ideias estão bem explicadas e fazem sentido com o conteúdo.</p><p><em>Este documento registra a resposta enviada pelo estudante.</em></p><div class="actions"><button id="resultadoImprimir" class="primary">🖨️ Imprimir / salvar PDF — enviar para o registro</button></div><p class="muted">Na janela de impressão, escolha “Salvar como PDF” e envie o arquivo pelo canal indicado pelo professor.</p></section>`;document.getElementById('resultadoImprimir').onclick=montarDocumentoImpressao}
function documentoImpressao(){const n=calcularNota();return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Atividade — ${esc(state.aluno)} — ${CONFIG.tema}</title><style>body{font:11pt/1.55 system-ui,sans-serif;color:#152332;max-width:190mm;margin:20px auto;padding:15px}h1{font-size:23pt}h2{font-size:17pt;border-bottom:1px solid #aaa;margin-top:28px}h3{font-size:13pt;margin-top:22px}p{margin:8px 0}.meta{background:#f1f5f9;padding:16px}.student-text{white-space:pre-wrap;overflow:visible;overflow-wrap:anywhere;word-break:break-word;height:auto;max-height:none;line-height:1.6}.question{margin:20px 0}footer{border-top:1px solid #aaa;margin-top:25px;font-size:9pt}@page{size:A4;margin:16mm}@media print{body{margin:0;padding:0;max-width:none}.print-button{display:none}.student-text{overflow:visible!important;white-space:pre-wrap!important;max-height:none!important;height:auto!important;break-inside:auto!important;page-break-inside:auto!important}.writing{break-inside:auto;page-break-inside:auto}h2,h3{break-after:avoid}}</style></head><body><button class="print-button" onclick="window.print()">Imprimir / salvar PDF</button><header><p>EDUCAÇÃO PROFISSIONAL PAULISTA · Técnico em Logística</p><h1>Trilha do Conhecimento</h1><div class="meta"><b>Estudante:</b> ${esc(state.aluno)}<br><b>Tema:</b> ${CONFIG.tema}<br><b>Disciplina:</b> ${CONFIG.disciplina}${CONFIG.turma?'<br><b>Turma:</b> '+esc(CONFIG.turma):''}<br><b>Identificação:</b> trilha-${CONFIG.slug} · v1<br><b>Início:</b> ${data(state.iniciadoEm)}<br><b>Conclusão:</b> ${data(state.finalizadoEm)}</div></header><h2>Resultado</h2><p>Acertos: ${n.acertos}/${CONFIG.numEstacoes*CONFIG.questoesPorEstacao} · Atividades concluídas: ${n.atividadesOk}/${CONFIG.numEstacoes}<br>Nota de conteúdo: ${numero(n.notaConteudo)} · Vacilos: ${state.vacilos} · Desconto: ${numero(n.desconto)}<br>Tempo total: ${formatarTempo(state.tempoTotalMs)} · <b>Média final: ${numero(n.mediaFinal)}/10</b></p><p>${esc(desempenho(n.mediaFinal))}</p><p>Fórmula: (acertos + atividades concluídas) / ${n.totalComponentes} × 10; desconto de ${numero(CONFIG.pesoVacilo)} por vacilo, limitado a ${numero(CONFIG.tetoVacilos)} pontos; nota final entre 0 e 10.</p><p>Cada texto concluído conta como uma parte da nota. O professor avalia a qualidade das ideias e a relação com o conteúdo.</p><h3>Registro de vacilos</h3>${state.eventosVacilo.length?'<ul>'+state.eventosVacilo.map(v=>'<li>'+esc(v.tipo==='aba'?'Saída da aba/página':'Tentativa de colagem')+' · '+data(v.ts)+'</li>').join('')+'</ul>':'<p>Nenhum vacilo registrado.</p>'}${ESTACOES.map((e,i)=>{const s=state.estacoes[i];return `<section><h2>Estação ${i+1} — ${e.titulo}</h2><p>Acertos: ${s.respostas.filter(r=>r.correta).length}/${CONFIG.questoesPorEstacao} · Atividade: ${s.textoConcluido?'concluída':'pendente'}</p>${e.questoes.map((q,j)=>{const r=s.respostas[j];return `<div class="question"><h3>Questão ${j+1} — ${q[0]}</h3>${q[1].map((a,k)=>'<p>'+String.fromCharCode(65+k)+'. '+a+'</p>').join('')}<p><b>Alternativa marcada:</b> ${r.escolha===null?'Sem resposta':String.fromCharCode(65+r.escolha)+'. '+q[1][r.escolha]}<br><b>Alternativa correta:</b> ${String.fromCharCode(65+q[2])}. ${q[1][q[2]]}<br><b>Resultado:</b> ${r.correta?'Correta':'Incorreta'} · <b>Tempo da questão:</b> ${formatarTempo(r.tempoMs)}</p><p><b>Explicação:</b> ${q[3]}</p></div>`}).join('')}<section class="writing"><h3>Atividade escrita — resposta integral</h3><p><b>Proposta:</b> ${e.atividade}</p><p>Caracteres: ${s.texto.length} · Tempo de escrita: ${formatarTempo(s.tempoAtividadeMs)}</p><div class="student-text">${esc(s.texto)}</div></section></section>`}).join('')}<footer>Este documento registra a resposta enviada pelo estudante.<br>Professor Magno Vieira dos Santos · Gerado em ${data(new Date().toISOString())}</footer></body></html>`}
function montarDocumentoImpressao(){const w=window.open('','_blank');if(!w){toast('Permita a abertura da janela de impressão neste navegador e tente novamente.');return}w.document.open();w.document.write(documentoImpressao());w.document.close();w.focus();w.setTimeout(()=>w.print(),300)}
load();lastTick=Date.now();tick();render();setInterval(()=>{tick();hud();if(state.iniciadoEm&&!state.finalizadoEm)save()},1000);
</script></body></html>
