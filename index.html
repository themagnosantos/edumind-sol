<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B1220"><title>Trilha do Conhecimento • Iniciação Empreendedora</title>
<style>
:root{--bg-900:#0B1220;--bg-800:#121A2B;--glass-fill:rgba(255,255,255,.08);--glass-fill-2:rgba(255,255,255,.13);--glass-stroke:rgba(255,255,255,.18);--glass-blur:18px;--text-100:#F4F7FB;--text-300:#C3CCDA;--text-500:#8C98AC;--success:#22C55E;--error:#EF4444;--warn:#F59E0B;--info:#38BDF8;--r-sm:10px;--r-md:16px;--r-lg:24px;--r-pill:999px;--shadow-1:0 4px 16px rgba(0,0,0,.25);--shadow-2:0 12px 40px rgba(0,0,0,.35);--gap:clamp(12px,2.5vw,24px);--accent:#2563EB;--accent-2:#38BDF8;--font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 10%,#2563eb14,transparent 55%),var(--bg-900);color:var(--text-100);font:16px/1.65 var(--font-ui);min-height:100vh}body:before,body:after{content:"";position:fixed;width:32vw;height:32vw;background:var(--accent);filter:blur(100px);opacity:.07;border-radius:50%;pointer-events:none;z-index:-1}body:after{right:0;bottom:0}button,input,textarea{font:inherit}button{min-height:44px;border:1px solid var(--glass-stroke);border-radius:var(--r-sm);background:var(--glass-fill);color:var(--text-100);padding:12px 20px;cursor:pointer;transition:background .2s,transform .2s}button:hover:enabled{background:var(--glass-fill-2);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);color:#FFFFFF;font-weight:800;border:0}.primary:hover:enabled{background:var(--accent-2);color:#071824}:focus-visible{outline:3px solid var(--accent-2);outline-offset:4px}a{color:var(--accent-2)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.1rem,5vw,4rem);line-height:1.1;letter-spacing:-.045em;margin-bottom:20px}h2{font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.2}h3{line-height:1.3}.muted{color:var(--text-300)}.eyebrow{color:var(--accent-2);font:700 .8rem var(--font-mono);letter-spacing:.13em;text-transform:uppercase;margin-bottom:16px}.shell{width:min(1100px,100%);margin:auto;padding:36px 24px 120px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:42px;color:var(--text-300);font-size:.9rem}.brand svg{width:40px;height:40px;color:var(--accent-2)}.glass-card{background:var(--glass-fill);border:1px solid var(--glass-stroke);border-radius:var(--r-lg);padding:clamp(20px,3vw,32px);backdrop-filter:blur(var(--glass-blur));box-shadow:var(--shadow-1)}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center}.hero-subtitle{font-size:1.4rem;color:var(--accent-2)}.chip{display:inline-block;border:1px solid var(--glass-stroke);border-radius:var(--r-pill);padding:5px 12px;font-size:.8rem;color:var(--text-300);margin:0 6px 8px 0}.field-label{display:block;font-weight:650;margin:16px 0 8px}input,textarea{width:100%;min-width:0;background:#0b1220b3;border:1px solid var(--glass-stroke);border-radius:var(--r-sm);padding:14px;color:var(--text-100)}textarea{min-height:330px;resize:vertical;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.actions button{flex-shrink:1}.hud{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;background:#121a2bf2;border:1px solid var(--glass-stroke);border-radius:var(--r-pill);box-shadow:var(--shadow-2);padding:12px 22px;z-index:5;font-size:.85rem;font-family:var(--font-mono)}.hud-item{white-space:nowrap}.station-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);margin:28px 0}.station-card{display:flex;flex-direction:column;gap:10px}.station-card button{margin-top:auto}.station-num{font:700 2.5rem var(--font-mono);color:var(--accent-2)}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 28px}.step{padding:7px 12px;border-radius:var(--r-pill);color:var(--text-300);background:var(--glass-fill);font-size:.85rem}.step--active{border:1px solid var(--accent-2);color:var(--accent-2)}.narrative{max-width:850px;margin:auto}.narrative section{margin:0 0 28px}.command{border-left:3px solid var(--accent-2);background:var(--glass-fill);padding:24px;border-radius:var(--r-md)}.quiz-card{margin:18px 0}.quiz-alt{display:block;width:100%;text-align:left;margin-top:10px;opacity:1!important}.quiz-alt:disabled{color:var(--text-300)}.quiz-alt--correta{border:2px solid var(--success);background:#22c55e14;color:var(--text-100)!important}.quiz-alt--errada{border:2px solid var(--error);background:#ef444414;color:var(--text-100)!important}.feedback{padding:16px;border-radius:var(--r-sm);background:var(--glass-fill);margin-top:16px;color:var(--text-300)}.writing-area{width:100%}.counter{font-family:var(--font-mono);color:var(--warn);margin-top:8px}.counter--ok{color:var(--success)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}.metric strong{display:block;font-size:1.8rem;color:var(--accent-2)}.metric{padding:18px;background:var(--glass-fill);border-radius:var(--r-md);font-size:.85rem}.grade{font-size:clamp(3rem,9vw,6rem);line-height:1.2;color:var(--accent-2);font-weight:800}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));padding:16px 22px;background:#173344;border:1px solid var(--accent-2);border-radius:var(--r-md);box-shadow:var(--shadow-2);z-index:20}.toast:empty{display:none}.storage-warning{color:var(--warn);font-size:.85rem}.fullscreen-card{max-width:700px;margin:40px auto}.fullscreen-card h1{font-size:clamp(2rem,5vw,3rem)}.confetti{font-size:2rem;letter-spacing:12px;animation:celebrate 1s ease-out}@keyframes celebrate{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}.footer{margin-top:40px;font-size:.8rem;color:var(--text-300)}@media(max-width:720px){.hero,.station-grid{grid-template-columns:1fr}.shell{padding:24px 16px 140px}.brand{margin-bottom:28px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.hud{border-radius:var(--r-md);gap:5px 14px;font-size:.73rem}.actions button{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><div class="shell"><header class="brand"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 15 24 6l16 9v18l-16 9L8 33Z M8 15l16 9 16-9M24 24v18" stroke="currentColor" stroke-width="2.5"/><path d="m17 11 15 9" stroke="currentColor" stroke-width="2.5"/></svg><span>EDUCAÇÃO PROFISSIONAL PAULISTA<br><b>Trilha do Conhecimento</b></span></header><div id="storageAviso" class="storage-warning" role="status"></div><main id="app"></main><footer class="footer">Iniciação Empreendedora · Unidade 6 — Construindo Soluções<br>Professor Magno Vieira dos Santos<br></footer></div><aside id="hud" class="hud" aria-label="Progresso da missão"></aside><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const CONFIG=Object.freeze({tema:'Construindo Soluções: do Cliente à Ideia',slug:'empreendedorismo-construindo-solucoes-40min',disciplina:'Iniciação Empreendedora',turma:'',numEstacoes:4,questoesPorEstacao:4,minCaracteres:500,minTempoTotalMin:40,pesoVacilo:1,tetoVacilos:3});
const ESTACOES=[{"titulo": "Uma ideia boa… para quem?", "sub": "Público-alvo, persona e recorte do problema", "icone": "01", "narrativa": [["Seu projeto começa pelas pessoas", "{NOME}, você recebeu uma missão: construir uma solução que faça sentido para quem vai usá-la. Parece simples, mas uma ideia bem planejada ainda pode não funcionar. O material propõe olhar tanto para o produto quanto para as pessoas a quem ele foi oferecido. Antes de defender sua ideia, descubra quem vive o problema. Nesta trilha, o caso dos estudantes que têm dificuldade para lembrar provas, trabalhos e atividades será o ponto de partida para suas decisões."], ["Público-alvo não é todo mundo que viu a ideia", "Público-alvo é o grupo que a empresa quer atingir. Essas pessoas compartilham características, interesses e necessidades: faixa etária, profissão ou rotina; interesse por tecnologia, esportes ou leitura; necessidade de economizar tempo ou se alimentar melhor. Conhecer um produto não basta para definir esse grupo, e já ter comprado também não é uma condição para pertencer a ele. O exemplo da aula é estudantes do ensino médio. O recorte orienta para quem a solução está sendo construída."], ["Persona aproxima o olhar", "A persona é um perfil mais detalhado da pessoa ideal. O exemplo é Lucas, 16 anos, que gosta de tecnologia e procura formas práticas de estudar e organizar a rotina. Compare: estudantes do ensino médio é o grupo geral; Lucas é um perfil detalhado. A persona não deve substituir o entendimento das necessidades do grupo. Um perfil só ajuda a decisão quando idade, rotina, hábitos e problema se conectam à solução pensada."], ["Nem todo estudante precisa da mesma coisa", "O material pergunta se todos os estudantes têm as mesmas necessidades e se jovens e adultos compartilham as mesmas prioridades. Tentar atender a todo mundo pode dificultar uma solução eficiente. Um público mais específico permite ajustar melhor a proposta. Isso não significa apenas colocar mais adjetivos na descrição: é explicar quem enfrenta o problema e como ele aparece no cotidiano. No caso dos prazos escolares, alguns colegas já usam agendas ou o celular. Estar na mesma turma não garante a mesma necessidade de outra ferramenta."], ["Você no comando: escolha e justifique", "{NOME}, separe o grupo que pretende atender do perfil detalhado que usará para pensar a experiência. Explique o problema, a rotina e por que uma solução poderia fazer sentido. Trate o perfil que você construir como hipótese para análise, sem fingir que entrevistou pessoas ou coletou dados. Sua tarefa é ligar o recorte às decisões, não apenas escrever uma descrição simpática."]], "questoes": [["Uma equipe escreve “estudantes do ensino médio” e, depois, “Lucas, 16 anos, gosta de tecnologia e busca organizar os estudos”. Qual leitura está correta?", ["O primeiro registro é a persona; o segundo é o público-alvo, porque tem mais detalhes.", "Os dois registros são públicos-alvo e a diferença é apenas o tamanho da descrição.", "O primeiro indica o público-alvo; o segundo exemplifica uma persona mais detalhada.", "Os dois registros são personas, porque descrevem pessoas que poderiam usar a solução."], 2, "O público-alvo é o grupo geral. A persona detalha um perfil, como Lucas, com idade, interesses e necessidade de organização. Os dois níveis ajudam a pensar a solução, mas não são sinônimos."], ["No caso dos prazos escolares, qual recorte é mais coerente com a ideia de público-alvo?", ["Estudantes que enfrentam dificuldade para acompanhar prazos, considerando características e necessidades em comum.", "Todas as pessoas que receberam o link da proposta, considerando a divulgação como prova da necessidade.", "Somente estudantes que já usaram a planilha, considerando o uso anterior como requisito para fazer parte do público.", "Qualquer pessoa que goste de tecnologia, considerando o interesse geral suficiente para definir o problema."], 0, "O recorte deve relacionar o grupo à necessidade que a solução pretende atender. Receber o link, já ter usado a planilha ou gostar de tecnologia não prova, sozinho, a existência dessa necessidade."], ["A equipe decide atender “qualquer pessoa, com qualquer rotina”. Qual revisão responde melhor ao problema apontado na aula?", ["Manter o grupo amplo e detalhar apenas as funções da solução, sem revisar para quem ela serve.", "Trocar o nome da persona e manter a mesma proposta para todas as necessidades do grupo.", "Escolher apenas uma faixa etária e considerar dispensável investigar a rotina e o problema.", "Definir quem vive o problema e usar suas características e necessidades para ajustar a proposta."], 3, "O material relaciona especificidade do público à adequação da solução. O recorte precisa orientar decisões sobre a proposta, em vez de funcionar apenas como uma descrição formal."], ["Uma ideia foi bem organizada, mas teve pouca adesão. Qual conclusão é mais consistente com a aula?", ["O planejamento da execução já comprova a adequação; a análise deve se limitar ao produto.", "A baixa adesão exige investigar a relação entre público, necessidade e proposta, mesmo com um bom planejamento.", "A falta de uso demonstra que o grupo não tem necessidades, pois a solução já estava pronta.", "A melhor resposta é ampliar o público sem revisar o que foi oferecido às pessoas."], 1, "Uma ideia pode falhar por desalinhamento com as necessidades do público. Organização e planejamento não substituem compreender para quem a solução foi criada."]], "atividade": "Use o problema dos prazos escolares como base. Defina um público-alvo específico e crie uma persona coerente com ele, apresentando rotina, hábitos, problema e necessidade. Diferencie os dois conceitos. Compare seu recorte com a proposta de atender a turma inteira e justifique uma decisão que mudaria no produto, na forma de oferecer ou no valor gerado. Explique também por que gostar de tecnologia ou receber o link não basta para comprovar a necessidade. Apresente a persona como hipótese, sem inventar pesquisa realizada."}, {"titulo": "O que a pessoa está tentando resolver?", "sub": "Necessidades funcionais, sociais e emocionais", "icone": "02", "narrativa": [["A mesma escolha pode ter motivos diferentes", "{NOME}, saber quem é o público é uma parte da missão. Agora você precisa entender o que motiva suas escolhas. O material organiza as necessidades em três categorias: funcionais, sociais e emocionais. O objeto escolhido, sozinho, não determina a categoria. Você precisa prestar atenção ao motivo destacado na situação e explicar a relação entre esse motivo e a necessidade."], ["Funcional: utilidade e desempenho", "As necessidades funcionais estão ligadas ao que o produto ou serviço faz e ao seu desempenho. O exemplo da aula é um smartphone cuja bateria dura o dia inteiro. O foco, nesse caso, está na utilidade. Na análise de uma solução, pergunte o que a pessoa precisa resolver. Não confunda um recurso disponível com uma necessidade efetivamente atendida: a proposta precisa estar alinhada ao problema que o público vive."], ["Social: como quero ser visto", "As necessidades sociais dizem respeito à forma como a pessoa quer ser percebida pelos outros. O material cita ter o modelo mais recente de smartphone e comprar um relógio caro principalmente para demonstrar status. No exemplo do relógio, o motivo central é o reconhecimento. O preço ou o objeto não são a justificativa completa: é o desejo de ser visto de determinada maneira que explica a classificação."], ["Emocional: como quero me sentir", "As necessidades emocionais estão ligadas à forma como a pessoa deseja se sentir. Ouvir música para aliviar o estresse é o exemplo apresentado. Perceba a diferença entre melhorar o desempenho de um aparelho, buscar reconhecimento e buscar um sentimento. Uma análise cuidadosa identifica o motivo predominante descrito, em vez de classificar automaticamente pelo produto. O perfil do cliente e a necessidade devem conversar com a proposta."], ["Você no comando: compare antes de classificar", "{NOME}, volte à solução de organização dos prazos. O material pede identificar o problema, o tipo de necessidade e por que a pessoa escolheria a proposta. Na sua produção, separe o que está explícito no caso do que é uma hipótese sua sobre como o cliente se sente. Compare as categorias e escolha uma necessidade principal com justificativa. Não invente que a turma relatou uma motivação que não aparece no estudo."]], "questoes": [["O material apresenta um smartphone cuja bateria dura o dia inteiro. Se esse é o motivo destacado na escolha, qual classificação é mais adequada?", ["Social, porque todo smartphone determina como a pessoa é vista pelo grupo.", "Emocional, porque a duração da bateria descreve diretamente um sentimento.", "Funcional, porque o motivo destacado é a utilidade e o desempenho do aparelho.", "Social, porque um recurso de desempenho sempre representa busca de reconhecimento."], 2, "A classificação depende do motivo destacado. A bateria que dura o dia inteiro exemplifica utilidade e desempenho, portanto uma necessidade funcional."], ["Uma pessoa compra um relógio caro principalmente para demonstrar status. Qual justificativa respeita o material?", ["A necessidade é emocional porque qualquer compra cara tem como objetivo aliviar estresse.", "A necessidade é social porque o motivo principal é a forma como a pessoa deseja ser percebida.", "A necessidade é funcional porque todo relógio permite consultar as horas, mesmo que esse não seja o motivo central.", "A necessidade não pode ser classificada sem calcular o preço exato do relógio."], 1, "Embora um relógio tenha utilidade, o enunciado destaca a busca por status. O material classifica essa motivação como social, ligada ao reconhecimento e à percepção dos outros."], ["Qual comparação mantém a diferença entre as três categorias da aula?", ["Bateria duradoura: social; relógio para status: emocional; música para aliviar estresse: funcional.", "Bateria duradoura: emocional; relógio para status: funcional; música para aliviar estresse: social.", "Bateria duradoura: funcional; relógio para status: emocional; música para aliviar estresse: social.", "Bateria duradoura: funcional; relógio para status: social; música para aliviar estresse: emocional."], 3, "Os exemplos se organizam pelo motivo: desempenho, reconhecimento e sentimento, respectivamente. O objeto utilizado não substitui a análise da motivação."], ["Um colega afirma que “a categoria da necessidade pode ser escolhida apenas pelo nome do produto”. Qual revisão é mais adequada?", ["Identificar o motivo destacado e relacioná-lo à utilidade, à percepção social ou ao sentimento buscado.", "Usar sempre a categoria funcional, porque todos os produtos possuem alguma função.", "Usar sempre a categoria emocional, porque qualquer escolha pode envolver algum sentimento.", "Classificar pelo preço e pela popularidade, sem considerar o motivo descrito."], 0, "As categorias da aula se referem às necessidades e motivações. Para classificar uma situação, é necessário relacionar o motivo apresentado à definição da categoria."]], "atividade": "Analise a necessidade principal do público e da persona que você definiu na estação anterior. Justifique a categoria escolhida e compare-a com as outras duas, explicando por que elas não são o foco principal da sua proposta. Use os exemplos de bateria, status e música do material para mostrar a diferença entre objeto e motivação. Descreva como sua pessoa hipotética poderia se sentir antes e depois da solução e indique o que você precisaria ouvir dela para confirmar essa interpretação. Separe fatos do caso e hipóteses suas."}, {"titulo": "A planilha estava pronta. E o valor?", "sub": "Escuta, participação, teste e adequação da solução", "icone": "03", "narrativa": [["O caso: uma ideia organizada, pouco usada", "{NOME}, um estudante da 2ª série percebeu que os colegas tinham dificuldade para lembrar datas de provas, trabalhos e atividades. Ele criou um grupo e compartilhou uma planilha com os prazos separados por disciplina. Apesar dessa organização, quase ninguém acessou ou utilizou a proposta. Sua missão é analisar por que ter uma solução pronta não foi suficiente. Não comece descartando o problema nem culpando a turma: olhe para as informações apresentadas."], ["Quatro pistas que precisam ser consideradas", "O estudante descobriu que alguns colegas já anotavam tudo no celular ou em agendas próprias. Outros acharam a planilha difícil de acompanhar. Parte da turma não participou da criação e não se sentiu envolvida. Alguns preferiam lembretes simples pelo WhatsApp ou pelo grupo da sala. Essas observações apontam diferenças de rotina, dificuldade de uso, falta de participação e preferência por outra forma de receber a informação. Nenhuma delas, sozinha, explica todos os colegas."], ["Valor aparece no cotidiano do cliente", "A aula destaca que uma solução tem valor quando realmente atende a uma necessidade do cliente no dia a dia. Olhar pela perspectiva de quem vai usar ajuda a criar propostas claras, úteis e relevantes. Separar prazos por disciplina pode parecer organizado para quem criou, mas a experiência do usuário também precisa ser analisada. Ouvir diferentes opiniões e ajustar a ideia pode melhorar a proposta e aumentar suas chances de uso. Isso não é garantia de que uma mudança servirá para todo mundo."], ["Participar e testar antes de insistir", "O estudo pergunta como a proposta poderia ter sido construída de forma participativa e o que o caso ensina sobre testar a ideia antes de colocá-la em prática. A atividade orienta retomar problema, solução e público; identificar o que o cliente precisa resolver; analisar sentimentos antes e depois; verificar clareza e funcionamento; avaliar valor e ajustar. O recurso Job to Be Done é citado como uma forma de entender o que as pessoas buscam resolver, mas o arquivo não desenvolve etapas específicas dessa metodologia."], ["Você no comando: explique o ajuste", "{NOME}, sua análise deve usar as quatro pistas do caso. Proponha uma mudança, explique a quem ela atende e diga como ouviria os colegas para verificar se ficou mais clara e útil. Trocar a planilha por lembretes pode responder à preferência de alguns, mas não substitui compreender as diferentes necessidades. Mostre o limite da sua proposta e o que ainda precisaria ser revisto."]], "questoes": [["A baixa adesão à planilha permite concluir com mais segurança que:", ["O problema dos prazos não existe, pois uma planilha organizada já deveria resolver a situação.", "Todos os colegas querem a mesma mudança, pois parte deles mencionou o WhatsApp.", "A proposta precisa ser revista considerando hábitos existentes, dificuldade de uso, participação e preferências relatadas.", "A principal causa é necessariamente a falta de disciplinas na planilha, pois não houve outro relato relevante."], 2, "O caso traz quatro elementos diferentes. A conclusão precisa considerá-los sem afirmar que o problema não existe ou que a preferência de alguns representa toda a turma."], ["Qual reformulação usa melhor as informações do caso sem transformar uma hipótese em certeza?", ["Ouvir os colegas, considerar seus hábitos e testar ajustes de clareza e forma de oferecer antes de decidir a versão final.", "Trocar tudo por lembretes no WhatsApp e considerar desnecessária qualquer nova escuta do grupo.", "Manter a planilha porque separar por disciplina já comprova o valor para qualquer estudante.", "Acrescentar funções para tornar a proposta mais completa, sem investigar por que houve dificuldade de uso."], 0, "A aula destaca escuta, participação, análise da experiência e ajuste. Uma preferência relatada por alguns é relevante, mas não comprova que uma única mudança atenderá a todos."], ["Por que “o criador organizou bem os dados” não comprova, sozinho, o valor da solução?", ["Porque o valor depende apenas da quantidade de pessoas que receberam o link.", "Porque uma proposta só tem valor se abandonar qualquer organização por disciplina.", "Porque a participação da turma importa mais que qualquer necessidade de uso.", "Porque o valor depende de atender de forma clara e útil uma necessidade real no cotidiano do cliente."], 3, "Organização é parte da análise, mas a solução precisa ser útil para o público no contexto de uso. A aula relaciona valor à necessidade real e à perspectiva do cliente."], ["O relato de que parte da turma não participou e não se sentiu envolvida sustenta qual interpretação?", ["A participação substitui a avaliação de clareza e funcionamento da proposta.", "A falta de escuta e envolvimento pode contribuir para o desengajamento, devendo ser considerada na revisão.", "Todos os colegas rejeitariam qualquer solução, independentemente do problema.", "O criador precisa apenas explicar novamente sua ideia, sem considerar opiniões diferentes."], 1, "As orientações da aula relacionam falta de escuta a desengajamento e baixa adesão. Envolver as pessoas e considerar opiniões distintas ajuda a aperfeiçoar a proposta."]], "atividade": "Faça um diagnóstico da baixa adesão à planilha usando as quatro observações do caso. Explique por que a organização dos prazos não comprova valor por si só. Escolha uma mudança na solução ou na forma de oferecê-la, mostre a qual necessidade ela responde e reconheça um limite dessa escolha. Descreva como envolveria os colegas e o que observaria em um teste para decidir se precisa ajustar novamente. Não afirme que todos preferem WhatsApp nem invente pesquisas, porcentagens ou resultados."}, {"titulo": "Da ideia à proposta: agora tem que fazer sentido", "sub": "Funcionamento, experiência, representação e revisão", "icone": "04", "narrativa": [["Uma frase boa não é uma solução estruturada", "{NOME}, agora reúna as decisões anteriores em uma proposta compreensível. O material da terceira aula destaca que, no mundo do trabalho, não basta ter uma ideia: é preciso explicá-la e estruturá-la. O ponto de partida é retomar problema, público e necessidade. Uma proposta pode parecer interessante, mas continuar incompleta quando não deixa claro o que oferece, como funciona e por que seria útil para quem vai usar."], ["Defina o que está sendo oferecido", "A solução precisa ser descrita de forma clara e objetiva. Depois, explique seu funcionamento passo a passo. No caso dos prazos escolares, não basta escrever que a turma terá uma organização melhor: mostre como a pessoa encontraria e utilizaria a proposta que você escolheu. Mantenha coerência com o público e com as observações do caso. Não acrescente recursos apenas para tornar a descrição mais sofisticada se eles não respondem ao problema analisado."], ["Pense na experiência e represente a ideia", "A aula pede analisar a experiência do cliente, incluindo simplicidade e facilidade de uso. A representação em desenho ou esquema ajuda a tornar a proposta concreta. Nesta atividade digital, você poderá usar um esquema textual com etapas numeradas dentro da sua resposta. O objetivo continua sendo mostrar como a solução funciona, e não substituir a explicação por um nome ou por uma promessa genérica. A pessoa que lê deve conseguir acompanhar a sequência."], ["Revisar faz parte da construção", "O processo do material inclui retomar a ideia, definir a solução, descrever o funcionamento, analisar a experiência, representar e revisar. A revisão conecta a proposta ao problema e ao público; não é só corrigir a aparência do texto. As atividades em grupo também valorizam colaboração e divisão de tarefas. Nesta trilha, você registra sua própria análise, mantendo empatia, pensamento crítico e respeito às diferentes opiniões que o caso apresenta."], ["Você no comando: apresente uma proposta completa", "{NOME}, use seu público e sua persona como referência, mas ajuste decisões se a análise do caso mostrar inconsistências. Apresente o que oferece, o percurso de uso, a experiência esperada e uma revisão justificada. Deixe claro o que é hipótese e o que está apoiado no material. O texto deve conectar as partes: preencher muitos caracteres sem explicar essas relações não substitui uma boa proposta."]], "questoes": [["Qual sequência corresponde às etapas de construção da solução apresentadas no material?", ["Retomar problema, público e necessidade; definir a solução; descrever o funcionamento; analisar a experiência; representar; revisar.", "Definir funções; divulgar a proposta; escolher o público que já concorda; representar; considerar a solução concluída.", "Escolher um nome; desenhar; encerrar a proposta; investigar o problema somente se houver rejeição.", "Retomar o problema; representar a ideia; dispensar a experiência; manter a versão inicial para evitar mudanças."], 0, "A sequência organiza a proposta a partir do problema e do público e inclui funcionamento, experiência, representação e revisão. Uma etapa não substitui a coerência das demais."], ["Uma equipe entrega um desenho bem acabado, mas não explica como a pessoa usa a solução. O que falta segundo a aula?", ["Apenas tornar o desenho mais detalhado, pois a representação já substitui o funcionamento.", "Ampliar o público para que mais pessoas decidam sozinhas como usar a proposta.", "Acrescentar uma promessa de resultado, sem precisar relacioná-la à rotina do cliente.", "Detalhar a lógica de uso e a experiência, conectando a representação ao problema e ao público."], 3, "A representação é importante, mas o material também exige detalhamento lógico do funcionamento e análise da simplicidade e da experiência do cliente."], ["Qual revisão demonstra maior coerência com a construção da solução?", ["Trocar o nome da proposta e preservar os pontos que dificultam o uso, sem nova análise.", "Modificar a forma de uso a partir das necessidades identificadas e explicar como a alteração melhora a experiência.", "Acrescentar recursos sem relação com o problema para aumentar a quantidade de etapas.", "Excluir opiniões diferentes para manter a ideia original mais fácil de apresentar."], 1, "A revisão deve aperfeiçoar a adequação ao público, o funcionamento e a experiência. Alterar a aparência ou aumentar recursos não demonstra, por si só, geração de valor."], ["Qual entrega integra melhor os critérios das três aulas?", ["Uma lista de funcionalidades acompanhada de um público amplo, sem necessidade ou situação de uso.", "Uma persona detalhada com uma promessa de valor, mas sem explicação do funcionamento.", "Uma proposta com problema, público, necessidade, funcionamento, experiência, representação e ajustes coerentes entre si.", "Um esquema bonito e uma conclusão de sucesso, sem considerar os relatos do caso."], 2, "Os critérios se conectam: compreender pessoas e necessidades, avaliar valor no cotidiano e estruturar uma solução clara, representada e revisada. Não basta atender a um único item isoladamente."]], "atividade": "Apresente a versão revisada da sua solução para os prazos escolares. Conecte problema, público, persona e necessidade principal. Defina o que é oferecido, descreva a experiência esperada antes e depois e represente o funcionamento em um esquema textual de etapas numeradas. Mostre uma revisão concreta motivada pelo caso da planilha e explique como ela melhora a clareza, a utilidade ou a facilidade de uso. Termine apontando uma hipótese que ainda precisaria ser testada. A proposta deve ser coerente com suas análises anteriores, mesmo que você precise corrigir uma decisão."}];
const STORAGE_KEY='trilha::'+CONFIG.slug+'::v1';
function novoEstado(){return{versao:1,slug:CONFIG.slug,tema:CONFIG.tema,aluno:'',tela:'inicio',estacaoAtual:0,passoAtual:1,estacoes:ESTACOES.map(e=>({concluida:false,narrativaLida:false,respostas:e.questoes.map(()=>({escolha:null,correta:null,tempoMs:0})),texto:'',textoConcluido:false,tempoAtividadeMs:0,tempoEstudoMs:0})),vacilos:0,eventosVacilo:[],tempoTotalMs:0,iniciadoEm:null,finalizadoEm:null}}
let state=novoEstado(),storageOk=true,lastTick=Date.now(),janelaFocada=true,contagemAnterior=false,toastTimer,lastVacilo={aba:-1,colar:-1},pasteStamp=0;
const app=document.getElementById('app');
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function storageAviso(){storageOk=false;document.getElementById('storageAviso').textContent='O navegador não permite salvar o progresso. Esta sessão continua em memória; mantenha a página aberta.'}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){storageAviso()}}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const s=JSON.parse(raw);if(s.versao!==1||s.slug!==CONFIG.slug||!Array.isArray(s.estacoes)||s.estacoes.length!==CONFIG.numEstacoes||!s.estacoes.every(e=>typeof e.texto==='string'&&Array.isArray(e.respostas)&&e.respostas.length===CONFIG.questoesPorEstacao))return;state=s;state.estacoes.forEach(e=>{if(!Number.isFinite(e.tempoEstudoMs)||e.tempoEstudoMs<0)e.tempoEstudoMs=0});if(!['inicio','mapa','estacao','resultado'].includes(state.tela))state.tela='mapa';if(state.tela==='resultado'&&!state.estacoes.every(e=>e.concluida))state.tela='mapa';if(!Number.isInteger(state.estacaoAtual)||state.estacaoAtual<0||state.estacaoAtual>=CONFIG.numEstacoes)state.estacaoAtual=0;if(![1,2,3].includes(state.passoAtual))state.passoAtual=1;}catch(e){storageAviso()}}
function formatarTempo(ms){const s=Math.floor(Math.max(0,ms)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function numero(n){return n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2})}
function personalizado(s){return s.replaceAll('{NOME}',state.aluno)}
function toast(msg){clearTimeout(toastTimer);document.getElementById('toast').textContent=msg;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',6500)}
function tick(){
 const now=Date.now(),dt=Math.min(2000,Math.max(0,now-lastTick));lastTick=now;
 if(!state.iniciadoEm||state.finalizadoEm){contagemAnterior=false;return;}
 state.tempoTotalMs=Math.max(0,now-new Date(state.iniciadoEm).getTime());
 const foco=typeof document.hasFocus==='function'?document.hasFocus():janelaFocada;
 const ativo=state.tela==='estacao'&&emTelaCheia()&&!document.hidden&&janelaFocada&&foco;
 if(ativo&&contagemAnterior){const e=state.estacoes[state.estacaoAtual];if(!e.concluida)e.tempoEstudoMs+=dt;
  if(state.passoAtual===2){const r=e.respostas.find(r=>r.escolha===null);if(r)r.tempoMs+=dt;}
  if(state.passoAtual===3&&!e.textoConcluido)e.tempoAtividadeMs+=dt;
 }
 contagemAnterior=ativo;
}
function minimoEstacaoMs(){return CONFIG.minTempoTotalMin*60000/CONFIG.numEstacoes}
function tempoEstudoTotal(){return state.estacoes.reduce((n,e)=>n+e.tempoEstudoMs,0)}
function faltaTempo(i=state.estacaoAtual){return Math.max(0,minimoEstacaoMs()-state.estacoes[i].tempoEstudoMs)}
function requisitosEstacao(){const e=state.estacoes[state.estacaoAtual];return !e.textoConcluido&&e.texto.length>=CONFIG.minCaracteres&&e.respostas.every(r=>r.escolha!==null)&&faltaTempo()===0}
function atualizarTempoEstudo(){
 if(state.tela!=='estacao'||!podeInteragir())return;
 const e=state.estacoes[state.estacaoAtual],remaining=faltaTempo();
 const status=document.getElementById('estacaoTempo');if(status)status.textContent='Tempo de estudo nesta estação: '+formatarTempo(e.tempoEstudoMs)+' / '+formatarTempo(minimoEstacaoMs())+' · Contagem em tela cheia, com aba visível e janela em foco.';
 if(state.passoAtual===3){const b=document.getElementById('atvConcluir');if(b)b.disabled=!requisitosEstacao();const aviso=document.getElementById('atvTempoRestante');if(aviso)aviso.textContent=remaining>0?'Continue analisando e revisando sua resposta. Faltam '+formatarTempo(Math.ceil(remaining/1000)*1000)+' de permanência nesta estação para liberar a conclusão.':'Tempo mínimo da estação cumprido. Confira seu texto antes de concluir.';}
}
function hud(){document.getElementById('hud').innerHTML=`<span class="hud-item">⏱ ${formatarTempo(state.tempoTotalMs)}</span><span class="hud-item">📖 ${formatarTempo(tempoEstudoTotal())}/${formatarTempo(CONFIG.minTempoTotalMin*60000)}</span><span class="hud-item">🚨 Vacilos: ${state.vacilos}</span><span class="hud-item">📍 ${state.iniciadoEm?'Estação '+(state.estacaoAtual+1)+'/'+CONFIG.numEstacoes+' · Passo '+state.passoAtual+'/3':'Pronto para começar'}</span>`}
function irPara(tela){if(!podeInteragir()){render();return;}tick();state.tela=tela;save();render();window.scrollTo(0,0);const title=app.querySelector('h1,h2');if(title){title.tabIndex=-1;title.focus()}}
function render(){hud();if(exigeTelaCheia()&&!emTelaCheia()){renderBloqueioTelaCheia();return;}if(state.tela==='inicio')renderInicio();else if(state.tela==='mapa')renderMapa();else if(state.tela==='estacao')renderEstacao();else renderResultado();atualizarTempoEstudo()}
function emTelaCheia(){return Boolean(document.fullscreenElement||document.webkitFullscreenElement)}
function exigeTelaCheia(){return Boolean(state.iniciadoEm&&!state.finalizadoEm&&state.tela!=='resultado')}
function podeInteragir(){return !exigeTelaCheia()||emTelaCheia()}
function suporteTelaCheia(){const root=document.documentElement;return Boolean(root&&(root.requestFullscreen||root.webkitRequestFullscreen))}
async function solicitarTelaCheia(){
  if(emTelaCheia())return true;
  const root=document.documentElement,request=root&&(root.requestFullscreen||root.webkitRequestFullscreen);
  if(!request){toast('Este navegador não oferece o modo de tela cheia necessário. Abra o arquivo em um navegador compatível para realizar a atividade.');return false;}
  try{await request.call(root);if(emTelaCheia())return true;}catch(e){}
  toast('Não foi possível ativar a tela cheia. Permita esse modo no navegador e clique novamente no botão para continuar.');return false;
}
function renderBloqueioTelaCheia(){
  
  app.innerHTML=`<section class="glass-card fullscreen-card" aria-labelledby="telaCheiaTitulo"><div class="eyebrow">Tela cheia obrigatória</div><h1 id="telaCheiaTitulo" tabindex="-1">Volte à tela cheia para continuar.</h1><p>${esc(state.aluno)}, seu progresso está preservado. A trilha só pode ser realizada em tela cheia.</p><p class="muted">As questões e a atividade escrita ficam bloqueadas enquanto esse modo estiver desativado. O tempo total continua correndo, mas a contagem de estudo necessária para concluir fica pausada.</p><div class="actions"><button id="telaCheiaRetomar" class="primary">Ativar tela cheia e continuar →</button></div><p class="muted">${suporteTelaCheia()?'Use o botão acima para retomar exatamente de onde parou.':'Este navegador não oferece o recurso necessário. Abra o arquivo em um navegador compatível, como Chrome, Edge ou Firefox em um computador.'}</p></section>`;
  document.getElementById('telaCheiaRetomar').onclick=async()=>{if(await solicitarTelaCheia()){lastTick=Date.now();render();}};
  document.getElementById('telaCheiaTitulo').focus();
}
let ultimaTelaCheia=emTelaCheia();
function mudouTelaCheia(){
  const atual=emTelaCheia();if(atual===ultimaTelaCheia)return;
  tick();ultimaTelaCheia=atual;save();
  if(exigeTelaCheia())render();
}
document.addEventListener('fullscreenchange',mudouTelaCheia);
document.addEventListener('webkitfullscreenchange',mudouTelaCheia);
function renderInicio(){app.innerHTML=`<div class="hero"><section><div class="eyebrow">Iniciação Empreendedora · Unidade 6</div><h1>Trilha do<br>Conhecimento<span style="color:var(--accent-2)">.</span></h1><p class="hero-subtitle">${CONFIG.tema}</p><p class="muted">Uma ideia, quatro decisões: para quem, qual necessidade, que valor e como funciona. Parece simples. A missão é conectar as respostas e sustentar suas escolhas.</p><span class="chip">${CONFIG.numEstacoes} estações</span><span class="chip">${CONFIG.numEstacoes*CONFIG.questoesPorEstacao} questões</span><span class="chip">${CONFIG.minTempoTotalMin} </span><span class="chip"></span><label class="field-label" for="inicioNome">Qual é o seu nome completo?</label><input id="inicioNome" autocomplete="name" maxlength="160" value="${esc(state.aluno)}" placeholder="Seu nome no boletim"><div class="actions"><button class="primary" id="inicioComecar" ${state.aluno.trim()?'':'disabled'}>Começar em tela cheia →</button></div></section><section class="glass-card"><div class="eyebrow">Antes de começar</div><h2>Regras da missão</h2><p>A trilha exige tela cheia. Ao clicar em “Começar em tela cheia”, permita a ativação desse modo. Se sair da tela cheia, a atividade será bloqueada até você voltar.</p><p>Em cada estação: leia a narrativa, responda a ${CONFIG.questoesPorEstacao} questões e escreva pelo menos ${CONFIG.minCaracteres} caracteres.</p><p>Reserve no mínimo ${CONFIG.minTempoTotalMin} minutos: cada estação exige ${CONFIG.minTempoTotalMin/CONFIG.numEstacoes} minutos de permanência em tela cheia, com a aba visível e a janela em foco. Fora dessas condições, a contagem de estudo pausa. Use o tempo para analisar e revisar.</p><p class="muted">As respostas do quiz são definitivas. A estação seguinte abre quando você concluir a anterior. Seu progresso é salvo neste navegador, quando disponível.</p><p>🚨 Saiu da aba durante o quiz ou a escrita? Tentou colar? Cada vacilo desconta ${numero(CONFIG.pesoVacilo)} ponto, até ${numero(CONFIG.tetoVacilos)} pontos no total. Aqui a ideia é aprender com suas palavras! 😅</p><p class="muted">Esses controles ajudam você a manter o foco, mas não são infalíveis. No final, salve o relatório em PDF e entregue ao professor.</p></section></div>`;document.getElementById('inicioNome').oninput=e=>{state.aluno=e.target.value;document.getElementById('inicioComecar').disabled=!state.aluno.trim();save()};document.getElementById('inicioComecar').onclick=async()=>{if(!state.aluno.trim())return;if(!await solicitarTelaCheia())return;state.iniciadoEm=state.iniciadoEm||new Date().toISOString();lastTick=Date.now();irPara('mapa')}}
function renderMapa(){const all=state.estacoes.every(e=>e.concluida);app.innerHTML=`<div class="eyebrow">Seu percurso</div><h1>Missão aceita, ${esc(state.aluno)}!</h1><p class="muted">Um percurso para transformar o problema dos prazos escolares em uma proposta bem fundamentada. Em cada estação, analise, decida e escreva com suas palavras.</p><div class="station-grid">${ESTACOES.map((e,i)=>{const done=state.estacoes[i].concluida,open=i===0||state.estacoes[i-1].concluida;return `<section class="glass-card station-card"><span class="station-num">${e.icone}</span><span class="eyebrow">${done?'✅ Concluída':open?'▶ Disponível':'🔒 Bloqueada'}</span><h2>${e.titulo}</h2><p class="muted">${e.sub}</p><p class="muted">Permanência mínima: ${CONFIG.minTempoTotalMin/CONFIG.numEstacoes} min · ${formatarTempo(state.estacoes[i].tempoEstudoMs)} registrado(s)</p><button data-estacao="${i}" ${!open||done?'disabled':''}>${done?'Missão concluída':open?'Entrar na estação →':'Conclua a estação anterior'}</button></section>`}).join('')}</div><button id="mapaResultado" class="primary" ${all?'':'disabled'}>Ver resultado final →</button>`;app.querySelectorAll('[data-estacao]').forEach(b=>b.onclick=()=>{if(!podeInteragir()){render();return;}const i=Number(b.dataset.estacao);if(i>0&&!state.estacoes[i-1].concluida)return;state.estacaoAtual=i;const e=state.estacoes[i];state.passoAtual=!e.narrativaLida?1:e.respostas.some(r=>r.escolha===null)?2:3;irPara('estacao')});document.getElementById('mapaResultado').onclick=finalizar}
function cabecalhoEstacao(){const e=ESTACOES[state.estacaoAtual];return `<div class="eyebrow">Estação ${state.estacaoAtual+1} de ${CONFIG.numEstacoes}</div><h1>${e.titulo}</h1><div class="steps">${['Narrativa','Quiz','Atividade escrita'].map((s,i)=>`<span class="step ${state.passoAtual===i+1?'step--active':''}">${i+1}. ${s}</span>`).join('')}</div>`}
function renderEstacao(){app.innerHTML=cabecalhoEstacao()+'<p id="estacaoTempo" class="muted"></p><div id="estacaoConteudo"></div>';if(state.passoAtual===1)renderNarrativa();if(state.passoAtual===2)renderQuiz();if(state.passoAtual===3)renderAtividade();atualizarTempoEstudo()}
function renderNarrativa(){const e=ESTACOES[state.estacaoAtual];document.getElementById('estacaoConteudo').innerHTML=`<article class="glass-card narrative">${e.narrativa.map((p,i)=>`<section class="${i===e.narrativa.length-1?'command':''}"><h2>${i===e.narrativa.length-1?'💡 ':''}${p[0]}</h2><p class="muted">${esc(personalizado(p[1]))}</p></section>`).join('')}<div class="actions"><button id="estacaoMapa">← Mapa</button><button class="primary" id="estacaoLida">Li a narrativa · ir ao quiz →</button></div></article>`;document.getElementById('estacaoMapa').onclick=()=>irPara('mapa');document.getElementById('estacaoLida').onclick=()=>{if(!podeInteragir()){render();return;}tick();state.estacoes[state.estacaoAtual].narrativaLida=true;state.passoAtual=2;save();render();window.scrollTo(0,0)}}
function renderQuiz(){const e=ESTACOES[state.estacaoAtual],s=state.estacoes[state.estacaoAtual],current=s.respostas.findIndex(r=>r.escolha===null);document.getElementById('estacaoConteudo').innerHTML=`<p class="muted">🧠 Leia com calma: depois de escolher, a resposta fica registrada. Responda na ordem e confira a explicação para aprender com cada questão.</p><div id="quizLista">${e.questoes.map((q,i)=>{const r=s.respostas[i],answered=r.escolha!==null;return `<section class="glass-card quiz-card"><div class="eyebrow">Questão ${i+1} / ${CONFIG.questoesPorEstacao}</div><h2>${q[0]}</h2>${q[1].map((a,j)=>`<button class="quiz-alt ${answered&&j===q[2]?'quiz-alt--correta':''} ${answered&&j===r.escolha&&j!==q[2]?'quiz-alt--errada':''}" data-q="${i}" data-a="${j}" ${answered||i!==current?'disabled':''}>${String.fromCharCode(65+j)}. ${a}${answered&&j===q[2]?' · ✓ Correta':''}${answered&&j===r.escolha?' · Sua escolha':''}</button>`).join('')}<div aria-live="polite">${answered?`<div class="feedback">${r.correta?'✓ Acertou!':'↻ Vamos aprender com essa.'} ${q[3]}<br>Tempo: ${formatarTempo(r.tempoMs)}</div>`:i!==current?'<p class="muted">Responda à questão anterior para liberar esta.</p>':''}</div></section>`}).join('')}</div><div class="actions"><button id="quizLer">Rever narrativa</button><button id="quizAvancar" class="primary" ${current===-1?'':'disabled'}>Ir para a atividade →</button></div>`;app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>responder(Number(b.dataset.q),Number(b.dataset.a)));document.getElementById('quizAvancar').onclick=()=>{if(!podeInteragir()){render();return;}if(s.respostas.some(r=>r.escolha===null))return;tick();state.passoAtual=3;save();render();window.scrollTo(0,0)};document.getElementById('quizLer').onclick=()=>{if(!podeInteragir()){render();return;}tick();state.passoAtual=1;save();render()}}
function responder(qIdx,altIdx){if(!podeInteragir())return;if(state.tela!=='estacao'||state.passoAtual!==2)return;const e=state.estacoes[state.estacaoAtual],q=ESTACOES[state.estacaoAtual].questoes[qIdx];if(qIdx!==e.respostas.findIndex(r=>r.escolha===null)||!q||altIdx<0||altIdx>3)return;tick();e.respostas[qIdx].escolha=altIdx;e.respostas[qIdx].correta=altIdx===q[2];save();renderQuiz();toast(e.respostas[qIdx].correta?'✓ Boa decisão, '+state.aluno+'!':state.aluno+', confira a explicação e siga aprendendo.');const next=app.querySelector('button[data-q]:not(:disabled)')||document.getElementById('quizAvancar');if(next)next.focus()}
function renderAtividade(){
 const e=ESTACOES[state.estacaoAtual],s=state.estacoes[state.estacaoAtual];
 document.getElementById('estacaoConteudo').innerHTML=`<div class="glass-card"><div class="eyebrow">Agora é com você</div><h2>Sua ideia em ação</h2><p>${e.atividade}</p><section class="writing-area"><label class="field-label" for="atvTexto">Sua resposta · mínimo de ${CONFIG.minCaracteres} caracteres</label><textarea id="atvTexto" spellcheck="true" ${s.textoConcluido?'readonly':''}></textarea><div id="atvContador" class="counter" aria-live="polite"></div><p class="muted">Escreva com suas palavras. A resposta será registrada integralmente, com suas quebras de linha.</p></section><p id="atvTempoRestante" class="muted" role="timer" aria-live="off"></p><div class="actions"><button id="atvRever">Rever narrativa</button><button id="atvConcluir" class="primary">Concluir estação →</button></div></div>`;
 const field=document.getElementById('atvTexto');field.value=s.texto;
 function counter(){const n=s.texto.length,el=document.getElementById('atvContador');el.textContent=n+'/'+CONFIG.minCaracteres;el.className='counter '+(n>=CONFIG.minCaracteres?'counter--ok':'');document.getElementById('atvConcluir').disabled=!requisitosEstacao()}
 counter();atualizarTempoEstudo();
 field.oninput=()=>{if(!podeInteragir()){field.value=s.texto;render();return;}s.texto=field.value;save();counter()};
 ['paste','drop'].forEach(type=>field.addEventListener(type,bloquearColagem));
 field.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='v')bloquearColagem(ev);if(ev.shiftKey&&ev.key==='Insert')bloquearColagem(ev)});
 field.addEventListener('beforeinput',ev=>{if(['insertFromPaste','insertFromDrop'].includes(ev.inputType))bloquearColagem(ev)});
 document.getElementById('atvRever').onclick=()=>{if(!podeInteragir()){render();return;}tick();state.passoAtual=1;save();render()};
 document.getElementById('atvConcluir').onclick=()=>{if(!podeInteragir()){render();return;}tick();if(!requisitosEstacao()){atualizarTempoEstudo();return;}s.textoConcluido=true;s.concluida=true;save();if(state.estacoes.every(e=>e.concluida))finalizar();else irPara('mapa')};
}
function bloquearColagem(ev){ev.preventDefault();const now=Date.now();if(now-pasteStamp<500)return;pasteStamp=now;addVacilo('colar')}
const mensagens={"aba": ["{NOME}, sua ideia precisa da sua atenção aqui. Vamos retomar! 💡", "Opa, {NOME}! O cliente espera sua análise nesta aba. 👀", "{NOME}, saiu da rota? Volte para construir sua solução. 🧭", "Atenção, {NOME}: saída da aba registrada. Bora focar! 📋", "{NOME}, organizar a ideia também pede foco. Volte ao desafio! 🧠", "Ei, {NOME}, sua missão empreendedora está aqui. 🚀", "{NOME}, atenção em trânsito! Retome sua análise do público. 🚦", "Uma pausa fora da rota, {NOME}. Agora é foco na proposta! ✍️"], "colar": ["{NOME}, uma boa proposta precisa das suas palavras. Digite sua ideia! ✍️", "Opa, {NOME}! Colagem detectada. Conte o que você entendeu. 💡", "{NOME}, colagem bloqueada. Seu raciocínio tem valor! 🧠", "Ei, {NOME}, construa sua análise e explique a decisão. 📋", "{NOME}, esse atalho não resolve a missão. Vamos escrever! 😅", "Conhecimento autoral em primeiro lugar, {NOME}! ✍️", "A coragem de tentar vale, {NOME}! Agora conecte suas ideias. 🚀", "Alerta na proposta, {NOME}: deixe a colagem e defenda sua escolha! 💬"]};
function addVacilo(tipo){if(state.tela!=='estacao'||![2,3].includes(state.passoAtual)||state.finalizadoEm)return;tick();state.vacilos++;state.eventosVacilo.push({tipo,ts:new Date().toISOString()});save();hud();const options=mensagens[tipo].map((v,i)=>i).filter(i=>i!==lastVacilo[tipo]);const idx=options[Math.floor(Math.random()*options.length)];lastVacilo[tipo]=idx;toast(personalizado(mensagens[tipo][idx])+' Desconto acumulado: '+numero(Math.min(state.vacilos*CONFIG.pesoVacilo,CONFIG.tetoVacilos))+'.')}
document.addEventListener('visibilitychange',()=>{tick();if(document.hidden){contagemAnterior=false;addVacilo('aba');}save()});window.addEventListener('pagehide',()=>{tick();contagemAnterior=false;save()});window.addEventListener('blur',()=>{tick();janelaFocada=false;contagemAnterior=false;save()});window.addEventListener('focus',()=>{janelaFocada=true;lastTick=Date.now();contagemAnterior=false;atualizarTempoEstudo()});document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='m'){e.preventDefault();state.vacilos=0;state.eventosVacilo=[];save();hud();if(state.tela==='resultado')renderResultado();toast('Vacilos zerados. Respostas e progresso preservados.')}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='r'){e.preventDefault();if(!confirm('Apagar todo o progresso desta trilha e começar novamente?'))return;state=novoEstado();lastTick=Date.now();contagemAnterior=false;save();render();toast('Trilha reiniciada com sucesso.')}});
function calcularNota(){const acertos=state.estacoes.reduce((n,e)=>n+e.respostas.filter(r=>r.correta===true).length,0),atividadesOk=state.estacoes.filter(e=>e.textoConcluido).length,totalComponentes=(CONFIG.questoesPorEstacao+1)*CONFIG.numEstacoes,notaConteudo=(acertos+atividadesOk)/totalComponentes*10,desconto=Math.min(state.vacilos*CONFIG.pesoVacilo,CONFIG.tetoVacilos),mediaFinal=Math.max(0,Math.min(10,notaConteudo-desconto));return{acertos,atividadesOk,totalComponentes,notaConteudo,desconto,mediaFinal}}
function finalizar(){if(!podeInteragir()){render();return;}tick();if(!state.estacoes.every(e=>e.concluida&&e.tempoEstudoMs>=minimoEstacaoMs())||tempoEstudoTotal()<CONFIG.minTempoTotalMin*60000)return;state.finalizadoEm=state.finalizadoEm||new Date().toISOString();irPara('resultado')}
function desempenho(n){return personalizado(n>=8.5?'🚀 {NOME}, você mandou MUITO bem!':n>=6?'👍 {NOME}, foi uma boa caminhada, mas alguns conceitos ainda precisam de treino.':n>=5?'⚠️ {NOME}, deu pra passar, mas vale revisar os pontos que escaparam.':'📚 {NOME}, é hora de voltar aos estudos e revisar os materiais antes da próxima missão.')}
function data(v){return new Date(v).toLocaleString('pt-BR')}
function renderResultado(){const n=calcularNota();app.innerHTML=`<div class="eyebrow">Missão concluída · boletim</div><section class="glass-card"><h1>Seu percurso tem resultado.</h1>${n.mediaFinal>=8.5?'<div class="confetti" aria-hidden="true">🎉 📦 ✨ 🚀</div>':''}<p>${esc(state.aluno)} · ${CONFIG.tema}${CONFIG.turma?' · '+esc(CONFIG.turma):''}<br><span class="muted">${data(state.finalizadoEm)}</span></p><div class="grade">${numero(n.mediaFinal)}<span style="font-size:1.2rem"> / 10</span></div><p>${esc(desempenho(n.mediaFinal))}</p><div class="metrics"><div class="metric"><strong>${n.acertos}/${CONFIG.numEstacoes*CONFIG.questoesPorEstacao}</strong>Acertos no quiz</div><div class="metric"><strong>${n.atividadesOk}/${CONFIG.numEstacoes}</strong>Atividades concluídas</div><div class="metric"><strong>${numero(n.notaConteudo)}</strong>Nota de conteúdo</div><div class="metric"><strong>${state.vacilos}</strong>Vacilos · desconto ${numero(n.desconto)}</div><div class="metric"><strong>${formatarTempo(tempoEstudoTotal())}</strong>Permanência de estudo · mínimo ${CONFIG.minTempoTotalMin} min</div><div class="metric"><strong>${CONFIG.numEstacoes}/${CONFIG.numEstacoes}</strong>Estações concluídas</div></div>${ESTACOES.map((e,i)=>`<p>✅ Estação ${i+1} · ${e.titulo}: ${state.estacoes[i].respostas.filter(r=>r.correta).length}/${CONFIG.questoesPorEstacao} acertos · atividade concluída.</p>`).join('')}<p class="muted">Concluir cada texto conta como uma parte da nota. O professor vai avaliar se suas ideias estão bem explicadas e fazem sentido com o conteúdo.</p><p class="muted">Tempo total decorrido: ${formatarTempo(state.tempoTotalMs)}. Permanência contada em tela cheia, com aba visível e janela em foco.</p><p><em>Este documento registra a resposta enviada pelo estudante.</em></p><div class="actions"><button id="resultadoImprimir" class="primary">🖨️ Imprimir / salvar PDF — enviar para o registro</button></div><p class="muted">Na janela de impressão, escolha “Salvar como PDF” e envie o arquivo pelo canal indicado pelo professor.</p></section>`;document.getElementById('resultadoImprimir').onclick=montarDocumentoImpressao}
function documentoImpressao(){const n=calcularNota();return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Atividade — ${esc(state.aluno)} — ${CONFIG.tema}</title><style>body{font:11pt/1.55 system-ui,sans-serif;color:#152332;max-width:190mm;margin:20px auto;padding:15px}h1{font-size:23pt}h2{font-size:17pt;border-bottom:1px solid #aaa;margin-top:28px}h3{font-size:13pt;margin-top:22px}p{margin:8px 0}.meta{background:#f1f5f9;padding:16px}.student-text{white-space:pre-wrap;overflow:visible;overflow-wrap:anywhere;word-break:break-word;height:auto;max-height:none;line-height:1.6}.question{margin:20px 0}footer{border-top:1px solid #aaa;margin-top:25px;font-size:9pt}@page{size:A4;margin:16mm}@media print{body{margin:0;padding:0;max-width:none}.print-button{display:none}.student-text{overflow:visible!important;white-space:pre-wrap!important;max-height:none!important;height:auto!important;break-inside:auto!important;page-break-inside:auto!important}.writing{break-inside:auto;page-break-inside:auto}h2,h3{break-after:avoid}}</style></head><body><button class="print-button" onclick="window.print()">Imprimir / salvar PDF</button><header><p>EDUCAÇÃO PROFISSIONAL PAULISTA · Iniciação Empreendedora</p><h1>Trilha do Conhecimento</h1><div class="meta"><b>Estudante:</b> ${esc(state.aluno)}<br><b>Tema:</b> ${CONFIG.tema}<br><b>Disciplina:</b> ${CONFIG.disciplina}${CONFIG.turma?'<br><b>Turma:</b> '+esc(CONFIG.turma):''}<br><b>Identificação:</b> trilha-${CONFIG.slug} · v1<br><b>Início:</b> ${data(state.iniciadoEm)}<br><b>Conclusão:</b> ${data(state.finalizadoEm)}</div></header><h2>Resultado</h2><p>Acertos: ${n.acertos}/${CONFIG.numEstacoes*CONFIG.questoesPorEstacao} · Atividades concluídas: ${n.atividadesOk}/${CONFIG.numEstacoes}<br>Nota de conteúdo: ${numero(n.notaConteudo)} · Vacilos: ${state.vacilos} · Desconto: ${numero(n.desconto)}<br>Tempo total decorrido: ${formatarTempo(state.tempoTotalMs)}<br>Permanência de estudo: ${formatarTempo(tempoEstudoTotal())} · mínimo exigido: ${CONFIG.minTempoTotalMin} min<br><b>Média final: ${numero(n.mediaFinal)}/10</b></p><p>${esc(desempenho(n.mediaFinal))}</p><p>Fórmula: (acertos + atividades concluídas) / ${n.totalComponentes} × 10; desconto de ${numero(CONFIG.pesoVacilo)} por vacilo, limitado a ${numero(CONFIG.tetoVacilos)} pontos; nota final entre 0 e 10.</p><p>Cada texto concluído conta como uma parte da nota. O professor avalia a qualidade das ideias e a relação com o conteúdo.</p><h3>Registro de vacilos</h3>${state.eventosVacilo.length?'<ul>'+state.eventosVacilo.map(v=>'<li>'+esc(v.tipo==='aba'?'Saída da aba/página':'Tentativa de colagem')+' · '+data(v.ts)+'</li>').join('')+'</ul>':'<p>Nenhum vacilo registrado.</p>'}${ESTACOES.map((e,i)=>{const s=state.estacoes[i];return `<section><h2>Estação ${i+1} — ${e.titulo}</h2><p>Acertos: ${s.respostas.filter(r=>r.correta).length}/${CONFIG.questoesPorEstacao} · Atividade: ${s.textoConcluido?'concluída':'pendente'}</p>${e.questoes.map((q,j)=>{const r=s.respostas[j];return `<div class="question"><h3>Questão ${j+1} — ${q[0]}</h3>${q[1].map((a,k)=>'<p>'+String.fromCharCode(65+k)+'. '+a+'</p>').join('')}<p><b>Alternativa marcada:</b> ${r.escolha===null?'Sem resposta':String.fromCharCode(65+r.escolha)+'. '+q[1][r.escolha]}<br><b>Alternativa correta:</b> ${String.fromCharCode(65+q[2])}. ${q[1][q[2]]}<br><b>Resultado:</b> ${r.correta?'Correta':'Incorreta'} · <b>Tempo da questão:</b> ${formatarTempo(r.tempoMs)}</p><p><b>Explicação:</b> ${q[3]}</p></div>`}).join('')}<section class="writing"><h3>Atividade escrita — resposta integral</h3><p><b>Proposta:</b> ${e.atividade}</p><p>Caracteres: ${s.texto.length} · Tempo de escrita: ${formatarTempo(s.tempoAtividadeMs)} · Permanência na estação: ${formatarTempo(s.tempoEstudoMs)} / mínimo ${formatarTempo(minimoEstacaoMs())}</p><div class="student-text">${esc(s.texto)}</div></section></section>`}).join('')}<footer>Este documento registra a resposta enviada pelo estudante.<br>Professor Magno Vieira dos Santos · Gerado em ${data(new Date().toISOString())}</footer></body></html>`}
function montarDocumentoImpressao(){const w=window.open('','_blank');if(!w){toast('Permita a abertura da janela de impressão neste navegador e tente novamente.');return}w.document.open();w.document.write(documentoImpressao());w.document.close();w.focus();w.setTimeout(()=>w.print(),300)}
load();lastTick=Date.now();tick();render();setInterval(()=>{tick();hud();atualizarTempoEstudo();if(state.iniciadoEm&&!state.finalizadoEm)save()},1000);
</script></body></html>
